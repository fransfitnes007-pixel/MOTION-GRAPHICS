<!doctype html>
<html><head><meta charset="utf-8"><title>Unit dot grid fill count</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @jesscaroline7's vertical app reel (motionvideo.xyz jesscaroline7-1ff7cb, 10s to 22s): a big condensed number
// counts up while a grid with one dot per unit lights up in orange, so the count reads as a quantity; then every dot flies into a
// ring that shows a share, with the percentage in the middle.
const CONFIG = {
  total: 1089, cols: 33,                 // one dot per unit; cols x rows should be >= total
  label: 'places mapped', share: .968, shareLabel: 'rated by locals',
  sep: ',',                              // thousands separator ('.' for pt/es)
  bg: '#141210', accent: '#f26a1b', dim: 'rgba(255,255,255,.09)', ink: '#ffffff', sub: 'rgba(255,255,255,.55)',
  t: { count: [.35, 2.2], ring: [2.7, 3.6], out: [4.5, 4.95] },
  dur: 5.2,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 : W / 1920
const hsh = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x) }
stage.style.background = C.bg
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; stage.appendChild(cv)
const g = cv.getContext('2d')
const FONT = (s, w = 800, st = '') => `${st} ${w} ${s}px 'Helvetica Neue', -apple-system, system-ui, sans-serif`
const rows = Math.ceil(C.total / C.cols)
const sp = TALL ? 25 * Z : 18 * Z, dr = sp * .3
const gw = (C.cols - 1) * sp, gh = (rows - 1) * sp
const gx = TALL ? CX - gw / 2 : W * .62 - gw / 2, gy = TALL ? CY - gh / 2 + 180 * Z : CY - gh / 2
const numX = TALL ? CX - gw / 2 : W * .1, numY = TALL ? gy - 150 * Z : CY - 10 * Z
// lighting order: roughly top to bottom with a seeded scatter, so it fills like data arriving
const order = [...Array(C.total).keys()].map((k) => ({ k, key: Math.floor(k / C.cols) + hsh(k, 1) * 7 })).sort((a, b) => a.key - b.key)
const rank = new Array(C.total); order.forEach((o, i) => { rank[o.k] = i })
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, C.sep)
const RR = (TALL ? 300 : 250) * Z, ringC = TALL ? [CX, CY + 60 * Z] : [W * .62, CY]

function render(t) {
  g.clearRect(0, 0, W, H)
  const [c0, c1] = C.t.count, cp = eo(seg(t, c0, c1)), n = C.total * cp
  const rp = seg(t, C.t.ring[0], C.t.ring[1]), out = eio(seg(t, C.t.out[0], C.t.out[1]))
  for (let k = 0; k < C.total; k++) {
    const r = rank[k]
    const lit = 1 - Math.pow(1 - r / C.total, 1 / 3)                  // when eo(count) passes this dot
    const tl = c0 + (c1 - c0) * lit, pop = clamp(seg(t, tl, tl + .22))
    const gxk = gx + (k % C.cols) * sp, gyk = gy + Math.floor(k / C.cols) * sp
    // ring slot: 4 concentric rows, ordered by rank so the lit share is one continuous arc
    const lane = r % 4, ang = -Math.PI / 2 + Math.floor(r / 4) / (C.total / 4) * Math.PI * 2
    const rx = ringC[0] + Math.cos(ang) * (RR + lane * dr * 3), ry = ringC[1] + Math.sin(ang) * (RR + lane * dr * 3)
    const u = eio(clamp((rp - hsh(k, 2) * .35) / .65))                 // each dot leaves at its own moment
    const x = lerp(gxk, rx, u), y = lerp(gyk, ry, u)
    const inShare = r < C.total * C.share
    let col = pop > 0 ? C.accent : C.dim
    if (u > .5 && !inShare) col = C.dim
    const s = (pop > 0 ? .55 + .45 * Math.min(1.25, 1 + .25 * Math.sin(Math.PI * pop)) : .55) * (1 - out)
    g.fillStyle = col; g.beginPath(); g.arc(x, y, dr * s, 0, 7); g.fill()
  }
  // the count, then the share in the ring's centre
  const a1 = 1 - eo(seg(t, C.t.ring[0], C.t.ring[0] + .3))
  g.globalAlpha = eo(seg(t, .15, .45)) * a1; g.fillStyle = C.ink; g.textAlign = 'left'
  g.font = FONT(140 * Z, 900); g.fillText(fmt(Math.round(n)), numX, numY)
  g.font = FONT(30 * Z, 500); g.fillStyle = C.sub; g.fillText(C.label, numX + 4 * Z, numY + 46 * Z)
  const a2 = eo(seg(t, C.t.ring[1] - .2, C.t.ring[1] + .2)) * (1 - out)
  g.globalAlpha = a2; g.textAlign = 'center'; g.fillStyle = C.ink; g.font = FONT(96 * Z, 900)
  g.fillText((C.share * 100 * eo(seg(t, C.t.ring[1] - .2, C.t.ring[1] + .5))).toFixed(1) + '%', ringC[0], ringC[1] + 26 * Z)
  g.font = FONT(26 * Z, 500); g.fillStyle = C.sub; g.fillText(C.shareLabel, ringC[0], ringC[1] + 72 * Z)
  g.globalAlpha = 1
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
