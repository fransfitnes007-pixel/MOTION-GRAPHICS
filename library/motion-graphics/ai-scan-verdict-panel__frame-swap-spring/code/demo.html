<!doctype html>
<html><head><meta charset="utf-8"><title>AI scan and verdict panel</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--f:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif}
.layer{position:absolute;inset:0}
.layer{will-change:transform}
.post{position:absolute;border-radius:28px;overflow:hidden;background:#111;box-shadow:0 40px 90px -30px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.06);transform-origin:50% 50%}
.post .ph{position:absolute;inset:0}
.post .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.72))}
.post .hd{position:absolute;left:5.5%;bottom:5%;color:#fff;font:700 1em var(--f);letter-spacing:-.01em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.post .hd small{display:block;font:500 .78em/1.25 var(--f);opacity:.9;margin-top:.25em}
.post .rail{position:absolute;right:4.5%;bottom:5%;display:flex;flex-direction:column;align-items:center;gap:.55em;color:#fff;font:700 .62em var(--f);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.post .rail svg{width:1.9em;height:1.9em;display:block;margin-bottom:.1em;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.pill{position:absolute;display:flex;align-items:center;gap:.4em;padding:.4em .8em;border-radius:999px;color:#fff;font:700 1em var(--f);white-space:nowrap;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transform-origin:50% 50%}
.chip{position:absolute;padding:.4em .75em;border-radius:999px;font:700 1em var(--f);white-space:nowrap;transform-origin:50% 50%}
.panel{position:absolute;border-radius:20px;overflow:hidden;background:#0b0a12;box-shadow:0 50px 120px -40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08),0 0 90px rgba(124,58,237,.22)}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across these demos
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 1.8
window.DUR = DUR
const at = (e, x, y, extra = '') => S(e, { left: px(x), top: px(y), transform: `translate(-50%,-50%) ${extra}` })
const wordIn = (e, t, t0, x, y, dur = .22) => { const q = spring(seg(t, t0, t0 + dur * 2.2), 8, 12); S(e, { opacity: clamp(q * 1.6), left: px(x), top: px(y), transform: `translate(-50%,-50%) translateY(${(1 - q) * 30}px) scale(${.7 + .3 * q})` }) }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x) }
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CURSOR = '<svg viewBox="0 0 24 24" width="44" height="44"><path d="M4.5 2.5l15 8.6-6.6 1.9-2.9 6.5z" fill="#fff" stroke="#0b0b10" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const HEART = (f = '#fff') => `<svg viewBox="0 0 24 24" fill="${f}"><path d="M12 21s-7.5-4.6-9.5-9.3C1 7.9 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 6 3.4 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>`
const COMMENT = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.6-2c1.1.3 2.2.5 3.4.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>`
const SHARE = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M13 4l8 7-8 7v-4.2C7.6 13.8 4.6 15.6 3 19c0-6.2 3.8-10.1 10-10.8V4z"/></svg>`
const SAVE = (f = '#fff') => `<svg viewBox="0 0 24 24" fill="${f}"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>`
const CHECK = (c = '#fff') => `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
const PHS = [['#3d5a80','#e0a97d','#1d2d44'], ['#7b2d5b','#f0c7a0','#2c1b3a'], ['#2f6b57','#d8a384','#10261f'], ['#c2603a','#f3d2b3','#40201a'], ['#4b4fa8','#e7b98f','#171a44'], ['#8a6a2d','#e9c39f','#2a200c'], ['#2a7d8f','#f1cfae','#0d2b33'], ['#a23b5a','#efc6a8','#2e0f1c']]
const phBg = (i) => { const [a, skin, b] = PHS[i % PHS.length]; return `radial-gradient(circle at 50% 33%, ${skin} 0 8.5%, transparent 9.2%), radial-gradient(ellipse 27% 19% at 50% 60%, rgba(255,255,255,.22) 0 99%, transparent 100%), linear-gradient(168deg, ${a}, ${b})` }
const phDiv = (parent, i) => { const d = el('div', 'ph', parent); d.style.background = phBg(i); return d }
const fmtK = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(n)
// post card: 9:16, sized by w. font-size scales everything inside. The photo is a gradient placeholder here.
function post(parent, i, w, handle, cap, likes = 77400, com = 2089) {
  const e = el('div', 'post', parent)
  S(e, { width: px(w), height: px(w * 16 / 9), fontSize: px(w * .085) })
  phDiv(e, i); el('div', 'sh', e)
  el('div', 'hd', e, `${handle || '@creator.name'}<small>${cap || 'A caption goes here'}</small>`)
  el('div', 'rail', e, `<div>${HEART()}<div class="n">${fmtK(likes)}</div></div><div>${COMMENT}<div>${fmtK(com)}</div></div><div>${SAVE()}<div>${fmtK(Math.round(likes / 6))}</div></div><div>${SHARE}<div>${fmtK(Math.round(likes / 4))}</div></div>`)
  return e
}
const BW = TALL ? 900 : 860, BH = BW * 403 / 700, SC = BW / 700
const revCard = post(stage, 2, 380 * K, '@creator.name', 'A caption goes here', 4200, 52)
const brain = el('div', 'panel'); S(brain, { width: px(BW), height: px(BH) })
// the full-length version plays 31 screenshots of a product scan; the demo draws a stand-in in a 700x403 box that is scaled to the panel
const dots = Array.from({ length: 70 }, (_, i) => { const a = rnd(i) * Math.PI * 2, r = Math.sqrt(rnd(i, 2)); return `<i style="position:absolute;left:${310 + Math.cos(a) * r * 190}px;top:${200 + Math.sin(a) * r * 130}px;width:${3 + rnd(i, 3) * 4}px;height:${3 + rnd(i, 3) * 4}px;border-radius:50%;background:rgba(190,170,255,${.35 + rnd(i, 4) * .5})"></i>` }).join('')
const scan = el('div', 'abs', brain, `<div style="position:absolute;left:14px;top:14px;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.06);font:500 13px var(--f);color:rgba(255,255,255,.7)">Scanning: reading the content</div>
<div class="glow" style="position:absolute;left:120px;top:60px;width:380px;height:290px;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,rgba(150,120,255,.55),rgba(90,60,210,.25) 50%,transparent 72%)"></div>${dots}
<div class="sw" style="position:absolute;top:50px;width:26px;height:310px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);filter:blur(4px)"></div>
<div style="position:absolute;left:330px;top:250px;width:250px;padding:12px 14px;border-radius:10px;background:rgba(30,28,40,.88);font:500 13px/1.35 var(--f);color:rgba(255,255,255,.88)"><b style="display:block;color:#ff7a9a;font-size:12px;margin-bottom:4px">Focus - 9/10</b>The key detail in the first frame stands out at once, the strongest signal here.</div>`)
S(scan, { left: 0, top: 0, width: '700px', height: '403px', transformOrigin: '0 0', transform: `scale(${SC})` })
const glow = scan.querySelector('.glow'), sweep = scan.querySelector('.sw')
const verdict = el('div', 'panel'); S(verdict, { width: px(BW), height: px(BH) })
const stat = (l, v, c) => `<div style="flex:1;border-radius:12px;background:rgba(255,255,255,.04);padding:14px 16px"><div style="font:600 11px var(--f);letter-spacing:.08em;color:rgba(255,255,255,.5)">${l}</div><div style="font:700 36px var(--f);color:${c};margin-top:6px">${v}</div></div>`
el('div', 'abs', verdict, `<div style="position:absolute;left:0;top:0;width:700px;height:403px;transform-origin:0 0;transform:scale(${SC});background:#0d0c16"><div style="margin:24px 28px 0;font:500 13px var(--f);color:rgba(255,255,255,.6)">Instant feedback before you publish</div>
<div style="margin:12px 28px 0;border-radius:12px;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.08);padding:18px 22px"><div style="font:700 28px var(--f);color:#34d399">Yes, good to go</div><div style="font:500 13px var(--f);color:rgba(255,255,255,.55);margin-top:6px">Strong opening, a clear contrast, and a clear ending.</div></div>
<div style="display:flex;gap:14px;margin:16px 28px 0">${stat('REACH', '84', '#34d399')}${stat('CONVERSION', '77', '#60a5fa')}${stat('REACH PROBABILITY', '81%', '#34d399')}</div></div>`)
const scored = el('div', 'chip', stage, 'Checked for you'); S(scored, { background: '#7c3aed', color: '#fff', fontSize: px(34 * K), boxShadow: '0 14px 30px -12px rgba(124,58,237,.8)' })
// times, seconds
const C_REVIEW = 15.68, T_VERDICT = 16.64, T_SCORED = 16.01
function render(t) {
  const ft = t + 15.6
  const q = spring(seg(ft, C_REVIEW, C_REVIEW + .5), 7, 11)
  const cx = TALL ? CX : CX - 560, cy = TALL ? CY - 470 : CY - 10
  vis(revCard, ft >= C_REVIEW); at(revCard, cx, cy, `scale(${(.8 + .2 * q) * (TALL ? .85 : 1)})`); revCard.style.opacity = clamp(q * 2)
  const bq = eo5(seg(ft, C_REVIEW + .05, C_REVIEW + .65)); const bx = TALL ? CX - BW / 2 : CX - 160, by = TALL ? CY - 90 : CY - BH / 2 - 10
  const fi = Math.min(30, Math.floor((ft - C_REVIEW) * 24))          // this steps through 31 frames at 24 per second
  S(glow, { opacity: .8 + .2 * Math.sin(fi * .5) }); S(sweep, { left: px(lerp(130, 560, Math.max(0, fi) / 30)) })
  const showV = ft >= T_VERDICT, vq = spring(seg(ft, T_VERDICT, T_VERDICT + .5), 8, 12)
  vis(brain, ft >= C_REVIEW && !showV); S(brain, { left: px(bx), top: px(by + (1 - bq) * 160), opacity: bq })
  vis(verdict, showV); S(verdict, { left: px(bx), top: px(by), transform: `scale(${.92 + .08 * vq})`, opacity: clamp(vq * 2) })
  const sq = spring(seg(ft, T_SCORED, T_SCORED + .55), 8, 12); vis(scored, ft >= C_REVIEW); at(scored, bx + BW - 40, by + 10, `scale(${sq}) rotate(${3 * sq}deg)`)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
