<!doctype html>
<html><head><meta charset="utf-8"><title>Campaign popup with slider and launch</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--f:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif}
.layer{position:absolute;inset:0}
.layer{will-change:transform}
.pop{position:absolute;border-radius:26px;background:#fff;box-shadow:0 50px 110px -30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.06);transform-origin:50% 0;overflow:hidden}
.pop .ttl{display:flex;align-items:center;justify-content:space-between;font:700 1em var(--f);letter-spacing:-.02em}
.tog{width:2.3em;height:1.3em;border-radius:1em;background:#d8d8de;position:relative}
.tog i{position:absolute;top:.12em;left:.12em;width:1.06em;height:1.06em;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tog.on{background:#34c759}.tog.on i{left:1.12em}
.fld{border:1.5px solid #e4e4ea;border-radius:.6em;padding:.45em .6em;font:600 .72em var(--f);color:#0b0b10;display:flex;flex-direction:column;gap:.15em}
.fld b{font:500 .78em var(--f);color:#8a8a96}
.btn{display:flex;align-items:center;justify-content:center;border-radius:.6em;background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;font:700 .82em var(--f);letter-spacing:-.01em;box-shadow:0 14px 30px -12px rgba(37,99,235,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.cursor{position:absolute;width:44px;height:44px;z-index:90;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.ring{position:absolute;border-radius:50%;border:3px solid #2f6bff;z-index:89}
.mk{position:absolute;display:grid;place-items:center;border-radius:50%;font-weight:800;color:#0b0b10;background:linear-gradient(145deg,#f4f6fa,#8a93a3 55%,#e8ecf2);filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across these demos
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 2.4
window.DUR = DUR
const at = (e, x, y, extra = '') => S(e, { left: px(x), top: px(y), transform: `translate(-50%,-50%) ${extra}` })
const wordIn = (e, t, t0, x, y, dur = .22) => { const q = spring(seg(t, t0, t0 + dur * 2.2), 8, 12); S(e, { opacity: clamp(q * 1.6), left: px(x), top: px(y), transform: `translate(-50%,-50%) translateY(${(1 - q) * 30}px) scale(${.7 + .3 * q})` }) }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x) }
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CURSOR = '<svg viewBox="0 0 24 24" width="44" height="44"><path d="M4.5 2.5l15 8.6-6.6 1.9-2.9 6.5z" fill="#fff" stroke="#0b0b10" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const HEART = (f = '#fff') => `<svg viewBox="0 0 24 24" fill="${f}"><path d="M12 21s-7.5-4.6-9.5-9.3C1 7.9 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 6 3.4 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>`
const COMMENT = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.3 1.1 4.4 2.9 5.9L4 21l4.6-2c1.1.3 2.2.5 3.4.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>`
const SHARE = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M13 4l8 7-8 7v-4.2C7.6 13.8 4.6 15.6 3 19c0-6.2 3.8-10.1 10-10.8V4z"/></svg>`
const SAVE = (f = '#fff') => `<svg viewBox="0 0 24 24" fill="${f}"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>`
const CHECK = (c = '#fff') => `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
const cursor = el('div', 'cursor', stage, CURSOR), ring = el('div', 'ring')
function clickAt(t, tc, x, y, from) {  // cursor glides in from `from`, clicks at tc with a ring
  const g = eio(seg(t, tc - .55, tc - .05)); const cx = lerp(from[0], x, g), cy = lerp(from[1], y, g)
  const press = 1 - .18 * Math.sin(Math.PI * seg(t, tc - .06, tc + .1))
  S(cursor, { left: px(cx), top: px(cy), transform: `scale(${press})`, opacity: 1 })
  const r = seg(t, tc, tc + .5); S(ring, { left: px(x), top: px(y), width: px(20 + 120 * r), height: px(20 + 120 * r), opacity: 1 - r, transform: 'translate(-50%,-50%)' }); vis(ring, r > 0 && r < 1)
}
// placeholder for a chrome logo badge
const markMk = (w, glyph = '\u2726') => { const e = el('div', 'mk', stage, glyph); S(e, { width: px(w), height: px(w), fontSize: px(w * .55) }); return e }
const gBadge = markMk(170 * K)
const popup = el('div', 'pop'); S(popup, { width: px(640 * K), padding: px(34 * K), fontSize: px(40 * K) })
popup.innerHTML = `<div class="ttl">New project<div class="tog on"><i></i></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45em;margin-top:.75em"><div class="fld"><b>Niche</b><span>Fitness</span></div><div class="fld"><b>Members</b><span>25</span></div><div class="fld"><b>Items / day</b><span>2</span></div></div>
<div class="fld" style="margin-top:.45em;flex-direction:row;align-items:center;justify-content:space-between;padding:.6em .7em"><b style="font-size:.78em">Budget</b><div class="sl" style="position:relative;width:62%;height:.32em;border-radius:1em;background:#e4e4ea"><div class="slf" style="position:absolute;left:0;top:0;height:100%;width:0;border-radius:1em;background:#2f6bff"></div><div class="slk" style="position:absolute;top:50%;left:0;width:.95em;height:.95em;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%)"></div></div></div>
<div class="btn launch" style="margin-top:.75em;height:2.3em">Launch project</div>`
const slf = popup.querySelector('.slf'), slk = popup.querySelector('.slk'), launch = popup.querySelector('.launch')
// times, seconds (voice words and scene cuts)
const C = { popup: 10.86, done: 12.98 }, WT = { pick: 10.92, set: 11.92, budget: 12.28, and2: 12.82, done: 13.0 }
function render(t) {
  const ft = t + 10.8
  vis(gBadge, false); vis(popup, false); vis(cursor, true); cursor.style.opacity = 0; vis(ring, false)
  const gq = spring(seg(ft, C.popup, C.popup + .5), 7, 11)
  const gx = TALL ? CX : CX - 430, gy = TALL ? CY - 640 : CY - 300
  if (ft >= C.popup && ft < C.done) { vis(gBadge, true); at(gBadge, gx, gy, `scale(${gq})`) }
  const pq = spring(seg(ft, WT.pick, WT.pick + .55), 7, 11), hide = ei(seg(ft, C.done - .05, C.done + .15))
  if (ft >= WT.pick && ft < C.done + .15) { vis(popup, true); S(popup, { left: px(TALL ? CX - 320 * K : CX - 200), top: px(TALL ? CY - 420 : CY - 280), transform: `scale(${(.7 + .3 * pq) * (1 - hide * .3)})`, opacity: clamp(pq * 2) * (1 - hide) }) }
  const sv = eo(seg(ft, WT.set, WT.budget + .3)) * .68; slf.style.width = (sv * 100) + '%'; slk.style.left = (sv * 100) + '%'
  const press = 1 - .06 * Math.sin(Math.PI * seg(ft, WT.done - .22, WT.done - .02)); launch.style.transform = `scale(${press})`
  if (ft >= WT.and2 && ft < C.done + .1) { const bx = (TALL ? CX : CX + 120), by = CY + 190; clickAt(ft, WT.done - .12, bx, by, [bx + 500, by + 420]); vis(cursor, true) }
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
