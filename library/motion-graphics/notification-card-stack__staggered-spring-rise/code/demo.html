<!doctype html>
<html><head><meta charset="utf-8"><title>Notification card stack</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--f:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif}
.layer{position:absolute;inset:0}
.layer{will-change:transform}
.note{position:absolute;display:flex;align-items:center;gap:.6em;padding:.55em .9em .55em .6em;border-radius:1em;background:#fff;box-shadow:0 30px 70px -25px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.07);white-space:nowrap;transform-origin:50% 50%;font:600 1em var(--f);letter-spacing:-.015em}
.note .ic{width:2.4em;height:2.4em;border-radius:.7em;background:#0b0b10;display:grid;place-items:center;flex:none;color:#fff;font-size:1em}
.note b{display:block;font:700 1em var(--f)}.note small{display:block;font:500 .86em var(--f);color:#5f5f6b;margin-top:.1em}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 3
window.DUR = DUR
const at = (e, x, y, extra = '') => S(e, { left: px(x), top: px(y), transform: `translate(-50%,-50%) ${extra}` })
const wordIn = (e, t, t0, x, y, dur = .22) => { const q = spring(seg(t, t0, t0 + dur * 2.2), 8, 12); S(e, { opacity: clamp(q * 1.6), left: px(x), top: px(y), transform: `translate(-50%,-50%) translateY(${(1 - q) * 30}px) scale(${.7 + .3 * q})` }) }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x) }
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const PHS = [['#3d5a80','#e0a97d','#1d2d44'], ['#7b2d5b','#f0c7a0','#2c1b3a'], ['#2f6b57','#d8a384','#10261f'], ['#c2603a','#f3d2b3','#40201a'], ['#4b4fa8','#e7b98f','#171a44'], ['#8a6a2d','#e9c39f','#2a200c'], ['#2a7d8f','#f1cfae','#0d2b33'], ['#a23b5a','#efc6a8','#2e0f1c']]
const phBg = (i) => { const [a, skin, b] = PHS[i % PHS.length]; return `radial-gradient(circle at 50% 33%, ${skin} 0 8.5%, transparent 9.2%), radial-gradient(ellipse 27% 19% at 50% 60%, rgba(255,255,255,.22) 0 99%, transparent 100%), linear-gradient(168deg, ${a}, ${b})` }
const phDiv = (parent, i) => { const d = el('div', 'ph', parent); d.style.background = phBg(i); return d }
const faceBg = (i) => { const [a, skin, b] = PHS[i % PHS.length]; return `radial-gradient(circle at 50% 38%, ${skin} 0 26%, transparent 28%), linear-gradient(160deg, ${a}, ${b})` }
const noteMk = (title, body, faces = []) => { const n = el('div', 'note'); S(n, { fontSize: px(TALL ? 30 : 34) }); n.innerHTML = `<div class="ic">✦</div><div><b>${title}</b><small>${body}</small></div>` + (faces.length ? `<div style="display:flex;margin-left:.4em">${faces.map((f, i) => `<span style="display:block;width:1.9em;height:1.9em;border-radius:50%;background:${faceBg(f)};border:2px solid #fff;margin-left:${i ? '-.55em' : 0}"></span>`).join('')}</div>` : ''); return n }
const note1 = noteMk('App name', '24 items matched to your brief', [0, 3, 5]), note2 = noteMk('App name', '6 new files ready for review', [2, 6])
const T1 = .5                           // the first card starts .1s before the cue word
function render(t) {
  // original positions are CY+130 and CY+270 (wide); the demo moves them up 190px so the stack is centred
  const n1 = spring(seg(t, T1, T1 + .6), 7, 11), n2 = spring(seg(t, T1 + .45, T1 + 1.05), 7, 11)
  vis(note1, n1 > 0); vis(note2, n2 > 0)
  if (n1 > 0) { at(note1, CX + (TALL ? 0 : 20), CY - 70 + (1 - n1) * 120, `rotate(${-3 * n1}deg) scale(${.8 + .2 * n1})`); note1.style.opacity = clamp(n1 * 2) }
  if (n2 > 0) { at(note2, CX + (TALL ? 0 : 40), CY + 70 + (1 - n2) * 120, `rotate(${2.5 * n2}deg) scale(${.8 + .2 * n2})`); note2.style.opacity = clamp(n2 * 2) }
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
