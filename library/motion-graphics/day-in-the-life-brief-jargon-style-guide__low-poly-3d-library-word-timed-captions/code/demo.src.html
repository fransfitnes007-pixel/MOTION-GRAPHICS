    else { q = { ...TYPE, eye: 1.3 }; c = CAM.shoulder; ck = seg(t, T.foundG, T.guide); v.flash = (1 - seg(t, T.foundG, T.foundG + 0.3)) * 0.85; v.coin = [0.3, 0.21, back(seg(t, T.foundG, T.foundG + 0.4)), t] }
  } else if (t < T.what) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.guide, T.what); docMode = 2; showDoc(T.guide); if (t >= T.tenHit) { v.pills.push(['10 STYLES', 0, back(seg(t, T.tenHit, T.tenHit + 0.2)), 'good']); shake = (1 - seg(t, T.tenHit, T.tenHit + 0.3)) * 0.5 } }
  else if (t < T.me) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.what, T.me); docMode = 3; showDoc(T.what, false); for (const h of [T.whatHit, T.whenHit, T.th2Hit, T.bestHit]) if (t >= h) shake = Math.max(shake, (1 - seg(t, h, h + 0.28)) * (h === T.bestHit ? 0.7 : 0.35)) }
  else if (t < T.no) { const k = back(seg(t, T.me, T.me + 0.18)); q = mixP(TYPE, { ...SIT, alx: -0.9, ale: -2.0, alz: 0.3, arx: -0.9, are: -2.0, arz: -0.3, hx: -0.06, eye: 1.3, mw: 1.8, mh: 2.0, brow: -0.15 }, k); c = CAM.front; ck = seg(t, T.me, T.no); glowOn = 1.2; if (t >= T.meHit) { v.pills.push(['NEW CREATOR: ME', 0, back(seg(t, T.meHit, T.meHit + 0.2)), 'good']); shake = (1 - seg(t, T.meHit, T.meHit + 0.3)) * 0.4 } }
  else if (t < T.still) {                                                       // no jargon, no nodding, no bullshit
    c = CAM.center; ck = seg(t, T.no, T.still)
    if (t < T.nob) {
      const n = t < T.n2s ? 0 : 1, h0 = n ? T.n2 + 0.15 : T.n1 + 0.1, st = n ? T.n2s : T.no, side = n ? 1 : -1, sw = seg(t, h0 - 0.1, h0 + 0.08), swing = Math.sin(sw * PI)
      q = { ...STAND, hy: -side * 0.35, mw: 1.5, mh: 1.4, brow: -0.15 }
      if (side < 0) { q.alz = -1.2 - swing * 1.2; q.alx = -0.4 * swing; q.ale = -0.6 } else { q.arz = 1.2 + swing * 1.2; q.arx = -0.4 * swing; q.are = -0.6 }
      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? bob : dict
      o.position.set(px, py, 2.3); o.rotation.set(0, spin * 0.6 + (n ? -0.2 : 0.25), spin); o.scale.setScalar(Math.max(0.01, inK * (n ? 1.0 : 0.95))); if (n) bobHead.rotation.x = Math.sin(t * 22) * 0.35; if (t >= h0) shake = (1 - seg(t, h0, h0 + 0.25)) * 0.5

    } else { const k = back(seg(t, T.nob, T.nob + 0.2)); q = mixP({ ...STAND }, { ...STAND, alx: -0.85, ale: -1.75, alz: 0.55, arx: -0.85, are: -1.75, arz: -0.55, eye: 0.7, brow: -0.25, mw: 1.3, mh: 0.8, hx: -0.06 }, k); if (t >= T.nobHit) shake = (1 - seg(t, T.nobHit, T.nobHit + 0.4)) * 0.9; v.pills.push(['JARGON', 0, 1, 'bad'], ['NODDING', 1, 1, 'bad']) }
  } else { q = { ...TYPE }; c = CAM.book; ck = seg(t, T.still, T.end); if (t >= T.stillHit) { v.pills.push(['B-ROLL = BREAD. STILL.', 0, back(seg(t, T.stillHit, T.stillHit + 0.2)), 'bad']); shake = (1 - seg(t, T.stillHit, T.stillHit + 0.35)) * 0.7 } }
  applyPose({ ...q, tx: q.tx + breathe })
  setCam(c[0], c[1], c[2], eo(ck) * 0.6 + ck * 0.4, 0.07, shake)
  lid.rotation.x = lidA
  docBody.color.set(docMode >= 2 ? 0x15161a : 0xffffff)
  // light and mood: a grey afternoon, then the reading lamp
  const warm = new THREE.Color(0xffd9a8)
  scene.background.set(0x9aa3a8).lerp(new THREE.Color(0xe6c9a0), good); shelfMat.color.set(0xdde3e8).lerp(new THREE.Color(0xffffff), good); wall2.color.set(0xa9b0b3).lerp(new THREE.Color(0xe9cda4), good); winMat.color.set(0xc3ced6).lerp(new THREE.Color(0xffe2a8), good); lampMat.color.set(0x9fb3a6).lerp(new THREE.Color(0xfff0c2), good)
  sun.color.set(0xd4dee8).lerp(warm, good); sun.intensity = lerp(1.4, 1.95, good); hemi.intensity = lerp(1.3, 1.3, good); hemi.color.set(0xdbe5ee).lerp(new THREE.Color(0xffe9cf), good)
  glow.position.set(2.0, 2.1, -1.55); glow.intensity = glowOn * 2.2
  lidG.material.opacity = t >= T.me && t < T.no ? 0 : good
  drawBread(t); drawLaptop(t); if (phoneOn) drawPhone(t); if (docMode >= 0) drawDoc(docMode, t)

    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.font = '600 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.fillText(CONFIG.site.toUpperCase(), CX, H * CONFIG.capY + 190); g.shadowColor = 'transparent'; g.globalAlpha = 1
  }
  const fl = Math.max(v.flash, (1 - seg(t, T.end, T.end + 0.3)) * seg(t, T.end - 0.12, T.end)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H) }
