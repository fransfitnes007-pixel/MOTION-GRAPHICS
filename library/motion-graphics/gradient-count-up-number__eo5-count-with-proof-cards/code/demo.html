<!doctype html>
<html><head><meta charset="utf-8"><title>Gradient count-up number</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--f:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif}
.layer{position:absolute;inset:0}
.layer{will-change:transform}
.word{position:absolute;white-space:nowrap;font:600 1em var(--f);letter-spacing:-.02em;transform-origin:50% 50%}
.big{position:absolute;white-space:nowrap;font:800 1em/0.9 var(--f);letter-spacing:-.055em;transform-origin:50% 50%}
.grad{background:linear-gradient(92deg,#ff7a3d 0%,#ff2e97 55%,#7c3aed 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bgrad{background:linear-gradient(92deg,#2f6bff,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-variant-numeric:tabular-nums}
.logo{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.7em 1em;border-radius:1em;background:#fff;box-shadow:0 30px 70px -25px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.06);font:800 1em var(--f);letter-spacing:-.03em;white-space:nowrap;transform-origin:50% 50%}
.logo i{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:.4em;background:#0b0b10;color:#fff;font-style:normal;font-size:1em}
.logo small{font:600 .42em var(--f);color:#5f5f6b;letter-spacing:0}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across this library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 2.2
window.DUR = DUR
const at = (e, x, y, extra = '') => S(e, { left: px(x), top: px(y), transform: `translate(-50%,-50%) ${extra}` })
const wordIn = (e, t, t0, x, y, dur = .22) => { const q = spring(seg(t, t0, t0 + dur * 2.2), 8, 12); S(e, { opacity: clamp(q * 1.6), left: px(x), top: px(y), transform: `translate(-50%,-50%) translateY(${(1 - q) * 30}px) scale(${.7 + .3 * q})` }) }
const rnd = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x) }
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const counter = el('div', 'big bgrad num', stage, '0'); S(counter, { fontSize: px(TALL ? 150 : 210), textAlign: 'center' })
const counterLbl = el('div', 'word', stage, 'views tracked'); S(counterLbl, { fontSize: px(46 * K), fontWeight: 600, color: '#0b0b10' })
const logoMk = (n, who) => { const e = el('div', 'logo'); S(e, { fontSize: px(TALL ? 46 : 54) }); e.innerHTML = `<i>✦</i><span class="num">${n}</span><small>views for ${who}</small>`; return e }
const logoA = logoMk('4,820,331', 'Brand A'), logoB = logoMk('3,106,447', 'Brand B')
// times, seconds
const C_TRACK = 18.6, T_TRACK = 18.64, T_EVERY2 = 18.88, T_VIEW = 19.4
function render(t) {
  const ft = t + 18.5
  const q = eo5(seg(ft, T_TRACK, T_VIEW + .25)); const n = q * 1e9
  counter.textContent = (q >= 1 ? '1,000,000,000+' : fmt(n))
  vis(counter, true); at(counter, CX, TALL ? CY - 200 : CY - 110, `scale(${.9 + .1 * spring(seg(ft, C_TRACK, C_TRACK + .5), 7, 11)})`)
  vis(counterLbl, true); wordIn(counterLbl, ft, T_EVERY2, CX, TALL ? CY - 60 : CY + 40)
  const la = spring(seg(ft, T_EVERY2 + .05, T_EVERY2 + .6), 7, 11), lb = spring(seg(ft, T_VIEW + .05, T_VIEW + .6), 7, 11)
  vis(logoA, la > 0); vis(logoB, lb > 0)
  if (la > 0) { at(logoA, TALL ? CX - 240 : CX - 640, TALL ? CY + 520 : CY + 160, `rotate(${-4 * la}deg) scale(${.7 + .3 * la})`); logoA.style.opacity = clamp(la * 2) }
  if (lb > 0) { at(logoB, TALL ? CX + 240 : CX + 640, TALL ? CY + 560 : CY + 190, `rotate(${3 * lb}deg) scale(${.7 + .3 * lb})`); logoB.style.opacity = clamp(lb * 2) }
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
