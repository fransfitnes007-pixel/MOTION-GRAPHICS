<!doctype html>
<html><head><meta charset="utf-8"><title>Section title with progress list</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#f4f5f7;color:#0b0c10;letter-spacing:-0.02em}
.blob{position:absolute;left:0;top:0;border-radius:50%;filter:blur(110px)}
.abs0{position:absolute;left:0;top:0;transform-origin:0 0}
#sx .eyebrow{font-weight:600;color:#5b5ce6;letter-spacing:.06em;text-transform:uppercase}
#sx .title{font-weight:700;letter-spacing:-0.03em;display:inline-block;line-height:1.02;white-space:nowrap}
#sx .desc{font-weight:500;color:#3a3d46;line-height:1.28;letter-spacing:-0.015em}
.li{position:absolute;left:0;display:flex;align-items:center;white-space:nowrap}
.li i{display:block;border-radius:4px;flex:none}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const BLOBS = [['#dfe3ff', .62], ['#ffe1ec', .56], ['#dff6ff', .5]].map(([c, s]) => { const b = el('div', 'blob'); S(b, { background: c, width: px(s * Math.max(W, H)), height: px(s * Math.max(W, H)) }); return b })
function drawBlobs(t) {
  const M = Math.max(W, H), tf = (e, x, y) => { e.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)' }
  tf(BLOBS[0], -0.16 * M + Math.sin(t * 0.35) * 40, -0.2 * M + Math.cos(t * 0.3) * 30); BLOBS[0].style.opacity = 0.75
  tf(BLOBS[1], W - 0.34 * M + Math.cos(t * 0.28) * 40, H * 0.3 + Math.sin(t * 0.33) * 40); BLOBS[1].style.opacity = 0.62
  tf(BLOBS[2], W * 0.25 + Math.sin(t * 0.25 + 1) * 50, H - 0.3 * M + Math.cos(t * 0.31) * 30); BLOBS[2].style.opacity = 0.65
}
const tf = (e, x, y, s = 1) => { e.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')' }
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const U = W / (TALL ? 1080 : 1920), DW = W / U, DH = H / U
const L = TALL ? { tx: { x: 70, y: 150, w: 940, eyebrow: 28, title: 112, desc: 40, gap1: 20, gap2: 26 }, list: { x: 70, y: 1200, font: 46, gap: 86 } }
  : { tx: { x: 100, y: 190, w: 540, eyebrow: 26, title: 96, desc: 34, gap1: 16, gap2: 22 }, list: { x: 100, y: 560, font: 34, gap: 60 } }
const SECTIONS = [['Overview', 'A short line about this section.'], ['Projects', 'What you would show here.'], ['Results', 'The numbers, with the proof.'], ['Pricing', 'Simple, one line to read.'], ['Contact', 'How people reach you.']]
const SEC_T = [0, 1.5, 3.0, 4.5, 6.0]
const DUR = 8
window.DUR = DUR
const world = el('div'); S(world, { position: 'absolute', left: 0, top: 0, width: px(DW), height: px(DH), transformOrigin: '0 0', transform: 'scale(' + U + ')' })
const sx = el('div', 'abs0', world); sx.id = 'sx'
sx.innerHTML = '<div class="eyebrow" id="sxn"></div><div class="title" id="sxt"></div><div class="desc" id="sxd"></div>'
S(sx, { width: L.tx.w + 'px' })
const sxn = sx.querySelector('#sxn'), sxt = sx.querySelector('#sxt'), sxd = sx.querySelector('#sxd')
sxn.style.fontSize = L.tx.eyebrow + 'px'; sxt.style.marginTop = L.tx.gap1 + 'px'
sxd.style.cssText += 'font-size:' + L.tx.desc + 'px;margin-top:' + L.tx.gap2 + 'px;max-width:' + L.tx.w + 'px'
const sxl = el('div', 'abs0', world)
const lis = SECTIONS.map(([name], i) => { const d = el('div', 'li', sxl); d.style.top = i * L.list.gap + 'px'; d.style.fontSize = L.list.font + 'px'; d.innerHTML = '<i></i><span>' + name + '</span>'; return d })
const fitCache = {}
function titleSize(txt) {                                       // shrink a long title to fit the column
  if (fitCache[txt] == null) { const pr = document.createElement('div'); pr.className = 'title'; pr.style.cssText = 'position:absolute;visibility:hidden;font-weight:700;letter-spacing:-0.03em;white-space:nowrap;font-size:' + L.tx.title + 'px'; pr.textContent = txt; sx.appendChild(pr); const w = pr.getBoundingClientRect().width / U; sx.removeChild(pr); fitCache[txt] = Math.floor(L.tx.title * Math.min(1, (L.tx.w - 4) / w)) }
  return fitCache[txt]
}
const secIndex = (t) => { let i = 0; for (let j = 0; j < SEC_T.length; j++) if (t >= SEC_T[j]) i = j; return i }

function render(t) {
  drawBlobs(t)
  const exit = seg(t, DUR - .35, DUR)
  const si = secIndex(t)
  const tin = si === 0 ? eo(seg(t, .2, .65)) : eo(seg(t, SEC_T[si] + .1, SEC_T[si] + .5))
  const nextT = si + 1 < SEC_T.length ? SEC_T[si + 1] : DUR - .5
  const tout = seg(t, nextT - .24, nextT - .03)
  sxn.textContent = String(si + 1).padStart(2, '0') + ' / ' + String(SECTIONS.length).padStart(2, '0')
  sxt.textContent = SECTIONS[si][0]; sxt.style.fontSize = titleSize(SECTIONS[si][0]) + 'px'
  sxd.textContent = SECTIONS[si][1]
  sx.style.opacity = tin * (1 - tout) * (1 - exit)
  tf(sx, L.tx.x, L.tx.y + (1 - tin) * 26 - tout * 14)
  const listIn = eo(seg(t, .3, .8))
  sxl.style.opacity = listIn * (1 - exit); tf(sxl, L.list.x, L.list.y + (1 - listIn) * 24)
  lis.forEach((li, j) => {
    let a = 0
    if (j === si) a = j === 0 ? 1 : eo(seg(t, SEC_T[j], SEC_T[j] + .35))
    else if (j === si - 1) a = 1 - eo(seg(t, SEC_T[si], SEC_T[si] + .35))
    const done = j < si ? 1 : 0, ic = li.firstChild, sp = li.lastChild, fs = L.list.font
    ic.style.width = lerp(fs * .32, fs * 1.05, a) + 'px'; ic.style.height = fs * .16 + 'px'; ic.style.marginRight = fs * .5 + 'px'
    ic.style.background = a > .5 ? '#5b5ce6' : done ? '#8b8cf0' : '#cdd0d8'
    sp.style.fontWeight = a > .5 ? 700 : 500
    const base = done ? 92 : 154
    sp.style.color = 'rgb(' + Math.round(lerp(base, 11, a)) + ',' + Math.round(lerp(done ? 96 : 158, 12, a)) + ',' + Math.round(lerp(done ? 107 : 168, 16, a)) + ')'
  })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
