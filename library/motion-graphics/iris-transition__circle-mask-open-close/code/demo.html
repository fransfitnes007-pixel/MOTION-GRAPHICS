<!doctype html>
<html><head><meta charset="utf-8"><title>Iris transition</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#000;color:#fff}
.sc{position:absolute;left:0;top:0;overflow:hidden}
.sc .t{position:absolute;font-weight:800;letter-spacing:-.045em;line-height:1}
.sc .s{position:absolute;font-weight:500;letter-spacing:-.01em;opacity:.75}
.sc .orb{position:absolute;border-radius:50%}
.irisring{position:absolute;border-radius:50%;box-sizing:border-box}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const pr = (t, a, d) => seg(t, a, a + d)          // progress 0..1 of a move that starts at a and lasts d seconds
const DUR = 6
window.DUR = DUR
const eio5 = (x) => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2
const C = { x: CX, y: CY }
const P = TALL ? { x: CX + W * .1, y: CY - H * .14 } : { x: CX + W * .2, y: CY - H * .02 }   // the subject the iris closes on
const OR = TALL ? 240 : 270                                                                 // subject radius
const mk = (bg, acc, title, sub, flip) => {
  const s = el('div', 'sc'); S(s, { width: px(W), height: px(H), background: bg })
  const o1 = el('div', 'orb', s), o2 = el('div', 'orb', s), o3 = el('div', 'orb', s)
  const big = OR * 2
  S(o1, { width: px(big * 1.9), height: px(big * 1.9), left: px(P.x - big * .95), top: px(P.y - big * .95), background: 'radial-gradient(circle,' + acc + '55 0%,transparent 65%)' })
  S(o2, { width: px(big), height: px(big), left: px(P.x - OR), top: px(P.y - OR), background: 'radial-gradient(circle at 34% 28%,#fff 0%,' + acc + ' 35%,rgba(0,0,0,.55) 110%)', boxShadow: '0 40px 100px -20px rgba(0,0,0,.7)' })
  S(o3, { width: px(big * .62), height: px(big * .62), left: px(P.x - OR * .62 + (flip ? 40 : -40)), top: px(P.y - OR * .62), border: '3px solid #ffffff55', background: 'transparent' })
  const t = el('div', 't', s, title), u = el('div', 's', s, sub)
  if (TALL) { S(t, { left: px(70), top: px(H * .62), fontSize: px(150) }); S(u, { left: px(74), top: px(H * .62 + 175), fontSize: px(44) }) }
  else { S(t, { left: px(110), top: px(CY - 130), fontSize: px(170) }); S(u, { left: px(114), top: px(CY + 60), fontSize: px(46) }) }
  return s
}
const A = mk('linear-gradient(135deg,#2b2f8f 0%,#171a52 55%,#0d0e2c 100%)', '#8b93ff', 'Scene one', 'Closes on its subject', false)
const B = mk('linear-gradient(135deg,#ff8a4c 0%,#d6366b 55%,#4a1459 100%)', '#ffc08a', 'Scene two', 'Opens on the same point', true)
const ring = el('div', 'irisring'), ring2 = el('div', 'irisring')
const rmax = (c) => Math.max(Math.hypot(c.x, c.y), Math.hypot(W - c.x, c.y), Math.hypot(c.x, H - c.y), Math.hypot(W - c.x, H - c.y)) + 4

// timeline: black, A opens from the centre, holds, closes onto the subject, B opens from the subject, holds, closes on the centre
function iris(t) {
  if (t < .25) return { s: null, r: 0, c: C }
  if (t < 1.3) return { s: A, r: rmax(C) * eo5(pr(t, .25, 1.05)), c: C }
  if (t < 2.5) return { s: A, r: rmax(C), c: C }
  if (t < 3.3) { const m = eio((t - 2.5) / .8), c = { x: lerp(C.x, P.x, m), y: lerp(C.y, P.y, m) }; return { s: A, r: Math.max(0, rmax(c) * (1 - eio5(pr(t, 2.5, .8)))), c } }
  if (t < 3.6) return { s: null, r: 0, c: P }
  if (t < 4.6) return { s: B, r: rmax(P) * eo5(pr(t, 3.6, 1.0)), c: P }
  if (t < 5.3) return { s: B, r: rmax(P), c: P }
  const m = eio((t - 5.3) / .7), c = { x: lerp(P.x, C.x, m), y: lerp(P.y, C.y, m) }
  return { s: B, r: Math.max(0, rmax(c) * (1 - eio5(pr(t, 5.3, .7)))), c }
}
function render(t) {
  const q = iris(t)
  vis(A, q.s === A); vis(B, q.s === B)
  const rr = Math.max(q.r, 0)
  if (q.s) q.s.style.clipPath = 'circle(' + rr.toFixed(1) + 'px at ' + q.c.x.toFixed(1) + 'px ' + q.c.y.toFixed(1) + 'px)'
  // light ring on the iris edge, only while the iris is a visible circle
  const edge = q.s && rr > 6 && rr < rmax(q.c) * .98
  const fade = q.s ? clamp(rr / 60) * (1 - clamp((rr - rmax(q.c) * .82) / (rmax(q.c) * .16))) : 0
  S(ring, { left: px(q.c.x - rr), top: px(q.c.y - rr), width: px(rr * 2), height: px(rr * 2), border: '3px solid rgba(255,255,255,.85)', boxShadow: '0 0 40px rgba(255,255,255,.35),inset 0 0 40px rgba(255,255,255,.12)', opacity: edge ? fade : 0 })
  S(ring2, { left: px(q.c.x - rr - 22), top: px(q.c.y - rr - 22), width: px(rr * 2 + 44), height: px(rr * 2 + 44), border: '1px solid rgba(255,255,255,.3)', opacity: edge ? fade * .8 : 0 })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
