    const lit = seg(t, T.brain + 0.1, T.tells) * 12; nodes.forEach((n, i) => { const on = i < lit, pulse = on ? 0.75 + 0.25 * Math.sin(t * 9 + i * 1.7) : 0.18; n.material.color.setScalar(pulse); n.scale.setScalar(on ? 1 + 0.35 * Math.max(0, Math.sin(t * 9 + i * 1.7)) : 0.7) })
    const sc = t < T.tells ? Math.sin((t - T.brain) * 7) : 0; scanRing.position.y = sc * 0.75; scanRing.scale.setScalar(Math.sqrt(Math.max(0.05, 1 - sc * sc * 0.55))); ringMat.opacity = t < T.tells ? 0.85 : 0.85 * (1 - seg(t, T.tells, T.tells + 0.3))

  } else if (t < T.again2) { q = TALK(t, 1.4); P.prod.visible = true; c = CAM.filmC; ck = seg(t, T.fixit, T.again2); softOn = 1.2 }       // I fix it
  else if (t < T.ok) { const ty = Math.sin(t * 26); q = { ...TYPE, ale: -1.15 + ty * 0.12, are: -1.15 - ty * 0.12, eye: 1.15, mw: 1.3 }; c = CAM.shoulder; ck = seg(t, T.again2, T.ok); glowOn = 1.2 }   // upload it again

    c = CAM.frontR; ck = seg(t, T.ok, T.no); glowOn = 1.2; v.stamp = ['APPROVED', seg(t, T.ok, T.ok + 0.16), '#16a46a', -0.08, 0.2]; shake = (1 - seg(t, T.ok, T.ok + 0.35)) * 0.8; v.flash = (1 - seg(t, T.ok, T.ok + 0.25)) * 0.5
  } else {                                                                      // no guessing, no waiting, no bullshit

      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? wc : qm
      o.position.set(px, py, 2.3); o.rotation.set(0, spin * 0.8, spin); o.scale.setScalar(Math.max(0.01, 1.05 * inK)); if (t >= h0) shake = (1 - seg(t, h0, h0 + 0.25)) * 0.5
    } else { const k = back(seg(t, T.nob, T.nob + 0.2)); q = mixP({ ...STAND, ry: 0, x: 0.25 }, { ...STAND, ry: 0, x: 0.25, alx: -0.85, ale: -1.75, alz: 0.55, arx: -0.85, are: -1.75, arz: -0.55, eye: 0.7, brow: -0.25, mw: 1.3, mh: 0.8, hx: -0.06 }, k); if (t >= T.nobHit) shake = (1 - seg(t, T.nobHit, T.nobHit + 0.4)) * 0.9 }

  applyPose({ ...q, tx: q.tx + breathe }); P.hook.rotation.x = -(q.arx + q.are); P.hook.rotation.z = -q.arz

  // light and mood: a cold evening, then the lamp comes on
  wallMat.color.set(CONFIG.wallPain).lerp(new THREE.Color(CONFIG.wallGood), good); wallMat2.color.copy(wallMat.color).multiplyScalar(0.9)

// ---------- 2D layer: captions, pills, stamps, list, end card

}

  g.font = '800 92px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const w = g.measureText(text).width + 90; g.fillStyle = color; g.beginPath(); g.roundRect(-w / 2, -80, w, 160, 26); g.fill()
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.beginPath(); g.roundRect(-w / 2 + 14, -66, w - 28, 132, 16); g.stroke()

function coin(xs, ys, k, t, size = 400) {

  g.save(); g.translate(W * xs, H * ys); g.shadowColor = 'rgba(255,255,255,.55)'; g.shadowBlur = 70; g.drawImage(G_IMG, -w / 2, -h / 2, Math.max(2, w), h); g.restore()
}
function captions(t) {
  let gi = -1; for (let i = 0; i < GROUPS.length; i++) { if (t >= WORDS[GROUPS[i][0]][1] - 0.04) gi = i }

function endCard(t) {

// The brain's verdict: a video timeline that gets scanned, two red marks, and the two fixes with their times.
function review(t) {
  const inK = back(seg(t, T.brain, T.brain + 0.25)); if (inK <= 0) return
  const w = 800, x0 = CX - w / 2, y0 = SAFE.top + 6, h = 190
  g.save(); g.translate(CX, y0 + h / 2); g.scale(inK, inK); g.translate(-CX, -(y0 + h / 2))
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 16; g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(x0, y0, w, h, 34); g.fill(); g.shadowColor = 'transparent'
  g.drawImage(G_IMG, x0 + 30, y0 + 22, 36, 45); g.fillStyle = CONFIG.bright; g.font = '700 34px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('Review brain', x0 + 80, y0 + 46)
  g.fillStyle = CONFIG.muted; g.font = '600 28px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'right'; g.fillText(t < T.tells ? 'watching my-video.mp4' : '2 fixes found', x0 + w - 32, y0 + 46)

  const marks = [0.11, 0.39]
  marks.forEach((m, i) => { const k = back(seg(t, T.fixW + i * 0.12, T.fixW + 0.2 + i * 0.12)); if (k <= 0) return; const mx = bx + bw * m; g.fillStyle = CONFIG.bad; g.beginPath(); g.roundRect(mx - 5, by - 8, 10, bh + 16, 5); g.fill(); g.beginPath(); g.arc(mx, by - 12, 13 * k, 0, 7); g.fill()
    const kw = back(seg(t, T.where + i * 0.1, T.where + 0.2 + i * 0.1)); if (kw > 0) { g.save(); g.translate(mx, by + bh + 34); g.scale(kw, kw); g.fillStyle = CONFIG.bad; g.beginPath(); g.roundRect(-46, -20, 92, 40, 20); g.fill(); g.fillStyle = '#fff'; g.font = '800 26px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.fillText(CONFIG.fixes[i][0], 0, 2); g.restore() } })
  if (t < T.tells) { const px = bx + bw * (0.5 + 0.5 * Math.sin((t - T.brain) * 7 - PI / 2)); g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 16; g.fillRect(px - 3, by - 10, 6, bh + 20); g.shadowColor = 'transparent' }
  g.restore()
  ;[T.fix1, T.fix2].forEach((t0, i) => { const k = back(seg(t, t0, t0 + 0.22)); if (k <= 0) return; const cy = y0 + h + 110 + i * 126, cw = 760
    g.save(); g.translate(CX, cy); g.scale(k, k); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30; g.shadowOffsetY = 12; g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(-cw / 2, -52, cw, 104, 30); g.fill(); g.shadowColor = 'transparent'
    g.fillStyle = CONFIG.bad; g.beginPath(); g.roundRect(-cw / 2 + 22, -32, 124, 64, 32); g.fill(); g.fillStyle = '#fff'; g.font = '800 38px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(CONFIG.fixes[i][0], -cw / 2 + 84, 2)
    g.textAlign = 'left'; g.font = '700 44px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.fillText(CONFIG.fixes[i][1], -cw / 2 + 172, 2); g.restore() })
}
function overlay(t) {
  g.clearRect(0, 0, W, H); const v = view

  if (t < T.end + 0.4) {
    if (v.coin) coin(v.coin[0], v.coin[1], v.coin[2], v.coin[3])
    for (const p of v.pills) pill(p[0], p[1], p[2], p[3])
    if (v.stamp) stamp(v.stamp[0], v.stamp[1], v.stamp[2], v.stamp[3], v.stamp[4])

window.render = (t) => { t = clamp(t, 0, T.dur); state(t); R.render(scene, cam); overlay(t) }
