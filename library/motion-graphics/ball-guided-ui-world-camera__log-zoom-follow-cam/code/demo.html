<!doctype html>
<html><head><meta charset="utf-8"><title>Ball guided ui world camera</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @rossaxbt's "White dot UI motion system" (motionvideo.xyz rossaxbt-4e066d, 10s, 16:9). All controls live in
// one world on a dark dot grid; a white ball pops out of a toggle, lands on a slider knob and drives it to 100, bounces across
// three notification cards as they arrive, then the camera pulls back and the ball rides home to the toggle so the loop closes.
// The camera follows the ball with a moving average of its path and zooms in log space.
const CONFIG = {
  bg: '#0b0b0c', ctrl: '#2d2f32', card: '#1c1c1f', text: '#ffffff', sub: 'rgba(255,255,255,.5)', accent: '#1d77de', ball: '#ffffff',
  cards: ['Slider', 'Gravity', 'Messages'], subs: ['Reached 100', 'Ball landed', 'What now?'],
  zoom: [[0, 1.9], [.9, 1.9], [1.5, 1.35], [2.7, 1.35], [3.3, 1.2], [4.0, .78], [4.75, .78], [5.3, 1.9]],   // [t, zoom], eased in log space
  dur: 5.6,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 * .8 : W / 1920
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
stage.style.background = C.bg
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; stage.appendChild(cv)
const g = cv.getContext('2d')
const FONT = (s, w = 600) => `${w} ${s}px -apple-system, system-ui, sans-serif`
// world layout (world px)
const TG = { x: 0, y: 0, w: 128, h: 68 }                       // toggle centre
const SL = { x0: 360, x1: 900, y: -30 }                        // slider track
const CARDS = [0, 1, 2].map((i) => ({ x: 1240, y: -150 + i * 120, w: 380, h: 96, t: 2.95 + i * .25 }))
const R = 22                                                   // ball radius
const knobOff = TG.x - TG.w / 2 + TG.h / 2, knobOn = TG.x + TG.w / 2 - TG.h / 2
const arc = (a, b, u, lift) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u) - Math.sin(Math.PI * u) * lift]
// the ball's whole route as one pure function of time
function ball(t) {
  if (t < .62) return [knobOff, TG.y]
  if (t < .78) return [lerp(knobOff, knobOn, eo(seg(t, .62, .78))), TG.y]                  // knob slides on with the click
  if (t < 1.35) return arc([knobOn, TG.y], [SL.x0, SL.y], eio(seg(t, .78, 1.35)), 220)      // springs free, arcs to the slider
  if (t < 2.6) return [lerp(SL.x0, SL.x1, eio(seg(t, 1.45, 2.6))), SL.y]                    // drives the knob to 100
  const hits = CARDS.map((c) => [c.x - c.w / 2 + 48, c.y])
  if (t < 3.2) return arc([SL.x1, SL.y], hits[0], eio(seg(t, 2.6, 3.2)), 260)
  if (t < 3.45) return arc(hits[0], hits[1], seg(t, 3.2, 3.45), 90)
  if (t < 3.7) return arc(hits[1], hits[2], seg(t, 3.45, 3.7), 90)
  if (t < 4.0) return hits[2]
  return arc(hits[2], [knobOff, TG.y], eio(seg(t, 4.0, 5.05)), 520)                          // the long ride home
}
const impacts = [1.35, 3.2, 3.45, 3.7, 5.05]
const squash = (t) => impacts.reduce((m, a) => Math.max(m, Math.sin(Math.PI * seg(t, a - .02, a + .14)) * (1 - seg(t, a, a + .14) * .4)), 0)
function camAt(t) {      // moving average of the last .35s of the ball path, so the camera trails smoothly and stays pure
  let x = 0, y = 0, n = 14
  for (let k = 0; k < n; k++) { const p = ball(Math.max(0, t - k * .025)); x += p[0]; y += p[1] }
  x /= n; y /= n
  const pull = eio(seg(t, 3.7, 4.3)) * (1 - eio(seg(t, 4.75, 5.3)))      // the pull back frames the whole world
  return [lerp(x, 600, pull), lerp(y, 0, pull)]
}
function zoomAt(t) { const K = C.zoom; let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++; const u = eio(seg(t, K[i][0], K[i + 1][0])); return Math.exp(lerp(Math.log(K[i][1]), Math.log(K[i + 1][1]), u)) }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r) }

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.bg; g.fillRect(0, 0, W, H)
  const [cx, cy] = camAt(t), z = zoomAt(t) * Z
  g.setTransform(z, 0, 0, z, CX - cx * z, CY - cy * z)
  // dot grid, world-locked
  g.fillStyle = 'rgba(255,255,255,.07)'
  const x0 = Math.floor((cx - CX / z) / 40) * 40, y0 = Math.floor((cy - CY / z) / 40) * 40
  for (let x = x0; x < cx + CX / z + 40; x += 40) for (let y = y0; y < cy + CY / z + 40; y += 40) g.fillRect(x - 1.5, y - 1.5, 3, 3)
  const b = ball(t)
  // toggle: on while the ball is away, off again when it returns
  const on = clamp(seg(t, .62, .78)) * (1 - seg(t, 4.95, 5.1))
  g.fillStyle = on > .5 ? C.accent : C.ctrl; rr(TG.x - TG.w / 2, TG.y - TG.h / 2, TG.w, TG.h, TG.h / 2); g.fill()
  // slider
  const prog = t < 1.35 ? 0 : t < 2.6 ? (b[0] - SL.x0) / (SL.x1 - SL.x0) : 1
  const fade = 1 - eio(seg(t, 4.5, 5.1))            // the fill drains back while the ball rides home, so the loop closes
  g.fillStyle = C.ctrl; rr(SL.x0, SL.y - 6, SL.x1 - SL.x0, 12, 6); g.fill()
  g.fillStyle = C.accent; rr(SL.x0, SL.y - 6, (SL.x1 - SL.x0) * prog * fade, 12, 6); g.fill()
  for (let i = 0; i <= 10; i++) { g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(SL.x0 + i * (SL.x1 - SL.x0) / 10 - 1, SL.y + 22, 2, 8) }
  if (t > 1.3 && t < 3.1) {   // value bubble rides above the knob
    const bx = t < 2.6 ? b[0] : SL.x1, a = clamp(seg(t, 1.3, 1.5)) * (1 - seg(t, 2.9, 3.1))
    g.globalAlpha = a; g.fillStyle = C.ctrl; rr(bx - 34, SL.y - 86, 68, 44, 12); g.fill()
    g.fillStyle = C.text; g.font = FONT(22, 700); g.textAlign = 'center'; g.fillText(String(Math.round(prog * 100)), bx, SL.y - 56); g.globalAlpha = 1
  }
  // cards arrive one per beat from the right on a spring
  CARDS.forEach((c, i) => {
    const s = sstep(t - c.t, 2, .75), out = eio(seg(t, 5.15, 5.45))
    if (s <= 0) return
    const x = c.x - c.w / 2 + (1 - s) * 260 - out * 0
    g.globalAlpha = clamp(s * 1.5) * (1 - out)
    g.fillStyle = C.card; rr(x, c.y - c.h / 2, c.w, c.h, 20); g.fill()
    g.fillStyle = C.accent; rr(x + 24, c.y - 24, 48, 48, 12); g.fill()
    g.textAlign = 'left'; g.fillStyle = C.text; g.font = FONT(24, 700); g.fillText(C.cards[i], x + 92, c.y - 4)
    g.fillStyle = C.sub; g.font = FONT(19, 500); g.fillText(C.subs[i], x + 92, c.y + 24)
    g.globalAlpha = 1
  })
  // ball with squash on contact (volume kept: sx * sy = 1)
  const q = squash(t), sx = 1 + .3 * q, sy = 1 / sx
  g.save(); g.translate(b[0], b[1] + R * (1 - sy)); g.scale(sx, sy); g.fillStyle = C.ball; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill(); g.restore()
  // cursor: comes in, clicks the toggle, leaves; back for the loop
  const cIn = eio(seg(t, 0, .55)), cOut = eio(seg(t, .85, 1.3)), press = Math.sin(Math.PI * seg(t, .55, .72))
  const px0 = lerp(160, TG.x + 10, cIn) + cOut * -220, py0 = lerp(140, TG.y + 8, cIn) + cOut * 160
  if (cOut < 1) { g.save(); g.translate(px0, py0); g.scale(1.2 - press * .2, 1.2 - press * .2); g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.5, 17); g.lineTo(9.5, 26); g.lineTo(13, 24.5); g.lineTo(9, 16); g.lineTo(16.5, 16); g.closePath(); g.fill(); g.stroke(); g.restore() }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
