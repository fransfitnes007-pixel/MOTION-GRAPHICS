<!doctype html>
<html><head><meta charset="utf-8"><title>Rotating word swap</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10;color:#fff}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
.lead{position:absolute;white-space:nowrap;font-weight:700;letter-spacing:-.04em;line-height:1;color:#e9e9f4}
.pill{position:absolute;border-radius:.3em;background:linear-gradient(160deg,rgba(130,140,255,.35),rgba(91,92,230,.18));box-shadow:0 0 0 2px rgba(165,180,252,.45),0 30px 80px -20px rgba(91,92,230,.6),inset 0 1px 0 rgba(255,255,255,.25)}
.wd{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.04em;line-height:1;perspective:900px}
.wd span{display:inline-block;will-change:transform}
.dots{position:absolute;display:flex;gap:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const pr = (t, a, d) => seg(t, a, a + d)          // progress 0..1 of a move that starts at a and lasts d seconds
const DUR = 4.8
window.DUR = DUR
const bg = el('div', 'fill'); bg.style.background = 'radial-gradient(65% 55% at 50% 50%,#16162b 0%,#0b0b10 75%)'
const WORDS = ['simple', 'fast', 'bold', 'calm']
const FS = TALL ? 190 : 150
const T = 1.2, T_SW = .78, STG = .045                    // hold per word, when the swap starts, letter stagger
const lead = el('div', 'lead'); lead.textContent = 'Built to feel'; S(lead, { fontSize: px(FS) })
const pill = el('div', 'pill')
const sets = WORDS.map(w => { const d = el('div', 'wd'); S(d, { fontSize: px(FS) }); const sp = [...w].map(c => el('span', '', d, c)); return { d, sp, w: 0 } })
const dots = el('div', 'dots'); const dl = WORDS.map(() => el('i', '', dots))
// measure after the fonts are in: widths of the lead and each word at this size
function measure() {
  const m = el('div', 'wd'); S(m, { fontSize: px(FS), visibility: 'hidden' }); m.style.position = 'absolute'
  sets.forEach((s, i) => { m.textContent = WORDS[i]; s.w = m.getBoundingClientRect().width })
  m.style.fontWeight = 700; m.textContent = 'Built to feel'; lead._w = m.getBoundingClientRect().width; m.remove()
}
measure()
const PAD = FS * .22, GAP = FS * .28

function render(t) {
  const k = Math.floor(t / T), ph = t - k * T
  const cur = k % 4, nxt = (k + 1) % 4
  const sw = pr(ph, T_SW, T - T_SW - .02)                // overall swap progress, 0 until the swap starts
  const wCur = sets[cur].w, wNxt = sets[nxt].w
  const wNow = lerp(wCur, wNxt, eio(seg(ph, T_SW + .1, T_SW + .1 + .4)))
  const boxW = wNow + PAD * 2, lh = FS
  let lx, ly, bx, by
  if (TALL) { lx = CX - lead._w / 2; ly = CY - FS * 1.0; bx = CX - boxW / 2; by = CY + FS * .12 }
  else { const tot = lead._w + GAP + boxW; lx = CX - tot / 2; ly = CY - lh / 2 - 20; bx = lx + lead._w + GAP; by = ly - lh * .12 }
  S(lead, { left: px(lx), top: px(ly) })
  S(pill, { left: px(bx), top: px(by - lh * .06), width: px(boxW), height: px(lh * 1.22) })
  sets.forEach((s, i) => {
    const isC = i === cur, isN = i === nxt && sw > 0
    vis(s.d, isC || isN)
    if (!(isC || isN)) return
    const cx = bx + boxW / 2
    S(s.d, { left: px(cx - s.w / 2), top: px(by) })
    s.sp.forEach((e, j) => {
      let a = 0, y = 0, o = 1
      if (isC) { const p = eio(pr(ph, T_SW + j * STG, .42)); a = -90 * p; y = -.45 * p; o = 1 - p * p }
      else { const p = eo(pr(ph, T_SW + .12 + j * STG, .5)); a = 90 * (1 - p); y = .45 * (1 - p); o = p }
      e.style.transform = 'translateY(' + (y * FS).toFixed(1) + 'px) rotateX(' + a.toFixed(1) + 'deg)'
      e.style.opacity = o.toFixed(3); e.style.color = '#fff'
    })
  })
  S(dots, { left: px(CX - 36 * 2 + 0), top: px(TALL ? CY + FS * 1.9 : CY + FS * 1.35) })
  dl.forEach((d, i) => { d.style.background = i === (sw > .5 ? nxt : cur) ? '#a5b4fc' : 'rgba(255,255,255,.2)'; d.style.transform = 'scale(' + (i === (sw > .5 ? nxt : cur) ? 1.35 : 1) + ')' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
