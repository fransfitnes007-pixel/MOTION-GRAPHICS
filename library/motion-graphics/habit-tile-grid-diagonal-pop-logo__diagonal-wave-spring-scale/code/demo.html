<!doctype html>
<html><head><meta charset="utf-8"><title>Habit tile grid diagonal pop logo</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.lab{text-align:center;color:rgba(255,255,255,.45);font-weight:600;font-family:ui-monospace,'SF Mono',Menlo,monospace;white-space:pre}
.wbox{text-align:center;overflow:hidden;font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.wl{display:inline-block}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @SebastianRoehl's vertical app-update reel (revid.ai wall #31, 0s to 1.6s and 13.6s to 15s).
// A grid of rounded habit tiles pops in as a diagonal wave from the top-left, row bands in four colours with some cells
// left dim, then the wordmark rises letter by letter under a small spaced label. At the end the wave runs backwards.
const CONFIG = {
  cols: 7, rows: 8,
  bands: ['#a6e05b', '#b28cf6', '#5fd38b', '#f2735a'],   // two rows per colour, top to bottom
  dimAlpha: .22,                                        // "not done" cells
  done: 'xxxx.xx|x.xxxxx|xx.xxxx|xxxxx.x|x.xx.xx|xxxxxx.|.xxxxxx|xxx.xxx',  // x = done, . = dim, one row per |
  label: 'H A B I T   T R A C K E R',
  word: ['Your', 'Brand'], wordColors: ['#ffffff', '#8b7cf6'],
  bg: '#0d0e13',
  tile: 74, gap: 12, radius: 17,                        // at 1080 wide (tall layout)
  t: { wave: .2, diag: .032, pop: .42, label: .82, word: .9, letter: .045, out: 3.4 },
  dur: 4.3,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 : H / 1920 * 1.15
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
stage.style.background = `radial-gradient(60% 40% at 25% 18%, rgba(120,170,60,.16), transparent 70%), radial-gradient(55% 40% at 80% 55%, rgba(110,90,200,.16), transparent 70%), radial-gradient(60% 35% at 45% 95%, rgba(220,90,70,.13), transparent 70%), ${C.bg}`
// faint background grid of the same rounded squares
const bgGrid = el('div', 'abs'); S(bgGrid, { left: 0, top: 0, width: W + 'px', height: H + 'px', opacity: .5,
  backgroundImage: `radial-gradient(circle at 50% 50%, rgba(255,255,255,.035) 0 ${px(14 * Z)}, transparent ${px(15 * Z)})`, backgroundSize: `${px(40 * Z)} ${px(40 * Z)}` })
const T = C.tile * Z, G = C.gap * Z, P = T + G
const gw = C.cols * P - G, gh = C.rows * P - G
const gx = CX - gw / 2, gy = CY - gh / 2 - 120 * Z
const rows = C.done.split('|')
const tiles = []
for (let r = 0; r < C.rows; r++) for (let c = 0; c < C.cols; c++) {
  const on = rows[r][c] === 'x', col = C.bands[Math.floor(r / 2) % C.bands.length]
  const e = el('div', 'abs'); S(e, { left: px(gx + c * P), top: px(gy + r * P), width: px(T), height: px(T), borderRadius: px(C.radius * Z), background: col, opacity: on ? 1 : C.dimAlpha })
  tiles.push({ e, r, c, on })
}
const label = el('div', 'abs lab', stage, C.label); S(label, { left: 0, width: W + 'px', top: px(gy + gh + 46 * Z), fontSize: px(17 * Z) })
const wordBox = el('div', 'abs wbox'); S(wordBox, { left: 0, width: W + 'px', top: px(gy + gh + 78 * Z), height: px(120 * Z), fontSize: px(104 * Z) })
const letters = []
C.word.forEach((part, k) => [...part].forEach((ch) => { const s = el('span', 'wl', wordBox, ch); s.style.color = C.wordColors[k]; letters.push(s) }))

function render(t) {
  const back = t > C.t.out
  const maxD = C.cols + C.rows - 2
  tiles.forEach(({ e, r, c }) => {
    const d = r + c
    const tin = C.t.wave + d * C.t.diag
    const tout = C.t.out + (maxD - d) * C.t.diag * .8          // leaves bottom-right first
    const s = sstep(t - tin, 2.3, .55) * (back ? 1 - eo(seg(t, tout, tout + .22)) : 1)
    const rot = (1 - clamp(s)) * (c % 2 ? 18 : -18)
    S(e, { transform: `scale(${Math.max(0, s)}) rotate(${rot}deg)` })
  })
  S(label, { opacity: eo(seg(t, C.t.label, C.t.label + .3)) * (1 - seg(t, C.t.out, C.t.out + .2)), letterSpacing: lerp(.1, .32, eo(seg(t, C.t.label, C.t.label + .6))) + 'em' })
  letters.forEach((s, i) => {
    const a = C.t.word + i * C.t.letter
    const p = eo5(seg(t, a, a + .32)), o = ei(seg(t, C.t.out + .05 + i * .02, C.t.out + .25 + i * .02))
    S(s, { transform: `translateY(${(1 - p) * 70 + o * 50}%)`, opacity: p * (1 - o) })
  })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
