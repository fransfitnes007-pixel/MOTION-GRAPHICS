<!doctype html>
<html><head><meta charset="utf-8"><title>Squash and stretch ball drop</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10;color:#fff}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
.floor{position:absolute;left:0;width:100%;background:linear-gradient(180deg,#171724 0%,#0b0b10 100%)}
.edge{position:absolute;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28) 20%,rgba(255,255,255,.28) 80%,transparent)}
.ball{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffe2c4 0%,#ff9a5c 22%,#ff5a36 52%,#a31d2c 100%);box-shadow:0 0 90px -10px rgba(255,106,61,.55),inset -14px -18px 40px rgba(90,10,30,.45)}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.75) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 72%)}
.dust{position:absolute;border-radius:50%;border:3px solid rgba(255,190,150,.8)}
.chip{position:absolute;left:50%;transform:translateX(-50%);padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.12);font:600 26px/1 ui-monospace,'SF Mono',Menlo,monospace;color:#c9c9d8;letter-spacing:.02em;white-space:nowrap}
.chip b{color:#ffb089;font-weight:700}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const pr = (t, a, d) => seg(t, a, a + d)          // progress 0..1 of a move that starts at a and lasts d seconds
const DUR = 4.4
window.DUR = DUR
el('div', 'fill').style.background = 'radial-gradient(70% 60% at 50% 55%,#1a1a2c 0%,#0b0b10 72%)'

const R = 150 * (TALL ? .9 : 1)
const FY = Math.round(CY + H * .2)                    // floor line
const flr = el('div', 'floor'); S(flr, { top: px(FY), height: px(H - FY) })
const edg = el('div', 'edge'); S(edg, { top: px(FY - 1) })
const sh = el('div', 'shadow')
const dust = []; for (let i = 0; i < 6; i++) dust.push(el('div', 'dust'))
const ball = el('div', 'ball')
const chip = el('div', 'chip'); S(chip, { top: px(FY + (H - FY) * .42), fontSize: px(26 * (TALL ? .9 : 1)) })

// physics: free fall from above the frame, then six rebounds that lose 40% of their speed each
const H0 = FY + 2 * R + 60                            // start height of the ball bottom above the floor (off screen)
const T0 = .78, G = 2 * H0 / (T0 * T0), V0 = G * T0, E = .6
const hits = []
{ let T = T0, v = V0
  for (let i = 0; i < 6; i++) { const c = .04 + .1 * Math.sqrt(v / V0); hits.push({ T, c, v }); T += c + 2 * E * v / G; v *= E } }
const T_ANT = 3.6, T_REL = 3.9, T_UP = 4.32           // anticipation squash, release, gone off the top

function ballAt(t) {
  if (t < T0) { const d = t; return { y: H0 - .5 * G * d * d, vy: -G * d, sq: 0 } }
  for (let i = 0; i < hits.length; i++) {
    const h = hits[i]
    if (t < h.T + h.c) return { y: 0, vy: 0, sq: .4 * Math.pow(h.v / V0, .55) * Math.sin(Math.PI * (t - h.T) / h.c) }
    if (i + 1 < hits.length && t < hits[i + 1].T) { const d = t - h.T - h.c, v = h.v * E; return { y: v * d - .5 * G * d * d, vy: v - G * d, sq: 0 } }
  }
  if (t < T_REL) return { y: 0, vy: 0, sq: 0 }
  const f = (x) => H0 * ei(seg(x, T_REL, T_UP))
  return { y: f(t), vy: (f(t + .01) - f(t - .01)) / .02, sq: 0 }
}

function render(t) {
  const b = ballAt(t)
  let sy, sx
  if (b.sq > 0) { sy = 1 - b.sq; sx = 1 / Math.sqrt(sy) }
  else { sy = 1 + .42 * clamp(Math.abs(b.vy) / V0); sx = 1 / Math.sqrt(sy) }
  const aq = .36 * eio(pr(t, T_ANT, T_REL - T_ANT)) * (1 - eo5(pr(t, T_REL, .07)))   // anticipation crouch before the launch
  if (aq > 0) { sy *= 1 - aq; sx = 1 / Math.sqrt(sy) }
  const ww = 2 * R * sx, hh = 2 * R * sy
  S(ball, { left: px(CX - ww / 2), top: px(FY - b.y - hh), width: px(ww), height: px(hh) })
  // contact shadow: wider and softer the higher the ball is
  const hn = clamp(b.y / FY)
  const sw = 2 * R * (1.25 - .55 * hn) * (1 + .25 * (sx - 1))
  S(sh, { left: px(CX - sw / 2), top: px(FY - sw * .09), width: px(sw), height: px(sw * .18), opacity: .9 * (1 - hn * .85) })
  // dust ring at each impact
  hits.forEach((h, i) => {
    const p = pr(t, h.T, .38), k = Math.pow(h.v / V0, .5)
    const w = 2 * R * (1.1 + 1.6 * eo(p)) * (.5 + .5 * k)
    S(dust[i], { left: px(CX - w / 2), top: px(FY - w * .06), width: px(w), height: px(w * .12), opacity: p > 0 && p < 1 ? .55 * k * (1 - p) : 0, borderWidth: px(3 * (1 - p) + 1) })
  })
  chip.innerHTML = 'scaleY <b>' + sy.toFixed(2) + '</b>   scaleX <b>' + sx.toFixed(2) + '</b>'
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
