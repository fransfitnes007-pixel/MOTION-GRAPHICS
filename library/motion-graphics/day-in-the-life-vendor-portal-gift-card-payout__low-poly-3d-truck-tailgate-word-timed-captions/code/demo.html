  else if (t < T.found) { const k = eo(seg(t, T.head, T.head + 0.3)); q = mixP(FLAT, { ...SIT, alx: -2.5, ale: -2.3, alz: 0.35, arx: -2.5, are: -2.3, arz: -0.35, hx: 0.22, eye: 0.12, brow: 0.32, mw: 1.1, tx: 0.1 }, k); c = CAM.face; ck = seg(t, T.head, T.found); v.pills.push(['5 APPS', 0, 1, 'bad']); if (t >= T.headHit) { v.pills.push(['1 HEADACHE', 1, back(seg(t, T.headHit, T.headHit + 0.2)), 'bad']); shake = (1 - seg(t, T.headHit, T.headHit + 0.4)) * 0.8 } }
  else if (t < T.bank) {                                                        // then I found YourBrand
    const k = eo(seg(t, T.found, T.found + 0.5)); glowOn = 0.4 + 1.2 * k
    if (t < T.foundG) { q = mixP({ ...SIT, alx: -2.5, ale: -2.3, arx: -2.5, are: -2.3, eye: 0.12 }, { ...SIT, hx: 0.12, eye: 1.45, mw: 0.8, mh: 2, alx: -0.3, arx: -0.3, ale: -0.9, are: -0.9 }, k); c = CAM.face; ck = seg(t, T.found, T.foundG) }
    else { q = { ...TYPE, eye: 1.3 }; c = CAM.shoulder; ck = seg(t, T.foundG, T.bank); v.flash = (1 - seg(t, T.foundG, T.foundG + 0.3)) * 0.85; v.coin = [0.3, 0.21, back(seg(t, T.foundG, T.foundG + 0.4)), t] }
  } else if (t < T.unlock) {                                                    // I add my bank details, once
    q = { ...TYPE, ale: -1.15 + ty * 0.1, are: -1.15 - ty * 0.1, eye: 1.15, mw: 1.3 }; c = CAM.pov; ck = seg(t, T.bank, T.unlock) * 0.5; glowOn = 1.2
    if (t >= T.once) { v.pills.push(['ONCE', 0, back(seg(t, T.once, T.once + 0.2)), 'good']); shake = (1 - seg(t, T.once, T.once + 0.3)) * 0.5 }
  } else if (t < T.no) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.unlock, T.no); docMode = 2; showDoc(T.unlock); for (const t0 of [T.unlockHit, T.pressHit]) if (t >= t0) shake = Math.max(shake, (1 - seg(t, t0, t0 + 0.25)) * 0.4) }
  else if (t < T.shampoo) {                                                     // no portals, no gift cards, no bullshit
    c = CAM.center; ck = seg(t, T.no, T.shampoo)
    if (t < T.nob) {
      const n = t < T.n2s ? 0 : 1, h0 = n ? T.n2 + 0.2 : T.n1, st = n ? T.n2s : T.no, side = n ? 1 : -1, sw = seg(t, h0 - 0.1, h0 + 0.08), swing = Math.sin(sw * PI)
      q = { ...STAND, hy: -side * 0.35, mw: 1.5, mh: 1.4, brow: -0.15 }
      if (side < 0) { q.alz = -1.2 - swing * 1.2; q.alx = -0.4 * swing; q.ale = -0.6 } else { q.arz = 1.2 + swing * 1.2; q.arx = -0.4 * swing; q.are = -0.6 }
      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? gift : clip
      o.position.set(px, py, 2.3); o.rotation.set(0, spin * 0.8 + 0.2, spin); o.scale.setScalar(Math.max(0.01, (n ? 1.0 : 0.9) * inK)); if (t >= h0) shake = (1 - seg(t, h0, h0 + 0.25)) * 0.5
    } else { const k = back(seg(t, T.nob, T.nob + 0.2)); q = mixP({ ...STAND }, { ...STAND, alx: -0.85, ale: -1.75, alz: 0.55, arx: -0.85, are: -1.75, arz: -0.55, eye: 0.7, brow: -0.25, mw: 1.3, mh: 0.8, hx: -0.06 }, k); if (t >= T.nobHit) shake = (1 - seg(t, T.nobHit, T.nobHit + 0.4)) * 0.9 }
    if (t >= T.n1) v.pills.push(['PORTALS', 0, back(seg(t, T.n1, T.n1 + 0.2)), 'bad']); if (t >= T.n2 + 0.2) v.pills.push(['GIFT CARDS', 1, back(seg(t, T.n2 + 0.2, T.n2 + 0.4)), 'bad'])
  } else { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.shampoo, T.end); phoneMode = 'card'; showPhone(T.shampoo); hero.rotation.z = 0.05; if (t >= T.nodogHit) { v.pills.push(['DOGS: 0', 0, back(seg(t, T.nodogHit, T.nodogHit + 0.2)), 'bad']); shake = (1 - seg(t, T.nodogHit, T.nodogHit + 0.35)) * 0.7 } }
  applyPose({ ...q, tx: q.tx + breathe })
  setCam(c[0], c[1], c[2], eo(ck) * 0.6 + ck * 0.4, 0.07, shake)
  lid.rotation.x = lidA
  docBody.color.set(docMode === 2 ? 0x15161a : 0xffffff)
  // light and mood: flat overcast noon, then low golden sun
  scene.background.set(0xaab4c2).lerp(new THREE.Color(0xffcf9a), good); cloudMat.color.set(0xd9dee6).lerp(new THREE.Color(0xffe6cc), good); sunBall.visible = good > 0.2; sunBall.position.y = lerp(5, 9, good)
  sun.color.set(0xe6edf5).lerp(new THREE.Color(0xffc98a), good); sun.intensity = lerp(1.35, 2.1, good); hemi.intensity = lerp(1.12, 1.25, good); hemi.color.set(0xe6edf5).lerp(new THREE.Color(0xffe6cc), good)
  storeMat.color.set(0xc9c2b8).lerp(new THREE.Color(0xf0d9b8), good)
  glow.position.set(2.0, 2.1, -1.55); glow.intensity = glowOn * 2.2
  lidG.material.opacity = good
  drawLaptop(t); if (phoneMode) drawPhone(phoneMode, t); if (docMode >= 0) drawDoc(docMode, t)
}

// ---------- 2D layer: captions, pills, stamps, list, end card
const SAFE = CONFIG.safe, CX = (SAFE.left + SAFE.right) / 2
function pill(text, row, k, kind) {
  if (k <= 0) return
  const fs = 44; g.font = `700 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; const mark = kind === 'good' ? '✓' : kind === 'bad' ? '✕' : '', tw = g.measureText(text).width, w = tw + (mark ? 124 : 76), h = 92, y = SAFE.top + 60 + row * 112
  g.save(); g.translate(CX, y); g.scale(k, k); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 30; g.shadowOffsetY = 12
  g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fill(); g.shadowColor = 'transparent'
  let x = -w / 2 + 38
  if (mark) { g.fillStyle = kind === 'good' ? CONFIG.good : CONFIG.bad; g.beginPath(); g.arc(x + 16, 0, 26, 0, 7); g.fill(); g.fillStyle = '#0b0c10'; g.font = `800 34px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(mark, x + 16, 2); x += 58 }
  g.fillStyle = CONFIG.bright; g.font = `700 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(text, x, 2); g.restore()
}
function stamp(text, k, color, rot, yShare) {
  if (k <= 0) return
  const s = lerp(2.6, 1, eo(k)); g.save(); g.translate(CX, H * yShare + SAFE.top); g.rotate(rot); g.scale(s, s); g.globalAlpha = clamp(k * 3)
  g.font = '800 92px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const w = g.measureText(text).width + 90; g.fillStyle = color; g.beginPath(); g.roundRect(-w / 2, -80, w, 160, 26); g.fill()
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.beginPath(); g.roundRect(-w / 2 + 14, -66, w - 28, 132, 16); g.stroke()
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, 6); g.restore()
}
function coin(xs, ys, k, t, size = 400) {
  if (k <= 0) return
  const sx = Math.cos(t * 3.2), h = size * k, w = h * 0.8 * Math.abs(sx)
  g.save(); g.translate(W * xs, H * ys); g.shadowColor = 'rgba(255,255,255,.55)'; g.shadowBlur = 70; g.drawImage(G_IMG, -w / 2, -h / 2, Math.max(2, w), h); g.restore()
}
function captions(t) {
  let gi = -1; for (let i = 0; i < GROUPS.length; i++) { if (t >= WORDS[GROUPS[i][0]][1] - 0.04) gi = i }
  if (gi < 0) return
  const [a, b, br, mul] = GROUPS[gi]; const endT = gi + 1 < GROUPS.length ? WORDS[GROUPS[gi + 1][0]][1] - 0.04 : WORDS[b][2] + 0.5
  if (t > Math.min(endT, WORDS[b][2] + 0.9)) return
  const lines = [[]]; for (let i = a; i <= b; i++) { lines[lines.length - 1].push(i); if (i === br) lines.push([]) }
  let fs = 118 * mul; const maxW = SAFE.right - SAFE.left - 20
  const widthOf = (ln) => { g.font = `800 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; return g.measureText(ln.map(i => WORDS[i][0].toUpperCase()).join(' ')).width }
  while (Math.max(...lines.map(widthOf)) > maxW && fs > 40) fs -= 4
  g.font = `800 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round'
  const lh = fs * 1.1, y0 = H * CONFIG.capY - (lines.length - 1) * lh / 2, sp = g.measureText(' ').width
  lines.forEach((ln, li) => {
    let x = CX - widthOf(ln) / 2; const y = y0 + li * lh
    for (const i of ln) {
      const txt = WORDS[i][0].toUpperCase(), ww = g.measureText(txt).width, said = t >= WORDS[i][1] - 0.04
      if (said) { const k = back(seg(t, WORDS[i][1] - 0.04, WORDS[i][1] + 0.1)), cur = t < WORDS[i][2] + 0.06 || i === b
        g.save(); g.translate(x + ww / 2, y); g.scale(0.7 + 0.3 * k, 0.7 + 0.3 * k); g.textAlign = 'center'
        g.strokeStyle = '#000'; g.lineWidth = fs * 0.2; g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 0; g.shadowOffsetY = fs * 0.07; g.strokeText(txt, 0, 0); g.shadowColor = 'transparent'
        g.fillStyle = cur ? CONFIG.capHi : CONFIG.capBase; g.fillText(txt, 0, 0); g.restore() }
      x += ww + sp
    }
  })
}
function endCard(t) {
  const k = seg(t, T.end, T.end + 0.35); if (k <= 0) return
  g.fillStyle = `rgba(6,6,9,${eo(k)})`; g.fillRect(0, 0, W, H)
  const a = eo(seg(t, T.end + 0.15, T.end + 0.6)), gh = 340, gy = H * 0.3
  g.save(); g.globalAlpha = a; g.translate(W / 2, gy); const s = lerp(1.25, 1, eo(seg(t, T.end + 0.15, T.end + 0.8))); g.scale(s, s); g.shadowColor = 'rgba(255,255,255,.35)'; g.shadowBlur = 90; g.drawImage(G_IMG, -gh * 0.4, -gh / 2, gh * 0.8, gh); g.restore()
  const ww = 540, wh = ww * WORD_IMG.height / WORD_IMG.width, wy = gy + gh / 2 + 10; g.save(); g.globalAlpha = eo(seg(t, T.end + 0.35, T.end + 0.8)); g.drawImage(WORD_IMG, W / 2 - ww / 2, wy, ww, wh); g.restore()
  g.textAlign = 'center'; g.textBaseline = 'middle'; const ly = wy + wh + 90
  CONFIG.endLines.forEach((s, i) => { const kk = eo(seg(t, T.end + 0.7 + i * 0.32, T.end + 1.05 + i * 0.32)); g.globalAlpha = kk; g.fillStyle = i === CONFIG.endLines.length - 1 ? '#fff' : '#d4d4d8'; g.font = '700 78px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.fillText(s, W / 2, ly + i * 100 + (1 - kk) * 26) })
  const kk = back(seg(t, T.end + 1.9, T.end + 2.2)); if (kk > 0) { g.globalAlpha = 1; g.save(); g.translate(W / 2, ly + CONFIG.endLines.length * 100 + 70); g.scale(kk, kk); g.font = '700 56px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const w = g.measureText(CONFIG.site).width + 110; g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-w / 2, -60, w, 120, 60); g.fill(); g.fillStyle = '#0b0c10'; g.fillText(CONFIG.site, 0, 3); g.restore() }
  g.globalAlpha = 1
}

function overlay(t) {
  g.clearRect(0, 0, W, H); const v = view
  if (v.dim) { g.fillStyle = `rgba(8,8,16,${v.dim})`; g.fillRect(0, 0, W, H) }
  if (t < T.end + 0.4) {
    if (v.coin) coin(v.coin[0], v.coin[1], v.coin[2], v.coin[3])
    for (const p of v.pills) pill(p[0], p[1], p[2], p[3])
    if (v.stamp) stamp(v.stamp[0], v.stamp[1], v.stamp[2], v.stamp[3], v.stamp[4])
    captions(t)
    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.font = '600 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.fillText(CONFIG.site.toUpperCase(), CX, H * CONFIG.capY + 190); g.shadowColor = 'transparent'; g.globalAlpha = 1
  }
  const fl = Math.max(v.flash, (1 - seg(t, T.end, T.end + 0.3)) * seg(t, T.end - 0.12, T.end)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H) }
  endCard(t)
}
window.render = (t) => { t = clamp(t, 0, T.dur); state(t); R.render(scene, cam); overlay(t) }
window.render(0); window.__rdy()
if (!Q.get('render')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % T.dur); requestAnimationFrame(loop) }; loop() }
})()
