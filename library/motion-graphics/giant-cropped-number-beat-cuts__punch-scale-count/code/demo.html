<!doctype html>
<html><head><meta charset="utf-8"><title>Giant cropped number beat cuts</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

#stage{background:#050509;color:#fff}
.layer{position:absolute;inset:0}
.word{position:absolute;font-weight:800;font-size:168px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.wm{position:absolute;text-align:center;font-family:'UnifrakturCook','Old English Text MT',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.03em;line-height:1;color:#fff;white-space:nowrap}


/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across this library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 4.2
window.DUR = DUR

const FS = TALL ? W / 1920 : Math.min(W / 1920, H / 1080)
const G = Math.max(W / 1920, H / 1080)
const mkFrame = (parent) => { const f = el('div', 'abs', parent); S(f, { left: px(CX - 960), top: px(CY - 540), width: '1920px', height: '1080px', transform: 'scale(' + FS + ')', transformOrigin: '50% 50%' }); return f }
const fr = mkFrame(stage)
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
const back = (x, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const ex = (x) => x === 1 ? 1 : 1 - Math.pow(2, -10 * x)
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CURSOR = '<svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const cover = (i) => { const h = (i * 47 + 250) % 360, sk = 18 + (i * 7) % 20; return 'radial-gradient(circle at 50% 36%, hsl(' + (20 + (i * 13) % 20) + ',60%,' + (68 - sk / 2) + '%) 0 13%, transparent 14%),radial-gradient(ellipse at 50% 98%, hsl(' + h + ',30%,14%) 0 40%, transparent 41%),linear-gradient(165deg, hsl(' + h + ',70%,52%), hsl(' + (h + 50) % 360 + ',60%,22%))' }
// persistent dark backdrop. v = 1 is a smaller blob variant (64px grid), v = 2 the larger (80px grid, bigger blob, faster drift)
function makeBG(v = 2, loop = 0) {
  const bg = el('div', 'layer'); stage.insertBefore(bg, stage.firstChild)
  const gr = v === 1 ? 64 : 80, ga = v === 1 ? .07 : .06
  const grid = el('div', 'grid', bg); S(grid, { backgroundSize: px(gr * G) + ' ' + px(gr * G), backgroundImage: 'linear-gradient(rgba(139,92,246,' + ga + ') 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,' + ga + ') 1px,transparent 1px)' })
  const gw = (v === 1 ? 1400 : 1600) * G, gh = (v === 1 ? 1000 : 1100) * G
  const blob = el('div', 'abs', bg); S(blob, { width: px(gw), height: px(gh), borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(' + (v === 1 ? '139,92,246,.28' : '124,58,237,.30') + '), transparent)', filter: 'blur(' + (v === 1 ? 20 : 30) * G + 'px)' })
  const vg = el('div', 'layer'); S(vg, { background: 'radial-gradient(ellipse at 50% 50%, transparent ' + (v === 1 ? 55 : 60) + '%, rgba(0,0,0,' + (v === 1 ? .65 : .6) + '))', zIndex: 70, pointerEvents: 'none' })
  return (t) => {
    const sp = loop ? [2 * gr / loop, gr / loop] : v === 1 ? [6, 4] : [14, 9], w = loop ? 2 * Math.PI / loop : 0
    grid.style.transform = 'translate(' + ((-t * sp[0]) % gr) * G + 'px,' + ((-t * sp[1]) % gr) * G + 'px)'
    const p = v === 1 ? [260 + Math.sin(t * (w || .3)) * 200, -100 + Math.cos(t * (w || .25)) * 120] : [160 + Math.sin(t * (w || .5)) * 260, -60 + Math.cos(t * (w || .4)) * 140]
    S(blob, { left: px(p[0] * G), top: px(p[1] * G) })
  }
}


const B = 60 / 128
const CASES = [
  { brand: 'Brand A', col: '#3b5bdb', n: 17, d: 0, suf: 'M', lab: 'views in 20 days', bg: 'radial-gradient(ellipse at 30% 40%, #1d2a6b, #070a1f 70%)', ink: '#fff' },
  { brand: 'Brand B', col: '#12b886', n: 8.5, d: 1, suf: 'M', lab: 'views in 21 days', bg: '#f4f2ee', ink: '#0b0b10' },
  { brand: 'Brand C', col: '#f59f00', n: 9.1, d: 1, suf: 'M', lab: 'views on one video', bg: 'radial-gradient(ellipse at 70% 40%, #4c1d95, #0b0618 70%)', ink: '#fff' },
]
const cuts = [0, 3 * B, 6 * B, 8 * B]
const flash = el('div', 'layer'); S(flash, { background: '#fff', zIndex: 90, opacity: 0, pointerEvents: 'none' })
const vg = el('div', 'layer'); S(vg, { background: 'radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.6))', zIndex: 70, pointerEvents: 'none' })   // a global vignette sits over every scene
const cs = CASES.map((c) => {
  const d = el('div', 'layer', stage); S(d, { background: c.bg }); stage.insertBefore(d, flash)
  const f = mkFrame(d)
  d.big = el('div', 'word', f); S(d.big, { fontSize: '560px', letterSpacing: '-.065em', color: c.ink, top: '230px', left: '640px' })
  d.head = el('div', 'abs', f, '<div style="width:' + (c.brand === 'Brand A' ? 70 : 84) + 'px;height:' + (c.brand === 'Brand A' ? 70 : 84) + 'px;border-radius:20px;background:' + c.col + '"></div><div style="font-weight:800;font-size:64px;letter-spacing:-.03em;margin-top:22px;color:' + c.ink + '">' + c.brand + '</div><div style="font-weight:600;font-size:30px;margin-top:12px;color:' + c.ink + ';opacity:.65;max-width:520px;line-height:1.25">' + c.lab + '</div>')
  S(d.head, { left: '120px', top: '330px' })
  return d
})
function render(t) {
  const lt0 = t
  cs.forEach((c, i) => {
    const on = lt0 >= cuts[i] && lt0 < cuts[i + 1]; vis(c, on); if (!on) return
    const l = lt0 - cuts[i], len = cuts[i + 1] - cuts[i]
    const v = CASES[i].n * eo(seg(l, 0, len * .7))
    c.big.textContent = (CASES[i].d ? v.toFixed(1) : Math.round(v)) + CASES[i].suf
    const punch = lerp(1.18, 1, eo5(seg(l, 0, .35))) * lerp(1, 1.06, l / len)
    S(c.big, { transform: 'scale(' + punch + ')', transformOrigin: '0 60%' })
    const hk = eo5(seg(l, .08, .4))
    S(c.head, { opacity: hk, transform: 'translateX(' + (1 - hk) * -60 + 'px)' })
  })
  // white flash on each cut, (1 - k) * .55 over .12s
  let fo = 0
  for (const h of [0, 3 * B, 6 * B]) { const k = seg(t, h, h + .12); if (k > 0 && k < 1) fo = Math.max(fo, (1 - k) * .55) }
  flash.style.opacity = fo
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
