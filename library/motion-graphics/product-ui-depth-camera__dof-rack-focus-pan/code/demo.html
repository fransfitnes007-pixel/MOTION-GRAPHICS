<!doctype html>
<html><head><meta charset="utf-8"><title>product-ui-depth-camera__dof-rack-focus-pan</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:radial-gradient(90% 80% at 50% 38%,#171a26 0%,#0b0b10 70%)}
.layer{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform,filter}
.bx{position:absolute;transform-origin:50% 50%}
.win{background:linear-gradient(180deg,#191b24,#13141b);border:1.5px solid rgba(255,255,255,.10);border-radius:28px;box-shadow:0 60px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden;color:#f2f2f4}
.tb{height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid rgba(255,255,255,.07)}
.tl{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18)}
.side{position:absolute;left:0;top:62px;bottom:0;width:230px;border-right:1px solid rgba(255,255,255,.07);padding:28px 24px}
.nav{height:38px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:14px}
.row{display:flex;align-items:center;gap:22px;height:96px;border-bottom:1px solid rgba(255,255,255,.06)}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(140deg,rgba(255,255,255,.28),rgba(255,255,255,.07));flex:none}
.ln{height:15px;border-radius:8px;background:rgba(255,255,255,.2)}
.pill{height:34px;border-radius:17px;background:rgba(255,255,255,.1);flex:none}
.card{background:linear-gradient(160deg,#272a37,#1d1f2a);border:1.5px solid rgba(255,255,255,.16);border-radius:30px;box-shadow:0 50px 100px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3),inset 0 1.5px 0 rgba(255,255,255,.18);color:#f2f2f4;padding:40px}
.lab{font-size:20px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:rgba(242,242,244,.55)}
.ttl{font-size:50px;font-weight:800;letter-spacing:-.025em;margin-top:14px;line-height:1.05}
.sub{font-size:25px;line-height:1.4;color:rgba(242,242,244,.62);margin-top:14px;font-weight:500}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;border-radius:40px}
.pri{background:#6aa8ff;color:#0b0b10;box-shadow:0 16px 36px rgba(106,168,255,.35)}
.gho{background:rgba(255,255,255,.08);color:#f2f2f4;border:1.5px solid rgba(255,255,255,.18)}
.toast{background:linear-gradient(160deg,#2f3342,#222532);border:1.5px solid rgba(255,255,255,.18);border-radius:60px;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);color:#f2f2f4;display:flex;align-items:center;gap:20px;padding:0 36px 0 26px;font-size:29px;font-weight:700}
.chk{width:46px;height:46px;border-radius:50%;background:#6aa8ff;display:flex;align-items:center;justify-content:center;flex:none}
.rip{position:absolute;border-radius:50%;border:3px solid #6aa8ff}
.vig{position:absolute;inset:0;background:radial-gradient(75% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 7
window.DUR = DUR
// ---- world layout (px, relative to the frame centre) ----
const WW = TALL ? 940 : 1400, WH = TALL ? 1360 : 860
const CW = TALL ? 700 : 580, CH = TALL ? 560 : 430, CYO = TALL ? 60 : 40       // card size and vertical offset
const BW = 230, BH = 76
const BTN = { x: CW / 2 - 40 - BW / 2, y: CYO + CH / 2 - 40 - BH / 2 }           // primary button centre, world coords
const TST = TALL ? { x: 190, y: -600 } : { x: 400, y: -300 }                      // toast centre
const TW_ = 500, TH_ = 100
const DEPTH = [0, 1, 2], PAR = .09                                                  // background, card, toast; scale gain per depth step
const BLUR = 11

const box = (parent, cx, cy, w, h, cls, html = '') => { const e = el('div', 'bx ' + (cls || ''), parent, html); S(e, { left: px(cx - w / 2), top: px(cy - h / 2), width: px(w), height: px(h) }); return e }
const L = [0, 1, 2].map(() => el('div', 'layer'))
L.forEach(l => S(l, { left: px(CX), top: px(CY) }))

// layer 0: app window with a sidebar and a list
const win = box(L[0], 0, 0, WW, WH, 'win')
win.innerHTML = `<div class="tb"><div class="tl"></div><div class="tl"></div><div class="tl"></div><div class="ln" style="width:240px;margin-left:30px;height:16px"></div></div>` +
  (TALL ? '' : `<div class="side">${[0, 1, 2, 3, 4, 5].map(i => `<div class="nav" style="${i == 1 ? 'background:rgba(106,168,255,.22)' : ''}"></div>`).join('')}</div>`)
const list = el('div', '', win); S(list, { position: 'absolute', left: px(TALL ? 40 : 270), right: '40px', top: '92px' })
list.innerHTML = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<div class="row"><div class="av"></div><div style="flex:1"><div class="ln" style="width:${64 - i * 3}%"></div><div class="ln" style="width:${36 - i}%;margin-top:12px;opacity:.55"></div></div><div class="pill" style="width:${i % 3 == 0 ? 120 : 84}px;${i == 2 ? 'background:rgba(106,168,255,.32)' : ''}"></div></div>`).join('')

// layer 1: floating card
const card = box(L[1], 0, CYO, CW, CH, 'card')
card.innerHTML = `<div class="lab">Review</div><div class="ttl">Publish your changes?</div><div class="sub">Your headline and 3 other edits go live for everyone.</div>`
const bGho = box(card, 0, 0, 190, BH, 'btn gho', 'Cancel'); S(bGho, { left: px(CW - 40 - BW - 20 - 190), top: px(CH - 40 - BH), width: '190px', height: px(BH) })
const bPri = box(card, 0, 0, BW, BH, 'btn pri', 'Continue'); S(bPri, { left: px(CW - 40 - BW), top: px(CH - 40 - BH), width: px(BW), height: px(BH) })
// absolute children are placed from the card's padding edge, so a 40 px inset gives the same margin as the text
const rip = el('div', 'rip', L[1]); S(rip, { left: px(BTN.x), top: px(BTN.y) })
const cur = el('div', '', L[1]); S(cur, { position: 'absolute', width: '44px', height: '52px', left: '0px', top: '0px' })
cur.innerHTML = '<svg viewBox="0 0 24 28" width="44" height="52"><path d="M3 2 L3 22 L8 17.5 L11.6 25.5 L14.8 24 L11.2 16.2 L18 16 Z" fill="#fff" stroke="#0b0b10" stroke-width="1.6" stroke-linejoin="round"/></svg>'
S(cur, { filter: 'drop-shadow(0 8px 12px rgba(0,0,0,.5))' })

// layer 2: toast
const toast = box(L[2], TST.x, TST.y, TW_, TH_, 'toast')
toast.innerHTML = `<div class="chk"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#0b0b10" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Changes saved`
el('div', 'vig')

// ---- camera tracks: [time, value], eased between keys ----
const track = (t, k) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) return lerp(k[i - 1][1], k[i][1], eio(seg(t, k[i - 1][0], k[i][0]))); return k[k.length - 1][1] }
const ZB = TALL ? 1.75 : 2.15                                                       // zoom when pushed into the button
const CX_ = [[0, 0], [1.5, 0], [2.0, 0], [3.0, 0], [4.0, TST.x], [4.8, TST.x], [5.5, 0], [5.6, 0], [6.4, BTN.x]]
const CY_ = [[0, 0], [1.5, 0], [2.0, CYO * .5], [3.0, CYO * .5], [4.0, TST.y], [4.8, TST.y], [5.5, CYO], [5.6, CYO], [6.4, BTN.y]]
const ZM_ = [[0, .94], [1.0, .98], [2.0, 1.04], [3.0, 1.06], [4.0, TALL ? 1.2 : 1.3], [4.8, TALL ? 1.2 : 1.3], [5.5, 1.08], [5.6, 1.08], [6.4, ZB]]
const FC_ = [[0, 0], [1.2, 0], [2.0, 1], [3.2, 1], [3.9, 2], [4.8, 2], [5.5, 1]]

function render(t) {
  const cx = track(t, CX_), cy = track(t, CY_), zoom = track(t, ZM_), focus = track(t, FC_)
  const master = eo(seg(t, 0, .5)) * (1 - ei(seg(t, 6.65, 7)))
  L.forEach((l, i) => {
    const s = zoom * (1 + PAR * DEPTH[i])
    l.style.transform = `translate(${(-cx * s).toFixed(2)}px,${(-cy * s).toFixed(2)}px) scale(${s.toFixed(4)})`
    const b = Math.abs(focus - DEPTH[i]) * BLUR
    l.style.filter = b < .05 ? 'none' : `blur(${b.toFixed(2)}px)`
    l.style.opacity = master.toFixed(3)
  })
  // window intro
  const wi = spring(seg(t, 0, .7), 6, 9); S(win, { transform: `scale(${(.96 + .04 * wi).toFixed(4)})` })
  // card enters at 1.2 s
  const cu = seg(t, 1.2, 1.8), cs = spring(cu, 6, 9)
  S(card, { opacity: clamp(cu * 3).toFixed(3), transform: `translateY(${((1 - cs) * 60).toFixed(2)}px) scale(${(.92 + .08 * cs).toFixed(4)})` })
  // toast enters at 2.6 s, from above and right
  const tu = seg(t, 2.6, 3.2), ts = spring(tu, 6.5, 10)
  S(toast, { opacity: clamp(tu * 4).toFixed(3), transform: `translate(${((1 - ts) * 90).toFixed(2)}px,${((1 - ts) * -50).toFixed(2)}px) scale(${(.85 + .15 * ts).toFixed(4)})` })
  // cursor glides to the button, hover, then a click at 6.2 s
  const g = eio(seg(t, 5.2, 6.15)), cu2 = eo(seg(t, 5.1, 5.3))
  const px0 = BTN.x - 180, py0 = BTN.y + 160, hover = seg(t, 5.95, 6.15)
  S(cur, { opacity: (cu2 * (1 - seg(t, 6.45, 6.6))).toFixed(3), transform: `translate(${(lerp(px0, BTN.x + 22, g)).toFixed(2)}px,${(lerp(py0, BTN.y + 18, g)).toFixed(2)}px) scale(${(1 - .12 * seg(t, 6.2, 6.28) + .12 * seg(t, 6.28, 6.4)).toFixed(3)})` })
  const down = seg(t, 6.2, 6.28) - seg(t, 6.3, 6.45)
  S(bPri, { transform: `scale(${(1 + .03 * hover - .07 * down).toFixed(4)})`, filter: `brightness(${(1 + .12 * hover).toFixed(3)})` })
  const ru = seg(t, 6.22, 6.75)
  S(rip, { width: px(BW * 1.0 + 240 * eo(ru)), height: px(BH + 240 * eo(ru)), marginLeft: px(-(BW + 240 * eo(ru)) / 2), marginTop: px(-(BH + 240 * eo(ru)) / 2), borderRadius: '80px', opacity: (ru > 0 ? .8 * (1 - ru) : 0).toFixed(3) })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
