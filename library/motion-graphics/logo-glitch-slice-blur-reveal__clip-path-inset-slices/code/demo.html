<!doctype html>
<html><head><meta charset="utf-8"><title>Logo glitch-slice blur reveal</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

#stage{background:#050509;color:#fff}
.layer{position:absolute;inset:0}
.word{position:absolute;font-weight:800;font-size:168px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.wm{position:absolute;text-align:center;font-family:'UnifrakturCook','Old English Text MT',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.03em;line-height:1;color:#fff;white-space:nowrap}

.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(139,92,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.06) 1px,transparent 1px)}
.glow{text-shadow:0 0 30px rgba(167,139,250,.55),0 0 80px rgba(139,92,246,.35)}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 3
window.DUR = DUR

const FS = TALL ? W / 1920 : Math.min(W / 1920, H / 1080)
const G = Math.max(W / 1920, H / 1080)
const mkFrame = (parent) => { const f = el('div', 'abs', parent); S(f, { left: px(CX - 960), top: px(CY - 540), width: '1920px', height: '1080px', transform: 'scale(' + FS + ')', transformOrigin: '50% 50%' }); return f }
const fr = mkFrame(stage)
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
const back = (x, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const ex = (x) => x === 1 ? 1 : 1 - Math.pow(2, -10 * x)
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CURSOR = '<svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const cover = (i) => { const h = (i * 47 + 250) % 360, sk = 18 + (i * 7) % 20; return 'radial-gradient(circle at 50% 36%, hsl(' + (20 + (i * 13) % 20) + ',60%,' + (68 - sk / 2) + '%) 0 13%, transparent 14%),radial-gradient(ellipse at 50% 98%, hsl(' + h + ',30%,14%) 0 40%, transparent 41%),linear-gradient(165deg, hsl(' + h + ',70%,52%), hsl(' + (h + 50) % 360 + ',60%,22%))' }
// persistent dark backdrop. v = 1 is the first variant (64px grid, smaller blob), v = 2 the second (80px grid, bigger blob, faster drift)
function makeBG(v = 2, loop = 0) {
  const bg = el('div', 'layer'); stage.insertBefore(bg, stage.firstChild)
  const gr = v === 1 ? 64 : 80, ga = v === 1 ? .07 : .06
  const grid = el('div', 'grid', bg); S(grid, { backgroundSize: px(gr * G) + ' ' + px(gr * G), backgroundImage: 'linear-gradient(rgba(139,92,246,' + ga + ') 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,' + ga + ') 1px,transparent 1px)' })
  const gw = (v === 1 ? 1400 : 1600) * G, gh = (v === 1 ? 1000 : 1100) * G
  const blob = el('div', 'abs', bg); S(blob, { width: px(gw), height: px(gh), borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(' + (v === 1 ? '139,92,246,.28' : '124,58,237,.30') + '), transparent)', filter: 'blur(' + (v === 1 ? 20 : 30) * G + 'px)' })
  const vg = el('div', 'layer'); S(vg, { background: 'radial-gradient(ellipse at 50% 50%, transparent ' + (v === 1 ? 55 : 60) + '%, rgba(0,0,0,' + (v === 1 ? .65 : .6) + '))', zIndex: 70, pointerEvents: 'none' })
  return (t) => {
    const sp = loop ? [2 * gr / loop, gr / loop] : v === 1 ? [6, 4] : [14, 9], w = loop ? 2 * Math.PI / loop : 0
    grid.style.transform = 'translate(' + ((-t * sp[0]) % gr) * G + 'px,' + ((-t * sp[1]) % gr) * G + 'px)'
    const p = v === 1 ? [260 + Math.sin(t * (w || .3)) * 200, -100 + Math.cos(t * (w || .25)) * 120] : [160 + Math.sin(t * (w || .5)) * 260, -60 + Math.cos(t * (w || .4)) * 140]
    S(blob, { left: px(p[0] * G), top: px(p[1] * G) })
  }
}


const bgRender = makeBG(1)
const word = el('div', 'wm', fr, 'WORDMARK'); S(word, { left: '260px', top: '400px', width: '1400px', fontSize: '170px' })
const sub = el('div', 'abs', fr); S(sub, { left: 0, right: 0, top: '640px', textAlign: 'center', fontWeight: 600, fontSize: '30px', color: 'rgba(255,255,255,.7)', letterSpacing: '.02em' }); sub.textContent = 'A one-line description of what you do'
function render(lt) {
  bgRender(lt + 5.2)
  const k = eo(seg(lt, 0, .7))
  S(word, { opacity: k, transform: 'scale(' + lerp(1.25, 1, k) + ')', filter: 'drop-shadow(0 0 ' + (30 + 30 * Math.sin(lt * 6)) + 'px rgba(167,139,250,.6)) blur(' + (1 - k) * 10 + 'px)' })
  // type remix: brief glitch slices in the first half second
  word.style.clipPath = lt < .5 && Math.floor(lt * 20) % 2 ? 'inset(' + rand(Math.floor(lt * 20)) * 60 + '% 0 ' + rand(Math.floor(lt * 20) + 9) * 30 + '% 0)' : 'none'
  S(sub, { opacity: eo(seg(lt, .6, 1.2)), transform: 'translateY(' + (1 - eo(seg(lt, .6, 1.2))) * 20 + 'px)' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
