<!doctype html>
<html><head><meta charset="utf-8"><title>Photo tile grid paper map unfold</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.tile{backface-visibility:hidden;box-shadow:0 18px 40px -22px rgba(0,0,0,.45);background-size:cover;background-position:center}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @twoclipping's "Develop" launch film (revid.ai wall #8, 3.2s to 4.2s): one big photo shrinks to a tile,
// then a 3x3 grid unfolds from behind it like a paper map: centre first, then the plus (up, down, left, right), then the corners.
// Each tile hinges on the edge it shares with the tile it unfolds from.
const CONFIG = {
  bg: '#ecede8',
  tile: 220, gap: 14, radius: 22,       // at 1920 wide
  photos: [                              // gradient placeholders, row by row; swap for background-image:url(...)
    'linear-gradient(160deg,#f6c27a,#c8643b 55%,#3b2a4a)', 'linear-gradient(180deg,#0b1830,#2457a6 60%,#9cc3ff)', 'linear-gradient(170deg,#9fd6ff,#c8d8c0 60%,#6d7c4c)',
    'linear-gradient(150deg,#3a2a1c,#a8693c 50%,#e8c08b)', 'linear-gradient(180deg,#1a0d08,#7a2e12 50%,#ff8a3a)', 'linear-gradient(200deg,#cfd9e6,#7f96b8 50%,#30405e)',
    'linear-gradient(170deg,#28203d,#6b4fa3 55%,#f0a7c8)', 'linear-gradient(190deg,#e9e1d2,#b9ad98 60%,#5f5a4e)', 'linear-gradient(160deg,#18301f,#3f7a4d 55%,#d7e8b0)',
  ],
  t: { shrink: .15, plus: .75, corners: .92, hinge: .26, foldBack: 2.6, out: 3.25 },
  dur: 3.8,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 * .95 : W / 1920
stage.style.background = C.bg
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
const T = C.tile * Z, G = C.gap * Z, P = T + G
const world = el('div', 'abs'); S(world, { left: px(CX), top: px(CY), width: 0, height: 0, perspective: '1600px', transformStyle: 'preserve-3d' })
// order: index = row*3+col. Each non-centre tile names the tile it hinges from and the shared edge.
const tiles = C.photos.map((bg, i) => {
  const r = Math.floor(i / 3) - 1, c = (i % 3) - 1
  const e = el('div', 'abs tile', world); S(e, { width: px(T), height: px(T), borderRadius: px(C.radius * Z), background: bg, left: px(c * P - T / 2), top: px(r * P - T / 2), zIndex: i === 4 ? 5 : (r === 0 || c === 0) ? 3 : 1 })
  return { e, r, c }
})
function hinge(tl, p) {   // p: 0 folded under the neighbour, 1 flat
  const { e, r, c } = tl
  const ang = 180 * (1 - p)
  let origin, rot
  if (r === 0 && c !== 0) { origin = c > 0 ? '0% 50%' : '100% 50%'; rot = `rotateY(${c > 0 ? -ang : ang}deg)` }      // left / right of centre
  else if (c === 0 && r !== 0) { origin = r > 0 ? '50% 0%' : '50% 100%'; rot = `rotateX(${r > 0 ? ang : -ang}deg)` }  // above / below centre
  else { origin = c > 0 ? '0% 50%' : '100% 50%'; rot = `rotateY(${c > 0 ? -ang : ang}deg)` }                          // corners unfold sideways from the up/down tile
  S(e, { transformOrigin: origin, transform: rot, visibility: p > .5 ? 'visible' : 'hidden' })
}
function render(t) {
  // the centre photo starts big and shrinks onto its slot (spring), then the others unfold; at the end they fold back and it grows
  const shrink = sstep(t - C.t.shrink, 1.5, .8) - sstep(t - C.t.out, 1.5, .8)
  const big = TALL ? 3.6 : 2.9
  const sc = lerp(big, 1, shrink)
  S(tiles[4].e, { transform: `scale(${sc})`, borderRadius: px(C.radius * Z / Math.max(1, sc * .6)) })
  const fold = eio(seg(t, C.t.foldBack, C.t.foldBack + .45))
  tiles.forEach((tl, i) => {
    if (i === 4) return
    const isPlus = tl.r === 0 || tl.c === 0
    const start = isPlus ? C.t.plus : C.t.corners
    let p = eo(seg(t, start, start + C.t.hinge))
    const back = isPlus ? seg(fold, .35, 1) : seg(fold, 0, .65)          // corners fold first, then the plus
    p = Math.min(p, 1 - back)
    hinge(tl, p)
  })
  S(world, { transform: `scale(${1 + .03 * seg(t, C.t.corners, C.t.foldBack)})` })   // slow moving hold
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
