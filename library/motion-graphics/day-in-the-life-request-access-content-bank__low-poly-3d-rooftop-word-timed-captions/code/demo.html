  } else if (t < T.no) {                                                        // the content bank: logo, screen recordings, app clips; one folder, already shared
    q = { ...SIT }; c = CAM.phone; ck = seg(t, T.bank, T.no); docMode = 2; showDoc(T.bank)
    if (t >= T.oneHit) { v.pills.push(['1 FOLDER', 0, back(seg(t, T.oneHit, T.oneHit + 0.2)), 'good']); if (t < T.sharedHit) shake = (1 - seg(t, T.oneHit, T.oneHit + 0.3)) * 0.5 }
  } else if (t < T.appr) {                                                      // no expired links, no request access, no bullshit
    c = CAM.center; ck = seg(t, T.no, T.appr)

      const n = t < T.n2s ? 0 : 1, h0 = n ? T.n2 : T.n1, st = n ? T.n2s : T.no, side = n ? 1 : -1, sw = seg(t, h0 - 0.1, h0 + 0.08), swing = Math.sin(sw * PI)
      q = { ...STAND, hy: -side * 0.35, mw: 1.5, mh: 1.4, brow: -0.15 }
      if (side < 0) { q.alz = -1.2 - swing * 1.2; q.alx = -0.4 * swing; q.ale = -0.6 } else { q.arz = 1.2 + swing * 1.2; q.arx = -0.4 * swing; q.are = -0.6 }
      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? lockF : glass
      o.position.set(px, py, 2.3); o.rotation.set(0, spin * 0.8 + 0.2, spin); o.scale.setScalar(Math.max(0.01, 0.95 * inK)); if (t >= h0) shake = (1 - seg(t, h0, h0 + 0.25)) * 0.5
    } else { const k = back(seg(t, T.nob, T.nob + 0.2)); q = mixP({ ...STAND }, { ...STAND, alx: -0.85, ale: -1.75, alz: 0.55, arx: -0.85, are: -1.75, arz: -0.55, eye: 0.7, brow: -0.25, mw: 1.3, mh: 0.8, hx: -0.06 }, k); if (t >= T.nobHit) shake = (1 - seg(t, T.nobHit, T.nobHit + 0.4)) * 0.9 }
    if (t >= T.n1) v.pills.push(['EXPIRED LINKS', 0, back(seg(t, T.n1, T.n1 + 0.2)), 'bad']); if (t >= T.n2) v.pills.push(['REQUEST ACCESS', 1, back(seg(t, T.n2, T.n2 + 0.2)), 'bad'])
  } else { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.appr, T.end); phoneMode = 'lock'; showPhone(T.appr); if (t >= T.endedHit) shake = (1 - seg(t, T.endedHit, T.endedHit + 0.3)) * 0.6 }   // they just approved my access; the campaign ended Tuesday
  applyPose({ ...q, tx: q.tx + breathe })
  setCam(c[0], c[1], c[2], eo(ck) * 0.6 + ck * 0.4, 0.07, shake)
  lid.rotation.x = lidA

  docBody.color.set(docMode === 2 ? 0x15161a : 0xffffff)

  scene.background.set(0x9aa7b8).lerp(new THREE.Color(0xffc48a), good); cloudMat.color.set(0xd9dee6).lerp(new THREE.Color(0xffe2c4), good); sunBall.visible = good > 0.2; sunBall.position.y = lerp(3.0, 6.0, good)

  parMat.color.set(0xb9b2a6).lerp(new THREE.Color(0xe7c9a3), good); skyMat.color.set(0xb4bcc8).lerp(new THREE.Color(0xffd9b0), good)
  glow.position.set(2.0, 2.1, -1.55); glow.intensity = glowOn * 2.2
  lidG.material.opacity = good
  drawLaptop(t); if (phoneMode) drawPhone(phoneMode, t); if (docMode >= 0) drawDoc(docMode, t)

// ---------- 2D layer: captions, pills, stamps, list, end card
const SAFE = CONFIG.safe, CX = (SAFE.left + SAFE.right) / 2

  g.fillStyle = CONFIG.bright; g.font = `700 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(text, x, 2); g.restore()
}

  g.font = '800 92px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const w = g.measureText(text).width + 90; g.fillStyle = color; g.beginPath(); g.roundRect(-w / 2, -80, w, 160, 26); g.fill()
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.beginPath(); g.roundRect(-w / 2 + 14, -66, w - 28, 132, 16); g.stroke()
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, 6); g.restore()
}
function coin(xs, ys, k, t, size = 400) {
  if (k <= 0) return
  const sx = Math.cos(t * 3.2), h = size * k, w = h * 0.8 * Math.abs(sx)
  g.save(); g.translate(W * xs, H * ys); g.shadowColor = 'rgba(255,255,255,.55)'; g.shadowBlur = 70; g.drawImage(G_IMG, -w / 2, -h / 2, Math.max(2, w), h); g.restore()
}
function captions(t) {
  let gi = -1; for (let i = 0; i < GROUPS.length; i++) { if (t >= WORDS[GROUPS[i][0]][1] - 0.04) gi = i }
  if (gi < 0) return
  const [a, b, br, mul] = GROUPS[gi]; const endT = gi + 1 < GROUPS.length ? WORDS[GROUPS[gi + 1][0]][1] - 0.04 : WORDS[b][2] + 0.5

  let fs = 118 * mul; const maxW = SAFE.right - SAFE.left - 20

  while (Math.max(...lines.map(widthOf)) > maxW && fs > 40) fs -= 4
  g.font = `800 ${fs}px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif`; g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round'
  const lh = fs * 1.1, y0 = H * CONFIG.capY - (lines.length - 1) * lh / 2, sp = g.measureText(' ').width
  lines.forEach((ln, li) => {
    let x = CX - widthOf(ln) / 2; const y = y0 + li * lh
    for (const i of ln) {

      if (said) { const k = back(seg(t, WORDS[i][1] - 0.04, WORDS[i][1] + 0.1)), cur = t < WORDS[i][2] + 0.06 || i === b
        g.save(); g.translate(x + ww / 2, y); g.scale(0.7 + 0.3 * k, 0.7 + 0.3 * k); g.textAlign = 'center'
        g.strokeStyle = '#000'; g.lineWidth = fs * 0.2; g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 0; g.shadowOffsetY = fs * 0.07; g.strokeText(txt, 0, 0); g.shadowColor = 'transparent'

function endCard(t) {

  const ww = 540, wh = ww * WORD_IMG.height / WORD_IMG.width, wy = gy + gh / 2 + 10; g.save(); g.globalAlpha = eo(seg(t, T.end + 0.35, T.end + 0.8)); g.drawImage(WORD_IMG, W / 2 - ww / 2, wy, ww, wh); g.restore()
  g.textAlign = 'center'; g.textBaseline = 'middle'; const ly = wy + wh + 90
  CONFIG.endLines.forEach((s, i) => { const kk = eo(seg(t, T.end + 0.7 + i * 0.32, T.end + 1.05 + i * 0.32)); g.globalAlpha = kk; g.fillStyle = i === CONFIG.endLines.length - 1 ? '#fff' : '#d4d4d8'; g.font = '700 78px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.fillText(s, W / 2, ly + i * 100 + (1 - kk) * 26) })
  const kk = back(seg(t, T.end + 1.9, T.end + 2.2)); if (kk > 0) { g.globalAlpha = 1; g.save(); g.translate(W / 2, ly + CONFIG.endLines.length * 100 + 70); g.scale(kk, kk); g.font = '700 56px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const w = g.measureText(CONFIG.site).width + 110; g.fillStyle = '#fff'; g.beginPath(); g.roundRect(-w / 2, -60, w, 120, 60); g.fill(); g.fillStyle = '#0b0c10'; g.fillText(CONFIG.site, 0, 3); g.restore() }
  g.globalAlpha = 1
}

// The two things she needs, with empty boxes.
function need(t) {
  const inK = back(seg(t, T.need, T.need + 0.22)); if (inK <= 0) return
  const w = 720, h = 270, x0 = CX - w / 2, y0 = SAFE.top + 6
  g.save(); g.translate(CX, y0 + h / 2); g.scale(inK, inK); g.translate(-CX, -(y0 + h / 2))
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 16; g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(x0, y0, w, h, 36); g.fill(); g.shadowColor = 'transparent'
  g.fillStyle = CONFIG.muted; g.font = '700 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('ALL I NEED', x0 + 44, y0 + 50)
  CONFIG.need.forEach((s, i) => { const t0 = i ? T.clipHit : T.logoHit, k = back(seg(t, t0 - 0.1, t0 + 0.14)); if (k <= 0) return; const y = y0 + 122 + i * 92
    g.save(); g.translate(x0 + 78, y); g.scale(k, k); g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.roundRect(-28, -28, 56, 56, 12); g.stroke(); g.restore(); g.globalAlpha = clamp(k); g.fillStyle = '#fff'; g.font = '700 52px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.fillText(s, x0 + 132, y + 3); g.globalAlpha = 1 })
  g.restore()
}
function recDot(t) {
  const on = Math.floor(t * 3) % 2, k = back(seg(t, T.maskHit, T.maskHit + 0.2)); if (k <= 0) return
  g.save(); g.translate(CX, SAFE.top + 60); g.scale(k, k); g.font = '800 46px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; const tw = g.measureText('REC').width, w = tw + 150; g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 30; g.shadowOffsetY = 12; g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(-w / 2, -50, w, 100, 50); g.fill(); g.shadowColor = 'transparent'
  g.fillStyle = on ? CONFIG.bad : '#5a2326'; g.beginPath(); g.arc(-w / 2 + 56, 0, 22, 0, 7); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('REC', -w / 2 + 100, 3); g.restore()
  pill('THEIR WEBSITE', 1, back(seg(t, 20.4, 20.6)), 'bad')
}
function overlay(t) {
  g.clearRect(0, 0, W, H); const v = view
  if (v.dim) { g.fillStyle = `rgba(8,8,16,${v.dim})`; g.fillRect(0, 0, W, H) }
  if (t < T.end + 0.4) {
    if (v.coin) coin(v.coin[0], v.coin[1], v.coin[2], v.coin[3])
    if (v.need != null) need(v.need)
    if (v.rec) recDot(v.rec)
    for (const p of v.pills) pill(p[0], p[1], p[2], p[3])

    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.font = '600 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.fillText(CONFIG.site.toUpperCase(), CX, H * CONFIG.capY + 190); g.shadowColor = 'transparent'; g.globalAlpha = 1
  }
  const fl = Math.max(v.flash, (1 - seg(t, T.end, T.end + 0.3)) * seg(t, T.end - 0.12, T.end)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H) }

}
window.render = (t) => { t = clamp(t, 0, T.dur); state(t); R.render(scene, cam); overlay(t) }

})()
