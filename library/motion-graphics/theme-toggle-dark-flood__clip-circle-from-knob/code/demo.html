<!doctype html>
<html><head><meta charset="utf-8"><title>Theme toggle dark flood</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.scene{left:0;top:0;overflow:hidden}
.eb{font-weight:700;letter-spacing:.14em}
.hd{font-weight:800;letter-spacing:-.035em;line-height:1.04}
.tg{transition:none}
.kn{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ph{box-shadow:0 50px 100px -40px rgba(20,30,60,.45),0 0 0 10px rgba(20,22,30,.92)}
.row{display:flex;align-items:center;padding-left:16px}
.rd{border-radius:50%}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @likithareddy's app launch film (revid.ai wall #15, 13.7s to 14.5s): a light scene with a headline and a
// phone; a toggle under the copy is clicked, its knob slides, and a dark circle grows from the knob until it covers the frame,
// revealing the same scene in dark mode. Then it flips back the same way.
const CONFIG = {
  eyebrow: 'DARK MODE', head: ['Day or night,', 'easy on the eyes.'],
  sub: 'Every screen has a dark version.',
  light: { bg: '#fbf8f1', ink: '#15161c', sub: '#6b6d78', card: '#ffffff', row: '#eef0f5', blobs: ['rgba(255,214,120,.45)', 'rgba(160,190,255,.45)', 'rgba(250,170,210,.4)'] },
  dark:  { bg: '#0f1320', ink: '#f2f3f7', sub: '#9aa0b4', card: '#171c2b', row: '#222941', blobs: ['rgba(70,90,190,.35)', 'rgba(40,60,140,.35)', 'rgba(90,60,140,.3)'] },
  accent: '#3d63f2',
  t: { click: .9, flood: [1.02, 1.34], clickBack: 3.2, back: [3.32, 3.64] },
  dur: 4.6,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 : W / 1920
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
// two copies of the same scene, one per theme; the dark one is clipped to a circle centred on the toggle knob
function scene(th) {
  const root = el('div', 'abs scene'); S(root, { width: W + 'px', height: H + 'px', background: `radial-gradient(40% 50% at 78% 12%, ${th.blobs[0]}, transparent 70%), radial-gradient(40% 50% at 20% 30%, ${th.blobs[1]}, transparent 70%), radial-gradient(40% 50% at 80% 95%, ${th.blobs[2]}, transparent 70%), ${th.bg}` })
  const tx = TALL ? CX - 380 * Z : W * .1, ty = TALL ? H * .1 : CY - 170 * Z
  const eb = el('div', 'abs eb', root, C.eyebrow); S(eb, { left: px(tx), top: px(ty), color: C.accent, fontSize: px(18 * Z) })
  const h = el('div', 'abs hd', root, C.head.join('<br>')); S(h, { left: px(tx), top: px(ty + 36 * Z), color: th.ink, fontSize: px(70 * Z) })
  const sb = el('div', 'abs', root, C.sub); S(sb, { left: px(tx), top: px(ty + 220 * Z), color: th.sub, fontSize: px(24 * Z) })
  const tg = el('div', 'abs tg', root); S(tg, { left: px(tx), top: px(ty + 280 * Z), width: px(84 * Z), height: px(46 * Z), borderRadius: px(23 * Z) })
  const kn = el('div', 'abs kn', tg); S(kn, { width: px(38 * Z), height: px(38 * Z), top: px(4 * Z), borderRadius: '50%' })
  // phone
  const pw = 330 * Z, ph = 680 * Z, ppx = TALL ? CX - pw / 2 : W * .68 - pw / 2, ppy = TALL ? H * .42 : CY - ph / 2
  const p = el('div', 'abs ph', root); S(p, { left: px(ppx), top: px(ppy), width: px(pw), height: px(ph), borderRadius: px(48 * Z), background: th.card, padding: `${px(60 * Z)} ${px(20 * Z)}` })
  for (let i = 0; i < 8; i++) { const r = el('div', 'row', p); S(r, { height: px(58 * Z), marginBottom: px(12 * Z), borderRadius: px(16 * Z), background: th.row }); const d = el('div', 'rd', r); S(d, { width: px(28 * Z), height: px(28 * Z), background: i % 3 ? C.accent : '#f2a93b' }) }
  return { root, tg, kn, knobC: [tx + 42 * Z, ty + 280 * Z + 23 * Z] }
}
const L = scene(C.light), D = scene(C.dark)
const cur = el('div', 'abs'); S(cur, { zIndex: 9 }); cur.innerHTML = '<svg viewBox="0 0 22 22" width="34" height="34"><path d="M3 2 L3 17 L7 13.5 L10 20 L12.5 19 L9.6 12.6 L15 12.4 Z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>'
const Rmax = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - L.knobC[0], y - L.knobC[1]))) * 1.05   // overscale past the far corner
function render(t) {
  const on = sstep(t - C.t.click, 2.6, .7) - sstep(t - C.t.clickBack, 2.6, .7)
  ;[L, D].forEach((s) => { S(s.kn, { left: px((4 + on * 38) * Z) }); S(s.tg, { background: on > .5 ? C.accent : 'rgba(120,124,140,.35)' }) })
  // the flood: about .3s, eased so it starts fast from the knob and slows as it passes the corners
  const r = Rmax * (eo(seg(t, ...C.t.flood)) * (1 - ei(seg(t, ...C.t.back))))
  const [kx, ky] = L.knobC
  D.root.style.clipPath = `circle(${r.toFixed(1)}px at ${(kx + (4 + on * 38 - 23) * Z).toFixed(1)}px ${ky.toFixed(1)}px)`
  // cursor clicks the toggle twice
  const press = Math.max(Math.sin(Math.PI * seg(t, C.t.click - .08, C.t.click + .1)), Math.sin(Math.PI * seg(t, C.t.clickBack - .08, C.t.clickBack + .1)))
  const cin = eio(seg(t, .2, .85)), cout = eio(seg(t, 3.5, 4.3))
  S(cur, { left: px(lerp(kx + 300 * Z, kx + 10 * Z, cin) + cout * 300 * Z), top: px(lerp(ky + 200 * Z, ky, cin) + cout * 200 * Z), transform: `scale(${1 - press * .15})`, filter: on > .5 && t < C.t.back[1] ? 'invert(1)' : 'none' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
