<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')

// easing + helpers, the same set used across these demos

const ei = (x) => x * x * x

const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 8.4
window.DUR = DUR
const V = H >= W                                   // vertical-ish layouts (9:16, 4:5, 1:1)
const SC = V ? W / 1080 : Math.min(W / 1920, H / 1080)   // design scale (the source calls it S; the template's S is the style helper)
const TR = V ? H / W : 0                         // 1.78 for 9:16, 1.25 for 4:5, 1 for 1:1 (the source calls it TALL)
const $ = (id) => document.getElementById(id)
const p = (t, a, b) => (b - a > 0 && isFinite(b - a) ? clamp((t - a) / (b - a)) : t >= a ? 1 : 0)
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const backS = (x, c1 = 2.4) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const SOUNDS = []   // {t,type}: cues collected here to build a soundtrack
const snd = (t, type) => { if (!SOUNDS.some((s) => s.t === t && s.type === type)) SOUNDS.push({ t, type }) }
// pre-load the fonts so offsetWidth measurements are right on the first frame drawn
const loadFonts = (...f) => f.forEach((x) => document.fonts.load(x))
const HF = (V ? 100 : 128) * SC    // headline font
const M = (V ? 72 : 110) * SC      // margin
function tf(el, o) {
  const { x = 0, y = 0, s = 1, sx, sy, r = 0, rx = 0, ry = 0, a = 1, z = 0, ox, oy } = o
  if (a <= 0.001) { el.style.display = 'none'; return }
  el.style.display = ''
  el.style.opacity = a
  if (ox !== undefined) el.style.transformOrigin = `${ox} ${oy}`
  el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotate(${r}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sx ?? s},${sy ?? s})`
}
const hide = (...els) => els.forEach((e) => (e.style.display = 'none'))
function setText(el, html) { if (el.dataset.k !== html) { el.innerHTML = html; el.dataset.k = html } }
// word-by-word slam: each word scales down from 1.35 and fades in, staggered
function tokenize(html) {
  // split into words, re-wrapping each word in whatever inline tags were open around it
  const parts = html.split(/(<\/?[a-z]+[^>]*>)/i).filter(Boolean), open = [], out = []
  for (const part of parts) {
    if (part.startsWith('</')) { open.pop(); continue }
    if (part.startsWith('<')) { open.push(part); continue }
    for (const w of part.split(/\s+/).filter(Boolean)) out.push(open.join('') + w + open.map((o) => '</' + o.match(/<([a-z]+)/i)[1] + '>').reverse().join(''))
  }
  return out
}
function slam(el, html, t, t0, { fs, x, y, w = 0.1, d = 0.45, out = Infinity, outD = 0.35, outDir = -1, align = 'left', color } = {}) {
  if (t < t0 || t > out + outD) { hide(el); return }
  el.style.display = ''; el.style.fontSize = px(fs); el.style.textAlign = align; if (color) el.style.color = color
  const key = html + '|' + fs
  if (el.dataset.k !== key) {
    el.innerHTML = tokenize(html).map((wd) => `<span class="w">${wd} </span>`).join('')
    el.dataset.k = key
  }
  const words = el.querySelectorAll('.w')
  words.forEach((sp, i) => {
    const k = eo(p(t, t0 + i * w, t0 + i * w + d))
    sp.style.opacity = k
    sp.style.transform = `translateY(${(1 - k) * 0.35 * fs}px) scale(${lerp(1.3, 1, k)})`
  })
  const ko = p(t, out, out + outD)
  const left = align === 'center' ? x - el.offsetWidth / 2 : align === 'right' ? x - el.offsetWidth : x
  tf(el, { x: left, y, a: 1 - ko, s: lerp(1, 0.96, ko), ox: '50%', oy: '50%' })
  if (ko > 0) el.style.transform += ` translateY(${outDir * ko * 40 * SC}px)`

function cursor(t, pts, clickAt) {
  // pts: [[t,x,y],...] keyframes; shows cursor between first and last
  if (t < pts[0][0] - 0.01 || t > pts[pts.length - 1][0] + 0.6) { hide($('cur'), $('rip')); return }
  let x = pts[0][1], y = pts[0][2]
  for (let i = 0; i < pts.length - 1; i++) {
    const [ta, xa, ya] = pts[i], [tb, xb, yb] = pts[i + 1]

  }

  $('cur').style.width = $('cur').style.height = px(cs)
  const press = clickAt !== undefined ? (t > clickAt && t < clickAt + 0.14 ? 0.82 : 1) : 1
  tf($('cur'), { x, y, s: press, a: p(t, pts[0][0], pts[0][0] + 0.3) })
  if (clickAt !== undefined && t > clickAt && t < clickAt + 0.5) {
    const k = p(t, clickAt, clickAt + 0.5), rs = lerp(10, 120, eo(k)) * SC
    $('rip').style.width = $('rip').style.height = px(rs); $('rip').style.borderWidth = px(4 * SC)
    tf($('rip'), { x: x - rs / 2 + 4 * SC, y: y - rs / 2 + 4 * SC, a: 1 - k })
    snd(clickAt, 'click')

// ---------- blobs ----------
function blobs(t, mood) {
  // mood: 0 dark/cold, 1 gold warm, 2 red danger
  const b1 = $('b1'), b2 = $('b2'), b3 = $('b3'), R = Math.max(W, H)
  const amp = (m) => (mood === m ? 1 : 0.35)
  ;[[b1, 0.9 * amp(1), 0.25, 0.3, 0.07], [b2, 0.8 * amp(0), 0.78, 0.7, 0.05], [b3, 0.9 * amp(2), 0.5, 0.95, 0.06]].forEach(([el, a, fx, fy, sp], i) => {
    const sz = R * (0.55 + 0.1 * i)
    el.style.width = el.style.height = px(sz)
    el.style.opacity = a * 0.9
    el.style.transform = `translate(${fx * W - sz / 2 + Math.sin(t * sp * 6 + i) * 0.08 * W}px,${fy * H - sz / 2 + Math.cos(t * sp * 5 + i) * 0.08 * H}px)`
  })
}

  if (t < t0 - 0.1) return
  const kin = eo(p(t, t0, t0 + 0.9))
  const bs = V ? (TR > 1.4 ? 0.78 : 0.56) : 0.82
  const bx = V ? W / 2 : W * 0.3, by = V ? H * (TR > 1.4 ? 0.33 : 0.36) : H * 0.5
  book(t, { x: bx, y: by + (1 - kin) * 120 * SC, s: bs, ry: -24 + Math.sin(t * 0.8) * 3, rx: 6, open: 0, a: p(t, t0, t0 + 0.5), bob: Math.sin(t * 1.4) * 6 * SC })
  snd(t0, 'whoosh')
  const tx = V ? W / 2 : W * 0.56, al = V ? 'center' : 'left'
  const ty = V ? by + BH * bs * 0.5 + 40 * SC : H * 0.3
  $('e1').style.display = ''; setText($('e1'), 'Author Name · a true story'); $('e1').style.fontSize = px((V ? 24 : 26) * SC)
  const avs = (V ? 64 : 72) * SC; $('ava').style.width = $('ava').style.height = px(avs)
  const ew = $('e1').offsetWidth, ex = V ? W / 2 - (ew + avs + 16 * SC) / 2 : tx
  if (t > t0 + 0.6) { tf($('ava'), { x: ex, y: ty - avs / 2 + 14 * SC, a: p(t, t0 + 0.6, t0 + 1.0), s: lerp(0.6, 1, backS(p(t, t0 + 0.6, t0 + 1.1), 1.6)), ox: '50%', oy: '50%' }); tf($('e1'), { x: ex + avs + 16 * SC, y: ty, a: p(t, t0 + 0.6, t0 + 1.0) }) } else hide($('e1'), $('ava'))
  slam($('h1'), 'The <i>Golden Title</i>', t, t0 + 0.8, { fs: (V ? 84 : 92) * SC, x: tx, y: ty + 52 * SC, align: al })
  slam($('h2'), 'on Silver Lane.', t, t0 + 1.3, { fs: (V ? 84 : 92) * SC, x: tx, y: ty + 52 * SC + (V ? 92 : 100) * SC, align: al })
  snd(t0 + 0.8, 'thud')
  // Amazon button
  const bt = $('btn'), bAt = t0 + 2.4, click = t0 + 4.7
  const bw = (V ? 440 : 420) * SC, bh = (V ? 96 : 92) * SC
  bt.style.width = px(bw); bt.style.height = px(bh); bt.style.fontSize = px((V ? 32 : 30) * SC); bt.querySelector('svg').style.width = px(30 * SC); bt.querySelector('svg').style.height = px(30 * SC)
  const bkx = V ? W / 2 - bw / 2 : tx, bky = ty + 52 * SC + (V ? 92 : 100) * SC * 2 + 30 * SC
  const kb = backS(p(t, bAt, bAt + 0.5), 1.8), pressed = t > click && t < click + 0.18 ? 0.95 : 1
  if (t > bAt) tf(bt, { x: bkx, y: bky, s: lerp(0.7, 1, kb) * pressed, a: p(t, bAt, bAt + 0.2), ox: '50%', oy: '50%' }); else hide(bt)
  snd(bAt, 'whoosh')
  cursor(t, [[click - 1.5, bkx + bw * 1.1, bky + bh * 2.2], [click - 0.3, bkx + bw * 0.62, bky + bh * 0.55], [click + 0.9, bkx + bw * 0.62, bky + bh * 0.55]], click)
  slam($('h3'), 'Start your <i>next chapter.</i>', t, click + 0.9, { fs: (V ? 44 : 44) * SC, x: V ? W / 2 : tx, y: bky + bh + 44 * SC, align: al })
  snd(click + 0.9, 'thud')
  $('s1').style.display = ''; setText($('s1'), 'example.com · paperback & ebook'); $('s1').style.fontSize = px((V ? 24 : 24) * SC)
  if (t > click + 1.6) tf($('s1'), { x: V ? W / 2 - $('s1').offsetWidth / 2 : tx, y: bky + bh + 44 * SC + 64 * SC, a: p(t, click + 1.6, click + 2.0) * 0.8 }); else hide($('s1'))
  // fade to black at the very end
  $('vig').style.background = `radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,${p(t, tEnd - 0.6, tEnd) * 0.9}) 0%,rgba(0,0,0,${0.6 + 0.4 * p(t, tEnd - 0.6, tEnd)}) 100%)`
}
function render(t) {
  ;['h1', 'h2', 'h3', 'e1', 's1', 'ava', 'bookWrap', 'bookShadow', 'btn', 'cur', 'rip'].forEach((id) => ($(id).style.display = 'none'))
  $('vig').style.background = ''
  blobs(t, 1)
  sceneCta(t)
}

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
