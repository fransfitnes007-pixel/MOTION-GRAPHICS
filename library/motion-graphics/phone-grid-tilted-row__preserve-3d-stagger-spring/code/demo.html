<!doctype html>
<html><head><meta charset="utf-8"><title>Phone grid tilted row</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.layer{position:absolute;inset:0}
.bgfill{position:absolute;left:-4000px;top:-4000px;width:9920px;height:9080px}
.dots{position:absolute;left:-4000px;top:-4000px;width:9920px;height:9080px;background-image:radial-gradient(rgba(20,16,40,.11) 1.3px,transparent 1.6px);background-size:34px 34px;background-position:-4px -4px}
.dotsd{position:absolute;left:-4000px;top:-4000px;width:9920px;height:9080px;background-position:-4px -4px;background-image:radial-gradient(rgba(255,255,255,.07) 1.3px,transparent 1.6px);background-size:34px 34px}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}

.line{position:absolute;white-space:nowrap;line-height:1;letter-spacing:-.045em}
.line .w{display:inline-block;will-change:transform,filter,opacity}
.grad{background:linear-gradient(100deg,#6d3cff 0%,#9b6bff 45%,#4f7bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:11px 18px 11px 14px;border-radius:999px;font-weight:700;font-size:21px;white-space:nowrap;letter-spacing:-.01em}
.chip.lt{background:rgba(255,255,255,.92);color:#0b0b10;box-shadow:0 14px 34px -10px rgba(24,16,52,.35),0 0 0 1px rgba(20,16,40,.07)}
.chip.dk{background:rgba(14,12,22,.86);color:#fff;box-shadow:0 14px 34px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12)}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}

.phone{position:absolute;border-radius:58px;background:#0c0c10;padding:11px;box-shadow:0 50px 110px -30px rgba(24,16,52,.6),inset 0 0 0 2px #2a2a33,0 0 0 1px rgba(0,0,0,.25)}
.phone .scr{position:absolute;inset:11px;border-radius:47px;overflow:hidden;background:#000}
.phone .scr .im{position:absolute;inset:-6%;}
.phone .isl{position:absolute;left:50%;top:22px;width:34%;height:30px;border-radius:20px;background:#000;transform:translateX(-50%);z-index:4}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 3.4
window.DUR = DUR
// Everything is laid out in the original's 1920x1080 space inside #root, scaled to fit whatever W x H the page is given.
const U = Math.min(W / 1920, H / 1080)
const root = el('div', 'abs'); S(root, { left: '0', top: '0', width: '1920px', height: '1080px', transformOrigin: '0 0', transform: `translate(${(W - 1920 * U) / 2}px,${(H - 1080 * U) / 2}px) scale(${U})` })
const ei4 = (x) => x * x * x * x
const eio5 = (x) => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CHECK = (size = 22, col = '#fff') => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${col}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
// A line of words that rise out of a blur, one per spoken word.
function line(parent, words, { size = 140, weight = 800, color = '#0b0b10', x = 960, y = 540, align = 'center', gap = .26, cls = '' } = {}) {
  const L = el('div', 'line ' + cls, parent)
  S(L, { fontWeight: weight, fontSize: size + 'px', color, top: (y - size / 2) + 'px' })
  if (align === 'center') S(L, { left: '0', width: '1920px', textAlign: 'center' }); else S(L, { left: x + 'px' })
  L.ws = words.map((w, i) => { const s = el('span', 'w' + (w.g ? ' grad' : ''), L); s.textContent = w.t; if (i < words.length - 1) s.style.marginRight = gap + 'em'; s.at = w.at; return s })
  return L
}
function wordsIn(L, t, dur = .42) {
  for (const s of L.ws) {
    const p = eo5(seg(t, s.at - .04, s.at - .04 + dur))
    s.style.opacity = p; s.style.filter = `blur(${(1 - p) * 16}px)`
    s.style.transform = `translateY(${(1 - p) * .38}em) scale(${.92 + .08 * p})`
  }
}
function wordsOut(L, t, t0, dir = -1, dur = .3) {
  L.ws.forEach((s, i) => {
    const q = ei(seg(t, t0 + i * .035, t0 + i * .035 + dur)); if (q <= 0) return
    s.style.opacity = 1 - q; s.style.filter = `blur(${q * 14}px)`; s.style.transform = `translateY(${dir * q * .45}em) scale(${1 - .05 * q})`
  })
}
// Placeholder for a vertical video cover: a gradient with a head-and-shoulders silhouette.
const coverBg = (i) => { const h = (i * 47 + 250) % 360; return `radial-gradient(circle at 50% 34%, rgba(255,255,255,.55) 0 11%, transparent 12%), radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.35) 0 28%, transparent 29%), linear-gradient(170deg, hsl(${h} 70% 62%), hsl(${(h + 50) % 360} 60% 30%))` }
// light stage: grey base, faint dot grid, four blurred orbs drifting
const bgL = el('div', 'layer', root); const bgBase = el('div', 'bgfill', bgL); S(bgBase, { background: '#f4f4f6' }); el('div', 'dots', bgL)
const orbs = [
  { c: 'rgba(139,92,246,.30)', s: 900, x: 300, y: 120, sp: .09 }, { c: 'rgba(96,165,250,.26)', s: 820, x: 1300, y: 520, sp: .07 },
  { c: 'rgba(236,72,153,.14)', s: 700, x: 900, y: 760, sp: .11 }, { c: 'rgba(148,163,184,.30)', s: 600, x: 1500, y: -120, sp: .06 },
].map((o) => { const e = el('div', 'orb', bgL); S(e, { width: o.s + 'px', height: o.s + 'px', background: `radial-gradient(closest-side, ${o.c}, transparent)` }); return { ...o, e } })
const driftOrbs = (t) => { for (const o of orbs) S(o.e, { left: (o.x + Math.sin(t * o.sp * 6 + o.s) * 120) + 'px', top: (o.y + Math.cos(t * o.sp * 5 + o.x) * 90) + 'px' }) }
function phone(parent, x, y, w, bg) {
  const h = w * 2.07
  const p = el('div', 'phone', parent, '<div class="scr"><div class="im"></div></div><div class="isl"></div>')
  S(p, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })
  p.scr = p.querySelector('.scr'); p.im = p.querySelector('.im'); p.im.style.background = bg; p.w = w; p.h = h
  return p
}
const T0 = 12.2
const WT = { real: 12.64, phones: 13.08, post: 13.52, it2: 13.78 }
const L6a = line(root, [{ t: 'Live', at: WT.real }, { t: 'on', at: WT.phones, g: 1 }, { t: 'every', at: WT.post }, { t: 'phone.', at: WT.it2 }], { size: 104, y: 150 })
const wall = el('div', 'abs', root); S(wall, { left: '0', top: '0', width: '1920px', height: '1080px', perspective: '2200px' })
const wallIn = el('div', 'abs', wall); S(wallIn, { left: '0', top: '0', width: '1920px', height: '1080px', transformStyle: 'preserve-3d' })
const wallHead = el('div', 'chip lt', root, `<span style="width:12px;height:12px;border-radius:50%;background:#22c55e;box-shadow:0 0 12px #22c55e;display:block"></span>Device row<span style="color:#8a8a99;font-weight:600">&middot; live</span>`)
S(wallHead, { left: '50%', top: '262px', transform: 'translateX(-50%)', fontSize: '22px' })
const PH = [0, 1, 2, 3, 4, 5, 6].map((i) => {
  const w = 228, x = 960 - 3.5 * 262 + i * 262 + 17, y = 330 + Math.abs(i - 3) * 18
  const p = phone(wallIn, x, y, w, coverBg((i * 3 + 4) % 14))
  const st = el('div', 'chip lt', wallIn); S(st, { fontSize: '18px', padding: '8px 14px 8px 10px', gap: '8px' })
  st.innerHTML = `<span class="ico a" style="width:24px;height:24px;background:#ede9fe"><span class="sp" style="width:12px;height:12px;border-radius:50%;border:2.5px solid #8b5cf6;border-top-color:transparent;display:block"></span></span><span class="la">Syncing</span><span class="ico b" style="width:24px;height:24px;background:#16a34a">${CHECK(14)}</span><span class="lb">Synced</span>`
  st.A = [...st.querySelectorAll('.a,.la')]; st.B = [...st.querySelectorAll('.b,.lb')]; st.sp = st.querySelector('.sp')
  p.st = st; p.i = i; p.x0 = x; p.y0 = y; return p
})
function render(t) {
  t += T0
  driftOrbs(t)
  const wi = eo5(seg(t, 12.3, 13.0)), swap = eio5(seg(t, 14.2, 14.6))
  wordsIn(L6a, t); wordsOut(L6a, t, 14.18, -1, .24)
  S(wallHead, { opacity: wi * (1 - swap), transform: `translateX(-50%) translateY(${(1 - wi) * 20}px)` })
  const tilt = lerp(18, 6, wi)
  S(wallIn, { transform: `translateY(${(1 - wi) * 160 + swap * 30}px) rotateX(${tilt}deg) scale(${lerp(.92, 1, wi) * lerp(1, .74, swap)})`, transformOrigin: '50% 60%' })
  PH.forEach((p) => {
    const d = Math.abs(p.i - 3), pin = spring(seg(t, 12.32 + d * .07, 12.95 + d * .07), 7, 11)
    S(p, { opacity: clamp(pin * 1.5), transform: `translateY(${(1 - pin) * 120 + Math.sin(t * 1.4 + p.i) * 6}px) rotateY(${(p.i - 3) * -5}deg)` })
    const at = WT.post + d * .12, posted = t > at + .45
    p.st.A.forEach((e) => vis(e, !posted)); p.st.B.forEach((e) => vis(e, posted)); p.st.sp.style.transform = `rotate(${t * 720}deg)`
    const sp = eo5(seg(t, at - .1, at + .2))
    S(p.st, { left: (p.x0 + p.w / 2) + 'px', top: (p.y0 + p.h - 70) + 'px', opacity: sp, transform: `translateX(-50%) scale(${.85 + .15 * sp})` })
    p.im.style.transform = `scale(${1.04 + .04 * Math.sin(t * .8 + p.i)})`
  })
  S(wallIn, { filter: swap > 0 ? `blur(${swap * 1.2}px)` : '' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
