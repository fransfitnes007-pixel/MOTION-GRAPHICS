<!doctype html>
<html><head><meta charset="utf-8"><title>Text scramble decode</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10;color:#fff}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
.scan{background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px)}
.row{position:absolute;left:0;width:100%;display:flex;justify-content:center;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700;line-height:1}
.c{display:inline-block;text-align:center}
.lab{position:absolute;left:0;width:100%;text-align:center;font:600 26px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;color:#8ea0ff}
.trk{position:absolute;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.trk i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#6d7bff,#9bf0ff);border-radius:3px}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const pr = (t, a, d) => seg(t, a, a + d)          // progress 0..1 of a move that starts at a and lasts d seconds
const DUR = 5
window.DUR = DUR
const bg = el('div', 'fill'); bg.style.background = 'radial-gradient(65% 55% at 50% 50%,#15152a 0%,#0b0b10 75%)'
el('div', 'fill scan')

const LINES = TALL ? ['YOUR', 'HEADLINE', 'DECODES', 'ITSELF'] : ['YOUR HEADLINE', 'DECODES ITSELF']
const GL = '!<>-_\\/[]{}=+*^?#%&$01ABCDEFGHJKLMNPQRSTUVWXYZ'
const hsh = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x) }
const maxc = Math.max(...LINES.map(l => l.length))
const FS = Math.min(TALL ? 165 : 150, W * .86 / (maxc * .62))
const CW = FS * .62, LH = FS * 1.22
const top0 = CY - (LINES.length * LH) / 2 - (TALL ? 20 : 30)

const cells = []; let idx = 0
LINES.forEach((ln, li) => {
  const row = el('div', 'row'); S(row, { top: px(top0 + li * LH), fontSize: px(FS), height: px(LH), alignItems: 'center' })
  ;[...ln].forEach((ch, ci) => {
    const c = el('span', 'c', row); S(c, { width: px(CW), height: px(FS) })
    cells.push({ c, ch, i: idx, li, ci, st: .3 + idx * .03 + li * .12, se: .65 + idx * .062 + hsh(idx, 7) * .4 })
    idx++
  })
})
const N = cells.length
const lab = el('div', 'lab'); S(lab, { top: px(top0 + LINES.length * LH + 40 * K), fontSize: px(26 * K) })
const trkW = Math.min(W * .4, 640), trk = el('div', 'trk'); S(trk, { left: px(CX - trkW / 2), top: px(top0 + LINES.length * LH + 100 * K), width: px(trkW) })
const fill = el('i', '', trk)
const T_OUT = 3.9

function render(t) {
  let done = 0
  const f = Math.floor(t * 30)
  cells.forEach((q) => {
    const tOut = T_OUT + (N - 1 - q.i) * .02
    const on = t >= q.st && t < tOut + .4
    if (q.ch === ' ' || !on) { if (q.c.textContent) q.c.textContent = ''; return }
    const settled = t >= q.se && t < tOut
    let txt, col, op
    if (settled) { txt = q.ch; const k = eo(seg(t, q.se, q.se + .45)); col = k < 1 ? 'rgb(' + (140 + 115 * k | 0) + ',' + (230 + 25 * k | 0) + ',255)' : '#fff'; op = 1; done++ }
    else {
      txt = GL[Math.floor(hsh(q.i, f) * GL.length)]; col = '#8ea0ff'
      op = t < q.se ? .55 + .3 * hsh(q.i, f + 99) : clamp(1 - (t - tOut) / .35) * .7
      if (t < q.st + .12) op *= seg(t, q.st, q.st + .12)
    }
    if (q.c.textContent !== txt) q.c.textContent = txt
    S(q.c, { color: col, opacity: op, textShadow: settled ? '0 0 ' + 40 * (1 - eo(seg(t, q.se, q.se + .5))) + 'px #8ea0ff' : '0 0 24px rgba(110,125,255,.5)' })
  })
  const frac = t < T_OUT ? done / N : 1 - eio(pr(t, T_OUT, .7))
  const vo = clamp(pr(t, .25, .3)) * (1 - clamp(pr(t, T_OUT + .5, .3)))
  S(trk, { opacity: vo }); fill.style.width = (frac * 100).toFixed(1) + '%'
  lab.textContent = frac >= 1 && t < T_OUT ? 'DECODED' : 'DECODING ' + Math.round(frac * 100) + '%'
  S(lab, { opacity: vo })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
