  else if (t < T.small) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.scan, T.small); phoneMode = 'scan'; showPhone(T.scan); v.flash = t >= T.scanHit ? (1 - seg(t, T.scanHit, T.scanHit + 0.22)) * 0.9 : 0; if (t >= T.thumbHit + 0.5) v.pills.push(['THUMB: IN ALL 23', 0, back(seg(t, T.thumbHit + 0.5, T.thumbHit + 0.7)), 'bad']) }   // scanned with the phone
  else if (t < T.found) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.small, T.found); phoneMode = 'v2'; showPhone(T.small); if (t >= T.againHit) { v.stamp = ['DO IT AGAIN', seg(t, T.againHit, T.againHit + 0.16), CONFIG.bad, -0.1, 0.36]; shake = 1 - seg(t, T.againHit, T.againHit + 0.4) } }   // small change, version two
  else if (t < T.agr) {                                                         // then I found YourBrand
    const k = eo(seg(t, T.found, T.found + 0.5)); glowOn = 0.5 + 1.1 * k
    if (t < T.foundG) { q = mixP({ ...FLAT, eye: 0.3, tx: 0.3, hx: 0.3 }, { ...SIT, hx: 0.12, eye: 1.4, mw: 0.8, mh: 2, alx: -0.3, arx: -0.3, ale: -0.9, are: -0.9 }, k); c = CAM.face; ck = seg(t, T.found, T.foundG) }
    else { q = { ...TYPE, eye: 1.25 }; c = CAM.shoulder; ck = seg(t, T.foundG, T.agr); v.flash = (1 - seg(t, T.foundG, T.foundG + 0.3)) * 0.85; v.coin = [0.5, 0.33, back(seg(t, T.foundG, T.foundG + 0.4)), t] }
  } else if (t < T.no) { q = { ...SIT }; c = CAM.phone; ck = seg(t, T.agr, T.no); docMode = 2; showDoc(T.agr); if (t >= T.thereHit && t < T.after[0]) shake = (1 - seg(t, T.thereHit, T.thereHit + 0.3)) * 0.5 }   // the agreement, read, sign, countersigned, brief, PDF
  else if (t < T.coast) {                                                       // no printer, no scanning, no bullshit
    c = CAM.center; ck = seg(t, T.no, T.coast)
    if (t < T.nob) {
      const n = t < T.n2s ? 0 : 1, h0 = n ? T.n2 : T.n1, st = n ? T.n2s : T.no, side = n ? 1 : -1, sw = seg(t, h0 - 0.1, h0 + 0.08), swing = Math.sin(sw * PI)
      q = { ...STAND, hy: -side * 0.35, mw: 1.5, mh: 1.4, brow: -0.15 }
      if (side < 0) { q.alz = -1.2 - swing * 1.2; q.alx = -0.4 * swing; q.ale = -0.6 } else { q.arz = 1.2 + swing * 1.2; q.arx = -0.4 * swing; q.are = -0.6 }
      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? scnP : prnP
      o.position.set(px, py, 2.3); o.rotation.set(0.3, spin * 0.8 + 0.3, spin); o.scale.setScalar(Math.max(0.01, 0.9 * inK)); if (t >= h0) shake = (1 - seg(t, h0, h0 + 0.25)) * 0.5
    } else { const k = back(seg(t, T.nob, T.nob + 0.2)); q = mixP({ ...STAND }, { ...STAND, alx: -0.85, ale: -1.75, alz: 0.55, arx: -0.85, are: -1.75, arz: -0.55, eye: 0.7, brow: -0.25, mw: 1.3, mh: 0.8, hx: -0.06 }, k); if (t >= T.nobHit) shake = (1 - seg(t, T.nobHit, T.nobHit + 0.4)) * 0.9 }
    if (t >= T.n1) v.pills.push(['PRINTER', 0, back(seg(t, T.n1, T.n1 + 0.2)), 'bad']); if (t >= T.n2) v.pills.push(['SCANNING', 1, back(seg(t, T.n2, T.n2 + 0.2)), 'bad'])
  } else {                                                                      // the twenty three pages are coasters now
    q = { ...SIT, hy: -0.6, hx: 0.2, eye: 0.6, mw: 1.8, mh: 1.3, arx: -0.3, are: -0.9, alx: -0.3, ale: -0.9 }; c = CAM.coaster; ck = seg(t, T.coast, T.end); const dk = seg(t, T.coast, T.coast + 0.3); mug.position.y = 1.795 + (1 - eo(dk)) * 0.6
    if (t >= T.coastHit) { v.pills.push(['COASTER', 0, back(seg(t, T.coastHit, T.coastHit + 0.2)), 'good']); shake = (1 - seg(t, T.coastHit, T.coastHit + 0.25)) * 0.4 }
  }
  applyPose({ ...q, tx: q.tx + breathe })
  setCam(c[0], c[1], c[2], eo(ck) * 0.6 + ck * 0.4, 0.07, shake)
  lid.rotation.x = lidA
  copier.visible = c === CAM.film
  docBody.color.set(docMode === 2 ? 0x15161a : 0xffffff)
  // light and mood: flat tube light, then afternoon sun through the shop window
  wallMat.color.set(0xcdd4dc).lerp(new THREE.Color(0xf6e3c8), good); wallMat2.color.set(0xc3cad3).lerp(new THREE.Color(0xecd7b8), good)
  sun.color.set(0xe6edff).lerp(new THREE.Color(0xffd9a8), good); sun.intensity = lerp(1.4, 2.0, good); hemi.intensity = lerp(1.08, 1.2, good)
  paneMat.color.set(0xbfd0e0).lerp(new THREE.Color(0xffe3b0), good); scene.background.set(0xd3d9df)
  glow.position.set(2.0, 2.1, -1.55); glow.intensity = glowOn * 2.2
  lidG.material.opacity = good
  hand1.rotation.z = -t * 0.2; hand2.rotation.z = -t * 1.5
  drawLaptop(t); if (phoneMode) drawPhone(phoneMode, t); if (docMode >= 0) drawDoc(docMode, t)
}

/*SHARED_UI*/
// The four chores the brand's email asks for.
function chores(t) {
  const inK = back(seg(t, T.todo, T.todo + 0.2)); if (inK <= 0) return
  const w = 640, rowH = 88, h = 36 + rowH * 4, x0 = CX - w / 2, y0 = SAFE.top + 6
  g.save(); g.translate(CX, y0 + h / 2); g.scale(inK, inK); g.translate(-CX, -(y0 + h / 2))
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 40; g.shadowOffsetY = 16; g.fillStyle = CONFIG.card; g.beginPath(); g.roundRect(x0, y0, w, h, 36); g.fill(); g.shadowColor = 'transparent'
  CONFIG.chores.forEach((s, i) => { const k = back(seg(t, T.steps[i] - 0.08, T.steps[i] + 0.14)); if (k <= 0) return; const y = y0 + 18 + rowH * i + rowH / 2
    g.save(); g.translate(x0 + 72, y); g.scale(k, k); g.fillStyle = CONFIG.bad; g.beginPath(); g.arc(0, 0, 28, 0, 7); g.fill(); g.fillStyle = '#0b0c10'; g.font = '800 32px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), 0, 2); g.restore()
    g.globalAlpha = clamp(k); g.fillStyle = '#fff'; g.font = '700 50px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(s, x0 + 126, y + 3); g.globalAlpha = 1 })
  g.restore()
}
function overlay(t) {
  g.clearRect(0, 0, W, H); const v = view
  if (v.dim) { g.fillStyle = `rgba(8,8,16,${v.dim})`; g.fillRect(0, 0, W, H) }
  if (t < T.end + 0.4) {
    if (v.coin) coin(v.coin[0], v.coin[1], v.coin[2], v.coin[3])
    if (v.chores != null) chores(v.chores)
    for (const p of v.pills) pill(p[0], p[1], p[2], p[3])
    if (v.stamp) stamp(v.stamp[0], v.stamp[1], v.stamp[2], v.stamp[3], v.stamp[4])
    captions(t)
    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.font = '600 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.fillText(CONFIG.site.toUpperCase(), CX, H * CONFIG.capY + 190); g.shadowColor = 'transparent'; g.globalAlpha = 1
  }
  const fl = Math.max(v.flash, (1 - seg(t, T.end, T.end + 0.3)) * seg(t, T.end - 0.12, T.end)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H) }
  endCard(t)
}
window.render = (t) => { t = clamp(t, 0, T.dur); state(t); R.render(scene, cam); overlay(t) }
window.render(0); window.__rdy()
if (!Q.get('render')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % T.dur); requestAnimationFrame(loop) }; loop() }
})()
