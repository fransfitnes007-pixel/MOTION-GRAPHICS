<!doctype html>
<html><head><meta charset="utf-8"><title>LED dot rainbow word</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.led{position:absolute;inset:0;background:#000}
.led .dots{position:absolute;inset:0;background-image:radial-gradient(circle,#2a2a2e 2.2px,transparent 3px);background-size:18px 18px}
.led .glow{position:absolute;inset:-40%;background:conic-gradient(from 0deg at 50% 50%,#ff2e97,#ff7a3d,#ffd23d,#38bdf8,#7c3aed,#ff2e97);-webkit-mask-image:radial-gradient(circle,#000 2.4px,transparent 3.2px);mask-image:radial-gradient(circle,#000 2.4px,transparent 3.2px);-webkit-mask-size:18px 18px;mask-size:18px 18px;opacity:.9;transform-origin:50% 50%}
.word{position:absolute;white-space:nowrap;font-weight:600;letter-spacing:-.02em;transform-origin:50% 50%}
.mark{position:absolute;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#f4f6fa,#8a93a3 55%,#e8ecf2);color:#0b0b10;font-weight:800;filter:drop-shadow(0 0 30px rgba(56,189,248,.55))}
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 3
window.DUR = DUR
const at = (e, x, y, extra = '') => S(e, { left: px(x), top: px(y), transform: `translate(-50%,-50%) ${extra}` })
const wordIn = (e, t, t0, x, y, dur = .22) => { const q = spring(seg(t, t0, t0 + dur * 2.2), 8, 12); S(e, { opacity: clamp(q * 1.6), left: px(x), top: px(y), transform: `translate(-50%,-50%) translateY(${(1 - q) * 30}px) scale(${.7 + .3 * q})` }) }

const bgLed = el('div', 'led'); el('div', 'dots', bgLed); const ledGlow = el('div', 'glow', bgLed)
// The source layer used inset:-40%, which uncovers the stage edges at some angles. A square as wide as the stage diagonal never does.
const GS = Math.hypot(W, H) * 1.12; S(ledGlow, { inset: 'auto', width: px(GS), height: px(GS), left: px(CX - GS / 2), top: px(CY - GS / 2) })
const but = el('div', 'word', stage, 'But,'); S(but, { fontSize: px(118 * K), color: '#fff', fontWeight: 700 })
const whatif = el('div', 'word', stage, 'what if'); S(whatif, { fontSize: px(118 * K), color: '#fff', fontWeight: 400 })
const mark = el('div', 'mark', stage, 'Y'/*brand-initial*/); S(mark, { width: px(150 * K), height: px(150 * K), fontSize: px(92 * K) })

// Words land at: But at 0, what at +.02, if at +.22. Slowed here so it reads on a loop.
const T_BUT = .3, T_WHAT = .55, T_IF = .85

function render(t) {
  S(ledGlow, { transform: `rotate(${t * 60}deg) scale(${1 + .05 * Math.sin(t * 8)})` })
  vis(but, t >= T_BUT); wordIn(but, t, T_BUT, CX - (TALL ? 230 : 250) * K, CY, .15)
  vis(whatif, t >= T_WHAT); wordIn(whatif, t, T_WHAT, CX + 20 * K, CY, .15)
  vis(mark, t >= T_IF)
  if (t >= T_IF) { const q = spring(seg(t, T_IF, T_IF + .45), 7, 12); at(mark, CX + (TALL ? 290 : 310) * K, CY - 8, `scale(${q}) rotate(${(1 - q) * -40}deg)`) }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
