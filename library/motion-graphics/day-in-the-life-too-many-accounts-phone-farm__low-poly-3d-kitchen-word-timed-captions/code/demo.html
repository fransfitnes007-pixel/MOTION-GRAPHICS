// ---------- 2D layer: captions, pills, stamps, list, end card
const SAFE = CONFIG.safe, CX = (SAFE.left + SAFE.right) / 2

}

  g.save(); g.translate(W * xs, H * ys); g.shadowColor = 'rgba(255,255,255,.55)'; g.shadowBlur = 70; g.drawImage(G_IMG, -w / 2, -h / 2, Math.max(2, w), h); g.restore()

function captions(t) {
  let gi = -1; for (let i = 0; i < GROUPS.length; i++) { if (t >= WORDS[GROUPS[i][0]][1] - 0.04) gi = i }

// Six campaign chips she says yes to, three by two.
function chips(t) {

  for (let i = 0; i < 6; i++) { const t0 = T.yes + 0.25 + i * 0.2, k = back(seg(t, t0, t0 + 0.2)); if (k <= 0) continue; const cx = x0 + (i % 3) * (cw + gx) + cw / 2, cy = y0 + Math.floor(i / 3) * (ch + gy) + ch / 2

    g.fillStyle = hex(CONFIG.apps[i]); g.beginPath(); g.roundRect(-cw / 2 + 18, -30, 60, 60, 16); g.fill(); g.fillStyle = '#fff'; g.font = '700 34px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('Brand ' + (i + 1), -cw / 2 + 92, -12)

function checklist(t) {

  CONFIG.steps.forEach((s, i) => { const y = y0 + 20 + rowH * i + rowH / 2, on = t >= hits[i], k = back(seg(t, hits[i], hits[i] + 0.2))
    g.beginPath(); g.arc(x0 + 74, y, 30, 0, 7); g.fillStyle = on ? CONFIG.good : '#2a2b31'; g.fill()
    if (on) { g.save(); g.translate(x0 + 74, y); g.scale(k, k); g.fillStyle = '#0b0c10'; g.font = '800 38px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('✓', 0, 2); g.restore() }
    else { g.fillStyle = CONFIG.muted; g.font = '700 32px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), x0 + 74, y + 2) }
    g.fillStyle = on ? CONFIG.bright : CONFIG.muted; g.font = '700 52px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(s, x0 + 130, y + 2) })
  g.restore()
}
function overlay(t) {

    if (v.stamp) stamp(v.stamp[0], v.stamp[1], v.stamp[2], v.stamp[3], v.stamp[4])
    if (v.list != null) checklist(v.list)

    g.globalAlpha = 0.55; g.fillStyle = '#fff'; g.font = '600 30px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 8; g.fillText(CONFIG.site.toUpperCase(), CX, H * CONFIG.capY + 190); g.shadowColor = 'transparent'; g.globalAlpha = 1
  }
  const fl = Math.max(v.flash, (1 - seg(t, T.end, T.end + 0.3)) * seg(t, T.end - 0.12, T.end)); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H) }
