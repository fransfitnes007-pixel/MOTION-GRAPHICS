<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark slam with shock ring</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.dots{position:absolute;inset:-120px;background-image:radial-gradient(rgba(20,16,40,.10) 1.3px,transparent 1.6px);background-size:34px 34px}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}

.line{position:absolute;white-space:nowrap;line-height:1;letter-spacing:-.045em;font-weight:800}
.line .w{display:inline-block;will-change:transform,filter,opacity}
.grad{background:linear-gradient(100deg,#4338ca 0%,#5b5ce6 45%,#8b5cf6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradL{background:linear-gradient(100deg,#a5b4fc 0%,#c4b5fd 60%,#e9d5ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.wm{position:absolute;display:grid;place-items:center;font-weight:900;letter-spacing:-.06em;line-height:1;white-space:nowrap}
.wm .base{background:linear-gradient(180deg,#f4f6fa 0%,#8a93a3 48%,#2a2f3a 52%,#cfd6e2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 10px rgba(20,16,40,.25));font-style:italic}
.wm .shine{position:absolute;inset:0;display:grid;place-items:center;color:transparent;font-style:italic;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,1) 50%,transparent 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;mix-blend-mode:screen}
.wm.dk .base{background-image:linear-gradient(180deg,#ffffff 0%,#a8b0c2 50%,#e8ecf5 100%);filter:drop-shadow(0 0 24px rgba(165,180,252,.35))}
.gmark{position:absolute;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#f4f6fa,#8a93a3 55%,#e8ecf2);color:#0b0b10;font-weight:900;box-shadow:0 10px 30px -8px rgba(20,16,40,.35)}
.shock{position:absolute;border-radius:50%;border:3px solid rgba(91,92,230,.5);box-shadow:0 0 60px rgba(91,92,230,.35)}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across this library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 2.2
window.DUR = DUR

const bgL = el('div', 'abs'); S(bgL, { left: 0, top: 0, width: W + 'px', height: H + 'px', background: '#f4f4f6' })
el('div', 'dots', bgL)
const orbs = [
  { c: 'rgba(91,92,230,.26)', s: 900, x: 280, y: 100, sp: .09 }, { c: 'rgba(96,165,250,.24)', s: 820, x: 1300, y: 520, sp: .07 },
  { c: 'rgba(236,72,153,.12)', s: 700, x: 900, y: 760, sp: .11 }, { c: 'rgba(148,163,184,.28)', s: 600, x: 1500, y: -120, sp: .06 },
].map((o) => { const e = el('div', 'orb', bgL); S(e, { width: o.s * K + 'px', height: o.s * K + 'px', background: `radial-gradient(closest-side, ${o.c}, transparent)` }); return { ...o, e } })
function bgLight(t) { for (const o of orbs) S(o.e, { left: ((o.x + Math.sin(t * o.sp * 6 + o.s) * 120) * W / 1920) + 'px', top: ((o.y + Math.cos(t * o.sp * 5 + o.x) * 90) * H / 1080) + 'px' }) }

const eio5 = (x) => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2


function line(words, { size = 140, weight = 800, color = '#0b0b10', y = CY, gap = .26 } = {}) {
  const P = typeof HOST === 'undefined' ? stage : HOST, LW = typeof HOST === 'undefined' ? W : 1920     // HOST is the 1920x1080 frame when a demo uses one
  const L = el('div', 'line', P)
  S(L, { fontSize: size + 'px', fontWeight: weight, color, top: (y - size / 2) + 'px', left: '0', width: LW + 'px', textAlign: 'center' })
  L.ws = words.map((w, i) => { const s = el('span', 'w' + (w.g ? (color === '#fff' ? ' gradL' : ' grad') : ''), L); s.textContent = w.t; if (i < words.length - 1) s.style.marginRight = gap + 'em'; s.at = w.at; return s })
  return L
}
function wordsIn(L, t, dur = .42) {
  for (const s of L.ws) {
    const p = eo5(seg(t, s.at - .04, s.at - .04 + dur))
    s.style.opacity = p; s.style.filter = `blur(${(1 - p) * 16}px)`
    s.style.transform = `translateY(${(1 - p) * .38}em) scale(${.92 + .08 * p})`
  }
}
function wordsOut(L, t, t0, dir = -1, dur = .3) {
  L.ws.forEach((s, i) => {
    const q = ei(seg(t, t0 + i * .035, t0 + i * .035 + dur)); if (q <= 0) return
    s.style.opacity = 1 - q; s.style.filter = `blur(${q * 14}px)`; s.style.transform = `translateY(${dir * q * .45}em) scale(${1 - .05 * q})`
  })
}


function wordmark(parent, text, size, cls = '') { const w = el('div', 'wm ' + cls, parent); w.style.fontSize = size + 'px'; w.innerHTML = '<span class="base"></span><span class="shine"></span>'; w.querySelector('.base').textContent = text; w.querySelector('.shine').textContent = text; w.shine = w.querySelector('.shine'); return w }

function camShake(t, at, amp = 10, dur = .35) { const p = seg(t, at, at + dur); if (p <= 0 || p >= 1) return [0, 0]; const d = (1 - p) * amp; return [Math.sin(t * 90) * d, Math.cos(t * 77) * d] }
const GK = .7                       // the moment the name is spoken (timed to the spoken name)
const L2 = line([{ t: 'This', at: .38 }, { t: 'is', at: .53 }], { size: 64 * K, weight: 600, color: '#6b6b7b', y: CY - 240 * K })
const g2 = el('div', 'gmark'); S(g2, { width: px(160 * K), height: px(160 * K), fontSize: px(100 * K), left: px(CX - 80 * K), top: px(CY - 180 * K) }); g2.textContent = 'B'
const wm = wordmark(stage, 'YourBrand', 190 * K); S(wm, { width: px(840 * K), height: px(400 * K), left: px(CX - 420 * K), top: px(CY + 140 * K - 200 * K) })
const shock = el('div', 'shock')
function render(t) {
  bgLight(t)
  wordsIn(L2, t, .34); wordsOut(L2, t, .87, -1, .2)
  const s = spring(seg(t, GK - .1, GK + .55), 8, 13), go = eio5(seg(t, 1.25, 1.67))     // go: tuck into the corner
  const [sx, sy] = camShake(t, GK, 9)
  S(wm, { opacity: clamp(seg(t, GK - .1, GK + .06)) * (1 - seg(t, 1.55, 1.67)), transform: `translate(${lerp(0, -(CX - 80), go) + sx}px, ${lerp(0, -(CY + 140 * K - 120), go) + sy}px) scale(${(1.5 - .5 * s) * lerp(1, .06, go)})`, filter: `blur(${(1 - clamp(s * 1.4)) * 14}px)` })
  wm.shine.style.backgroundPosition = `${lerp(130, -30, seg(t, GK + .1, GK + .8))}% 0`
  const gs = spring(seg(t, GK - .2, GK + .4), 6, 9)
  S(g2, { opacity: clamp(gs * 1.3) * (1 - seg(t, 1.45, 1.6)), transform: `translate(${lerp(0, -(CX - 132), go)}px, ${lerp(0, -(CY - 100 * K - 120), go)}px) rotateY(${(1 - eio(seg(t, GK - .2, GK + .7))) * 360}deg) scale(${(.6 + .4 * gs) * lerp(1, .4, go)})` })
  const p = eo(seg(t, GK, GK + .9)), d = (400 + p * 1600) * K
  S(shock, { width: px(d), height: px(d), left: px(CX - d / 2), top: px(CY + 100 * K - d / 2), opacity: (1 - p) * (t > GK ? 1 : 0) })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
