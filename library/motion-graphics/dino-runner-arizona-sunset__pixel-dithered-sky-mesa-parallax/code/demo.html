<!doctype html>
<html><head><meta charset="utf-8"><title>Dino runner, Arizona sunset</title>
<!-- A short video in two shapes (1080x1920 and 1920x1080). The product is the dino, a bad launch is the cactus, the desert is a sunset.
     Every frame is a pure function of time: window.render(t). URL params: ?w=1080&h=1920&render=1. Everything you would change is in CONFIG. -->
<style>

</style></head><body><div id="stage"><canvas id="c"></canvas></div>
<script>window.READY=new Promise(r=>{window.__rdy=r})</script>
<script src="brand-assets.js"></script>
<script>
(async () => {
'use strict'
const CONFIG = {
  brandTag: 'YOUR PRODUCT',               // label over the dino
  cactusTag: 'BAD LAUNCH',             // label over the first cactus
  fails: ['SIGNUPS STALL', 'BUDGET BURNS', 'SHELVED'], // the three that end the run
  restartWord: 'NEW IDEA',             // counts up through the restart montage
  wins: ['DAY 1', 'DAY 2', 'DAY 3', 'LAUNCHED', 'GROWING'], // ticks in the endless run

  steps: [[22.26, '1 CLICK'], [24.1, 'PROJECT BUILT'], [25.3, 'TESTED'], [26.2, 'RUNS ON ITS OWN'], [28.44, '3 DAYS FLAT'], [30.0, 'CLEAR CHECKLIST'], [32.94, '0 BAD LAUNCHES'], [34.2, '0 RESTARTS']],
  throughLine: 'RUNNING THROUGH YOURBRAND',
  endLines: ['Keep going.', 'Never stop.'],
  site: 'yourbrand.com',
  // Type, pills and logo stay in the brand's dark theme. Only the backdrop is the sunset.
  bright: '#ffffff', card: '#161619', muted: '#a1a1aa', silver: '#d4d4d8', dark: '#0b0c10',
  // The Arizona sunset, top of the sky to the horizon, then the same sky at dusk for the YourBrand half.
  sunset: ['#1a0a38', '#35104f', '#641a63', '#a3285f', '#d9414a', '#f46a33', '#ff9a35', '#ffc65a'],
  dusk: ['#0a0520', '#170838', '#33104f', '#641a66', '#a52a62', '#dd4d48', '#f47a36', '#ffab45'],
  floor: ['#3a1638', '#241028', '#150a1c', '#0a0510'],   // desert floor, horizon to the bottom of the frame
  sun: ['#fff3b0', '#ffd670', '#ff9d4a'],
  mesaFar: ['#8e3566', '#5a2262'], mesaNear: ['#4a1a4f', '#2c1038'], // [sunset, dusk]
  shade: '#170b20', rim: '#ffb057',       // silhouettes and the light on their edge
  speck: '#7a3d6e', cloud: ['#ff8f7a', '#d9486b', '#8c2a73'],
  speed1: 125, speed2: 270,               // game pixels per second, before and with YourBrand
  // Short-video apps cover the right edge (buttons) and the bottom (caption, profile): keep type inside this box.
  safe: { left: 70, right: 940, top: 250, bottom: 1480 },
}
const WORDS = [[0.0, 0.28, "Every"], [0.28, 0.54, "maker"], [0.54, 0.9, "launching"], [0.9, 1.08, "new"], [1.08, 1.4, "projects"], [1.4, 1.62, "is"], [1.62, 1.88, "playing"], [1.88, 2.14, "this"], [2.14, 2.38, "game."], [2.94, 3.1, "You're"], [3.1, 3.24, "the"], [3.24, 3.5, "dino."], [4.1, 4.26, "The"], [4.26, 4.58, "cactus"], [4.58, 4.9, "is"], [4.9, 5.12, "a"], [5.12, 5.32, "bad"], [5.32, 5.74, "launch."], [6.12, 6.24, "You"], [6.24, 6.36, "get"], [6.36, 6.52, "lucky"], [6.52, 6.9, "once."], [7.32, 7.42, "You"], [7.42, 7.54, "get"], [7.54, 7.76, "lucky"], [7.76, 8.12, "twice."], [8.7, 8.98, "Then"], [8.98, 9.1, "the"], [9.1, 9.28, "signups"], [9.28, 9.64, "stall,"], [10.0, 10.1, "the"], [10.1, 10.24, "budget"], [10.24, 10.6, "burns,"], [10.92, 11.06, "and"], [11.06, 11.16, "the"], [11.16, 11.44, "project"], [11.44, 11.7, "gets"], [11.7, 12.22, "shelved."], [12.76, 12.88, "Game"], [12.88, 13.28, "over."], [13.78, 14.06, "So"], [14.06, 14.36, "you"], [14.36, 14.68, "restart."], [15.3, 15.4, "New"], [15.4, 15.7, "idea."], [16.26, 16.48, "Same"], [16.48, 16.78, "bad"], [16.78, 17.26, "launch."], [17.54, 17.92, "Every"], [17.92, 18.34, "single"], [18.34, 18.78, "time."], [19.34, 19.54, "Now"], [19.54, 19.74, "watch"], [19.74, 19.98, "the"], [19.98, 20.22, "same"], [20.22, 20.56, "game,"], [20.82, 20.98, "running"], [20.98, 21.3, "through"], [21.3, 21.74, "YourBrand."], [22.26, 22.5, "One"], [22.5, 22.74, "click,"], [22.74, 23.06, "done"], [23.06, 23.24, "inside"], [23.24, 23.4, "the"], [23.4, 23.68, "app."], [24.02, 24.18, "It"], [24.18, 24.48, "builds"], [24.48, 24.68, "the"], [24.68, 25.04, "project,"], [25.3, 25.58, "checks"], [25.58, 25.7, "it"], [25.7, 25.9, "over,"], [26.08, 26.26, "and"], [26.26, 26.42, "runs"], [26.42, 26.62, "the"], [26.62, 27.02, "entire"], [27.02, 27.46, "process"], [27.46, 27.7, "on"], [27.7, 27.84, "its"], [27.84, 28.1, "own."], [28.44, 28.78, "Three"], [28.78, 29.06, "days"], [29.06, 29.56, "flat."], [29.98, 30.48, "Following"], [30.48, 30.74, "a"], [30.74, 31.12, "clear"], [31.12, 31.62, "checklist,"], [31.86, 32.02, "step"], [32.02, 32.24, "by"], [32.24, 32.54, "step."], [32.94, 33.18, "No"], [33.18, 33.42, "bad"], [33.42, 33.8, "launches."], [34.2, 34.32, "Not"], [34.32, 34.74, "one"], [34.74, 35.28, "restart."], [35.96, 36.26, "YourBrand."], [36.82, 36.98, "Keep"], [36.98, 37.68, "going."], [38.06, 38.18, "Never"], [38.18, 38.52, "stop."]]
const Q = new URLSearchParams(location.search), W = +(Q.get('w') || 1080), H = +(Q.get('h') || 1920)
const stage = document.getElementById('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px'
const cv = document.getElementById('c'); cv.width = W; cv.height = H
const X = cv.getContext('2d')
// Two layouts: tall 1080x1920 for vertical feeds, wide 1920x1080 for landscape players.
const WIDE = W > H, DW = WIDE ? 1920 : 1080, DH = WIDE ? 1080 : 1920
if (WIDE) CONFIG.safe = { left: 70, right: 1850, top: 40, bottom: 1040 }
const CXM = (CONFIG.safe.left + CONFIG.safe.right) / 2, CAPY = WIDE ? 968 : 1400, TITLEY = WIDE ? 56 : 330
const K = Math.min(W / DW, H / DH), OX = (W - DW * K) / 2, OY = (H - DH * K) / 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3), back = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2)
const rng = (s) => () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const mix = (a, b, k) => { const A = hex(a), B2 = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B2[i] - v) * k)).join(',')})` }
const img = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src })
const [gDark, gLight, wordLight] = await Promise.all([BRAND_ASSETS.MARK_DARK, BRAND_ASSETS.MARK_LIGHT, BRAND_ASSETS.WORD_LIGHT].map(img))
try { await Promise.all([document.fonts.load("700 40px SFD"), document.fonts.load("600 40px SFD")]) } catch (e) {}

// ---------- the game, drawn small and scaled up 5x with hard pixels
const GW = WIDE ? 384 : 216, GH = 150, S = 5, BY = WIDE ? 150 : 560, GROUND = 118, DX = WIDE ? 70 : 26
const g = document.createElement('canvas'); g.width = GW; g.height = GH
const G = g.getContext('2d'); G.imageSmoothingEnabled = false
const DINO = ['............########..','...........##########.','...........##.#######.','...........##########.','...........##########.','...........#####......','...........########...','#.........#####.......','#........######.......','##.....#########......','###...##########.#....','################......','################......','.##############.......','..############........','...##########.........','....########..........','.....###.###..........','.....##...##..........','.....#....#...........','.....##...##..........']
function dinoFill(x, y, color, frame) {
  G.fillStyle = color
  DINO.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') { if (r >= 18 && frame === 1 && c < 8) continue; if (r >= 18 && frame === 2 && c >= 8) continue; G.fillRect(x + c, y + r, 1, 1) } })
}
// A one-pixel edge in another colour keeps the dino readable on any part of the sky.
function dino(x, y, color, frame, dead, edge) {
  if (edge) for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) dinoFill(x + ox, y + oy, edge, frame)
  dinoFill(x, y, color, frame)
  if (dead) { G.fillStyle = edge || color; G.fillRect(x + 12, y + 1, 4, 4); G.fillStyle = color; G.fillRect(x + 12, y + 1, 1, 1); G.fillRect(x + 15, y + 1, 1, 1); G.fillRect(x + 13, y + 2, 2, 2); G.fillRect(x + 12, y + 4, 1, 1); G.fillRect(x + 15, y + 4, 1, 1) }
}
function cactusFill(x, h, color) {
  G.fillStyle = color
  G.fillRect(x, GROUND - h, 5, h); G.fillRect(x + 1, GROUND - h - 1, 3, 1)
  const a = Math.round(h * 0.45)
  G.fillRect(x - 4, GROUND - a - 6, 2, 7); G.fillRect(x - 4, GROUND - a, 4, 2)
  G.fillRect(x + 7, GROUND - a - 10, 2, 8); G.fillRect(x + 5, GROUND - a - 3, 4, 2)
}
function cactus(x, h, color, edge) {
  x = Math.round(x)
  if (edge) for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1]]) { G.save(); G.translate(ox, oy); cactusFill(x, h, edge); G.restore() }
  cactusFill(x, h, color)
}
const R0 = rng(11), SPECK = Array.from({ length: 90 }, () => [R0() * 2000, 3 + R0() * 8, 1 + Math.floor(R0() * 3)])
function ground(scroll, line, speck) {
  G.fillStyle = speck
  for (const [x, y, w] of SPECK) { const px = ((x - scroll) % 2000 + 2000) % 2000; if (px < GW) G.fillRect(Math.round(px), GROUND + y, w, 1) }
  G.fillStyle = line; G.fillRect(0, GROUND, GW, 1)
}
const JUMP = 0.56, jumpY = (t, at) => { const p = (t - at) / JUMP + 0.5; return p > 0 && p < 1 ? 46 * 4 * p * (1 - p) : 0 }

// ---------- timeline, from the voiceover's word times
const T = { tagDino: 2.95, tagCactus: 4.1, j1: 6.7, j2: 7.92, fail: [9.1, 10.1, 11.7], hit: 12.76, restart: 13.78, part2: 19.32, slam: [17.54, 17.92, 18.34, 19.25], wall: 35.5, end: 35.75, dur: 40 }
const s1 = CONFIG.speed1, s2 = CONFIG.speed2
const C1 = [[T.j1, 30], [T.j2, 34]].map(([t, h]) => ({ x: s1 * t + DX + 8, h }))
const TRIPLE = [0, 12, 24].map((o, i) => ({ x: s1 * T.hit + DX + 20 + o, h: 30 + (i === 1 ? 8 : 0) }))
// The restart montage: a run that ends in the same cactus, faster each time. The last three crashes land on EVERY, SINGLE, TIME.
const RUNS = [[13.85, 14.95], [15.2, 16.15], [16.4, 17.2], [17.3, 17.54], [17.62, 17.92], [18.0, 18.34]]
// The endless run: a jump every beat until the G.
const J2 = []; for (let t = T.part2 + 0.75, i = 0; t < T.wall - 0.5; t += 0.74 - 0.012 * Math.min(i, 8), i++) J2.push(t)
const C2 = J2.map((t, i) => ({ x: s2 * (t - T.part2) + DX + 8, h: 26 + (i * 7) % 14, double: i % 3 === 2 }))

// ---------- the desert: a dithered sky, a setting sun, two rows of mesas, all on one small canvas scaled 5x
const BW = DW / S, BH = DH / S, HY = BY / S + GROUND, SUNX = WIDE ? 262 : 150, SUNR = 30
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]]
function skyCanvas(stops) {
  const c = document.createElement('canvas'); c.width = BW; c.height = BH; const x = c.getContext('2d'), d = x.createImageData(BW, BH)
  const sky = stops.map(hex), fl = CONFIG.floor.map(hex)
  for (let y = 0; y < BH; y++) {
    const up = y < HY, list = up ? sky : fl
    const f = (up ? Math.pow(y / HY, WIDE ? 1.05 : 1.3) : Math.pow((y - HY) / (BH - HY), 0.55)) * (list.length - 1), i = Math.min(list.length - 2, Math.floor(f)), fr = f - i
    for (let px = 0; px < BW; px++) { const c2 = fr > (BAYER[y % 4][px % 4] + 0.5) / 16 ? list[i + 1] : list[i], o = (y * BW + px) * 4; d.data[o] = c2[0]; d.data[o + 1] = c2[1]; d.data[o + 2] = c2[2]; d.data[o + 3] = 255 }
  }
  x.putImageData(d, 0, 0); return c
}
const SKY1 = skyCanvas(CONFIG.sunset), SKY2 = skyCanvas(CONFIG.dusk)
const bgc = document.createElement('canvas'); bgc.width = BW; bgc.height = BH
const B = bgc.getContext('2d'); B.imageSmoothingEnabled = false
const R1 = rng(23), PER = 760
const STARS = Array.from({ length: 46 }, () => [Math.floor(R1() * BW), Math.floor(R1() * HY * 0.5), R1() * 6.3])
const STREAKS = Array.from({ length: 9 }, (_, i) => [R1() * PER, Math.round(HY - 34 - R1() * (WIDE ? 78 : 150)), 26 + Math.floor(R1() * 44), i % 3])
const mk = (n, wide) => Array.from({ length: n }, (_, i) => { const spire = R1() < 0.3; return [i * (PER / n) + R1() * 40, spire ? 3 : Math.round((wide ? 22 : 14) + R1() * 34), Math.round((spire ? 16 : 10) + R1() * (spire ? 14 : 16)), spire] })
const MESA_FAR = mk(5, true), MESA_NEAR = mk(4, false)
const SAGUARO = Array.from({ length: 7 }, () => R1() * PER)
const FSPECK = Array.from({ length: 70 }, () => [R1() * 2400, R1(), 2 + Math.floor(R1() * 5)])
const ridgeH = (wx, base) => base + Math.round(2 * Math.sin(wx * 0.045) + 1.5 * Math.sin(wx * 0.11 + 1))
function mesas(items, off, color, base) {
  off = Math.floor(off); B.fillStyle = color
  for (let x = 0; x < BW; x += 2) { const h = ridgeH(x + off, base); B.fillRect(x, HY - h, 2, h) }
  for (const [x0, w, h, spire] of items) {
    const px = Math.round(((x0 - off) % PER + PER) % PER - 100); if (px > BW + 12) continue
    const m = Math.round(h * 0.55), l = Math.round(h * 0.24)
    if (spire) { B.fillRect(px, HY - h, w, h); B.fillRect(px - 1, HY - m, w + 2, m); B.fillRect(px - 4, HY - l, w + 8, l) }
    else { B.fillRect(px, HY - h, w, h); B.fillRect(px + 2, HY - h - 1, w - 5, 1); B.fillRect(px - 2, HY - m, w + 4, m); B.fillRect(px - 6, HY - l, w + 12, l) }
  }
}
function backdrop(t, scroll, dusk) {
  B.globalAlpha = 1; B.drawImage(SKY1, 0, 0); if (dusk > 0) { B.globalAlpha = dusk; B.drawImage(SKY2, 0, 0) }
  if (dusk > 0) { B.fillStyle = '#fff'; for (const [x, y, ph] of STARS) { B.globalAlpha = dusk * (0.4 + 0.4 * Math.sin(t * 3 + ph)); B.fillRect(x, y, 1, 1) } }
  B.globalAlpha = 1
  const sy = Math.round(HY - 26 + 22 * clamp(t / T.wall))
  for (let dy = -SUNR; dy <= SUNR; dy++) { const y = sy + dy; if (y >= HY) break; const w = Math.floor(Math.sqrt(SUNR * SUNR - dy * dy)); B.fillStyle = CONFIG.sun[dy < -SUNR * 0.4 ? 0 : dy < SUNR * 0.2 ? 1 : 2]; B.fillRect(SUNX - w, y, w * 2, 1) }
  B.globalAlpha = 0.75
  for (const [x0, y, w, c] of STREAKS) { const px = Math.round(((x0 - scroll * 0.03 - t * 1.2) % PER + PER) % PER - 80); B.fillStyle = CONFIG.cloud[c]; B.fillRect(px, y, w, 1); B.fillRect(px + 5, y + 1, w - 12, 1); B.fillRect(px + 10, y - 1, Math.round(w * 0.45), 1) }
  B.globalAlpha = 1
  mesas(MESA_FAR, scroll * 0.05, mix(CONFIG.mesaFar[0], CONFIG.mesaFar[1], dusk), 5)
  const near = mix(CONFIG.mesaNear[0], CONFIG.mesaNear[1], dusk), off = Math.floor(scroll * 0.12 + 300)
  mesas(MESA_NEAR, off, near, 3)
  B.fillStyle = near
  for (const x0 of SAGUARO) { const px = Math.round(((x0 - off) % PER + PER) % PER - 40), y = HY - ridgeH(px + off, 3); B.fillRect(px, y - 7, 1, 7); B.fillRect(px - 2, y - 5, 1, 3); B.fillRect(px - 2, y - 3, 2, 1); B.fillRect(px + 2, y - 6, 1, 3); B.fillRect(px + 1, y - 4, 2, 1) }
  // Stones on the desert floor below the game strip; the deeper ones are longer and pass faster.
  B.fillStyle = '#4a2350'
  for (const [x, dp, w] of FSPECK) { const y = Math.round(HY + 34 + dp * (BH - HY - 38)), px = ((x - scroll * (1 + dp * 0.9)) % 2400 + 2400) % 2400; if (px < BW) { B.globalAlpha = 0.35 + 0.5 * dp; B.fillRect(Math.round(px), y, w + Math.round(dp * 5), 1) } }
  B.globalAlpha = 1
  return sy
}

function pill(text, cx, cy, size, bg, fg, a = 1, scale = 1) {
  if (a <= 0) return
  X.save(); X.globalAlpha = a; X.translate(cx, cy); X.scale(scale, scale)
  X.font = `${size < 34 ? 600 : 700} ${size}px SFD, -apple-system, system-ui, Helvetica Neue, Arial, sans-serif`; const w = X.measureText(text).width + size * 1.1, h = size * 1.75
  X.shadowColor = 'rgba(10,4,18,.45)'; X.shadowBlur = 24; X.shadowOffsetY = 6
  X.fillStyle = bg; X.beginPath(); X.roundRect(-w / 2, -h / 2, w, h, h / 2); X.fill(); X.shadowColor = 'transparent'
  if (bg !== CONFIG.bright) { X.strokeStyle = 'rgba(255,255,255,.16)'; X.lineWidth = 2; X.stroke() }
  X.fillStyle = fg; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(text, 0, size * 0.06); X.restore()
}
// Captions: three words at a time, the current one lit, hot words in pure white with a glow.
const CH = []; for (let i = 0; i < WORDS.length;) { let j = i; while (j < WORDS.length && j - i < 3 && !/[.,?!]$/.test(WORDS[j - 1 < i ? i : j - 1][2]) || j === i) j++; CH.push([i, j]); i = j }
const HOT = { bad: 1, yourbrand: 1, over: 1, restart: 1, shelved: 1 }
function captions(t) {
  const c = CH.find(([a, b]) => t >= WORDS[a][0] - 0.08 && t < WORDS[b - 1][1] + 0.28); if (!c || (t > T.slam[0] - 0.1 && t < T.slam[3])) return
  const ws = WORDS.slice(c[0], c[1]); X.font = '700 84px SFD, -apple-system, system-ui, Helvetica Neue, Arial, sans-serif'; X.textBaseline = 'middle'
  const sp = 20, widths = ws.map((w) => X.measureText(w[2]).width), total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1)
  const cxm = CXM; let x = cxm - total / 2
  const pop = back(seg(t, WORDS[c[0]][0] - 0.08, WORDS[c[0]][0] + 0.1))
  X.save(); X.translate(cxm, CAPY); X.scale(0.9 + 0.1 * pop, 0.9 + 0.1 * pop); X.translate(-cxm, -CAPY)
  ws.forEach((w, i) => { const on = t >= w[0] - 0.03, key = w[2].toLowerCase().replace(/[^a-z]/g, ''); X.textAlign = 'left'; X.fillStyle = on ? (HOT[key] ? CONFIG.bright : CONFIG.silver) : 'rgba(190,170,200,.42)'; X.shadowColor = on && HOT[key] ? 'rgba(255,255,255,.55)' : 'rgba(8,3,14,.9)'; X.shadowBlur = on && HOT[key] ? 26 : 14; X.fillText(w[2], x, CAPY); X.shadowBlur = 0; x += widths[i] + sp })
  X.restore()
}

function render(t) {
  t = ((t % T.dur) + T.dur) % T.dur
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, H)
  X.setTransform(K, 0, 0, K, OX, OY)
  const p2 = t >= T.part2, dusk = seg(t, T.part2 - 0.05, T.part2 + 0.6)
  // Before YourBrand everything is a silhouette with the sun on its edge. With it, the dino is white.
  const body = p2 ? CONFIG.bright : CONFIG.shade, edge = p2 ? CONFIG.shade : CONFIG.rim, line = p2 ? CONFIG.bright : CONFIG.rim
  G.clearRect(0, 0, GW, GH)
  let scroll, dy = 0, dead = false, over = false, restarts = 0, frame = 0
  const overlays = []
  if (t < T.restart) {
    const tt = Math.min(t, T.hit); scroll = s1 * tt; dead = t >= T.hit; over = dead
    dy = jumpY(tt, T.j1) + jumpY(tt, T.j2)
    ground(scroll, line, CONFIG.speck)
    C1.forEach((c) => cactus(c.x - scroll, c.h, CONFIG.shade, CONFIG.rim)); TRIPLE.forEach((c) => cactus(c.x - scroll, c.h, CONFIG.shade, CONFIG.rim))
