  $('edgeR').style.width = px(BD - 4 * SC); $('edgeR').style.height = px(BH - pad * 2); $('edgeR').style.left = px(BW - pad * 1.1 - (BD - 4 * SC)); $('edgeR').style.top = px(pad)
  $('edgeR').style.transform = `rotateY(90deg) translateZ(${0}px)`
  $('edgeB').style.width = px(BW - pad * 1.6); $('edgeB').style.height = px(BD - 4 * SC); $('edgeB').style.left = px(pad * 0.5); $('edgeB').style.top = px(BH - pad - (BD - 4 * SC))
  $('edgeB').style.transform = `rotateX(-90deg)`
  $('spine').style.width = px(BD); $('spine').style.height = px(BH); $('spine').style.transform = `rotateY(-90deg)`
  $('spine').querySelector('span').style.fontSize = px(BD * 0.42)
  $('front').style.width = px(BW); $('front').style.height = px(BH)
  // inside page text
  const pg = $('block').querySelector('.pg')
  pg.querySelector('.cn').style.cssText += `left:${BW * 0.1}px;top:${BH * 0.1}px;font-size:${BW * 0.028}px`
  pg.querySelector('.ch').style.cssText += `left:${BW * 0.1}px;top:${BH * 0.135}px;font-size:${BW * 0.062}px`
  const tx = pg.querySelector('.tx'); tx.style.cssText += `left:${BW * 0.1}px;top:${BH * 0.22}px;width:${BW * 0.78}px;font-size:${BW * 0.03}px`
  tx.textContent = 'The first paragraph of the book goes here, set in a typewriter face with a drop cap in the serif headline face.\n\nA second paragraph follows. The page is only there to be pushed into: the camera zooms until this page fills the frame.\n\nA third paragraph, so the page does not look empty.'
})()
function book(t, { x, y, s = 1, ry = -28, rx = 6, open = 0, a = 1, bob = 0 }) {
  if (a <= 0) { hide($('bookWrap'), $('bookShadow')); return }
  $('bookWrap').style.display = ''; $('bookShadow').style.display = ''
  $('bookWrap').style.opacity = a
  $('bookWrap').style.transform = `translate3d(${x - BW / 2}px,${y - BH / 2 + bob}px,0) scale(${s})`
  $('book').style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`
  $('front').style.transform = `rotateY(${-open * 168}deg)`
  const gl = $('front').querySelector('.gloss'); gl.style.transform = `translateX(${lerp(-BW, BW, (Math.sin(t * 0.9) + 1) / 2)}px)`
  const sw = BW * 1.6 * s, sh = BW * 0.5 * s
  $('bookShadow').style.width = px(sw); $('bookShadow').style.height = px(sh)
  $('bookShadow').style.transform = `translate(${x - sw / 2}px,${y + BH * 0.46 * s - sh / 2 + bob * 0.3}px)`
  $('bookShadow').style.opacity = a * 0.85
}

loadFonts('700 20px PF', '700 20px PFI', '20px Rye', '20px Vibes')
const SCH = { book: 0.2, setup: 8.0 }   // the book scene is 7.8s: slide in, tilt, cursor click opens the cover at +3.6s, push into the page at +5.6s
function sceneBook(t) {
  const t0 = SCH.book, tOpen = t0 + 3.6, tPush = t0 + 5.6, tEnd = SCH.setup
  if (t < t0 - 0.2 || t > tEnd + 0.1) { hide($('bookWrap'), $('bookShadow')); return }
  const kin = backS(p(t, t0, t0 + 1.2), 1.1)
  const openK = eio(p(t, tOpen, tOpen + 1.7))
  const push = ei(p(t, tPush, tEnd))
  const cx = V ? W / 2 : W * 0.5, cy = V ? H * 0.47 : H * 0.5
  const s0 = V ? (TR > 1.5 ? 0.95 : TR > 1.15 ? 0.8 : 0.66) : 1
  // during push-in, zoom into the open page (page center is at book center shifted)
  const pageCx = cx + (V ? 0 : BW * 0.02) * s0
  const s = s0 * lerp(1, 3.6, push)
  const x = lerp(cx, cx + (cx - pageCx) * 3, push) + (1 - kin) * (V ? 0 : 240 * SC) + (V ? 0.3 : 0.42) * BW * s0 * openK * (1 - push)
  const y = lerp(cy, cy + BH * 0.05 * s, push) + (1 - kin) * H * 0.55
  const ry = lerp(lerp(-62, -26, kin), lerp(-26, 0, eo(p(t, tOpen, tOpen + 1.7))), 1) + lerp(0, 0, push)
  const rx = lerp(10, 5, kin) * (1 - push)
  book(t, { x, y, s, ry, rx, open: openK, a: 1, bob: Math.sin(t * 1.6) * 8 * SC * (1 - push) })
  snd(tOpen, 'flip')
  // title headline under / above the book
  const ty = V ? cy + BH * s0 * 0.5 + 40 * SC : cy - BH * 0.5 - HF * 0.95
  slam($('h1'), 'The <i>Golden Title</i> on Silver Lane.', t, t0 + 0.75, { fs: (V ? 62 : 74) * SC, x: W / 2, y: ty, align: 'center', out: tOpen + 0.4, outD: 0.3 })
  // cursor clicks the cover to open it
  const px0 = cx + (V ? 160 : 190) * SC * s0, py0 = cy + (V ? 60 : 40) * SC
  cursor(t, [[tOpen - 1.3, px0 + 260 * SC, py0 + 220 * SC], [tOpen - 0.25, px0, py0], [tOpen + 0.6, px0, py0]], tOpen - 0.02)
  $('flash').style.opacity = 0.9 * p(t, tEnd - 0.25, tEnd) * (1 - p(t, tEnd, tEnd + 0.6))
}
function render(t) {
  ;['h1', 'bookWrap', 'bookShadow', 'cur', 'rip'].forEach((id) => ($(id).style.display = 'none'))
  $('flash').style.opacity = 0
  blobs(t, 1)
  sceneBook(t)
  // the next scene: the flash falls away over a photograph (sceneSetup does this in the full-length version)
  const tEnd = SCH.setup
  bg('house_restored', t, { t0: tEnd, out: Infinity, zoomFrom: 1.0, zoomTo: 1.08, dur: 4, grade: false })
  $('flash').style.opacity = Math.max(+$('flash').style.opacity || 0, 0.9 * (1 - p(t, tEnd, tEnd + 0.6)) * (t >= tEnd ? 1 : 0))
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
