<!doctype html>
<html><head><meta charset="utf-8"><title>Line mask text reveal</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10;color:#fff}
.fill{position:absolute;left:0;top:0;width:100%;height:100%}
.hl{position:absolute;left:0;width:100%;text-align:center;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.ln{position:relative;display:block;overflow:hidden;padding:0 .06em .1em;margin-bottom:-.02em}
.w{display:block;will-change:transform}
.acc{color:#a5b4fc}
.hair{position:absolute;left:8%;bottom:.08em;height:2px;width:84%;background:linear-gradient(90deg,transparent,rgba(165,180,252,.7),transparent);transform-origin:50% 50%}
.sub{position:absolute;left:0;width:100%;text-align:center;font-weight:500;color:#8c8ca6;letter-spacing:-.005em}
.sub .ln{display:inline-block}
.rule{position:absolute;height:4px;border-radius:2px;background:linear-gradient(90deg,#6d7bff,#9bf0ff)}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const back = (x, s = 1.9) => { const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2) }
const pr = (t, a, d) => seg(t, a, a + d)          // progress 0..1 of a move that starts at a and lasts d seconds
const DUR = 5.2
window.DUR = DUR
const bg = el('div', 'fill'); bg.style.background = 'radial-gradient(70% 60% at 50% 45%,#16162b 0%,#0b0b10 75%)'
const L = TALL ? ['Make', 'every line', 'land on', 'its own', 'beat.'] : ['Make every line', 'land on its own', 'beat.']
const FS = TALL ? 150 : 158
const hl = el('div', 'hl'); S(hl, { fontSize: px(FS) })
const lines = L.map((txt, i) => {
  const ln = el('span', 'ln', hl)
  const w = el('span', 'w', ln, /own|beat/.test(txt) && i >= L.length - 2 ? txt.replace(/(own|beat\.)/, '<span class="acc">$1</span>') : txt)
  const hair = el('i', 'hair', ln)
  return { ln, w, hair }
})
const hh = L.length * FS * 1.18, tot = hh + 110 * K, top0 = CY - tot / 2
S(hl, { top: px(top0) })
const sub = el('div', 'sub'); S(sub, { fontSize: px(34 * K), top: px(top0 + hh + 58 * K) })
const sl = el('span', 'ln', sub); const sw = el('span', 'w', sl, 'Each line rises out of its own mask.'); sw.style.display = 'inline-block'
const rule = el('div', 'rule'); S(rule, { top: px(top0 + hh + 20 * K) })
const T_IN = .35, T_OUT = 3.95

function render(t) {
  lines.forEach((q, i) => {
    const a = T_IN + i * .14, pI = eo5(pr(t, a, .95))
    const pO = ei(pr(t, T_OUT + i * .09, .6))
    const y = (1 - pI) * 108 - pO * 112
    q.w.style.transform = 'translateY(' + y.toFixed(2) + '%) rotate(' + ((1 - pI) * 5 - pO * 3).toFixed(2) + 'deg)'
    q.w.style.transformOrigin = '30% 100%'
    const hp = eo(pr(t, a - .05, .55)) * (1 - eio(pr(t, 4.2, .7)))
    S(q.hair, { opacity: hp * .55, transform: 'scaleX(' + eo(pr(t, a - .05, .6)) + ')' })
  })
  const sI = eo5(pr(t, 1.7, .9)), sO = ei(pr(t, T_OUT + .1, .55))
  sw.style.transform = 'translateY(' + ((1 - sI) * 110 - sO * 120).toFixed(2) + '%)'
  const rw = (TALL ? 240 : 300) * eo5(pr(t, 1.9, .8)) * (1 - eio(pr(t, T_OUT + .2, .6)))
  S(rule, { left: px(CX - rw / 2), width: px(rw) })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
