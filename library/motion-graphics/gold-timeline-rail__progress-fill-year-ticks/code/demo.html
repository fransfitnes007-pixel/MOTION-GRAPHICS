<!doctype html>
<html><head><meta charset="utf-8"><title>Gold timeline rail</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
@font-face{font-family:PF;src:url(fonts/PlayfairDisplay[wght].ttf);font-weight:400 900}
@font-face{font-family:PFI;src:url(fonts/PlayfairDisplay-Italic[wght].ttf);font-weight:400 900}
:root{--sf:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif}
html,body{background:#07080b}
#stage{background:#07080b;color:#f3f1ea;font-family:var(--sf)}
.blob{position:absolute;left:0;top:0;border-radius:50%;filter:blur(120px);will-change:transform}
.h{position:absolute;left:0;top:0;font-family:PF;font-weight:700;line-height:1.02;letter-spacing:-0.01em;white-space:nowrap}
.h .w{display:inline-block;white-space:pre}
.h i{font-family:PFI;font-style:normal;color:#e8b43a;margin-right:.1em}
.h .red{color:#d8463a}
.plate{position:absolute;left:0;top:0;transform-origin:50% 50%;border-radius:28px;overflow:hidden;box-shadow:0 80px 160px -50px rgba(0,0,0,.9),0 0 0 1.5px rgba(255,255,255,.1) inset;background:#111}
.plate .im{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:0;top:0;font-family:var(--sf);font-weight:500;color:#cfd2da;letter-spacing:.01em;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.cap b{color:#e8b43a;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-right:.7em}
.plate .edge{position:absolute;inset:0;border-radius:28px;box-shadow:0 0 0 1.5px rgba(255,255,255,.12) inset,0 30px 60px rgba(0,0,0,.4) inset}
#rail{position:absolute;left:0;top:0;background:rgba(255,255,255,.14);border-radius:3px}
#railfill{position:absolute;left:0;top:0;background:linear-gradient(90deg,#e8b43a,#f7d873);border-radius:3px;box-shadow:0 0 24px rgba(232,180,58,.6)}
.tick{position:absolute;left:0;top:0;transform-origin:50% 50%}
.tick .dot{position:absolute;border-radius:50%;background:#e8b43a;box-shadow:0 0 0 6px rgba(232,180,58,.18),0 0 30px rgba(232,180,58,.6)}
.tick .dot.red{background:#d8463a;box-shadow:0 0 0 6px rgba(216,70,58,.2),0 0 30px rgba(216,70,58,.7)}
.tick .yr{position:absolute;font-family:PF;font-weight:800;color:#fff;line-height:1;white-space:nowrap;letter-spacing:-0.02em}
.tick .lb{position:absolute;font-family:var(--sf);font-weight:500;color:#b9bcc6;white-space:nowrap;line-height:1.25}
/* placeholder photographs, pure CSS gradients (use real photos in practice) */
.im{position:absolute;left:0;top:0;display:block;transform-origin:50% 50%}
.im.house{background:
 linear-gradient(#ffc766,#ffc766) 31% 64%/3.4% 7% no-repeat,linear-gradient(#ffc766,#ffc766) 44% 64%/3.4% 7% no-repeat,linear-gradient(#ffb347,#ffb347) 57% 64%/3.4% 7% no-repeat,
 linear-gradient(#17120e,#17120e) 24% 70%/46% 3% no-repeat,linear-gradient(#3a2d22,#2a2018) 22% 58%/50% 24% no-repeat,
 linear-gradient(#1c1712,#1c1712) 0 80%/100% 20% no-repeat,
 linear-gradient(180deg,#27354d 0%,#4b5a75 46%,#8c7b69 62%,#3b2f26 62%)}
.im.room{background:
 linear-gradient(#fff3d6,#e8d3a8) 62% 18%/16% 40% no-repeat,linear-gradient(#2b1d14,#2b1d14) 12% 20%/14% 34% no-repeat,
 linear-gradient(#3b2a1e,#241810) 0 70%/100% 30% no-repeat,linear-gradient(90deg,#8e7c66,#a69580 60%,#7c6a55)}
.im.yard{background:linear-gradient(#e8eadc,#e8eadc) 62% 40%/10% 30% no-repeat,radial-gradient(ellipse at 45% 30%,#35502a 0 28%,transparent 29%),linear-gradient(180deg,#7fa3c6 0%,#b7c7cf 50%,#4f6b3a 50%,#2f4a24)}
.im.wall{background:radial-gradient(ellipse 12% 22% at 66% 66%,#120804 0 90%,transparent 92%),radial-gradient(circle at 66% 44%,#120804 0 5%,transparent 6%),linear-gradient(90deg,transparent 46%,rgba(30,14,4,.8) 46% 48%,transparent 48% 70%,rgba(30,14,4,.8) 70% 72%,transparent 72%),linear-gradient(135deg,#d98b3a,#a8591c 55%,#5a2d0e)}
.im.sepia{background:radial-gradient(ellipse 9% 30% at 30% 72%,#201710 0 90%,transparent 92%),radial-gradient(ellipse 9% 30% at 52% 72%,#2d2216 0 90%,transparent 92%),radial-gradient(circle at 30% 38%,#e6d7bd 0 4%,transparent 5%),radial-gradient(circle at 52% 38%,#e6d7bd 0 4%,transparent 5%),linear-gradient(180deg,#8f7f68,#5c4e3b)}
.im.portrait{background:radial-gradient(circle at 50% 36%,#d8cbb4 0 15%,transparent 16%),radial-gradient(ellipse 30% 28% at 50% 82%,#3a3128 0 90%,transparent 92%),linear-gradient(180deg,#6f6757,#4a4338)}
.im.plaque{background:linear-gradient(#5a5f66,#5a5f66) 14% 22%/72% 56% no-repeat,linear-gradient(135deg,#aab1ba,#7d848d)}
.blob{position:absolute;left:0;top:0;border-radius:50%;filter:blur(120px);will-change:transform}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>")}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across this library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 10.7
window.DUR = DUR
const V = H >= W                                   // vertical-ish layouts (9:16, 4:5, 1:1)
const SC = V ? W / 1080 : Math.min(W / 1920, H / 1080)   // design scale (the source calls it S; the template's S is the style helper)
const TR = V ? H / W : 0                         // 1.78 for 9:16, 1.25 for 4:5, 1 for 1:1 (the source calls it TALL)
const $ = (id) => document.getElementById(id)
const p = (t, a, b) => (b - a > 0 && isFinite(b - a) ? clamp((t - a) / (b - a)) : t >= a ? 1 : 0)
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const backS = (x, c1 = 2.4) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const SOUNDS = []   // {t,type}: cues can be dumped to build a soundtrack
const snd = (t, type) => { if (!SOUNDS.some((s) => s.t === t && s.type === type)) SOUNDS.push({ t, type }) }
// pre-load the fonts so offsetWidth measurements are right on the first frame drawn
const loadFonts = (...f) => f.forEach((x) => document.fonts.load(x))
const HF = (V ? 100 : 128) * SC    // headline font
const M = (V ? 72 : 110) * SC      // margin
function tf(el, o) {
  const { x = 0, y = 0, s = 1, sx, sy, r = 0, rx = 0, ry = 0, a = 1, z = 0, ox, oy } = o
  if (a <= 0.001) { el.style.display = 'none'; return }
  el.style.display = ''
  el.style.opacity = a
  if (ox !== undefined) el.style.transformOrigin = `${ox} ${oy}`
  el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotate(${r}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sx ?? s},${sy ?? s})`
}
const hide = (...els) => els.forEach((e) => (e.style.display = 'none'))
function setText(el, html) { if (el.dataset.k !== html) { el.innerHTML = html; el.dataset.k = html } }
// word-by-word slam: each word scales down from 1.35 and fades in, staggered
function tokenize(html) {
  // split into words, re-wrapping each word in whatever inline tags were open around it
  const parts = html.split(/(<\/?[a-z]+[^>]*>)/i).filter(Boolean), open = [], out = []
  for (const part of parts) {
    if (part.startsWith('</')) { open.pop(); continue }
    if (part.startsWith('<')) { open.push(part); continue }
    for (const w of part.split(/\s+/).filter(Boolean)) out.push(open.join('') + w + open.map((o) => '</' + o.match(/<([a-z]+)/i)[1] + '>').reverse().join(''))
  }
  return out
}
function slam(el, html, t, t0, { fs, x, y, w = 0.1, d = 0.45, out = Infinity, outD = 0.35, outDir = -1, align = 'left', color } = {}) {
  if (t < t0 || t > out + outD) { hide(el); return }
  el.style.display = ''; el.style.fontSize = px(fs); el.style.textAlign = align; if (color) el.style.color = color
  const key = html + '|' + fs
  if (el.dataset.k !== key) {
    el.innerHTML = tokenize(html).map((wd) => `<span class="w">${wd} </span>`).join('')
    el.dataset.k = key
  }
  const words = el.querySelectorAll('.w')
  words.forEach((sp, i) => {
    const k = eo(p(t, t0 + i * w, t0 + i * w + d))
    sp.style.opacity = k
    sp.style.transform = `translateY(${(1 - k) * 0.35 * fs}px) scale(${lerp(1.3, 1, k)})`
  })
  const ko = p(t, out, out + outD)
  const left = align === 'center' ? x - el.offsetWidth / 2 : align === 'right' ? x - el.offsetWidth : x
  tf(el, { x: left, y, a: 1 - ko, s: lerp(1, 0.96, ko), ox: '50%', oy: '50%' })
  if (ko > 0) el.style.transform += ` translateY(${outDir * ko * 40 * SC}px)`
}
function plate(el, t, { x, y, w, h, t0, out = Infinity, rx = 0, ry = 0, s = 1, zoom = 1, dir = 1, a = 1 }) {
  if (t < t0 || t > out + 0.5) { hide(el); return }
  const im = el.querySelector('.im')
  el.style.width = px(w); el.style.height = px(h); el.style.borderRadius = px(28 * SC)
  const ki = backS(p(t, t0, t0 + 0.75), 1.4), ko = p(t, out, out + 0.5)
  im.style.transform = `scale(${zoom + (t - t0) * 0.006})`
  tf(el, { x, y: y + (1 - ki) * 90 * SC * dir, s: lerp(0.86, 1, ki) * s * lerp(1, 0.94, ko), rx, ry, a: a * p(t, t0, t0 + 0.3) * (1 - ko), ox: '50%', oy: '50%' })
  if (t0 !== undefined) snd(t0, 'whoosh')
}
function caption(t, html, { x, y, t0, out = Infinity, fs = 24, align = 'left' }) {
  const el = $('cap1')
  if (t < t0 || t > out + 0.3) { hide(el); return }
  el.style.display = ''; setText(el, html); el.style.fontSize = px(fs * SC)
  const k = eo(p(t, t0, t0 + 0.5)), ko = p(t, out, out + 0.3)
  const left = align === 'center' ? x - el.offsetWidth / 2 : align === 'right' ? x - el.offsetWidth : x
  tf(el, { x: left, y: y + (1 - k) * 14 * SC, a: k * (1 - ko) })
}
// ---------- blobs ----------
function blobs(t, mood) {
  // mood: 0 dark/cold, 1 gold warm, 2 red danger
  const b1 = $('b1'), b2 = $('b2'), b3 = $('b3'), R = Math.max(W, H)
  const amp = (m) => (mood === m ? 1 : 0.35)
  ;[[b1, 0.9 * amp(1), 0.25, 0.3, 0.07], [b2, 0.8 * amp(0), 0.78, 0.7, 0.05], [b3, 0.9 * amp(2), 0.5, 0.95, 0.06]].forEach(([el, a, fx, fy, sp], i) => {
    const sz = R * (0.55 + 0.1 * i)
    el.style.width = el.style.height = px(sz)
    el.style.opacity = a * 0.9
    el.style.transform = `translate(${fx * W - sz / 2 + Math.sin(t * sp * 6 + i) * 0.08 * W}px,${fy * H - sz / 2 + Math.cos(t * sp * 5 + i) * 0.08 * H}px)`
  })
}

stage.insertAdjacentHTML('afterbegin', '<div class="blob" id="b1" style="background:#3a2a08"></div><div class="blob" id="b2" style="background:#0f1f3a"></div><div class="blob" id="b3" style="background:#4a1410"></div>')

stage.insertAdjacentHTML('beforeend', '<div class="h" id="h1"></div><div class="h" id="h2"></div><div class="plate" id="p1"><div class="im room"></div><div class="edge"></div></div><div class="plate" id="p2"><div class="im portrait"></div><div class="edge"></div></div><div class="plate" id="p3"><div class="im portrait"></div><div class="edge"></div></div><div class="cap" id="cap1"></div><div id="rail"></div><div id="railfill"></div><div id="ticks"></div>')
stage.insertAdjacentHTML('beforeend', '<div id="grain"></div><div id="vig"></div>')
loadFonts('700 20px PF', '800 20px PF', '700 20px PFI')
// The full scene runs 19 x r seconds (r = 1.13). Here it is compressed to 10.5s: every beat scales by r = (tEnd - t0) / 19.
const SCH = { timeline: 0, events: 10.5 }
function sceneTimeline(t) {
  const t0 = SCH.timeline, tEnd = SCH.events
  if (t < t0 || t > tEnd) { hide($('rail'), $('railfill'), $('ticks')); return }
  const r = (tEnd - t0) / 19
  const items = [
    { yr: '2012', lb: 'Company founded<br>in a garage', at: t0 + 0.5 },
    { yr: '2016', lb: 'First hire', at: t0 + 5.6 * r },
    { yr: '2021', lb: 'Series A raised', at: t0 + 8.4 * r },
    { yr: '2024', lb: 'The turning<br>point', at: t0 + 11.4 * r, red: true },
  ]
  const horiz = !V
  const rx0 = horiz ? M : W * 0.14, rx1 = horiz ? W - M : W * 0.14
  const ry0 = horiz ? H * 0.4 : H * 0.14, ry1 = horiz ? H * 0.4 : H * 0.5
  const thick = 6 * SC
  $('rail').style.display = $('railfill').style.display = $('ticks').style.display = ''
  if (horiz) { $('rail').style.width = px(rx1 - rx0); $('rail').style.height = px(thick); tf($('rail'), { x: rx0, y: ry0 - thick / 2, a: p(t, t0, t0 + 0.5) * (1 - p(t, tEnd - 0.5, tEnd)) }) }
  else { $('rail').style.width = px(thick); $('rail').style.height = px(ry1 - ry0); tf($('rail'), { x: rx0 - thick / 2, y: ry0, a: p(t, t0, t0 + 0.5) * (1 - p(t, tEnd - 0.5, tEnd)) }) }
  // progress: reaches tick i at items[i].at
  let prog = 0
  for (let i = 0; i < items.length - 1; i++) { const a = items[i].at, b = items[i + 1].at; if (t >= a) prog = lerp(i / (items.length - 1), (i + 1) / (items.length - 1), eio(p(t, a + 0.3, b))) }
  if (horiz) { $('railfill').style.width = px((rx1 - rx0) * prog); $('railfill').style.height = px(thick); tf($('railfill'), { x: rx0, y: ry0 - thick / 2, a: 1 - p(t, tEnd - 0.5, tEnd) }) }
  else { $('railfill').style.width = px(thick); $('railfill').style.height = px((ry1 - ry0) * prog); tf($('railfill'), { x: rx0 - thick / 2, y: ry0, a: 1 - p(t, tEnd - 0.5, tEnd) }) }
  const host = $('ticks')
  if (host.dataset.k !== 'tl' + SC) {
    host.innerHTML = items.map((it) => `<div class="tick"><div class="dot${it.red ? ' red' : ''}"></div><div class="yr">${it.yr}</div><div class="lb">${it.lb}</div></div>`).join('')
    host.dataset.k = 'tl' + SC
  }
  const ticks = host.querySelectorAll('.tick')
  ticks.forEach((el, i) => {
    el.style.display = ''
    const it = items[i], k = backS(p(t, it.at, it.at + 0.55), 1.8), ko = p(t, tEnd - 0.5, tEnd)
    const f = i / (items.length - 1)
    const x = horiz ? lerp(rx0, rx1, f) : rx0, y = horiz ? ry0 : lerp(ry0, ry1, f)
    const ds = 22 * SC
    const dot = el.querySelector('.dot'), yr = el.querySelector('.yr'), lb = el.querySelector('.lb')
    dot.style.width = dot.style.height = px(ds); dot.style.left = px(-ds / 2); dot.style.top = px(-ds / 2)
    yr.style.fontSize = px((horiz ? 86 : 96) * SC); lb.style.fontSize = px((horiz ? 26 : 28) * SC)
    if (horiz) {
      const up = true
      yr.style.left = px(-yr.offsetWidth / 2 + 0); yr.style.top = px(up ? -ds - 95 * SC - 0 : ds + 26 * SC)
      const lx = i === 0 ? 0 : i === items.length - 1 ? -lb.offsetWidth : -lb.offsetWidth / 2
      lb.style.left = px(lx); lb.style.top = px(up ? -ds - 95 * SC - lb.offsetHeight - 10 * SC : ds + 26 * SC + 100 * SC)
      lb.style.textAlign = i === 0 ? 'left' : i === items.length - 1 ? 'right' : 'center'
      if (i === 0) yr.style.left = px(-ds * 0.4); if (i === items.length - 1) yr.style.left = px(-yr.offsetWidth + ds * 0.4)
    } else {
      yr.style.left = px(ds * 1.6); yr.style.top = px(-yr.offsetHeight / 2 + 4 * SC)
      lb.style.left = px(ds * 1.6 + yr.offsetWidth + 22 * SC); lb.style.top = px(-lb.offsetHeight / 2 + 2 * SC)
      if (lb.offsetWidth + ds * 1.6 + yr.offsetWidth + 22 * SC + rx0 > W - M * 0.6) { lb.style.left = px(ds * 1.6); lb.style.top = px(yr.offsetHeight / 2 + 4 * SC) }
    }
    if (it.red) { const pulse = 1 + 0.12 * Math.sin((t - it.at) * 9); dot.style.transform = `scale(${pulse})` }
    tf(el, { x, y, s: lerp(0.6, 1, k), a: p(t, it.at, it.at + 0.2) * (1 - ko), ox: '0', oy: '0' })
    snd(it.at, 'click')
  })
  // Seaman & Achsa portraits (from the book's historic photos)
  const pw = (horiz ? 150 : 150) * SC, ph = pw * 1.34
  if (horiz) {
    plate($('p2'), t, { x: rx0 + 150 * SC, y: ry0 + 40 * SC, w: pw, h: ph, t0: t0 + 1.6, out: t0 + 13.9 * r, rx: 0, ry: 0, dir: -1 })
    plate($('p3'), t, { x: lerp(rx0, rx1, 2 / 3) + 150 * SC, y: ry0 + 40 * SC, w: pw, h: ph, t0: t0 + 9.4 * r, out: t0 + 13.9 * r, rx: 0, ry: 0, dir: -1 })
  } else {
    plate($('p2'), t, { x: W - M * 0.8 - pw, y: ry0 - ph * 0.3, w: pw, h: ph, t0: t0 + 1.6, out: tEnd - 0.4, rx: 0, ry: 0, dir: -1 })
    plate($('p3'), t, { x: W - M * 0.8 - pw, y: lerp(ry0, ry1, 2 / 3) - ph * 0.3, w: pw, h: ph, t0: t0 + 9.4 * r, out: tEnd - 0.4, rx: 0, ry: 0, dir: -1 })
  }
  // bedroom plate + the kicker lines
  const bAt = t0 + 14.2 * r
  if (horiz) plate($('p1'), t, { x: W * 0.57, y: H * 0.5, w: W * 0.38, h: W * 0.38 * 0.5625, t0: bAt, out: tEnd - 0.4, ry: -8, rx: 4, dir: 1 })
  else plate($('p1'), t, { x: W * 0.08, y: H * 0.74, w: W * 0.84, h: W * 0.84 * 0.5625, t0: bAt, out: tEnd - 0.4, ry: 0, rx: 6, dir: 1 })
  caption(t, '<b>Photo</b>Placeholder photo caption', { x: horiz ? W * 0.57 + W * 0.19 : W / 2, y: horiz ? H * 0.5 + W * 0.38 * 0.5625 + 18 * SC : H * 0.74 + W * 0.84 * 0.5625 + 16 * SC, t0: bAt + 0.6, out: tEnd - 0.4, fs: V ? 20 : 22, align: 'center' })
  slam($('h1'), 'The <span class="red">turning point.</span>', t, t0 + 14.6 * r, { fs: HF * (V ? 0.8 : 0.78), x: horiz ? M : W / 2, y: horiz ? H * 0.56 : H * 0.58, align: horiz ? 'left' : 'center', out: tEnd - 0.4, outD: 0.3 })
  slam($('h2'), '<i>Our</i> story.', t, t0 + 16.4 * r, { fs: HF * (V ? 0.8 : 0.78), x: horiz ? M : W / 2, y: horiz ? H * 0.56 + HF * 0.85 : H * 0.58 + HF * 0.8, align: horiz ? 'left' : 'center', out: tEnd - 0.4, outD: 0.3 })
  snd(t0 + 14.6 * r, 'thud'); snd(t0 + 16.4 * r, 'thud')
}
function render(t) {
  ;['h1', 'h2', 'cap1', 'p1', 'p2', 'p3'].forEach((id) => ($(id).style.display = 'none'))
  blobs(t, 1)
