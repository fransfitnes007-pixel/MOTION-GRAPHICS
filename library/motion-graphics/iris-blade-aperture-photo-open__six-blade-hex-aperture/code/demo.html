<!doctype html>
<html><head><meta charset="utf-8"><title>Iris blade aperture photo open</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @twoclipping's "Develop" launch film (revid.ai wall #8, 2.33s to 3.2s), using the build note in the
// public prompt (motionvideo.xyz twoclipping-221cab): "6 blades around a hexagonal aperture. Each blade is its two vertices,
// both edge extensions and the SHORT arc between them." A camera iris closes over a disc and snaps open onto a photo.
const CONFIG = {
  bg: '#ecede8',
  blade: ['#2b2b2e', '#1e1e21'],        // alternating blade tones
  seam: 'rgba(255,255,255,.16)',        // hairline between blades
  radius: 210,                          // disc radius at 1920 wide
  turn: 62,                             // degrees the blades rotate between closed and open
  t: { pop: .15, open: .75, close: 2.65, out: 3.3 },   // seconds
  openDur: .38, closeDur: .32,
  dur: 3.9,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 * .9 : W / 1920
stage.style.background = C.bg
const cv = document.createElement('canvas'); cv.width = W; cv.height = H; stage.appendChild(cv)
const g = cv.getContext('2d')
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }

// placeholder "photo": a dark room with an orange lit doorway and a small figure
function photo(R) {
  const gr = g.createRadialGradient(0, -R * .1, R * .05, 0, 0, R * 1.2)
  gr.addColorStop(0, '#5a2410'); gr.addColorStop(.45, '#24120c'); gr.addColorStop(1, '#0a0807')
  g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R)
  const dg = g.createLinearGradient(0, -R * .5, 0, R * .4)
  dg.addColorStop(0, '#ff8a3a'); dg.addColorStop(1, '#d4471a')
  g.fillStyle = dg; g.fillRect(-R * .16, -R * .5, R * .32, R * .86)
  g.fillStyle = 'rgba(255,120,50,.18)'; g.beginPath(); g.moveTo(-R * .16, R * .36); g.lineTo(R * .16, R * .36); g.lineTo(R * .55, R); g.lineTo(-R * .55, R); g.fill()
  g.fillStyle = '#120a08'; g.fillRect(-R * .03, R * .16, R * .06, R * .2); g.beginPath(); g.arc(0, R * .13, R * .035, 0, 7); g.fill()
}

// blade i: vertex P_i -> P_{i+1} -> extension of edge i to the rim -> short arc back to the extension of edge i-1 -> P_i
function iris(R, a, rot) {   // a = aperture circumradius, rot = radians
  const P = [], E = []
  for (let i = 0; i < 6; i++) { const th = rot + i * Math.PI / 3; P.push([a * Math.cos(th), a * Math.sin(th)]) }
  for (let i = 0; i < 6; i++) {   // extend edge P_i -> P_{i+1} beyond P_{i+1} until it meets the circle
    const p = P[(i + 1) % 6], q = P[i], dx = p[0] - q[0], dy = p[1] - q[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L
    const b = p[0] * ux + p[1] * uy, c = p[0] * p[0] + p[1] * p[1] - R * R, s = -b + Math.sqrt(Math.max(0, b * b - c))
    E.push([p[0] + ux * s, p[1] + uy * s])
  }
  for (let i = 0; i < 6; i++) {
    const e1 = E[i], e0 = E[(i + 5) % 6]
    g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[(i + 1) % 6][0], P[(i + 1) % 6][1]); g.lineTo(e1[0], e1[1])
    let a1 = Math.atan2(e1[1], e1[0]), a0 = Math.atan2(e0[1], e0[0]); let d = a0 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI
    g.arc(0, 0, R, a1, a1 + d, d < 0); g.closePath()
    const sh = g.createLinearGradient(P[i][0], P[i][1], e1[0], e1[1]); sh.addColorStop(0, C.blade[i % 2]); sh.addColorStop(1, C.blade[(i + 1) % 2])
    g.fillStyle = sh; g.fill(); g.strokeStyle = C.seam; g.lineWidth = 1.5; g.stroke()
  }
}

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H)
  const R0 = C.radius * Z
  const s = sstep(t - C.t.pop, 2.2, .6) * (1 - ei(seg(t, C.t.out, C.t.out + .3)))
  if (s <= .001) return
  const push = 1 + .04 * seg(t, C.t.open, C.t.close)             // slow moving hold while open
  const R = R0 * s * push
  const op = eo5(seg(t, C.t.open, C.t.open + C.openDur)) * (1 - eio(seg(t, C.t.close, C.t.close + C.closeDur)))
  const a = op * R * 1.2                                           // open = hexagon bigger than the disc, so no blade shows
  const rot = (-C.turn * Math.PI / 180) * (1 - op) + .3
  g.translate(CX, CY)
  g.save(); g.beginPath(); g.arc(0, 0, R, 0, 7); g.clip()
  photo(R)
  if (op < .999) iris(R, Math.max(a, .5), rot)
  g.restore()
  g.beginPath(); g.arc(0, 0, R, 0, 7); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; g.stroke()
  g.setTransform(1, 0, 0, 1, 0, 0)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
