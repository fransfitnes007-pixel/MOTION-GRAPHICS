<!doctype html>
<html><head><meta charset="utf-8"><title>Notification storm then one card</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.serif{text-align:center;font-family:'New York','Iowan Old Style',Georgia,serif;font-weight:400;color:#1c1c21;letter-spacing:-.015em;line-height:1.12}
.qw{display:inline-block}
.acc{font-style:italic}
.dock{display:flex;justify-content:center}
.ic{position:relative;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.bd{position:absolute;background:#ff3b30;color:#fff;border-radius:999px;font-weight:700;text-align:center;padding:0 5px;font-family:-apple-system,system-ui,sans-serif}
.card{display:flex;align-items:center;background:rgba(255,255,255,.96);box-shadow:0 18px 40px -18px rgba(30,30,60,.35),0 0 0 1px rgba(0,0,0,.04);transform-style:preserve-3d}
.av{border-radius:50%;flex:none}
.tx{flex:1}
.ln{border-radius:6px}
.ap{flex:none;align-self:flex-start;margin-top:14px}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from @dhruvalgolakiya's 5-second "How many apps did you check today?" clip (revid.ai wall #44).
// A serif question builds word by word over an app dock, notification cards fly in faster and faster until the frame is
// buried, the storm blows outward, and one card drifts to the centre: "And you still missed this one."
const CONFIG = {
  q: ['How', 'many', 'apps', '|', 'did', 'you', 'check', 'today?'],
  a: ['And', 'you', 'still', 'missed', '*this', '*one.'],          // * = accent words (italic, red)
  accent: '#d63a2f',
  apps: ['#2fbf5b', 'linear-gradient(45deg,#f9b233,#e1306c,#833ab4)', '#0a66c2', 'linear-gradient(135deg,#36c5f0,#2eb67d,#ecb22e,#e01e5a)', '#ea4335', '#34a853'],
  cards: 30,                         // how many cards make the storm
  rate: 7.2,                         // cards spawned by time t: rate * (t - spawnStart)^2  (accelerating)
  t: { q: .1, perWord: .12, spawn: .6, storm: 2.62, hero: 2.85, a: 3.45, out: 5.15 },
  dur: 5.6,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 : W / 1920
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
const hsh = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x) }
stage.style.background = `radial-gradient(45% 55% at 82% 12%, rgba(240,168,158,.42), transparent 70%), radial-gradient(45% 55% at 12% 92%, rgba(150,182,232,.45), transparent 70%), #fbfaf8`
stage.style.perspective = '1400px'

function words(list, parent) {
  const out = []; let line = el('div', '', parent)
  list.forEach((w) => {
    if (w === '|') { line = el('div', '', parent); return }
    const acc = w[0] === '*'; const s = el('span', 'qw' + (acc ? ' acc' : ''), line, acc ? w.slice(1) : w); if (acc) s.style.color = C.accent
    out.push(s); line.appendChild(document.createTextNode(' '))
  })
  return out
}
const qBox = el('div', 'abs serif'); S(qBox, { left: 0, width: W + 'px', top: px(CY - 95 * Z), fontSize: px(66 * Z), zIndex: 1 })
const qW = words(C.q, qBox)
const aBox = el('div', 'abs serif'); S(aBox, { left: 0, width: W + 'px', top: px(CY + 95 * Z), fontSize: px(46 * Z), zIndex: 1 })
const aW = words(C.a, aBox)
// dock with badges
const dock = el('div', 'abs dock'); S(dock, { left: 0, width: W + 'px', top: px(H - 140 * Z), gap: px(26 * Z), zIndex: 1 })
const badges = C.apps.map((bg) => { const ic = el('div', 'ic', dock); S(ic, { width: px(46 * Z), height: px(46 * Z), borderRadius: px(12 * Z), background: bg }); const b = el('div', 'bd', ic); S(b, { fontSize: px(13 * Z), minWidth: px(22 * Z), height: px(22 * Z), lineHeight: px(22 * Z), top: px(-8 * Z), right: px(-10 * Z) }); return b })

function card(i) {
  const e = el('div', 'abs card'); S(e, { width: px(330 * Z), height: px(70 * Z), borderRadius: px(16 * Z), padding: `0 ${px(14 * Z)}`, gap: px(12 * Z), zIndex: 2 + i })
  const av = el('div', 'av', e); S(av, { width: px(40 * Z), height: px(40 * Z), background: `hsl(${Math.floor(hsh(i, 3) * 360)},35%,${55 + hsh(i, 4) * 20}%)` })
  const tx = el('div', 'tx', e); const l1 = el('div', 'ln', tx), l2 = el('div', 'ln', tx)
  S(l1, { width: px((90 + hsh(i, 5) * 70) * Z), height: px(10 * Z), background: '#3a3a40', marginBottom: px(8 * Z) }); S(l2, { width: px((150 + hsh(i, 6) * 80) * Z), height: px(8 * Z), background: '#c9c9cf' })
  const ap = el('div', 'ap', e); S(ap, { width: px(16 * Z), height: px(16 * Z), borderRadius: px(5 * Z), background: C.apps[i % C.apps.length] })
  return e
}
const cards = []
for (let i = 0; i < C.cards; i++) {
  const ti = C.t.spawn + Math.sqrt(i / C.rate)
  // final spot: seeded, spread over the frame, a few over the headline
  const fx = (.07 + .86 * hsh(i, 1)) * W, fy = (.08 + .74 * hsh(i, 2)) * H
  const dx = fx - CX, dy = fy - CY, d = Math.hypot(dx, dy) || 1
  cards.push({ e: card(i), ti, fx, fy, ux: dx / d, uy: dy / d, rz: (hsh(i, 7) - .5) * 10, ry: (hsh(i, 8) - .5) * 70, rx: (hsh(i, 9) - .5) * 40 })
}
const hero = card(99); S(hero, { zIndex: 60 })

function render(t) {
  const out = eo(seg(t, C.t.out, C.t.out + .4))
  const storm = eio(seg(t, C.t.storm, C.t.storm + .32))
  qW.forEach((s, i) => { const a = C.t.q + i * C.t.perWord, p = eo5(seg(t, a, a + .38)); S(s, { opacity: p * (1 - storm), filter: `blur(${(1 - p) * 9 + storm * 10}px)`, transform: `translateY(${(1 - p) * 18}px)` }) })
  S(dock, { opacity: eo(seg(t, .25, .6)) * (1 - storm) })
  const n = clamp(C.t.spawn <= t ? C.rate * Math.pow(t - C.t.spawn, 2) : 0, 0, C.cards)
  badges.forEach((b, i) => { const v = Math.floor(n * (1 + i * .7) / 2) + i + 1; b.textContent = v > 99 ? '99+' : v })
  cards.forEach((c) => {
    const p = eo5(seg(t, c.ti, c.ti + .45))
    if (p <= 0 || storm >= 1) { c.e.style.display = 'none'; return }
    c.e.style.display = 'flex'
    const far = (1 - p) * 700 * Z + storm * 900 * Z
    const x = c.fx + c.ux * far, y = c.fy + c.uy * far
    const drift = Math.sin(t * 1.3 + c.rz) * 4 * Z
    S(c.e, { left: px(x - 165 * Z), top: px(y - 35 * Z + drift), opacity: clamp(p * 2) * (1 - storm),
      filter: `blur(${(1 - p) * 6 + storm * 14}px)`,
      transform: `rotateX(${c.rx * (1 - p)}deg) rotateY(${c.ry * (1 - p)}deg) rotate(${c.rz * .4}deg) scale(${1.15 - .15 * p + storm * .6})` })
  })
  // hero card: drifts in from the upper right and settles in the middle, then the answer line builds under it
  const h = sstep(t - C.t.hero, 1.4, .82)
  S(hero, { display: t > C.t.hero ? 'flex' : 'none', left: px(lerp(CX + 260 * Z, CX, h) - 165 * Z), top: px(lerp(CY - 220 * Z, CY - 35 * Z, h)), opacity: clamp(h * 1.5) * (1 - out), transform: `scale(${lerp(.7, 1.25, h)})`, filter: `blur(${(1 - clamp(h)) * 6}px)` })
  aW.forEach((s, i) => { const a = C.t.a + i * .1, p = eo5(seg(t, a, a + .38)); S(s, { opacity: p * (1 - out), filter: `blur(${(1 - p) * 8}px)`, transform: `translateY(${(1 - p) * 14}px)` }) })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
