<!doctype html>
<html><head><meta charset="utf-8"><title>Typed prompt box with send click</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */

#stage{background:#050509;color:#fff}
.layer{position:absolute;inset:0}
.word{position:absolute;font-weight:800;font-size:168px;letter-spacing:-.05em;line-height:1;white-space:nowrap}
.wm{position:absolute;text-align:center;font-family:'UnifrakturCook','Old English Text MT',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.03em;line-height:1;color:#fff;white-space:nowrap}

.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(139,92,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.06) 1px,transparent 1px)}
.glow{text-shadow:0 0 30px rgba(167,139,250,.55),0 0 80px rgba(139,92,246,.35)}

.cursor{position:absolute;width:40px;height:40px;z-index:60;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.ring{position:absolute;border-radius:50%;border:3px solid #C4B5FD;z-index:59}


/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same helper set used across the library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 5.6
window.DUR = DUR

const FS = TALL ? W / 1920 : Math.min(W / 1920, H / 1080)
const G = Math.max(W / 1920, H / 1080)
const mkFrame = (parent) => { const f = el('div', 'abs', parent); S(f, { left: px(CX - 960), top: px(CY - 540), width: '1920px', height: '1080px', transform: 'scale(' + FS + ')', transformOrigin: '50% 50%' }); return f }
const fr = mkFrame(stage)
const rand = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
const back = (x, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const ex = (x) => x === 1 ? 1 : 1 - Math.pow(2, -10 * x)
const fmt = (n) => Math.round(n).toLocaleString('en-US')
const CURSOR = '<svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 2l16 9-7 2-3 7z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const cover = (i) => { const h = (i * 47 + 250) % 360, sk = 18 + (i * 7) % 20; return 'radial-gradient(circle at 50% 36%, hsl(' + (20 + (i * 13) % 20) + ',60%,' + (68 - sk / 2) + '%) 0 13%, transparent 14%),radial-gradient(ellipse at 50% 98%, hsl(' + h + ',30%,14%) 0 40%, transparent 41%),linear-gradient(165deg, hsl(' + h + ',70%,52%), hsl(' + (h + 50) % 360 + ',60%,22%))' }
// persistent dark backdrop. v = 1 is the first variant (64px grid, smaller blob), v = 2 the second (80px grid, bigger blob, faster drift)
function makeBG(v = 2, loop = 0) {
  const bg = el('div', 'layer'); stage.insertBefore(bg, stage.firstChild)
  const gr = v === 1 ? 64 : 80, ga = v === 1 ? .07 : .06
  const grid = el('div', 'grid', bg); S(grid, { backgroundSize: px(gr * G) + ' ' + px(gr * G), backgroundImage: 'linear-gradient(rgba(139,92,246,' + ga + ') 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,' + ga + ') 1px,transparent 1px)' })
  const gw = (v === 1 ? 1400 : 1600) * G, gh = (v === 1 ? 1000 : 1100) * G
  const blob = el('div', 'abs', bg); S(blob, { width: px(gw), height: px(gh), borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(' + (v === 1 ? '139,92,246,.28' : '124,58,237,.30') + '), transparent)', filter: 'blur(' + (v === 1 ? 20 : 30) * G + 'px)' })
  const vg = el('div', 'layer'); S(vg, { background: 'radial-gradient(ellipse at 50% 50%, transparent ' + (v === 1 ? 55 : 60) + '%, rgba(0,0,0,' + (v === 1 ? .65 : .6) + '))', zIndex: 70, pointerEvents: 'none' })
  return (t) => {
    const sp = loop ? [2 * gr / loop, gr / loop] : v === 1 ? [6, 4] : [14, 9], w = loop ? 2 * Math.PI / loop : 0
    grid.style.transform = 'translate(' + ((-t * sp[0]) % gr) * G + 'px,' + ((-t * sp[1]) % gr) * G + 'px)'
    const p = v === 1 ? [260 + Math.sin(t * (w || .3)) * 200, -100 + Math.cos(t * (w || .25)) * 120] : [160 + Math.sin(t * (w || .5)) * 260, -60 + Math.cos(t * (w || .4)) * 140]
    S(blob, { left: px(p[0] * G), top: px(p[1] * G) })
  }
}


const bgRender = makeBG(1)
const setRing = el('div', 'ring'); S(setRing, { borderColor: '#A78BFA', borderWidth: '3px' })
fr.appendChild(setRing)
const cursor = el('div', 'cursor', fr, CURSOR); S(cursor, { width: '34px', height: '34px' }); cursor.firstChild.setAttribute('width', 34); cursor.firstChild.setAttribute('height', 34)
const box = el('div', 'abs', fr); S(box, { left: '460px', top: '440px', width: '1000px', height: '200px', borderRadius: '28px', background: 'rgba(16,14,28,.92)', border: '1px solid rgba(167,139,250,.35)', boxShadow: '0 0 80px rgba(139,92,246,.25)' })
const ptext = el('div', 'abs', box); S(ptext, { left: '40px', top: '38px', right: '40px', fontWeight: 500, fontSize: '38px', color: '#fff', lineHeight: '1.3' })
const bar = el('div', 'abs', box); S(bar, { left: '40px', bottom: '28px', fontWeight: 500, fontSize: '20px', color: 'rgba(255,255,255,.45)' }); bar.textContent = 'Your product · New project'
const send = el('div', 'abs', box, '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'); S(send, { right: '28px', bottom: '22px', width: '60px', height: '60px', borderRadius: '18px', background: '#8B5CF6', display: 'grid', placeItems: 'center', boxShadow: '0 0 30px rgba(139,92,246,.7)' })
const kicker = el('div', 'abs glow', fr); S(kicker, { left: 0, right: 0, top: '300px', textAlign: 'center', fontWeight: 700, fontSize: '30px', letterSpacing: '.3em', color: '#C4B5FD' }); kicker.textContent = 'YOUR BRAND'

// v1 cursor: ring r = 10 + 60 * eo(k) over .45s, press scale .85
function setCursor(on, x, y, clickT, t) {
  vis(cursor, on); vis(setRing, false)
  if (!on) return
  S(cursor, { left: x + 'px', top: y + 'px' })
  if (clickT != null) {
    const k = seg(t, clickT, clickT + .45)
    if (k > 0 && k < 1) { vis(setRing, true); const r = 10 + 60 * eo(k); S(setRing, { left: (x + 4 - r) + 'px', top: (y + 4 - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: 1 - k }) }
    cursor.style.transform = 'scale(' + (k > 0 && k < .25 ? .85 : 1) + ')'
  }
}
function render(lt) {
  bgRender(lt)
  const txt = 'Plan a product launch for my app with ten partners'
  const n = Math.floor(txt.length * eio(seg(lt, .5, 3.2)))
  ptext.innerHTML = txt.slice(0, n) + (Math.floor(lt * 2.5) % 2 === 0 || lt < 3.2 ? '<span style="color:#A78BFA">|</span>' : '')
  const inK = eo(seg(lt, 0, .6))
  // the original cuts away at 5.2; the demo fades the last .3s so the loop does not pop
  S(box, { opacity: inK * (1 - seg(lt, 5, 5.3)), transform: 'translateY(' + (1 - inK) * 30 + 'px) scale(' + (1 + ex(seg(lt, 4.3, 5.2)) * 1.6) + ')', filter: 'blur(' + seg(lt, 4.5, 5.2) * 14 + 'px)' })
  kicker.style.opacity = inK * (1 - seg(lt, 4.2, 4.6))
  const cx = lerp(1500, 1386, eio(seg(lt, 3.1, 3.8))), cy = lerp(760, 590, eio(seg(lt, 3.1, 3.8)))
  setCursor(lt > 2.9 && lt < 4.4, cx, cy, 3.9, lt)
  send.style.transform = 'scale(' + (lt > 3.9 && lt < 4.1 ? .9 : 1) + ')'
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
