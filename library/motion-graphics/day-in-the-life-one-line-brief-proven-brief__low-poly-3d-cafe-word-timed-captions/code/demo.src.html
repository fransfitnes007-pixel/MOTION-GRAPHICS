    const k = back(seg(t, T.guess + 0.25, T.guess + 0.5)); qm.position.set(0.3, 4.55 + Math.sin(t * 4) * 0.08, 1.9); qm.rotation.set(0, Math.sin(t * 2.5) * 0.5, 0); qm.scale.setScalar(Math.max(0.01, 1.15 * k))

  } else if (t < T.found) { const k = back(seg(t, T.cooked, T.cooked + 0.2)); q = mixP({ ...SIT }, SLUMP, clamp(k)); c = CAM.slump; ck = seg(t, T.cooked, T.found); if (t >= T.cookedHit) shake = 1 - seg(t, T.cookedHit, T.cookedHit + 0.45); lidA = lerp(0.22, -PI / 2, eo(seg(t, T.cooked, T.cooked + 0.14))) }   // I'm cooked
  else if (t < T.brief) {                                                       // then I found YourBrand
    const k = eo(seg(t, T.found, T.found + 0.5)); lidA = lerp(-PI / 2, 0.22, eo(seg(t, T.found, T.found + 0.35))); glowOn = 1.6 * k
    if (t < T.foundG) { q = mixP(SLUMP, { ...SIT, hx: 0.12, eye: 1.45, mw: 0.8, mh: 2, alx: -0.3, arx: -0.3, ale: -0.9, are: -0.9 }, k); c = CAM.face; ck = seg(t, T.found, T.foundG) }
    else { q = { ...TYPE, eye: 1.3 }; c = CAM.shoulder; ck = seg(t, T.foundG, T.brief); v.flash = (1 - seg(t, T.foundG, T.foundG + 0.3)) * 0.85; v.coin = [0.5, 0.33, back(seg(t, T.foundG, T.foundG + 0.4)), t] }
  } else if (t < T.guessed) {                                                   // the brief has everything, down to the detail
    q = { ...SIT }; c = CAM.phone; ck = seg(t, T.brief, T.guessed); docMode = 1; const z = eio(seg(t, T.detail, T.detail + 0.4)); showDoc(T.brief, 1 + z * 0.75); doc.position.y = 3.0 + z * 0.62; doc.rotation.y *= 1 - z
    if (t < T.items[0] - 0.12) v.pills.push(['EVERYTHING IS IN IT', 0, back(seg(t, T.brief + 0.6, T.brief + 0.8)), 'good'])

    if (t >= T.provenHit) { v.stamp = ['PROVEN', seg(t, T.provenHit, T.provenHit + 0.16), '#16a46a', -0.07, 0.3]; shake = (1 - seg(t, T.provenHit, T.provenHit + 0.35)) * 0.7 }
  } else {                                                                      // no blank page, no guessing, no bullshit
    c = CAM.center; ck = seg(t, T.nn, T.end)
    if (t < T.nob) {
      const n = t < T.n2s ? 0 : 1, h0 = n ? T.n2 : T.n1, st = n ? T.n2s : T.nn, side = n ? 1 : -1, sw = seg(t, h0 - 0.1, h0 + 0.08), swing = Math.sin(sw * PI)

      const fl0 = seg(t, h0, h0 + 0.5), fly = fl0 * fl0, inK = back(seg(t, st, st + 0.14)), px = 0.25 + side * (0.98 + fly * 6), py = 3.75 + fly * 2.4 + Math.sin(t * 5) * 0.06, spin = fly * 9, o = n ? qm : blank

    if (t >= T.n1) v.pills.push(['BLANK PAGE', 0, back(seg(t, T.n1, T.n1 + 0.2)), 'bad']); if (t >= T.n2) v.pills.push(['GUESSING', 1, back(seg(t, T.n2, T.n2 + 0.2)), 'bad'])
  }

  lid.rotation.x = lidA
  tripod.visible = c === CAM.film || c === CAM.filmC
  docBody.color.set(docMode === 1 ? 0x15161a : 0xffffff)
  // light and mood: a grey afternoon, then the sun comes out
  wallMat.color.set(0xb4bcc8).lerp(new THREE.Color(0xfff1dc), good); wallMat2.color.set(0xcfd3d6).lerp(new THREE.Color(0xf6e3c4), good)
  sun.color.set(0xdfe6f2).lerp(new THREE.Color(0xffd9a8), good); sun.intensity = lerp(1.25, 1.95, good) * day; hemi.intensity = lerp(0.95, 1.15, good) * (0.6 + 0.4 * day)
  paneMat.color.set(0xaeb9c4).lerp(new THREE.Color(0xffe3b0), good).multiplyScalar(0.5 + 0.5 * day); scene.background.set(0xcfd6dd)
  bulbs.intensity = lerp(2.0, 3.5, good)
  glow.position.set(2.0, 2.1, -1.55); glow.intensity = glowOn * 2.2
  lidG.material.opacity = good
  const fast = t >= T.hours && t < T.ask; hand1.rotation.z = -t * (fast ? 16 : 0.2); hand2.rotation.z = -t * (fast ? 100 : 1.5)
  drawLaptop(t); if (phoneMode) drawPhone(phoneMode, t); if (docMode >= 0) drawDoc(docMode, t)
}

// "Nothing is guessed": the reference video on the left, his on the right, same shot.

  tile(x0 + 30, 'THE VIDEO THAT WORKED', '#3b527c', false); const k2 = back(seg(t, T.guessed + 0.3, T.guessed + 0.55)); if (k2 > 0) { g.save(); g.globalAlpha = clamp(k2); tile(x0 + 440, 'MINE', '#6b4a2f', true); g.restore() }
  g.fillStyle = '#fff'; g.font = '800 54px system-ui, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('→', CX, y0 + 190)
  g.restore()
}
function overlay(t) {
