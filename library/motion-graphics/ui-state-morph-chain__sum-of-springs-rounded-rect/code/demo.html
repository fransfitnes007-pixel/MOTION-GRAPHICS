<!doctype html>
<html><head><meta charset="utf-8"><title>Ui state morph chain</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.shape{overflow:hidden;box-shadow:0 22px 50px -24px rgba(0,0,0,.45)}
.lay{inset:0;display:flex;align-items:center;justify-content:center;gap:.5em;color:#fff;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tic{display:inline-flex;width:1.25em;height:1.25em;border-radius:50%;background:#fff;color:#0c0c0d;align-items:center;justify-content:center;font-size:.8em;font-weight:800}
.ind{background:#fff}
.tab{text-align:center;font-weight:600}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from the "one shape through UI states" films: @twoclipping's shape-morph piece (motionvideo.xyz twoclipping-5cba86)
// and @thednyx's UI micro-animation (revid.ai wall #58). One black rounded rectangle never cuts: button -> loader -> check -> toast
// -> tab bar -> button. Every property is a sum of springs (one per change), so any frame is a pure function of time; the tab
// indicator's two edges ride different springs, so the leading edge stretches ahead of the trailing one.
const CONFIG = {
  bg: '#ecede8', ink: '#0c0c0d', paper: '#ffffff',
  //        time   w     h    radius  camera zoom
  states: [ [0,    300,  88,  44,     1.55],    // button
            [.62,  88,   88,  44,     2.1 ],    // loader
            [1.55, 88,   88,  44,     2.1 ],    // check (same shape, new content)
            [2.15, 520,  84,  24,     1.3 ],    // toast
            [3.05, 600,  96,  48,     1.22],    // tab bar
            [4.4,  300,  88,  44,     1.55] ],  // back to the button: last frame = first frame
  button: 'Generate', toast: 'Saved to your library', tabs: ['Home', 'Search', 'Library', 'Profile'],
  tabMoves: [[3.65, 2], [4.0, 1]],              // [time, tab index] the indicator moves to
  spring: { f: 2.3, z: .78 },                   // shape springs: tiny overshoot
  edge: { lead: 3.4, trail: 1.7, z: .8 },       // indicator edges
  dur: 5,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const Z = TALL ? W / 1080 * .75 : W / 1920
stage.style.background = C.bg
const sstep = (tau, f = 2.1, z = .72) => { if (tau <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + z * w / wd * Math.sin(wd * tau)) }
// a value with many targets = first target + one spring per change
const sumSpring = (t, keys, col, f = C.spring.f, z = C.spring.z) => keys.reduce((v, k, i) => i ? v + (k[col] - keys[i - 1][col]) * sstep(t - k[0], f, z) : k[col], 0)

const cam = el('div', 'abs'); S(cam, { left: px(CX), top: px(CY), width: 0, height: 0 })
const shape = el('div', 'abs shape', cam); S(shape, { background: C.ink })
const layer = (html) => { const d = el('div', 'abs lay', shape, html); return d }
const L = {
  btn: layer(`<span>${C.button}</span>`),
  load: layer(`<svg viewBox="0 0 40 40" width="46%" height="46%"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="4"/><path class="arcp" d="M20 5 A15 15 0 0 1 35 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`),
  check: layer(`<svg viewBox="0 0 40 40" width="50%" height="50%"><path class="ck" d="M11 21l6 6 12-13" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg>`),
  toast: layer(`<span class="tic">✓</span><span>${C.toast}</span>`),
  tabs: layer(''),
}
const ind = el('div', 'abs ind', L.tabs)
const tabEls = C.tabs.map((n) => el('div', 'abs tab', L.tabs, n))
const arcp = L.load.querySelector('.arcp'), ck = L.check.querySelector('.ck')
const cur = el('div', 'abs', cam); S(cur, { zIndex: 9 }); cur.innerHTML = '<svg viewBox="0 0 22 22" width="30" height="30"><path d="M3 2 L3 17 L7 13.5 L10 20 L12.5 19 L9.6 12.6 L15 12.4 Z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>'

// content windows: each layer is visible between its state's start and the next state's start, with a short blur swap
const win = { btn: [[-1, .62], [4.4, 9]], load: [[.62, 1.55]], check: [[1.55, 2.15]], toast: [[2.15, 3.05]], tabs: [[3.05, 4.4]] }
function showAmt(t, ranges) { let a = 0; ranges.forEach(([s, e]) => { const i = s < 0 ? 1 : eo(seg(t, s + .06, s + .26)), o = ei(seg(t, e - .1, e + .02)); a = Math.max(a, i * (1 - o)) }); return a }
// cursor keyframes [t, x, y] in shape-local px (camera space), pressed at the listed times
const curK = [[0, 260, 150], [.4, 60, 10], [.75, 140, 120], [3.3, 140, 120], [3.6, 75, 8], [3.9, -30, 8], [4.3, 200, 140], [5, 260, 150]]
const presses = [.48, 3.62, 3.97]

function render(t) {
  const K = C.states
  const w = sumSpring(t, K, 1) * Z, h = sumSpring(t, K, 2) * Z, r = sumSpring(t, K, 3) * Z
  const zoom = sumSpring(t, K, 4, 1.4, .9)
  const press = presses.reduce((m, p) => Math.max(m, Math.sin(Math.PI * seg(t, p, p + .18))), 0)
  S(shape, { left: px(-w / 2), top: px(-h / 2), width: px(w), height: px(h), borderRadius: px(r), transform: `scale(${1 - press * .04})` })
  S(cam, { transform: `scale(${zoom})` })
  for (const k in L) { const a = showAmt(t, win[k]); S(L[k], { opacity: a, filter: `blur(${(1 - a) * 8}px)`, display: a > .001 ? 'flex' : 'none', fontSize: px(30 * Z) }) }
  arcp.setAttribute('transform', `rotate(${t * 520} 20 20)`)
  ck.setAttribute('stroke-dashoffset', 1 - eo(seg(t, 1.62, 1.95)))
  // tab bar: indicator edges follow the active tab; moving right, the right edge leads (fast spring) and the left trails (slow)
  const pad = 8 * Z, tw = (w - pad * 2) / C.tabs.length
  tabEls.forEach((e, i) => S(e, { left: px(pad + i * tw), width: px(tw), top: 0, height: px(h), lineHeight: px(h), fontSize: px(22 * Z) }))
  const tk = [[0, 0]].concat(C.tabMoves)
  let lft = tk[0][1], rgt = tk[0][1] + 1
  for (let i = 1; i < tk.length; i++) {
    const d = tk[i][1] - tk[i - 1][1], right = d > 0
    lft += d * sstep(t - tk[i][0], right ? C.edge.trail : C.edge.lead, C.edge.z)
    rgt += d * sstep(t - tk[i][0], right ? C.edge.lead : C.edge.trail, C.edge.z)
  }
  S(ind, { left: px(pad + lft * tw), width: px((rgt - lft) * tw), top: px(pad), height: px(h - pad * 2), borderRadius: px(r - pad) })
  const active = Math.round((lft + rgt - 1) / 2)
  tabEls.forEach((e, i) => { e.style.color = i === active ? C.ink : 'rgba(255,255,255,.7)' })
  // cursor, in camera space so it scales with the zoom
  let i = 0; while (i < curK.length - 2 && t > curK[i + 1][0]) i++
  const a = curK[i], b = curK[i + 1], u = eio(seg(t, a[0], b[0]))
  S(cur, { left: px(lerp(a[1], b[1], u) * Z), top: px(lerp(a[2], b[2], u) * Z), transform: `scale(${(1 - press * .15) * .8})`, transformOrigin: '0 0' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
