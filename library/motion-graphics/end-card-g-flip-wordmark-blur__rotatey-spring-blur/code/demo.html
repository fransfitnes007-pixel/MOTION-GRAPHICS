<!doctype html>
<html><head><meta charset="utf-8"><title>End card with flipping mark</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.dots{position:absolute;inset:-120px;background-image:radial-gradient(rgba(20,16,40,.10) 1.3px,transparent 1.6px);background-size:34px 34px}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}

.wm{position:absolute;display:grid;place-items:center;font-weight:900;letter-spacing:-.06em;line-height:1;white-space:nowrap}
.wm .base{background:linear-gradient(180deg,#f4f6fa 0%,#8a93a3 48%,#2a2f3a 52%,#cfd6e2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 10px rgba(20,16,40,.25));font-style:italic}
.wm .shine{position:absolute;inset:0;display:grid;place-items:center;color:transparent;font-style:italic;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,1) 50%,transparent 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;mix-blend-mode:screen}
.wm.dk .base{background-image:linear-gradient(180deg,#ffffff 0%,#a8b0c2 50%,#e8ecf5 100%);filter:drop-shadow(0 0 24px rgba(165,180,252,.35))}
.gmark{position:absolute;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#f4f6fa,#8a93a3 55%,#e8ecf2);color:#0b0b10;font-weight:900;box-shadow:0 10px 30px -8px rgba(20,16,40,.35)}
.url10{position:absolute;left:0;text-align:center;font-weight:600;color:#55556a;letter-spacing:-.01em}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set used across this library
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 3.6
window.DUR = DUR

const bgL = el('div', 'abs'); S(bgL, { left: 0, top: 0, width: W + 'px', height: H + 'px', background: '#f4f4f6' })
el('div', 'dots', bgL)
const orbs = [
  { c: 'rgba(91,92,230,.26)', s: 900, x: 280, y: 100, sp: .09 }, { c: 'rgba(96,165,250,.24)', s: 820, x: 1300, y: 520, sp: .07 },
  { c: 'rgba(236,72,153,.12)', s: 700, x: 900, y: 760, sp: .11 }, { c: 'rgba(148,163,184,.28)', s: 600, x: 1500, y: -120, sp: .06 },
].map((o) => { const e = el('div', 'orb', bgL); S(e, { width: o.s * K + 'px', height: o.s * K + 'px', background: `radial-gradient(closest-side, ${o.c}, transparent)` }); return { ...o, e } })
function bgLight(t) { for (const o of orbs) S(o.e, { left: ((o.x + Math.sin(t * o.sp * 6 + o.s) * 120) * W / 1920) + 'px', top: ((o.y + Math.cos(t * o.sp * 5 + o.x) * 90) * H / 1080) + 'px' }) }


function wordmark(parent, text, size, cls = '') { const w = el('div', 'wm ' + cls, parent); w.style.fontSize = size + 'px'; w.innerHTML = '<span class="base"></span><span class="shine"></span>'; w.querySelector('.base').textContent = text; w.querySelector('.shine').textContent = text; w.shine = w.querySelector('.shine'); return w }

const END = .1                        // the wordmark time, seconds after the card starts
const s10 = el('div', 'abs'); S(s10, { left: 0, top: 0, width: W + 'px', height: H + 'px' })
const g10 = el('div', 'gmark', s10); S(g10, { width: px(160 * K), height: px(160 * K), fontSize: px(100 * K), left: px(CX - 80 * K), top: px(CY - 370 * K) }); g10.textContent = 'B'
const wm10 = wordmark(s10, 'YourBrand', 215 * K); S(wm10, { width: px(920 * K), height: px(440 * K), left: px(CX - 460 * K), top: px(CY - 200 * K) })
const url10 = el('div', 'url10', s10); S(url10, { width: W + 'px', top: px(CY + 290 * K), fontSize: px(46 * K) }); url10.textContent = 'brand.link'
const vignette = el('div', 'abs'); S(vignette, { left: 0, top: 0, width: W + 'px', height: H + 'px', zIndex: 90, pointerEvents: 'none', background: 'radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(10,8,20,.10))' })
function render(t) {
  bgLight(t)
  const g = spring(seg(t, .05, .75), 6, 9), w = spring(seg(t, END - .05, END + .6), 8, 12)
  S(g10, { opacity: clamp(g * 1.4), transform: `translateY(${(1 - g) * 40}px) rotateY(${(1 - eio(seg(t, .05, 1.4))) * 360}deg) scale(${.7 + .3 * g})` })
  S(wm10, { opacity: clamp(w * 1.4), transform: `scale(${1.2 - .2 * w})`, filter: `blur(${(1 - clamp(w * 1.3)) * 14}px)` })
  wm10.shine.style.backgroundPosition = `${lerp(130, -30, seg(t, .5, 1.5))}% 0`
  const u = eo5(seg(t, .7, 1.2)); S(url10, { opacity: u, transform: `translateY(${(1 - u) * 20}px)` })
  const f = seg(t, 2.4, 3.2); S(s10, { opacity: 1 - f * f })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
