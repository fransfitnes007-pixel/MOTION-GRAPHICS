<!doctype html>
<html><head><meta charset="utf-8"><title>ask-bar-greeting-composer__word-blur-in-dock-drop</title>
<!-- Library demo. Every frame is a pure function of time: window.render(t). Open it in a browser and it loops.
     engine/tools/render_demo.cjs drives it frame by frame (?render=1). URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;font-family:-apple-system,'SF Pro Text',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0e0f14;color:#e8eaed;font-family:Geist,'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'SF Pro Text',sans-serif}
.ab svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ab-glow{position:absolute;background:radial-gradient(46% 44% at 53% 56%,#1b2b6e 0%,rgba(27,43,110,.55) 40%,rgba(0,0,0,0) 74%)}
.ab-hello{position:absolute;left:0;width:100%;text-align:center;font-size:28px;line-height:33.6px;letter-spacing:-.01em;font-weight:400;color:#e8eaed;white-space:pre}
.ab-hello span{display:inline-block;white-space:pre}
.ab-bar{position:absolute;left:21.6px;width:496.8px;height:64px;background:#1f1f1f;border-radius:32px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.25)}
.ab-ic{position:absolute;top:10px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#c4c7c5}
.ab-ic svg{width:22px;height:22px}
.ab-field{position:absolute;left:62px;top:20px;font-size:17px;line-height:24px;white-space:nowrap}
.ab-model{position:absolute;right:54px;top:10px;height:44px;border-radius:22px;padding:0 12px 0 16px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:#e8eaed}
.ab-model svg{width:18px;height:18px;color:#c4c7c5}
.ab-act{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.ab-act svg{width:20px;height:20px}
.ab-menu{position:absolute;right:21.6px;width:288px;background:#282a2c;border-radius:18px;padding:8px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 48px rgba(0,0,0,.35)}
.ab-mi{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px}
.ab-mi div{flex:1}.ab-mi b{display:block;font-weight:500;font-size:15px;line-height:20px}.ab-mi small{display:block;color:#9aa0a6;font-size:13px;line-height:18px;margin-top:2px}
.ab-mi svg{width:20px;height:20px;color:#8ab4f8}
.ab-me{position:absolute;right:21.6px;max-width:80%;background:#2b2c30;border-radius:22px 22px 6px 22px;padding:12px 18px;font-size:17px;line-height:25.6px}
.ab-ai{position:absolute;left:26px;width:489px}
.ab-spark{position:absolute;left:0;top:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#8ab4f8}
.ab-spark svg{width:22px;height:22px;fill:currentColor;stroke:none}
.ab-ai p{margin-left:46px;font-size:17px;line-height:25.6px;min-height:25.6px;padding-top:0}
.ab-ai small{display:block;margin:8px 0 0 46px;font-size:12px;line-height:18px;color:#9aa0a6}
.ab-dots{position:absolute;left:46px;top:11px;display:flex;gap:5px}
.ab-dots i{display:block;width:7px;height:7px;border-radius:50%;background:#9aa0a6}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'
// cubic-bezier(x1,y1,x2,y2) as a function of progress, for the CSS easings read off the source
const bez = (x1, y1, x2, y2) => { const B = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t
  return (x) => { x = clamp(x); let lo = 0, hi = 1, t = x; for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; B(x1, x2, t) < x ? lo = t : hi = t } return B(y1, y2, t) } }
// phone-sized virtual canvas: the source previews were read at 540 x 960 CSS px; tall scales that to the frame width, wide shows a 540 column at 760 high
const SC = TALL ? W / 540 : H / 760, vw = W / SC, vh = H / SC
const V = el('div', 'abs'); S(V, { left: '0px', top: '0px', width: vw + 'px', height: vh + 'px', transform: `scale(${SC})`, transformOrigin: '0 0', overflow: 'hidden' })
const CW = Math.min(vw, 540), COL = el('div', 'abs', V); S(COL, { left: px((vw - CW) / 2), top: '0px', width: CW + 'px', height: vh + 'px', overflow: 'hidden' })

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  greeting: 'What shall we look into today?', placeholder: 'Ask Qalam',
  models: [['Swift', 'Quick answers for everyday questions'], ['Deep', 'Slower, thinks through harder problems'], ['Scholar', 'Reads widely and cites its sources']],
  ask: 'Plan my week',
  reply: 'Good question. In short: start small, write down what you learn, and check it against one real example. Want me to go deeper on "Plan my week"?',
  menuAt: 1.9, hoverAt: 2.7, pickAt: 3.3, typeAt: 3.9, typeDur: 1.3, sendAt: 5.4, thinkFor: 1.3, cps: 58 }
const DUR = 11
window.DUR = DUR
const IC = { plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>', mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>', down: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>', up: '<svg viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>', stop: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:12px;height:12px"><rect x="4" y="4" width="16" height="16" rx="2.5"/></svg>', check: '<svg viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', star: '<svg viewBox="0 0 24 24"><path d="M12 1.5c.6 5.6 4.9 9.9 10.5 10.5-5.6.6-9.9 4.9-10.5 10.5C11.4 16.900 7.100 12.600 1.500 12 7.100 11.400 11.400 7.100 12 1.500z"/></svg>' }
const root = el('div', 'ab abs', COL); S(root, { left: '0', top: '0', width: '100%', height: vh + 'px', overflow: 'hidden' })
const glow = el('div', 'ab-glow', root); S(glow, { left: '-127px', top: px(-243 * vh / 960), width: '794px', height: px(1411 * vh / 960) })
const gy = vh * .354, by0 = gy + 34 + Math.max(28, Math.min(52, vh * .05)), by1 = vh - 62 - 64
const hello = el('div', 'ab-hello', root); S(hello, { top: px(gy) })
const words = CONFIG.greeting.split(' ').map((w, i) => el('span', '', hello, w + (i < CONFIG.greeting.split(' ').length - 1 ? ' ' : '')))
const bar = el('div', 'ab-bar', root)
const plus = el('div', 'ab-ic', bar, IC.plus); S(plus, { left: '12px' })
const field = el('div', 'ab-field', bar)
const model = el('div', 'ab-model', bar), modelT = el('span', '', model, CONFIG.models[0][0]); el('div', '', model, IC.down)
const mic = el('div', 'ab-ic', bar, IC.mic); S(mic, { right: '10px', left: 'auto' })
const act = el('div', 'ab-act', bar)
const note = el('div', '', root);
const menu = el('div', 'ab-menu', root)
const mitems = CONFIG.models.map((m, i) => el('div', 'ab-mi', menu, `<div><b>${m[0]}</b><small>${m[1]}</small></div>` + (i === 0 ? IC.check : '')))
const me = el('div', 'ab-me', root, CONFIG.ask)
const ai = el('div', 'ab-ai', root); const spark = el('div', 'ab-spark', ai, IC.star); const dots = el('div', 'ab-dots', ai, '<i></i><i></i><i></i>')
const rep = el('p', '', ai), tag = el('small', '', ai, 'Swift')
const ease16 = bez(.2, .7, .2, 1)
function render(t){
  const C = CONFIG, started = t >= C.sendAt
  // greeting: each word blurs and rises in, 70 ms apart (askb-word, 0.6s, cubic-bezier(.2,.7,.2,1))
  vis(hello, !started)
  words.forEach((w, i) => { const e = ease16(seg(t, .12 + .07 * i, .72 + .07 * i)); S(w, { opacity: String(e), transform: `translateY(${(1 - e) * 8}px)`, filter: `blur(${(1 - e) * 4}px)` }) })
  // bar moves to the bottom once a message is sent
  S(bar, { top: px(started ? by1 : by0) })
  // model dropdown
  const picked = t >= C.pickAt, mopen = t >= C.menuAt && t < C.pickAt + .12
  const mo = mopen ? (t < C.pickAt ? seg(t, C.menuAt, C.menuAt + .16) : 1 - seg(t, C.pickAt + .02, C.pickAt + .12)) : 0
  vis(menu, mo > 0)
  S(menu, { opacity: String(mo), bottom: px(vh - (by0 - 12)), transform: `translateY(${(1 - mo) * 6}px)` })
  const hov = t >= C.hoverAt && t < C.pickAt + .12 ? 1 : -1
  mitems.forEach((d, i) => { S(d, { background: i === hov ? '#323436' : 'transparent' }); const c = d.querySelector('svg'); if (c) c.style.opacity = picked ? '0' : '1' })
  modelT.textContent = C.models[picked ? 1 : 0][0]
  S(model, { background: mo > 0 ? '#2a2a2a' : 'transparent', height: '44px' })
  model.children[1].style.transform = `rotate(${mo > 0 ? 180 : 0}deg)`
  // composer text, mic -> send -> stop
  const n = t < C.sendAt ? Math.floor(clamp((t - C.typeAt) / C.typeDur) * C.ask.length) : 0
  field.textContent = n ? C.ask.slice(0, n) : C.placeholder
  S(field, { color: n ? '#e8eaed' : '#9aa0a6' })
  const doneAt = C.sendAt + C.thinkFor + C.reply.length / C.cps, busy = started && t < doneAt
  const sendOn = (n > 0 && !started)
  vis(mic, !sendOn && !busy)
  vis(act, sendOn || busy)
  if (busy) { act.innerHTML !== IC.stop && (act.innerHTML = IC.stop); S(act, { background: '#2a2a2a', color: '#e8eaed', transform: 'scale(1)', opacity: '1' }) }
  else { if (act.innerHTML !== IC.up) act.innerHTML = IC.up; const q = seg(t, C.typeAt, C.typeAt + .2); S(act, { background: '#e8eaed', color: '#131314', transform: `scale(${.6 + .4 * bez(.3, .7, .3, 1.4)(q)})`, opacity: String(q) }) }
  // thread
  vis(me, started); vis(ai, started)
  if (started) {
    const e = eo(seg(t, C.sendAt, C.sendAt + .3))
    S(me, { top: '32px', opacity: String(e), transform: `translateY(${(1 - e) * 8}px)` })
    S(ai, { top: px(32 + me.offsetHeight + 22), opacity: String(eo(seg(t, C.sendAt, C.sendAt + .3))) })
    const st = C.sendAt + C.thinkFor, sn = Math.floor(clamp((t - st) * C.cps, 0, C.reply.length))
    rep.textContent = C.reply.slice(0, sn); vis(dots, t < st)
    ;[...dots.children].forEach((c, i) => { const p = (((t - i * .15) % 1) + 1) % 1, b = Math.sin(p * Math.PI * 2) ** 2 * (p < .5 ? 1 : 0); S(c, { transform: `translateY(${-3 * b}px)`, opacity: String(1 - .7 * b) }) })
    S(spark, { transform: `rotate(${t < doneAt ? ((t - C.sendAt) / 2.4 % 1) * 360 : 0}deg)` })
    vis(tag, t >= st); tag.textContent = C.models[picked ? 1 : 0][0]
    rep.style.display = t >= st ? '' : 'none'
  }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
