<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)

const DUR = 6                           // every icon's loop (1.5, 2, 3 or 6 s) divides 6, so the clip loops with no seam
window.DUR = DUR
stage.style.background = CONFIG.bg; stage.style.color = CONFIG.ink
const names = Object.keys(ICONS).filter(n => !CONFIG.only || CONFIG.only.includes(n))
const cols = TALL ? CONFIG.cols.tall : CONFIG.cols.wide, rows = Math.ceil(names.length / cols)
const mx = TALL ? 54 : 60, y0 = TALL ? 300 : 120, bot = TALL ? 70 : 50
const cw = (W - mx * 2) / cols, ch = (H - y0 - bot) / rows, gap = TALL ? 10 : 8
const size = Math.min(cw, ch) * (TALL ? .54 : .46)
const h1 = el('div', 'h'); h1.textContent = CONFIG.title; S(h1, { left: px(mx), top: px(TALL ? 120 : 34), fontSize: px(TALL ? 76 : 40), fontWeight: 700, letterSpacing: '-.5px' })
const h2 = el('div', 'h'); h2.textContent = CONFIG.subtitle; S(h2, { left: px(mx), top: px(TALL ? 214 : 82), fontSize: px(TALL ? 32 : 19), color: CONFIG.muted })
const cells = names.map((n, i) => {
  const c = el('div', 'tile'), x = mx + (i % cols) * cw, y = y0 + Math.floor(i / cols) * ch
  S(c, { left: px(x + gap / 2), top: px(y + gap / 2), width: px(cw - gap), height: px(ch - gap), background: CONFIG.tile, border: '1px solid ' + CONFIG.line, borderRadius: px(Math.min(cw, ch) * .12), gap: px(size * .16) })
  const ic = el('div', '', c, ICONS[n].svg); const svg = ic.firstChild
  svg.setAttribute('width', size); svg.setAttribute('height', size); svg.style.color = CONFIG.accents[i % CONFIG.accents.length]
  const cap = el('div', 'cap', c); cap.textContent = CONFIG.labels[n] || n; S(cap, { fontSize: px(TALL ? 22 : 14), color: CONFIG.muted })
  return { c, svg, L: ICONS[n].L, off: i * CONFIG.stagger, i }
})
function render(t) {
  for (const o of cells) {
    const p = CONFIG.popIn ? spring(seg(t, .05 + o.i * .03, .05 + o.i * .03 + CONFIG.popIn), 7, 11) : 1
    o.c.style.opacity = clamp(p * 1.5); o.c.style.transform = `scale(${.7 + .3 * p})`
    const ms = (t + o.off) * 1000
    for (const a of o.svg.getAnimations({ subtree: true })) { a.pause(); a.currentTime = ms }   // seek: same t, same frame
  }
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
