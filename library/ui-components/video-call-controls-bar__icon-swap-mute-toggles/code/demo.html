<!doctype html>
<html><head><meta charset="utf-8"><title>Video call controls bar</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0a0a0a;color:#c9c9cc}
.card{position:absolute;left:0;top:0;width:585px;height:255px;border-radius:30px;background:#171717;border:1.5px solid #2b2b2d}
.status{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:21px;color:#9a9a9f;white-space:nowrap}
.dot{display:inline-block;width:19px;height:19px;border-radius:50%;background:#22c55e;vertical-align:-3px;margin-right:9px}
.col{position:absolute;top:98px;text-align:center}
.btn{position:relative;width:72px;height:72px;border-radius:17px;margin:0 auto;display:grid;place-items:center;border:1.5px solid #333336;background:#1e1e20}
.btn svg{position:absolute;width:28px;height:28px;fill:none;stroke:#d8d8db;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbl{position:relative;margin-top:14px;height:28px;font-size:21px;color:#a8a8ad;white-space:nowrap}
.lbl span{position:absolute;left:0;right:0;top:0}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  status: 'In call · 12:34',   // line above the buttons
  dotColor: '#22c55e',         // live dot colour
  leaveColor: '#ff5a62',       // the leave button fill
  offFill: '#2d2b2b',          // button fill once a toggle is switched off
  offBorder: '#4a3535',        // faint red border when off
  swapSec: .18,                // icon and label crossfade time
  // scripted clicks: [time, which button]  buttons: 0 mic, 1 camera, 2 screen
  clicks: [[.95, 0], [2.6, 1], [4.4, 0], [5.0, 1]],
}
const DUR = 6.2
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const IC = {
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  micOff: '<path d="M2 2l20 20"/><path d="M18.9 10v2a7 7 0 0 1-.9 3.4M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M5 10v2a7 7 0 0 0 11.5 5.4M12 19v3"/>',
  cam: '<path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  camOff: '<path d="M2 2l20 20"/><path d="M10.7 6H14a2 2 0 0 1 2 2v3.3l5.2-3.8a.5.5 0 0 1 .8.4v7.2M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2"/>',
  screen: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  leave: '<path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-3.3-2.7m-2.7-3.3A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9"/><path d="M22 2 2 22"/>',
}
const box = fitBox(600, 290, .8)
const card = el('div', 'card', box)
const st = el('div', 'status', card, '<span class="dot"></span>' + CONFIG.status)
const dot = st.firstChild; S(dot, { background: CONFIG.dotColor })
const defs = [
  { x: 36, w: 72, on: ['Mute', IC.mic], off: ['Unmute', IC.micOff] },
  { x: 156, w: 120, on: ['Stop video', IC.cam], off: ['Start video', IC.camOff] },
  { x: 300, w: 148, on: ['Share screen', IC.screen], off: ['Stop sharing', IC.screen] },
  { x: 472, w: 72, leave: true, on: ['Leave', IC.leave], off: ['Leave', IC.leave] },
]
const cols = defs.map((d) => {
  const c = el('div', 'col', card); S(c, { left: d.x - (d.w - 72) / 2 + 'px', width: d.w + 'px' })
  const b = el('div', 'btn', c)
  const mk = (p) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = p; s.style.cssText = 'position:absolute;width:28px;height:28px;fill:none;stroke:#d8d8db;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round'; return s }
  b.innerHTML = ''; const s1 = mk(d.on[1]), s2 = mk(d.off[1]); b.append(s1, s2)
  const l = el('div', 'lbl', c); const l1 = el('span', '', l, d.on[0]), l2 = el('span', '', l, d.off[0])
  if (d.leave) { S(b, { background: CONFIG.leaveColor, borderColor: CONFIG.leaveColor }); s1.style.stroke = '#fff'; s2.style.stroke = '#fff'; l.style.color = '#c4c4c8' }
  return { d, b, s1, s2, l1, l2 }
})
const cur = makeCursor(box)
// cursor path: rest -> button centres. button centre = col.x + 36, y = 134
const bx = (i) => defs[i].x + 36, by = 134
const path = [[0, 330, 235], [.5, bx(0) + 4, by + 6], [1.2, bx(0) + 4, by + 6], [2.1, bx(1) + 4, by + 6], [3.0, bx(1) + 4, by + 6], [3.9, bx(0) + 4, by + 6], [4.5, bx(0) + 4, by + 6], [4.9, bx(1) + 4, by + 6], [5.4, bx(1) + 4, by + 6], [6.2, 330, 235]]
function stateAt(t, i) { let on = true; for (const [ct, w] of CONFIG.clicks) if (w === i && t >= ct) on = !on; return on }
function swapAt(t, i) { let last = -9; for (const [ct, w] of CONFIG.clicks) if (w === i && t >= ct) last = ct; return last }
function render(t) {
  // status dot: soft ring that breathes (period 2s)
  const br = .5 + .5 * Math.sin(t * Math.PI)
  S(dot, { boxShadow: `0 0 0 ${3 + br * 3}px rgba(34,197,94,${.16 + .14 * br})` })
  cols.forEach((c, i) => {
    const on = stateAt(t, i), ls = swapAt(t, i)
    const q = ls < 0 ? 1 : clamp((t - ls) / CONFIG.swapSec)    // 0 -> 1 crossfade after a click
    const toOff = !on
    const fromA = c.d.leave ? 1 : (toOff ? 1 - q : q)           // opacity of the "on" icon
    const hasSwap = !c.d.leave
    S(c.s1, { opacity: hasSwap ? fromA : 1, transform: `scale(${hasSwap ? .8 + .2 * fromA : 1})` })
    S(c.s2, { opacity: hasSwap ? 1 - fromA : 0, transform: `scale(${hasSwap ? .8 + .2 * (1 - fromA) : 1})` })
    S(c.l1, { opacity: hasSwap ? fromA : 1 }); S(c.l2, { opacity: hasSwap ? 1 - fromA : 0 })
    if (hasSwap) {
      const mix = 1 - fromA                                   // 0 = on style, 1 = off style
      S(c.b, { background: `rgb(${lerp(30, 45, mix) | 0},${lerp(30, 43, mix) | 0},${lerp(32, 43, mix) | 0})`, borderColor: `rgb(${lerp(51, 74, mix) | 0},${lerp(51, 53, mix) | 0},${lerp(54, 53, mix) | 0})` })
    }
  })
  // press feedback on the button under the cursor click
  let press = 0, pi = -1
  CONFIG.clicks.forEach(([ct, w]) => { const p = seg(t, ct - .08, ct + .1); if (p > 0 && p < 1) { press = Math.sin(p * Math.PI); pi = w } })
  cols.forEach((c, i) => S(c.b.parentNode, { transform: `scale(${i === pi ? 1 - .06 * press : 1})` }))
  const [cx, cy] = kfp(t, path)
  setCursor(cur, cx, cy, press > .4)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
