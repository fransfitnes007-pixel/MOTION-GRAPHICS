<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#111}
.bub{position:absolute;height:62px;display:flex;align-items:center;font-size:26.5px;white-space:nowrap}
.nm{position:absolute;font-size:22px;font-weight:500;white-space:nowrap}
.av{position:absolute;width:57px;height:57px;border-radius:50%;overflow:hidden}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  messages: [                                     // side: 'start' = incoming (left, avatar, grey), 'end' = outgoing (right, black)
    { side: 'start', name: 'alex', text: 'Deploying to prod real quick.', avatar: 'a' },
    { side: 'end', text: "It's 4:55 PM. On a Friday.", status: 'Delivered' },
    { side: 'start', name: 'sam', text: "It's always a one-line change 😭", avatar: 'b' },
  ],
  incomingBg: '#f4f4f5', incomingText: '#111',   // incoming bubble colours
  outgoingBg: '#171717', outgoingText: '#fff',    // outgoing bubble colours
  statusColor: '#76767c',                         // "Delivered" caption
  firstAt: 0.35, gap: 0.8,                        // when the first message appears and the seconds between messages
  riseMs: 0.4,                                    // fade-up time per message
  rise: 14,                                       // px each message rises while it fades in
}
const DUR = 5.4
window.DUR = DUR
const BW = 960, BH = 720
const U = Math.min(W / BW, H / BH)
const root = el('div', 'abs', stage)
S(root, { left: '50%', top: '50%', width: BW + 'px', height: BH + 'px', marginLeft: -BW / 2 + 'px', marginTop: -BH / 2 + 'px', transform: `scale(${U})` })
const AV = {
  a: '<div style="width:100%;height:100%;background:radial-gradient(circle at 50% 38%,#f4c6a8 0 22%,transparent 23%),linear-gradient(140deg,#d63f8c,#5a3fc0)"></div>',
  b: '<svg viewBox="0 0 57 57" width="57" height="57"><rect width="57" height="57" fill="#0a0a0a"/><ellipse cx="22" cy="17" rx="4.5" ry="11" fill="#fff"/><ellipse cx="35" cy="17" rx="4.5" ry="11" fill="#fff"/><ellipse cx="28.5" cy="36" rx="13" ry="12" fill="#fff"/><circle cx="23.5" cy="35" r="1.8" fill="#0a0a0a"/><circle cx="33.5" cy="35" r="1.8" fill="#0a0a0a"/></svg>',
}
// vertical anchors measured from the preview: [name y, bubble y] for an incoming message, bubble y for outgoing
const Y = [[156, 192], [311], [472, 508]]
const items = CONFIG.messages.map((m, i) => {
  const g = el('div', 'abs', root); S(g, { left: '0', top: '0', width: BW + 'px', height: BH + 'px' })
  let bw
  const tmp = el('span', '', stage, m.text); S(tmp, { position: 'absolute', visibility: 'hidden', fontSize: '26.5px', whiteSpace: 'nowrap' }); bw = tmp.offsetWidth + 56; tmp.remove()
  if (m.side === 'start') {
    el('div', 'nm', g, m.name).style.cssText += `left:199px;top:${Y[i][0]}px`
    const av = el('div', 'av', g, AV[m.avatar]); S(av, { left: '128px', top: px(Y[i][1] + 3) })
    const b = el('div', 'bub', g, m.text); S(b, { left: '199px', top: px(Y[i][1]), width: px(bw), background: CONFIG.incomingBg, color: CONFIG.incomingText, padding: '0 28px', borderRadius: '31px 31px 31px 10px' })
  } else {
    const b = el('div', 'bub', g, m.text); S(b, { left: px(817 - bw), top: px(Y[i][0]), width: px(bw), background: CONFIG.outgoingBg, color: CONFIG.outgoingText, padding: '0 28px', borderRadius: '31px 31px 10px 31px' })
    if (m.status) { const s = el('div', 'abs', g, m.status); S(s, { right: px(BW - 817), top: px(Y[i][0] + 71), fontSize: '19px', color: CONFIG.statusColor }); g.status = s }
  }
  return g
})
function render(t) {
  const C = CONFIG
  const out = 1 - seg(t, DUR - .4, DUR)
  items.forEach((g, i) => {
    const a = C.firstAt + i * C.gap, p = eo(seg(t, a, a + C.riseMs))
    S(g, { opacity: p * out, transform: `translateY(${(1 - p) * C.rise}px)` })
    if (g.status) S(g.status, { opacity: eo(seg(t, a + .45, a + .85)) })
  })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
