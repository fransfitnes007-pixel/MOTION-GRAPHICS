<!doctype html>
<html><head><meta charset="utf-8"><title>Sticky command bar with live stats</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F6F9F7;
  --ink:#101C18; --muted:#5B6B64; --faint:#8A9A93;
  --accent:#0F6E4F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;
  --urgent:#A83C14; --urgent-soft:#F8E3DA;
  --line:#D7E0DB; --line-strong:#BCC9C3;
  --good:#8A6100;
  --shadow:0 1px 2px rgba(16,28,24,.06),0 4px 14px rgba(16,28,24,.05);
  --r:12px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* ---- command bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 10px}
.bar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat b{font-size:18px;font-weight:700}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.stat.urg b{color:var(--urgent)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}

/* ---- progress ---- */
.prog{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px;
  max-width:1080px;margin-inline:auto}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 14px}
.search{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink)}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--muted);
  padding:7px 12px;border-radius:99px;font:600 12.5px/1 Archivo,sans-serif;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.savepill{display:flex;align-items:center;gap:6px;font:600 10.5px/1 Archivo,sans-serif;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
.savepill i{width:7px;height:7px;border-radius:99px;background:var(--faint);display:block}
.savepill.ok i{background:var(--accent)} .savepill.ok{color:var(--accent);border-color:var(--accent)}
.savepill.busy i{background:var(--good)}
.savepill.off i{background:var(--urgent)} .savepill.off{color:var(--urgent);border-color:var(--urgent)}

/* ---- item row (collapsed) ---- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;color:inherit;font:inherit}
.num{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);
  border:1px solid var(--line);display:grid;place-items:center;font:600 11.5px/1 "IBM Plex Mono",monospace;color:var(--muted)}
.htxt{flex:1;min-width:0}
.htitle{font-weight:600;font-size:14.5px;letter-spacing:-.01em;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.price{flex:none;font:700 16px/1 "IBM Plex Mono",monospace}
@media (max-width:560px){
  .brand h1{font-size:15.5px}
  .stat b{font-size:16px}
}

#stage{background:var(--bg)}
.box{position:absolute;background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,'Helvetica Neue',Arial,sans-serif;overflow:hidden;border-radius:14px;box-shadow:0 20px 60px rgba(16,28,24,.18)}
.box .bar{margin-inline:0;position:absolute;left:0;right:0;top:0}
.box .scroll{position:absolute;left:16px;right:16px;top:0}
.item{box-shadow:var(--shadow)}
.prog i{transition:none}
.box .clip{position:absolute;left:0;right:0;top:88px;bottom:0;overflow:hidden;border-radius:0 0 14px 14px}
.box .bar{top:-3px;padding-top:15px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// fit: lay a fixed-width design box out at its own size, then scale it to fill the stage (works for wide and tall).
function fit(box, cw, fillW = .9, fillH = .88, h) {
  S(box, { position: 'absolute', width: cw + 'px' }); if (h) box.style.height = h + 'px'
  const hh = h || box.offsetHeight, s = Math.min(W * fillW / cw, H * fillH / hh)
  S(box, { left: ((W - cw) / 2) + 'px', top: ((H - hh) / 2) + 'px', transformOrigin: '50% 50%', transform: 'scale(' + s + ')' }); return s
}
// rev: fade + rise a node in over [t0, t0+d]
const rev = (e, t, t0, d = .45, dy = 14) => { const q = eo(seg(t, t0, t0 + d)); S(e, { opacity: q, transform: 'translateY(' + ((1 - q) * dy) + 'px)' }); return q }
const DUR = 6
window.DUR = DUR
const BAR_H = 92
const box = el('div', 'box')
const clip = el('div', 'clip', box)
const scroll = el('div', 'scroll', clip)
const controls = el('div', 'controls', scroll, '<input class="search" placeholder="Search items, keywords, categories…"><button class="chip" aria-pressed="true">All</button><button class="chip" aria-pressed="false">Not priced</button><button class="chip" aria-pressed="false">Group A</button><button class="chip" aria-pressed="false">Group B</button>')
S(controls, { marginTop: px(6) })
const N = 22
const rows = []
for (let i = 1; i <= N; i++) {
  const r = el('div', 'item', scroll, `<div class="head"><span class="num">${i}</span><span class="htxt"><span class="htitle">Sample listing title ${i}, short description of the item</span><span class="hmeta"><b style="font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#2C6E9B">Like new</b><span>Group ${i % 2 ? 'A' : 'B'}</span></span></span><span class="price mono">$${40 + (i * 37) % 260}</span></div>`)
  rows.push(r)
}
const bar = el('div', 'bar', box, `<div class="bar-in"><div class="brand"><h1>Pricing Console</h1><div class="sub">Sample City · ${N} listings</div></div><div class="stat urg"><b>12</b><span>Days left</span></div><div class="stat"><b class="mono" id="priced">0/${N}</b><span>Priced</span></div><div class="stat"><b class="mono" id="total">$0</b><span>Your total</span></div><div class="savepill" id="savepill"><i></i><span id="savetxt">Connecting</span></div><button class="iconbtn">◑</button></div><div class="prog"><i id="progbar"></i></div>`)
const $priced = bar.querySelector('#priced'), $total = bar.querySelector('#total'), $pill = bar.querySelector('#savepill'), $txt = bar.querySelector('#savetxt'), $prog = bar.querySelector('#progbar')
const CW = 1000
fit(box, CW, .92, .86, 600)

function render(t) {
  // bar drops in
  const q = eo5(seg(t, 0, .6)); S(bar, { opacity: q, transform: `translateY(${(1 - q) * -30}px)` })
  // list scrolls under the sticky bar
  const sc = eio(seg(t, 1, 5)); S(scroll, { transform: `translateY(${-sc * 560}px)` })
  // pricing progresses: one more item priced every ~0.19s between 1.0 and 5.2
  const n = Math.floor(seg(t, 1, 5.2) * N + 1e-6)
  const total = Math.round(Array.from({ length: n }, (_, i) => 40 + ((i + 1) * 37) % 260).reduce((a, b) => a + b, 0) * .8)
  $priced.textContent = `${n}/${N}`; $total.textContent = '$' + total.toLocaleString('en-US')
  S($prog, { width: (n / N * 100).toFixed(2) + '%' })
  // save pill: Connecting -> Saved -> Saving… -> Saved (each price edit writes)
  const busy = (t > 2.2 && t < 2.7) || (t > 4 && t < 4.4)
  const st = t < .8 ? ['', 'Connecting'] : busy ? ['busy', 'Saving…'] : ['ok', 'Saved']
  if ($pill.className !== 'savepill ' + st[0]) $pill.className = ('savepill ' + st[0]).trim()
  if ($txt.textContent !== st[1]) $txt.textContent = st[1]
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
