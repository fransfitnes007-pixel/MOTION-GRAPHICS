<!doctype html>
<html><head><meta charset="utf-8"><title>animated-number__slide-up-down-by-trend</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#0a0a0a;font-family:ui-sans-serif,system-ui,sans-serif}
.grp{position:absolute;left:0;top:0;display:flex;align-items:center;gap:16px;transform-origin:0 0}
.btn{width:36px;height:36px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)}
.btn svg{width:16px;height:16px}
.mid{display:flex;flex-direction:column;align-items:center;min-width:112px}
.num{position:relative;display:inline-flex;overflow:hidden;font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:-.03em;height:36px;align-items:center;justify-content:center;width:100%}
.num span{position:absolute;display:inline-block;line-height:1;white-space:nowrap}
.lab{font-size:13px;color:#737373}
.cur{position:absolute;width:22px;height:26px;left:0;top:0;pointer-events:none}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Rebuilt by eye from the live preview of @ikascom/animated-number (21st.dev): the number is swapped as a whole,
// the old one leaves 10px up and the new one comes in from 10px below on an increase (mirrored on a decrease).
const CONFIG = { start: 1208, label: 'orders', sep: '.', clicks: [[.9, 1], [1.5, 1], [2.1, 1], [3.0, 1], [3.2, 1], [3.4, 1], [4.3, -1], [4.9, -1], [5.5, -1], [6.1, -1], [6.4, -1], [6.7, -1]] }
const DUR = 8
window.DUR = DUR
// measured: progress of the incoming number (opacity and slide share one curve), ms -> 0..1
const CURVE = [[0, 0], [34, .12], [67, .35], [100, .57], [134, .73], [167, .84], [201, .91], [234, .95], [267, .98], [300, .99], [334, 1]]
const cv = (ms) => { if (ms <= 0) return 0; if (ms >= 334) return 1; for (let i = 1; i < CURVE.length; i++) if (ms <= CURVE[i][0]) { const [a, p] = CURVE[i - 1], [b, q] = CURVE[i]; return p + (q - p) * (ms - a) / (b - a) } return 1 }
const fmt = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, CONFIG.sep)
const ICON = { '-': '<path d="M5 12h14"/>', '+': '<path d="M5 12h14"/><path d="M12 5v14"/>' }
const grp = el('div', 'grp')
const mk = (k) => { const b = el('div', 'btn', grp, `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`); return b }
const bm = mk('-'); const mid = el('div', 'mid', grp); const num = el('div', 'num', mid); const lab = el('div', 'lab', mid); lab.textContent = CONFIG.label; const bp = mk('+')
const cur = el('div', 'cur'); cur.innerHTML = '<svg viewBox="0 0 22 26"><path d="M3 2l15 9-7 1.800L8 19z" fill="#111" stroke="#fff" stroke-width="1.600" stroke-linejoin="round"/></svg>'
const GW = 216, GH = 54, sc = TALL ? W * .84 / GW : Math.min(H * .22 / GH, W * .5 / GW)
S(grp, { width: GW + 'px', height: GH + 'px', transform: `translate(${CX - GW * sc / 2}px,${CY - GH * sc / 2}px) scale(${sc})` })
// each shown value is an instance with an enter time and (when replaced) an exit time
const clicks = CONFIG.clicks, inst = [{ v: CONFIG.start, te: -9, dIn: 1, tx: null, dOut: 0 }]
let v = CONFIG.start
clicks.forEach(([tc, d]) => { const last = inst[inst.length - 1]; last.tx = tc; last.dOut = d; v += d; inst.push({ v, te: tc, dIn: d, tx: null, dOut: 0 }) })
const spans = inst.map((i) => el('span', '', num)); spans.forEach((s, k) => { s.textContent = fmt(inst[k].v) })
function render(t) {
  inst.forEach((i, k) => {
    const pin = cv((t - i.te) * 1000), pout = i.tx == null ? 0 : cv((t - i.tx) * 1000)
    const op = pin * (1 - pout), y = i.dIn * 10 * (1 - pin) - i.dOut * 10 * pout
    const s = spans[k]; vis(s, op > .002); s.style.opacity = op; s.style.transform = `translateY(${y}px)`
  })
  // pointer visits the button for each click, press dip 0.12s, button tint while held
  let pt = null, hold = 0
  const ev = clicks.map(([tc, d]) => ({ tc, d }))
  let prev = { x: GW / 2 + 40, y: GH + 40 }
  const pos = (d) => d > 0 ? { x: GW - 18, y: GH / 2 + 4 } : { x: 18, y: GH / 2 + 4 }
  let cx = prev.x, cy = prev.y, show = 0
  for (let i = 0; i < ev.length; i++) {
    const a = pos(ev[i].d), tc = ev[i].tc
    const from = i ? pos(ev[i - 1].d) : prev, t0 = i ? ev[i - 1].tc + .12 : tc - .55
    const gap = tc - .0 - t0
    if (t >= t0 - .0001) { const p = eio(seg(t, t0, tc - .05)); cx = lerp(from.x, a.x, p); cy = lerp(from.y, a.y, p); show = 1 }
  }
  const last = ev[ev.length - 1].tc; if (t > last + .5) { const p = eo(seg(t, last + .5, last + 1.1)); show = 1 - p }
  if (t < ev[0].tc - .55) show = 0
  let press = 0; ev.forEach((e) => { const x = (t - e.tc); if (x >= 0 && x < .22) press = Math.max(press, 1 - Math.abs(x - .11) / .11) })
  const act = ev.filter((e) => t >= e.tc && t < e.tc + .16).map((e) => e.d)
  bm.style.background = act.includes(-1) ? '#f5f5f5' : '#fff'; bp.style.background = act.includes(1) ? '#f5f5f5' : '#fff'
  S(cur, { opacity: show, transform: `translate(${CX - GW * sc / 2 + cx * sc}px,${CY - GH * sc / 2 + cy * sc}px) scale(${sc * (1 - .14 * press)})` })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
