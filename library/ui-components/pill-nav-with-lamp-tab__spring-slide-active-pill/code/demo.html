<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;font-family:'Inter',-apple-system,'SF Pro Text',system-ui,sans-serif}
.nav{position:absolute;background:#fff;border:1px solid #e9e9ec;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04)}
.pill{position:absolute;background:#e8e8e8;border-radius:999px}
.lamp{position:absolute;background:#141414;border-radius:6px 6px 2px 2px}
.glow{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 0%,rgba(0,0,0,.38),rgba(0,0,0,.12) 55%,transparent 75%);filter:blur(4px)}
.it{position:absolute;text-align:center;font-size:27px;line-height:64px;white-space:nowrap}
.cur{position:absolute;left:0;top:0;width:30px;height:30px;pointer-events:none}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Tubelight navbar: a white pill nav. The active tab gets a grey pill and a black "lamp" tab on the bar's top edge with a soft shadow glow; both slide to the clicked tab with a spring.
const CONFIG = {
  items: ['Home', 'About', 'Projects', 'Resume'],
  bar: { w: 800, h: 90 },               // px
  padX: 8,                              // px: space between the bar edge and the first tab
  pillH: 70,                            // active background height
  lampW: 58, lampH: 10,                 // the bright tab on the top edge
  spring: { k: 7.5, f: 9 }, moveSec: .55,
  clicks: [[1.0, 1], [2.3, 2], [3.4, 3], [4.5, 0]],   // [time, tab index]; starts on tab 0
  dur: 5.6,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const bx = CX - C.bar.w / 2, by = CY - C.bar.h / 2
const nav = el('div', 'nav', stage); S(nav, { left: px(bx), top: px(by), width: px(C.bar.w), height: px(C.bar.h) })
const pill = el('div', 'pill', nav), glow = el('div', 'glow', nav), lamp = el('div', 'lamp', nav)
const its = C.items.map((n) => el('div', 'it', nav, n))
// lay the tabs out: measure text at bold weight so the layout does not shift when the active one turns bold
its.forEach((e) => { e.style.fontWeight = 700 }); const slotW = (C.bar.w - 2 * C.padX) / its.length, pw = its.map((e) => e.offsetWidth + 72)   // tabs share the bar equally; the active pill hugs the text
const rects = []
its.forEach((e, i) => { const c = C.padX + (i + .5) * slotW; rects.push([c - pw[i] / 2, pw[i]]); S(e, { left: px(c - slotW / 2), width: px(slotW), top: px((C.bar.h - 64) / 2 - 1) }) })
const cur = el('div', 'cur'); const ARROW = '<svg viewBox="0 0 22 22" width="30" height="30"><path d="M3 2 L3 17 L7 13.5 L10 20 L12.5 19 L9.6 12.6 L15 12.4 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const HAND = '<svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 3a1.5 1.5 0 0 1 3 0v6.5l1-.5a1.5 1.5 0 0 1 2 .7l.3.4 1.2-.2a1.5 1.5 0 0 1 1.5 1.5V17c0 3-2 5-5 5h-2c-2 0-3.3-1-4.3-2.6L4 15a1.5 1.5 0 0 1 2.4-1.7L9 16Z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>'
let kindNow = ''
function pos(t) { let from = 0, to = 0, te = -9; for (const [tt, i] of C.clicks) if (t >= tt) { from = to; to = i; te = tt } ; return [from, to, spring(seg(t, te, te + C.moveSec), C.spring.k, C.spring.f)] }
function render(t) {
  const [a, b, k] = pos(t)
  const x = lerp(rects[a][0], rects[b][0], k), w = lerp(rects[a][1], rects[b][1], k), cxm = x + w / 2
  S(pill, { left: px(x + 2), width: px(w - 4), top: px((C.bar.h - C.pillH) / 2 - 1), height: px(C.pillH) })
  const stretch = Math.abs(rects[b][0] - rects[a][0]) * Math.sin(Math.PI * clamp(k)) * .0
  S(lamp, { left: px(cxm - C.lampW / 2), top: px(-C.lampH + 3), width: px(C.lampW), height: px(C.lampH) })
  S(glow, { left: px(cxm - C.lampW * 1.0), top: px(-4), width: px(C.lampW * 2), height: px(38) })
  its.forEach((e, i) => { const act = clamp(1 - Math.abs(lerp(a, b, clamp(k)) - i) * 1.5); S(e, { color: `rgb(${Math.round(lerp(96, 12, act))},${Math.round(lerp(96, 12, act))},${Math.round(lerp(100, 12, act))})`, fontWeight: act > .55 ? 700 : 500 }) })
  // cursor: arrow rests low-left, then visits each tab as a hand
  const rest = [bx + 30, by + C.bar.h + 120]
  const stops = [[0, ...rest], ...C.clicks.map(([tt, i]) => [tt, bx + rects[i][0] + rects[i][1] / 2 + 12, by + C.bar.h / 2 + 18]), [C.dur - .3, ...rest]]
  let cx = rest[0], cy = rest[1]
  for (let j = 0; j < stops.length - 1; j++) if (t >= stops[j][0] && t <= stops[j + 1][0]) { const kk = eio(seg(t, Math.max(stops[j][0], stops[j + 1][0] - .75), stops[j + 1][0])); cx = lerp(stops[j][1], stops[j + 1][1], kk); cy = lerp(stops[j][2], stops[j + 1][2], kk) }
  if (t > stops[stops.length - 1][0]) { cx = rest[0]; cy = rest[1] }
  const over = cy < by + C.bar.h + 20 && cy > by - 10
  const kind = over ? 'h' : 'a'
  if (kind !== kindNow) { cur.innerHTML = over ? HAND : ARROW; kindNow = kind }
  let press = 0; for (const [tt] of C.clicks) press = Math.max(press, clamp(1 - Math.abs(t - tt) / .1))
  S(cur, { transform: `translate(${cx - (over ? 10 : 0)}px,${cy - (over ? 4 : 0)}px) scale(${1 - .15 * press})` })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
