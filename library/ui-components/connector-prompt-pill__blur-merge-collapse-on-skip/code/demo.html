<!doctype html>
<html><head><meta charset="utf-8"><title>Connector prompt pill</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff}
.pill{position:absolute;left:0;top:0;width:560px;height:86px;border-radius:43px;background:#fff;border:2px solid #dedede}
.cmp{position:absolute;left:0;top:100px;width:560px;height:170px;border-radius:40px;background:#fbfbfb;border:2px solid #dedede}
.lg{position:absolute;left:31px;top:19px;width:44px;height:44px;border-radius:8px;border:3px solid #0b0b0b;background:#fff;display:grid;place-items:center;font:800 27px/1 Georgia,serif;color:#0b0b0b;box-shadow:3px 3px 0 #0b0b0b}
.eb{position:absolute;left:87px;top:16px;font-size:15px;color:#666;letter-spacing:.01em}
.pn{position:absolute;left:87px;top:34px;font-size:23px;font-weight:600;color:#0d0d0d}
.skip{position:absolute;left:350px;top:0;height:82px;line-height:82px;font-size:20px;font-weight:600;color:#4d4d4d}
.con{position:absolute;left:416px;top:19px;width:124px;height:44px;line-height:42px;text-align:center;border-radius:22px;border:1.5px solid #dfe1f8;font-size:20px;font-weight:600;color:#1f4fc4;background:#fff}
.ph{position:absolute;left:30px;top:22px;font-size:24px;color:#4f4f4f}
.snd{position:absolute;left:496px;top:104px;width:44px;height:44px;border-radius:50%;background:#dcdcdc;display:grid;place-items:center}
.foc{position:absolute;left:12px;top:12px;width:508px;height:50px;border:2px solid #4c5fd1;border-radius:3px}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  provider: 'Notion', eyebrow: 'MCP Connector', placeholder: 'Ask anything...',
  connectLabel: 'Connect', skipLabel: 'Skip',
  hoverBorder: '#8f95d9',     // outline colour on both pieces when the pill is hovered
  restBorder: '#dedede',
  hoverAt: .8, skipClickAt: 2.3,       // seconds: cursor reaches Connect, cursor clicks Skip
  collapseSec: .55,                     // the original does this in about 0.15s; slowed down to read
  resetAt: 5.2, resetSec: .6,           // the pill comes back so the demo loops
  gap: 14,
}
const DUR = 6.6
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const box = fitBox(560, 270, .6)
const stack = el('div', 'abs', box); S(stack, { left: 0, top: 0, width: '560px', height: '270px' })
const cmp = el('div', 'cmp', stack)
const pill = el('div', 'pill', stack)
el('div', 'lg', pill, 'N'); el('div', 'eb', pill, CONFIG.eyebrow); el('div', 'pn', pill, CONFIG.provider)
const skip = el('div', 'skip', pill, CONFIG.skipLabel); const con = el('div', 'con', pill, CONFIG.connectLabel)
const ph = el('div', 'ph', cmp, CONFIG.placeholder)
const snd = el('div', 'snd', cmp, '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>')
const foc = el('div', 'foc', cmp)
const cur = makeCursor(box)
const conC = [478, 41], skC = [378, 41]
const path = [[0, 560, 160], [.5, conC[0] + 12, conC[1] + 4], [1.5, conC[0] + 12, conC[1] + 4], [2.0, skC[0] + 4, skC[1] + 4], [3.0, skC[0] + 4, skC[1] + 4], [3.6, 600, 230], [DUR, 600, 230]]
function render(t) {
  const c0 = CONFIG.skipClickAt
  const out = eio(clamp((t - c0) / CONFIG.collapseSec)) * (t < CONFIG.resetAt ? 1 : 1 - eio(clamp((t - CONFIG.resetAt) / CONFIG.resetSec)))
  const [cx, cy] = kfp(t, path)
  const over = t < c0 && cx > 0 && cx < 560 && cy > 0 && cy < 86 && t > CONFIG.hoverAt - .2
  const hb = over ? CONFIG.hoverBorder : CONFIG.restBorder
  const dy = (86 + CONFIG.gap) / 2
  S(cmp, { transform: `translateY(${-dy * out}px)`, borderColor: hb })
  S(pill, { transform: `translateY(${(86 + CONFIG.gap) * .5 * out}px) scale(${1 - .08 * out})`, opacity: 1 - clamp(out * 1.25), filter: `blur(${out * 7}px)`, borderColor: hb })
  vis(pill, out < .999)
  S(con, { borderColor: over && cx > 416 ? '#aab2f0' : '#dfe1f8', background: over && cx > 416 ? '#f6f7ff' : '#fff' })
  const f = out > .5 ? clamp((out - .5) * 2) : 0
  S(foc, { opacity: f }); S(ph, { color: '#4f4f4f' })
  const pr = t > c0 - .06 && t < c0 + .12
  setCursor(cur, cx, cy, pr, t > .1 && t < 4.3)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
