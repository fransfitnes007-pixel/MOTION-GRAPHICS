<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#121212;color:#fff}
.card{position:absolute;width:400px;border-radius:24px;padding:16px 16px 18px;background:#18181a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:14px;font-weight:600;color:#fafafa;line-height:20px}
.card p{font-size:14px;color:#a1a1aa;line-height:20px;margin-top:2px}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:var(--link);position:relative;align-self:flex-start}
.lnk .ar{display:inline-block}
.lnk .ul{position:absolute;left:0;bottom:-1px;height:1px;background:var(--link);width:100%;transform-origin:0 50%}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- shared helpers (keyframes, scripted cursor, fixed 1280x800 design space scaled to fit) ----
const kf = (t, k, ez = eio) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; return va + (vb - va) * ez((t - a) / (b - a)) } return k[k.length - 1][1] }
const CURSOR_SVG = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 2.5l15 8-6.4 2L9.6 19.5z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
// pts: [[time, x, y, pressed?], ...]  (x, y in the 1280x800 design space); eases between points
const cursorAt = (t, pts, ez = eio) => { let r = { x: pts[0][1], y: pts[0][2], p: 0 }; if (t <= pts[0][0]) return r
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if (t <= b[0]) { const u = ez((t - a[0]) / Math.max(1e-6, b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), p: b[3] && a[3] ? 1 : (t > b[0] - .08 && b[3]) || (a[3] && t < a[0] + .08) ? 1 : 0 } } }
  const l = pts[pts.length - 1]; return { x: l[1], y: l[2], p: l[3] ? 1 : 0 } }
const root = el('div', 'abs'); const U = Math.min(W / 1280, H / 800)
S(root, { width: '1280px', height: '800px', left: px((W - 1280) / 2), top: px((H - 800) / 2), transform: `scale(${U})`, transformOrigin: '50% 50%' })
const cur = el('div', 'abs', root, CURSOR_SVG); S(cur, { left: 0, top: 0, zIndex: 99, pointerEvents: 'none', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' })
const putCursor = (c) => S(cur, { transform: `translate(${c.x - 4}px,${c.y - 2.5}px) scale(${c.p ? .88 : 1})`, opacity: c.show === 0 ? 0 : 1 })
// ---- end shared ----

const CONFIG = {
  scale: 2,                       // size of the card on the 1280x800 canvas
  title: 'Become an Acme Creator!',
  body: 'Visit the Acme Creator Hub to sign up today and start earning credits from your fans and followers.',
  link: 'Creator Hub',            // footer link text (the arrow is added after it)
  accent: '#60a5fa',              // icon and link colour
  enterAt: .2,                    // seconds before the card fades in
}
const DUR = 6
window.DUR = DUR
stage.style.setProperty('--link', CONFIG.accent)
const ICON = `<svg width="24" height="24" viewBox="0 0 16 16" fill="none" style="color:${CONFIG.accent}"><path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M13.5 8a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0M15 8A7 7 0 1 1 1 8a7 7 0 0 1 14 0M8.75 4.25a.75.75 0 0 0-1.5 0v.339a2.5 2.5 0 0 0-1.007.47 1.95 1.95 0 0 0-.74 1.546c0 .764.474 1.265.94 1.559.456.287 1.007.448 1.448.547.462.102.843.191 1.118.341.228.125.275.224.275.376 0 .102-.04.217-.248.341-.224.135-.577.229-.982.229-.344 0-.683-.114-.953-.29-.281-.184-.42-.388-.457-.506a.75.75 0 1 0-1.43.452c.171.543.591 1 1.068 1.31.284.185.612.335.968.429v.357a.75.75 0 0 0 1.5 0v-.313c.375-.067.74-.19 1.058-.382.53-.319.976-.864.976-1.627 0-.864-.51-1.394-1.055-1.692-.478-.26-1.056-.389-1.46-.478l-.053-.012c-.386-.086-.736-.202-.973-.352-.227-.142-.24-.236-.24-.29a.45.45 0 0 1 .18-.375c.134-.108.403-.227.87-.227.47 0 .742.11.9.218a.83.83 0 0 1 .316.41.75.75 0 0 0 1.407-.52 2.33 2.33 0 0 0-.878-1.13 2.7 2.7 0 0 0-1.048-.417z"/></svg>`
const card = el('div', 'card', root, `${ICON}<div><h3>${CONFIG.title}</h3><p>${CONFIG.body}</p></div>`)
const lnk = el('a', 'lnk', card, `${CONFIG.link}<span class="ar">↗</span><span class="ul"></span>`)
const ar = lnk.querySelector('.ar'), ul = lnk.querySelector('.ul')
const cw = 400 * CONFIG.scale, ch = card.offsetHeight * CONFIG.scale
S(card, { left: px(640 - 200), top: px(400 - card.offsetHeight / 2), transformOrigin: '50% 50%' })
// link centre on the canvas, for the scripted cursor
const lx = 640 - cw / 2 + (16 + 40) * CONFIG.scale, ly = 400 + ch / 2 - (18 + 10) * CONFIG.scale
const P = [[0, 1000, 650, 0], [2, 1000, 650, 0], [2.9, lx, ly, 0], [3.0, lx, ly, 0], [4.6, lx, ly, 0], [5.4, 1000, 650, 0], [6, 1000, 650, 0]]
function render(t) {
  const a = eo(seg(t, CONFIG.enterAt, CONFIG.enterAt + .7))
  const hov = seg(t, 2.8, 3.0) * (1 - seg(t, 4.6, 4.8))
  S(card, { opacity: a, transform: `translateY(${(1 - a) * 24}px) scale(${CONFIG.scale * (.96 + .04 * a)})` })
  S(ar, { transform: `translate(${hov * 2}px,${-hov * 2}px)` })
  S(ul, { transform: `scaleX(${hov})` })
  putCursor(cursorAt(t, P))
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
