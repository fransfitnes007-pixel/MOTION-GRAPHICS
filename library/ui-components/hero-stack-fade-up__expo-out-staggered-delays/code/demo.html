<!doctype html>
<html><head><meta charset="utf-8"><title>Hero stack fade-up</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.pg{position:absolute;inset:0;background:linear-gradient(180deg,#fff 0%,#f5f6f8 55%,#e6e8ec 100%)}
.wash{position:absolute;left:0;right:0;top:0;height:75%;background:radial-gradient(60% 60% at 50% 0%,rgba(37,99,235,.11),rgba(14,165,233,.04) 45%,transparent 72%)}
.ff{position:absolute;left:0;right:0;text-align:center;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#0b0c10}
.mark{position:absolute;left:50%;top:28px;width:300px;margin-left:-150px;text-align:center;font:900 54px/1 -apple-system,'SF Pro Display',system-ui,sans-serif;letter-spacing:-.045em}
.mark span{background:linear-gradient(180deg,#3a3d46 0%,#13151b 45%,#6a6e79 55%,#1a1c22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 22px rgba(15,17,26,.18)) drop-shadow(0 0 60px rgba(37,99,235,.16))}
.h1{margin:0;font-size:60px;font-weight:700;letter-spacing:-.025em;line-height:1.04}
.h1 .g{display:block;background:linear-gradient(90deg,#1D4ED8 0%,#2563EB 45%,#0EA5E9 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.p{margin:0 auto;font-size:17px;line-height:1.6;color:#5c606b;max-width:640px}
.btns{display:flex;justify-content:center;gap:16px}
.cta{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:12px;font:600 14px/1 -apple-system,'SF Pro Display',system-ui,sans-serif;color:#d4d4d8;text-shadow:0 1px 2px rgba(0,0,0,.6);border:3.5px solid transparent;
  background:linear-gradient(180deg,#1c1c1f 0%,#000 100%) padding-box,conic-gradient(from var(--metal-a),transparent 0 7%,rgba(255,214,120,.95) 9%,rgba(255,255,255,1) 10.5%,rgba(150,190,255,.95) 12%,rgba(196,140,255,.7) 13.5%,transparent 16% 55%,rgba(170,210,255,.9) 58%,rgba(255,255,255,.95) 59.5%,rgba(255,190,140,.8) 61%,transparent 64% 100%) border-box,linear-gradient(180deg,#f2f2f4 0%,#c6c6cb 30%,#8d8d93 62%,#b9b9be 100%) border-box;
  box-shadow:0 0 0 1px rgba(0,0,0,.28),0 2px 5px rgba(0,0,0,.15),0 9px 9px rgba(0,0,0,.12),0 20px 12px rgba(0,0,0,.08),0 36px 14px rgba(0,0,0,.02)}
.glass{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:12px;font:600 14px/1 -apple-system,'SF Pro Display',system-ui,sans-serif;color:#0b0c10;background:rgba(255,255,255,.28);
  box-shadow:0 0 6px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.08),inset 3px 3px .5px -3px rgba(0,0,0,.9),inset -3px -3px .5px -3px rgba(0,0,0,.85),inset 1px 1px 1px -.5px rgba(0,0,0,.6),inset -1px -1px 1px -.5px rgba(0,0,0,.6),inset 0 0 6px 6px rgba(0,0,0,.12),inset 0 0 2px 2px rgba(0,0,0,.06),0 0 12px rgba(255,255,255,.15)}
.film{position:absolute;left:50%;width:640px;margin-left:-320px;border-radius:24px;border:1px solid rgba(11,12,16,.1);background:#000;overflow:hidden;box-shadow:0 40px 120px -40px rgba(37,99,235,.55)}
.film .v{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#1e293b,#0b1220 60%,#1d4ed8)}
.film .hl{position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(ellipse at 50% 0%,rgba(37,99,235,.35),transparent 65%)}
.play{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:9999px}
.play .ping{position:absolute;inset:0;border-radius:9999px;background:rgba(37,99,235,.6)}
.watch{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);border-radius:9999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);padding:6px 16px;font:600 12px -apple-system,system-ui,sans-serif;color:#fff}
.halo{position:absolute;left:50%;top:0;width:900px;height:260px;margin-left:-450px;background:radial-gradient(ellipse at 50% 0%,rgba(37,99,235,.22),transparent 65%)}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }
// a CSS-transition-like value: events [{t, to, dur, delay, ease}] each start from wherever the value was when they began (interrupts are continuous)
const animTo = (t, init, events, i = events.length - 1) => {
  if (i < 0) return init
  const e = events[i], start = e.t + (e.delay || 0)
  if (t < start) return animTo(t, init, events, i - 1)
  const from = animTo(start, init, events, i - 1), p = clamp((t - start) / e.dur)
  return from + (e.to - from) * (e.ease || EASE.easeOut)(p)
}

const DUR = 6
window.DUR = DUR
const box = fitBox(1000, 640, '#f5f6f8')
el('div', 'pg', box); el('div', 'wash', box)
const ARW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
const BLD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18zM6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>'
el('div', 'mark', box, '<span>WORDMARK</span>')
const h1 = el('div', 'ff', box, '<h1 class="h1"><span style="display:block">Content that sells,</span><span class="g">in every niche.</span></h1>'); S(h1, { top: '104px' })
const p = el('div', 'ff', box, '<p class="p">We build, brief and run creator teams for apps, films and consumer brands: the formats, the creators, the posting, the tracking and the payouts.</p>'); S(p, { top: '248px' })
const btns = el('div', 'ff', box, `<div class="btns"><span class="cta">Book a strategy call ${ARW}</span><span class="glass">${BLD} Apply for a business account</span></div>`); S(btns, { top: '344px' })
const filmWrap = el('div', 'ff', box); S(filmWrap, { top: '424px', height: '300px' })
const halo = el('div', 'halo', filmWrap)
const film = el('div', 'film', filmWrap, '<div class="v"><div class="hl"></div><div class="play cta" style="padding:0;position:absolute"><span class="ping"></span><svg style="position:relative;margin-left:6px" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></div><span class="watch">Watch the film</span></div>')
S(film, { top: '0px' })
const ctas = [$(btns, '.cta'), $(film, '.play')], ping = $(film, '.ping')
// motion.h1 / p / buttons: initial { opacity 0, y 20 }, duration .8, delays .1 .2 .3; film initial y 32, duration .9, delay .45; ease [.16, 1, .3, 1]
const fade = (e, t, delay, dur, dy) => { const q = EASE.expo(clamp((t - T0 - delay) / dur)); S(e, { opacity: String(q.toFixed(4)), transform: `translateY(${((1 - q) * dy).toFixed(2)}px)` }) }
const T0 = .4
function render(t) {
  fade(h1, t, .1, .8, 20); fade(p, t, .2, .8, 20); fade(btns, t, .3, .8, 20); fade(filmWrap, t, .45, .9, 32)
  const a = ((t / 6) % 1 * 360 * 1).toFixed(2) + 'deg'    // the metal rim turns once per 6s, as in the CTA
  ctas.forEach((c) => c.style.setProperty('--metal-a', a))
  const pp = bez(0, 0, .2, 1)(clamp((t % 1) / .75)); S(ping, { transform: `scale(${1 + pp})`, opacity: String(1 - pp) })
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
