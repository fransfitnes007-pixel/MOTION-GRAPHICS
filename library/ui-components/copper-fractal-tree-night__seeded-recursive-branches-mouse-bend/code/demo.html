<!doctype html>
<html><head><meta charset="utf-8"><title>mengto-generative-tree</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#07060a}
canvas{position:absolute;left:0;top:0}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const U = Math.min(W / 1280, H / 800)   // the board below is 1280x800 and scaled to fit any ?w=&h=
const root = el('div', 'abs'); S(root, { left: px(CX - 640), top: px(CY - 400), width: '1280px', height: '800px', transform: `scale(${U})`, transformOrigin: '50% 50%' })

const CONFIG = {
  seed: 7,                  // change for a different tree shape
  depth: 12,                // levels of splitting; each level doubles the twig count
  trunkLen: 160,            // px, first segment length on the 1280x800 board
  trunkWidth: 6,            // px at the base, shrinks by `taper` each level
  taper: .74,
  shrink: [.66, .8],        // length multiplier per level, random between the two
  spread: [15, 44],          // degrees each child leans off its parent, random between the two
  copper: [150, 82, 34],    // thick wood colour
  leaf: [120, 112, 80],     // thin twig tips, drawn dim and additive so they read as a cloud
  sway: .02,                // radians of wind sway at the tips
  mouseBend: .34,           // radians a branch leans away from the cursor
  mouseRadius: 150,         // px
  dust: 46,                 // background specks
}
const DUR = 5
window.DUR = DUR
root.remove()
const cv = el('canvas'); cv.width = W; cv.height = H
const g = cv.getContext('2d')

const mul32 = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
const dust = (() => { const r = mul32(99); return Array.from({ length: CONFIG.dust }, () => ({ x: r() * 1280, y: r() * 800, a: .05 + r() * .12, s: .6 + r() * 1.2 })) })()

let rng, cur
function branch(x, y, ang, len, d, w, t) {
  const C = CONFIG
  const ph = rng() * 6.283
  const tip = d / C.depth
  const sway = Math.sin(t / DUR * 6.283 + ph + d * .6) * C.sway * (.3 + tip * 1.4)
  let a = ang + sway
  // lean away from the cursor, stronger on the thin outer twigs
  const dx = x - cur.x, dy = y - cur.y, dist = Math.hypot(dx, dy)
  if (dist < C.mouseRadius) a += Math.sign(dx || 1) * C.mouseBend * (1 - dist / C.mouseRadius) ** 2 * (.3 + tip)
  const x2 = x + Math.sin(a) * len, y2 = y - Math.cos(a) * len
  const col = C.copper.map((c, i) => c + (C.leaf[i] - c) * tip)
  g.strokeStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${.78 - tip * .6})`
  g.lineWidth = Math.max(.45, w)
  g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke()
  if (d >= C.depth) return
  const n = d < 2 ? 2 : (rng() < .12 ? 3 : 2)
  for (let i = 0; i < n; i++) {
    const side = n === 2 ? (i ? 1 : -1) : i - 1
    const lean = (C.spread[0] + rng() * (C.spread[1] - C.spread[0])) * Math.PI / 180 * (d < 2 ? .55 : 1)
    const k = C.shrink[0] + rng() * (C.shrink[1] - C.shrink[0])
    branch(x2, y2, a + side * lean + (rng() - .5) * .08, len * k * (d === 0 ? 1.05 : 1), d + 1, w * C.taper, t)
  }
}

function render(t) {
  const C = CONFIG
  cur = { x: lerp(300, 980, eio(seg(t, .3, 4.2))), y: lerp(300, 330, Math.sin(t / DUR * 6.283 * 2) * .5 + .5) }
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.fillStyle = '#08070a'; g.fillRect(0, 0, W, H)
  g.setTransform(U, 0, 0, U, CX - 640 * U, CY - 400 * U)
  const glow = g.createRadialGradient(640, 330, 20, 640, 330, 520); glow.addColorStop(0, 'rgba(70,40,18,.28)'); glow.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = glow; g.fillRect(0, 0, 1280, 800)
  for (const p of dust) { g.fillStyle = `rgba(200,170,120,${p.a})`; g.fillRect(p.x, (p.y - t * 2) % 800 + (p.y - t * 2 < 0 ? 800 : 0), p.s, p.s) }
  g.lineCap = 'round'; g.globalCompositeOperation = 'lighter'
  rng = mul32(C.seed)
  branch(640, 800, 0, C.trunkLen, 0, C.trunkWidth, t)
  g.globalCompositeOperation = 'source-over'
  // cursor
  const cx = CX - 640 * U + cur.x * U, cy = CY - 400 * U + cur.y * U
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy + 15 * U); g.lineTo(cx + 4 * U, cy + 11.5 * U); g.lineTo(cx + 10 * U, cy + 11 * U); g.closePath(); g.fill()
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
