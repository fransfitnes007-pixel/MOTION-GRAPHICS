<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0a0a0a;color:#e8e8ea}
.bar{position:absolute;background:#171717;border:1px solid #2a2a2a;border-radius:24px}
.ph,.typed{position:absolute;left:32px;top:28px;font-size:23px;white-space:nowrap}
.ph{color:#8f8f95}
.send{position:absolute;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.caret{position:absolute;top:28px;width:2px;height:28px;background:#e8e8ea}
.status{position:absolute;font-size:15px;color:#6f6f76;text-align:center;left:0;right:0}
svg{display:block}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Input bar: a dark message box with a round send button. The clip shows only the resting state (placeholder, dim button); typing, sending and the stop state here follow the usage props (onSend, onStop, status) and are the recreation's own sequence.
const CONFIG = {
  placeholder: 'Send a message...',
  message: 'Summarise the last order thread',   // typed in the demo
  bar: { w: 672, h: 144 },                      // px, resting size from the clip
  typeStart: 1.1, charsPerSec: 14,              // typing speed
  sendAt: 3.9,                                  // time the message is sent
  streamSec: 1.8,                               // how long the stop button shows (status = streaming)
  dur: 8,
}
const C = CONFIG
const DUR = C.dur
window.DUR = DUR
const bx = CX - C.bar.w / 2, by = CY - C.bar.h / 2
const bar = el('div', 'bar'); S(bar, { left: px(bx), top: px(by), width: px(C.bar.w), height: px(C.bar.h) })
const ph = el('div', 'ph', bar, C.placeholder)
const typed = el('div', 'typed', bar)
const caret = el('div', 'caret', bar)
const send = el('div', 'send', bar); S(send, { left: px(C.bar.w - 52 - 20), top: px(C.bar.h - 52 - 20) })
send.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" class="ar"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="18" height="18" viewBox="0 0 24 24" class="sq" style="position:absolute"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>'
const status = el('div', 'status', stage); S(status, { top: px(by + C.bar.h + 24) })
const ar = send.querySelector('.ar'), sq = send.querySelector('.sq')
function render(t) {
  const n = clamp(Math.floor((t - C.typeStart) * C.charsPerSec), 0, C.message.length)
  const streaming = t >= C.sendAt && t < C.sendAt + C.streamSec
  const sent = t >= C.sendAt
  const text = sent ? '' : C.message.slice(0, n)
  typed.textContent = text
  S(ph, { opacity: text ? 0 : 1 })
  const hasText = text.length > 0
  // caret sits after the typed text while typing, blinks at rest
  const w = typed.offsetWidth
  const blink = Math.floor(t * 2) % 2 === 0
  S(caret, { left: px(32 + w + 2), opacity: (t >= C.typeStart - .2 && !sent && blink) || (t >= C.typeStart && t < C.sendAt - .3 && !sent) ? 1 : 0 })
  // send button: dim at rest, white when there is text, white with a square while streaming
  const on = hasText ? eo(clamp((t - C.typeStart) / .15)) : streaming ? 1 : 0
  const press = clamp(1 - Math.abs(t - C.sendAt) / .14)
  S(send, { background: streaming ? '#e8e8ea' : `rgb(${lerp(38, 232, on)},${lerp(38, 232, on)},${lerp(38, 234, on)})`, color: streaming || hasText ? '#111' : '#555', transform: `scale(${1 - .14 * press})` })
  S(ar, { opacity: streaming ? 0 : 1 }); S(sq, { opacity: streaming ? 1 : 0 })
  status.textContent = streaming ? 'status: streaming (onStop)' : 'status: ready'
  const ready = streaming ? 0 : 1
  S(bar, { borderColor: hasText && !sent ? '#3a3a3a' : '#2a2a2a' })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
