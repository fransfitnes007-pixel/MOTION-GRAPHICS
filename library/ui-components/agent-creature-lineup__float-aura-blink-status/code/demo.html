<!doctype html>
<html><head><meta charset="utf-8"><title>Agent creature lineup</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.stage{position:absolute;left:24px;top:130px;width:1152px;height:250px;border-radius:24px;overflow:hidden;background:rgba(13,13,26,.85);border:1px solid rgba(139,92,246,.15)}
.glowtop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.14),transparent 60%)}
.gridl{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.05) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%)}
.col{position:absolute;top:32px;width:136px;text-align:center;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif}
.nm{font-weight:700;font-size:14px;color:#fff;margin-top:6px;line-height:1}
.cn{font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.ch{position:relative;width:88px;height:88px;margin:0 auto}
.ring{position:absolute;inset:0;border-radius:9999px}
.ground{position:absolute;left:50%;border-radius:50%}
.fl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bd{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
.div{position:absolute;left:32px;right:32px;top:180px;height:1px;background:linear-gradient(90deg,transparent,rgb(255 255 255/.35),transparent)}
.stat{position:absolute;left:0;right:0;top:204px;text-align:center;font:14px -apple-system,'SF Pro Display',system-ui,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;height:24px}
.stat b{font-weight:700}
.stat .t{color:rgb(255 255 255/.8)}
.cap{position:absolute;left:0;right:0;bottom:80px;text-align:center;font:600 13px -apple-system,system-ui,sans-serif;color:rgb(255 255 255/.45);letter-spacing:.03em}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }

const DUR = 12.6
window.DUR = DUR
const box = fitBox(1200, 540, '#000')
const AG = [
  ['Nova', 'The Scout', '139,92,246', 'Scanning the niche for live angles…'], ['Atlas', 'The Digger', '16,185,129', 'Digging through the product + competitors…'],
  ['Iris', 'The Empath', '245,158,11', 'Mapping who is really watching…'], ['Vivi', 'The Visionary', '236,72,153', 'Shaping the big creative idea…'],
  ['Quill', 'The Architect', '59,130,246', 'Assembling the creator brief…'], ['Ember', 'The Guardian', '239,68,68', 'Planning safe account warmup…'],
  ['Cog', 'The Engineer', '20,184,166', 'Wiring the automation…'], ['Pulse', 'The Analyst', '99,102,241', 'Reading the performance data…'],
]
const STEP = 1.4, NSTEP = AG.length + 1       // the app uses 2500ms per step; shortened so the clip is 12.6s
const body = (i, fill, c) => {
  const st = `rgba(${c},0.9)`, a = `fill="${fill}" stroke="${st}" stroke-width="1.5"`
  switch (i) {
    case 0: return `<path d="M50 12 L82 50 L50 88 L18 50 Z" ${a}/>`
    case 1: return `<rect x="16" y="18" width="68" height="68" rx="20" ${a}/>`
    case 2: return `<ellipse cx="50" cy="50" rx="40" ry="34" ${a}/>`
    case 3: return `<path d="M50 14 C78 14 88 36 84 56 C80 78 64 88 50 88 C32 88 16 76 16 54 C16 32 28 14 50 14 Z" ${a}/>`
    case 4: return `<rect x="22" y="14" width="56" height="74" rx="26" ${a}/>`
    case 5: return `<path d="M50 12 C58 30 74 34 70 56 C68 74 60 88 50 88 C40 88 30 76 30 58 C30 44 44 40 50 12 Z" ${a}/>`
    case 6: { let teeth = ''; for (let k = 0; k < 10; k++) { const an = (k / 10) * Math.PI * 2, x = 50 + Math.cos(an) * 42, y = 50 + Math.sin(an) * 42; teeth += `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" rx="2" fill="${fill}" transform="rotate(${an * 180 / Math.PI} ${x} ${y})"/>` }
      return `<g class="gear" style="transform-origin:50px 50px">${teeth}</g><circle cx="50" cy="50" r="33" ${a}/>` }
    default: return `<path d="M50 12 L84 32 L84 68 L50 88 L16 68 L16 32 Z" ${a}/>`
  }
}
const pn = el('div', 'stage', box); el('div', 'glowtop', pn); el('div', 'gridl', pn)
const objs = AG.map((a, i) => {
  const c = a[2], col = el('div', 'col', pn); S(col, { left: 32 + i * 136 + 'px' })
  const ch = el('div', 'ch', col)
  const r1 = el('div', 'ring', ch), r2 = el('div', 'ring', ch); S(r1, { boxShadow: `0 0 0 2px rgba(${c},0.5)` }); S(r2, { boxShadow: `0 0 0 2px rgba(${c},0.5)` })
  const gr = el('div', 'ground', ch); S(gr, { bottom: 88 * .06 + 'px', width: 88 * .6 + 'px', height: 88 * .12 + 'px', marginLeft: -88 * .3 + 'px' })
  const fl = el('div', 'fl', ch)
  fl.innerHTML = `<svg width="${88 * .78}" height="${88 * .78}" viewBox="0 0 100 100" fill="none"><defs><radialGradient id="g${i}" cx="50%" cy="38%" r="65%"><stop class="s0" offset="0%" stop-color="rgb(${c})"/><stop offset="100%" stop-color="rgb(${c})" stop-opacity="0.55"/></radialGradient></defs>
    ${body(i, `url(#g${i})`, c)}
    <g class="eyes" style="transform-origin:50px 46px"><circle cx="40" cy="46" r="4.5" fill="#0A0A12"/><circle cx="60" cy="46" r="4.5" fill="#0A0A12"/><g class="hl"><circle cx="41.4" cy="44.4" r="1.5" fill="#fff"/><circle cx="61.4" cy="44.4" r="1.5" fill="#fff"/></g></g>
    <path class="mouth" d="M42 62 L58 62" stroke="#0A0A12" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>`
  const bd = el('div', 'bd', ch, '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#0A0A12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>')
  S(bd, { background: `rgb(${c})`, boxShadow: `0 0 12px rgba(${c},0.6)` })
  el('div', 'nm', col, a[0]); const cn = el('div', 'cn', col, a[1]); cn.style.color = `rgb(${c})`
  return { fl, r1, r2, gr, bd, eyes: $(fl, '.eyes'), hl: $(fl, '.hl'), mouth: $(fl, '.mouth'), s0: $(fl, '.s0'), gear: $(fl, '.gear'), c }
})
el('div', 'div', pn)
const stat = el('div', 'stat', pn, '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg><span class="m"></span>')
const sm = $(stat, '.m')
el('div', 'cap', box, 'one agent RUNNING at a time, finished ones COMPLETED, the rest PENDING; step advance every 2.5s in the app (1.4s here)')
const text = (k) => k < AG.length ? `<b style="color:rgb(${AG[k][2]})">${AG[k][0]}</b> <span class="t">${AG[k][3]}</span>` : `<b style="color:#93c5fd">Team</b> <span class="t">Campaign assembled. Starting the next run…</span>`
const blinkDur = 4, blinkRep = 1.5
function render(t) {
  const step = Math.floor(t / STEP) % NSTEP, ts = t - Math.floor(t / STEP) * STEP, tStep = Math.floor(t / STEP) * STEP
  objs.forEach((o, i) => {
    const st = i < step ? 'done' : i === step ? 'run' : 'pend'
    const since = st === 'run' ? t - tStep : st === 'done' ? t - ((i + 1) * STEP) : t
    const fdur = st === 'run' ? 1.6 : 4 + (i % 3)
    const y = st === 'run' ? kf(since, [0, -7, 0], { dur: fdur }) : kf(since, [0, -4, 0], { dur: fdur })
    const rot = st === 'run' ? kf(since, [0, 1.5, 0, -1.5, 0], { dur: fdur }) : 0
    S(o.fl, { transform: `translateY(${y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`, opacity: st === 'pend' ? .5 : 1 })
    S(o.gr, { background: `radial-gradient(closest-side, rgba(${o.c},${st === 'pend' ? .15 : st === 'run' ? .55 : .35}), rgba(${o.c},0))` })
    o.s0.setAttribute('stop-opacity', st === 'run' ? 1 : .95)
    // rings pulse only while running
    vis(o.r1, st === 'run'); vis(o.r2, st === 'run')
    if (st === 'run') {
      const q1 = EASE.easeOut(clamp((since % 1.4) / 1.4)), s2 = since - .7, q2 = s2 < 0 ? 0 : EASE.easeOut(clamp((s2 % 1.4) / 1.4))
      S(o.r1, { transform: `scale(${1 + .35 * q1})`, opacity: String(.6 * (1 - q1)) }); S(o.r2, { transform: `scale(${1 + .35 * q2})`, opacity: String(.6 * (1 - q2)) })
    }
    // blink: scaleY [1,1,.1,1,1] times [0,.45,.5,.55,1], 4s with 1.5s repeat delay (not for pending)
    const sy = st === 'pend' ? 1 : kf(t, [1, 1, .1, 1, 1], { dur: blinkDur, repeatDelay: blinkRep, times: [0, .45, .5, .55, 1] })
    o.eyes.style.transform = `scale(1,${sy.toFixed(3)})`; vis(o.hl, st !== 'pend')
    // mouth: flat when pending, bobbing smile when running, steady smile when done
    if (st === 'pend') o.mouth.setAttribute('d', 'M42 62 L58 62')
    else if (st === 'done') o.mouth.setAttribute('d', 'M41 61 Q50 68 59 61')
    else { const p = kf(since, [0, 1, 0], { dur: .8 }); o.mouth.setAttribute('d', `M40 ${(60 + p).toFixed(2)} Q50 ${(70 - 4 * p).toFixed(2)} 60 ${(60 + p).toFixed(2)}`) }
    if (o.gear) o.gear.style.transform = `rotate(${st === 'run' ? (since / 6 % 1 * 360).toFixed(2) : 0}deg)`
    // check badge: spring in (stiffness 400, damping 18) when the agent finishes
    const bq = st === 'done' ? sp(since, 400, 18) : 0
    S(o.bd, { transform: `scale(${bq.toFixed(4)})` }); vis(o.bd, st === 'done' && bq > 0)
  })
  // status line: AnimatePresence mode="wait", .25s out (y -6) then .25s in (y 6 to 0)
  let k = step, op = 1, yy = 0
  if (ts < .25) { k = (step + NSTEP - 1) % NSTEP; const q = EASE.easeOut(ts / .25); op = 1 - q; yy = -6 * q }
  else if (ts < .5) { const q = EASE.easeOut((ts - .25) / .25); op = q; yy = 6 * (1 - q) }
  if (sm._k !== k) { sm.innerHTML = text(k); sm._k = k }
  S(sm, { opacity: String(op), display: 'inline-block', transform: `translateY(${yy.toFixed(2)}px)` })
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
