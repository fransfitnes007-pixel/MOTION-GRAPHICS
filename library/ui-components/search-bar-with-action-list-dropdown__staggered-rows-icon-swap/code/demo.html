<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#111827}
.w{position:absolute;left:0;top:0;width:470px;transform-origin:0 0}
.lbl{font-size:12px;font-weight:500;color:#6b7280;margin-bottom:6px;display:block}
.in{position:relative;height:46px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;display:flex;align-items:center;padding:0 16px 0 14px;font-size:16px}
.in.on{box-shadow:0 0 0 2px #9ca3af;border-color:#d1d5db}
.in .ph{color:#6b7280}
.caret{display:inline-block;width:1px;height:18px;background:#111827;vertical-align:-3px}
.ic{position:absolute;right:14px;top:13px;width:20px;height:20px;color:#9ca3af}
.ic svg{position:absolute;left:0;top:0}
.dd{margin-top:6px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.06);transform-origin:50% 0}
.rw{display:flex;align-items:center;height:42px;padding:0 12px;font-size:15px;white-space:nowrap;overflow:hidden}
.rw .i{width:18px;height:18px;margin-right:10px;flex:none}
.rw .d{font-size:13px;color:#9ca3af;margin-left:8px}
.rw .r{margin-left:auto;font-size:12.5px;color:#9ca3af;display:flex;gap:10px}
.ft{display:flex;justify-content:space-between;padding:0 14px;height:36px;align-items:center;font-size:12.5px;color:#6b7280;border-top:1px solid #f0f0f2}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- shared helpers (keyframes, scripted cursor, fixed 1280x800 design space scaled to fit) ----
const kf = (t, k, ez = eio) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; return va + (vb - va) * ez((t - a) / (b - a)) } return k[k.length - 1][1] }
const CURSOR_SVG = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 2.5l15 8-6.4 2L9.6 19.5z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
// pts: [[time, x, y, pressed?], ...]  (x, y in the 1280x800 design space); eases between points
const cursorAt = (t, pts, ez = eio) => { let r = { x: pts[0][1], y: pts[0][2], p: 0 }; if (t <= pts[0][0]) return r
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if (t <= b[0]) { const u = ez((t - a[0]) / Math.max(1e-6, b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), p: b[3] && a[3] ? 1 : (t > b[0] - .08 && b[3]) || (a[3] && t < a[0] + .08) ? 1 : 0 } } }
  const l = pts[pts.length - 1]; return { x: l[1], y: l[2], p: l[3] ? 1 : 0 } }
const root = el('div', 'abs'); const U = Math.min(W / 1280, H / 800)
S(root, { width: '1280px', height: '800px', left: px((W - 1280) / 2), top: px((H - 800) / 2), transform: `scale(${U})`, transformOrigin: '50% 50%' })
const cur = el('div', 'abs', root, CURSOR_SVG); S(cur, { left: 0, top: 0, zIndex: 99, pointerEvents: 'none', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' })
const putCursor = (c) => S(cur, { transform: `translate(${c.x - 4}px,${c.y - 2.5}px) scale(${c.p ? .88 : 1})`, opacity: c.show === 0 ? 0 : 1 })
// ---- end shared ----

const CONFIG = {
  scale: 1.7,                    // size of the whole widget on the 1280x800 canvas
  label: 'Search Commands',
  placeholder: "What's up?",
  typed: 'Boo',                  // text typed into the bar; rows that do not contain its first letters are removed
  footerL: 'Press ⌘K to open commands', footerR: 'ESC to cancel',
  actions: [                     // [label, sub label, shortcut, end tag, icon colour, icon key]
    ['Book tickets', 'Operator', '⌘K', 'Agent', '#3b82f6', 'plane'],
    ['Summarize', 'gpt-4o', '⌘cmd+p', 'Command', '#f97316', 'bars'],
    ['Screen Studio', 'gpt-4o', '', 'Application', '#a855f7', 'video'],
    ['Talk to Jarvis', 'gpt-4o voice', '', 'Active', '#22c55e', 'wave'],
    ['Translate', 'gpt-4o', '', 'Command', '#3b82f6', 'globe'],
  ],
  rowH: 42, stagger: .06,
}
const DUR = 6.4
window.DUR = DUR
const ICONS = {
  plane: '<path d="M2 22h20M6.4 14.3l-3.2-3.2 .9-1.3 4.5 .8 4.2-4.2-8-2 .9-1.4 10 1.5 2.9-2.9a2.1 2.1 0 0 1 3 3l-2.9 2.9 .7 9.8-1.4 .9z"/>',
  bars: '<path d="M12 20V10M18 20V4M6 20v-4"/>',
  video: '<path d="M16 10l5.2-3a.5.5 0 0 1 .8.4v9.2a.5.5 0 0 1-.8.4L16 14"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  wave: '<path d="M2 10v3M6 6v11M10 3v18M14 8v8M18 5v14M22 10v3"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
}
const svg = (k, c) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`
const w = el('div', 'w', root)
el('span', 'lbl', w, CONFIG.label)
const inp = el('div', 'in', w, '<span class="txt"></span>'); const txt = inp.firstChild
const ic = el('div', 'ic', inp, '<svg class="s" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><svg class="p" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>')
const dd = el('div', 'dd', w)
const rows = CONFIG.actions.map((a) => { const e = el('div', 'rw', dd, `${svg(a[5], a[4])}<span>${a[0]}</span><span class="d">${a[1]}</span><span class="r"><span>${a[2]}</span><span>${a[3]}</span></span>`); return { e, a } })
const ft = el('div', 'ft', dd, `<span>${CONFIG.footerL}</span><span>${CONFIG.footerR}</span>`)
const sI = ic.querySelector('.s'), pI = ic.querySelector('.p')
const sc = CONFIG.scale, W0 = 470
S(w, { left: px(640 - W0 * sc / 2), top: px(150), transform: `scale(${sc})` })
const T = { click: 1.0, k: [2.7, 2.95, 3.2], clear: 5.2, hide: 5.6 }
const P = [[0, 1000, 520, 0], [.4, 1000, 520, 0], [.95, 640, 222, 0], [T.click, 640, 222, 1], [T.click + .1, 640, 222, 0], [4.8, 640, 222, 0], [5.6, 1000, 520, 0], [6.4, 1000, 520, 0]]
function render(t) {
  const n = t < T.k[0] ? 0 : t < T.k[1] ? 1 : t < T.k[2] ? 2 : 3
  const typed = t < T.clear ? CONFIG.typed.slice(0, n) : ''
  const focus = t >= T.click && t < T.hide
  inp.className = 'in' + (focus ? ' on' : '')
  const caret = focus && Math.floor(t * 2.4) % 2 === 0 ? '<span class="caret"></span>' : ''
  txt.innerHTML = typed ? typed + caret : (caret + `<span class="ph">${CONFIG.placeholder}</span>`)
  const sw = t < T.clear ? seg(t, T.k[0], T.k[0] + .18) : 1 - seg(t, T.clear, T.clear + .18)
  S(sI, { opacity: 1 - sw, transform: `scale(${1 - .3 * sw}) rotate(${-30 * sw}deg)` }); S(pI, { opacity: sw, transform: `scale(${.7 + .3 * sw}) rotate(${30 * (1 - sw)}deg)` })
  // dropdown: grows in on click, rows stagger, filters to the first row when typing, closes on blur
  const openA = t < T.hide ? eo(seg(t, T.click, T.click + .28)) : 1 - eo(seg(t, T.hide, T.hide + .25))
  const filt = (t >= T.k[0] && t < T.clear) ? seg(t, T.k[0], T.k[0] + .22) : (t >= T.clear ? 1 - seg(t, T.clear, T.clear + .25) : 0)
  let h = 0
  rows.forEach((r, i) => {
    const keep = r.a[0].toLowerCase().startsWith(CONFIG.typed[0].toLowerCase())
    const vis = keep ? 1 : 1 - filt
    const enter = eo(seg(t, T.click + .08 + i * CONFIG.stagger, T.click + .08 + i * CONFIG.stagger + .3))
    S(r.e, { height: px(CONFIG.rowH * vis), opacity: vis * (t < T.hide ? enter : 1), transform: `translateY(${(1 - enter) * 6}px)` })
    h += CONFIG.rowH * vis
  })
  S(dd, { opacity: openA, transform: `scaleY(${.92 + .08 * openA})`, display: openA > 0 ? '' : 'none' })
  putCursor(cursorAt(t, P))
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
