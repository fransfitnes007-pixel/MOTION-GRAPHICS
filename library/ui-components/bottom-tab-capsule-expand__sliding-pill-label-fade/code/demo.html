<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10}
.finger{position:absolute;border-radius:50%;background:rgba(120,126,145,.38);border:2px solid rgba(255,255,255,.6);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.tabicon{position:absolute;display:flex;align-items:center;justify-content:center}
.tablabel{position:absolute;overflow:hidden;white-space:nowrap;font-weight:700;color:#1a1b22;display:flex;align-items:center}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 5.6
window.DUR = DUR
const names = ['NEW', 'BROWSE', 'SAVED', 'LIBRARY', 'SETTINGS']
const s = TALL ? 1.1 : 1.55
const SLOT = 104 * s, BH = 128 * s, PAD = 14 * s, CAPH = 100 * s, FS = 28 * s, ICON = 42 * s, LG = 12 * s, LS = .08 * FS
const FONT = '-apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif'
const mctx = document.createElement('canvas').getContext('2d'); mctx.font = '700 ' + FS + 'px ' + FONT
const LW = names.map(n => mctx.measureText(n).width + n.length * LS)
const EX = LW.map(w => LG + w)

// icons: 24x24 line art
const gearPath = (() => { let d = ''; const pts = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; for (const [da, r] of [[-.30, 7.4], [-.17, 9.4], [.17, 9.4], [.30, 7.4]]) pts.push([12 + r * Math.cos(a + da), 12 + r * Math.sin(a + da)]) } pts.forEach((p, i) => d += (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)); return d + 'Z' })()
const ICONS = [
  '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.4 2.2"/>',
  '<circle cx="10.5" cy="10.5" r="6.4"/><path d="M15.4 15.4L20 20"/>',
  '<path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4.2L6 20V5a1 1 0 0 1 1-1z"/>',
  '<rect x="4" y="4" width="6.8" height="6.8" rx="1.8"/><rect x="13.2" y="4" width="6.8" height="6.8" rx="1.8"/><rect x="4" y="13.2" width="6.8" height="6.8" rx="1.8"/><rect x="13.2" y="13.2" width="6.8" height="6.8" rx="1.8"/>',
  '<path d="' + gearPath + '"/><circle cx="12" cy="12" r="3"/>'
]

const bar = el('div', 'abs'); const cap = el('div', 'abs')
const icons = ICONS.map(p => { const d = el('div', 'tabicon'); d.innerHTML = `<svg viewBox="0 0 24 24" width="${ICON}" height="${ICON}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`; S(d, { width: px(ICON), height: px(ICON) }); return d })
const labels = names.map(n => { const d = el('div', 'tablabel'); d.textContent = n; S(d, { fontSize: px(FS), letterSpacing: LS + 'px', height: px(CAPH) }); return d })
S(bar, { borderRadius: px(BH / 2), height: px(BH), background: 'linear-gradient(180deg,#1d1d25,#15151b)', border: '1px solid rgba(255,255,255,.08)', boxShadow: '0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06)', top: px(CY - BH / 2) })
S(cap, { height: px(CAPH), borderRadius: px(CAPH / 2), background: 'linear-gradient(180deg,#f3f4f8,#dfe2ea)', boxShadow: '0 8px 22px rgba(0,0,0,.35)', top: px(CY - CAPH / 2) })
const finger = el('div', 'finger')

// layout for a weight vector: tab widths grow by w * (gap + label width)
function layout(w) {
  const widths = w.map((x, i) => SLOT + EX[i] * Math.max(0, x))
  const total = widths.reduce((a, b) => a + b, 0), barW = total + 2 * PAD, barL = CX - barW / 2
  const lefts = []; let x = barL + PAD
  for (let i = 0; i < 5; i++) { lefts.push(x); x += widths[i] }
  return { widths, lefts, barW, barL }
}
const unit = (k) => [0, 1, 2, 3, 4].map(i => i === k ? 1 : 0)
const CEN = [0, 1, 2, 3, 4].map(k => { const L = layout(unit(k)); return L.lefts[k] + L.widths[k] / 2 })

// the finger path: arrival time at each tab, then a fast swipe back to the first
const ARR = [.45, 1.3, 2.0, 2.7, 3.4], TRAVEL = .4
const SW = [{ t: 1.1, f: 0, to: 1, d: .55 }, { t: 1.8, f: 1, to: 2, d: .55 }, { t: 2.5, f: 2, to: 3, d: .55 }, { t: 3.2, f: 3, to: 4, d: .55 }, { t: 4.2, f: 4, to: 0, d: .75 }]
function fingerX(t) {
  let x = CEN[0]
  for (let k = 1; k < 5; k++) { if (t >= ARR[k] - TRAVEL) x = lerp(CEN[k - 1], CEN[k], eio(seg(t, ARR[k] - TRAVEL, ARR[k]))) }
  if (t >= 3.9) x = lerp(CEN[4], CEN[0], eio(seg(t, 3.9, 4.5)))
  return x
}
function weights(t) {
  const w = [1, 0, 0, 0, 0]
  let cur = null
  for (const sw of SW) if (t >= sw.t) cur = sw
  if (!cur) return w
  const u = spring(seg(t, cur.t, cur.t + cur.d), 9, 10)
  const out = [0, 0, 0, 0, 0]; out[cur.f] += 1 - u; out[cur.to] += u
  return out
}
const mix = (a, b, x) => Math.round(a + (b - a) * clamp(x))

function render(t) {
  const w = weights(t), L = layout(w)
  S(bar, { left: px(L.barL), width: px(L.barW) })
  let cl = 0, cr = 0
  for (let i = 0; i < 5; i++) { cl += w[i] * L.lefts[i]; cr += w[i] * (L.lefts[i] + L.widths[i]) }
  S(cap, { left: px(cl), width: px(Math.max(0, cr - cl)) })
  for (let i = 0; i < 5; i++) {
    const c = clamp(w[i])
    const ix = L.lefts[i] + SLOT / 2 - ICON / 2
    S(icons[i], { left: px(ix), top: px(CY - ICON / 2), color: `rgb(${mix(140, 22, c)},${mix(143, 23, c)},${mix(154, 30, c)})` })
    const lx = L.lefts[i] + SLOT / 2 + ICON / 2 + LG
    const al = clamp((w[i] - .3) / .5)
    S(labels[i], { left: px(lx), top: px(CY - CAPH / 2), width: px(Math.max(0, L.lefts[i] + L.widths[i] - lx - 6 * s)), opacity: al })
    vis(labels[i], al > 0.003)
  }
  // finger
  const fa = seg(t, .2, .45) * (1 - seg(t, 4.7, 5.0))
  if (fa <= 0) { vis(finger, 0) } else {
    const press = seg(t, .35, .5) * (1 - seg(t, 4.75, 4.95))
    const fs = 96 * s * (1 - .18 * press), fx = fingerX(t), fy = CY + 34 * s + (1 - eo(seg(t, .2, .45))) * 50 * s
    vis(finger, 1); S(finger, { width: px(fs), height: px(fs), left: px(fx - fs / 2), top: px(fy - fs / 2), opacity: fa })
  }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
