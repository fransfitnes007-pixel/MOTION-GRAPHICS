<!doctype html>
<html><head><meta charset="utf-8"><title>Timeline accordion of glass cards</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.pg{position:absolute;inset:0;background:linear-gradient(180deg,#fff 0%,#f5f6f8 55%,#e6e8ec 100%);font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#0b0c10}
.wash{position:absolute;left:0;right:0;top:0;height:75%;background:radial-gradient(60% 60% at 50% 0%,rgba(37,99,235,.11),rgba(14,165,233,.04) 45%,transparent 72%)}
.rail{position:absolute;width:1px;background:rgba(11,12,16,.10)}
.it{position:absolute;left:0;width:768px;padding-left:48px}
.dt{position:absolute;left:12px;top:22px;width:14px;height:14px;border-radius:9999px;border:2px solid #f5f6f8;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.gk{border-radius:28px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 32px -12px rgba(15,17,26,.18)}
.gk.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 64px -24px rgba(15,17,26,.28)}
.bt{display:flex;align-items:center;gap:16px;padding:14px 20px;height:68px}
.bt .ib{width:40px;height:40px;border-radius:16px;border:1px solid rgba(37,99,235,.25);background:rgba(37,99,235,.10);color:#2563eb;display:grid;place-items:center;flex-shrink:0}
.bt .n{font-size:12px;font-weight:600;color:#2563eb;line-height:16px}
.bt .tt{font-size:16px;font-weight:600;color:#0b0c10;line-height:24px}
.bt .ch{margin-left:auto;color:#5c606b}
.pnl{overflow:hidden}
.pnl .in{padding:0 20px 20px 76px}
.pnl p{margin:0;font-size:14px;line-height:1.625;color:rgba(11,12,16,.70)}
.tg{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tg span{border-radius:9999px;background:rgba(255,255,255,.7);padding:4px 10px;font-size:12px;font-weight:500;color:#0b0c10}
.cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:600 13px -apple-system,system-ui,sans-serif;color:#5c606b;letter-spacing:.02em}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }
// a CSS-transition-like value: events [{t, to, dur, delay, ease}] each start from wherever the value was when they began (interrupts are continuous)
const animTo = (t, init, events, i = events.length - 1) => {
  if (i < 0) return init
  const e = events[i], start = e.t + (e.delay || 0)
  if (t < start) return animTo(t, init, events, i - 1)
  const from = animTo(start, init, events, i - 1), p = clamp((t - start) / e.dur)
  return from + (e.to - from) * (e.ease || EASE.easeOut)(p)
}

const DUR = 10
window.DUR = DUR
const DW = 900, DH = 620
const box = fitBox(DW, DH, '#f5f6f8')
el('div', 'pg', box); el('div', 'wash', box)
const SV = [
  ['Content programmes', 'Briefs, writers, hooks, edits and publishing on a timeline. Every asset is reviewed against the brief before it goes live, and every post is tracked after.', ['Talking head', 'Demos', 'Reviews', 'Skits'], '<rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l6-3v10l-6-3"/>'],
  ['Dedicated channel teams', 'A bench of writers publishing on dedicated channels built for the project, set up first so the first post lands in a real feed.', ['Channel setup', 'Ramp-up', 'Daily posting'], '<path d="M12 22V9M12 9c0-4 3-6 7-6 0 4-3 6-7 6zM12 13c0-3-2-5-6-5 0 3 2 5 6 5z"/>'],
  ['Launches and pushes', 'Release windows, app launches and drops. Every partner posts the same proven formats inside the same window.', ['Film', 'Apps', 'Products'], '<path d="M12 2c3 3 5 6 5 10l-5 5-5-5c0-4 2-7 5-10zM9 19l-3 3M15 19l3 3"/>'],
  ['Partner sourcing', 'Vetted partners from a large network, matched to niche, audience, platform and budget, with past numbers in front of you.', ['Every niche', 'Vetted'], '<circle cx="9" cy="8" r="3.5"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0M16 4.500a3.500 3.500 0 0 1 0 7M18 14.500a6.500 6.500 0 0 1 3.500 5.500"/>'],
  ['Partner management', 'Contracts, deliverables, usage rights and billing handled end to end, inside one platform.', ['Contracts', 'Usage rights', 'Billing'], '<path d="M7 11l4 4 6-8M3 12l5 5M16 6l5 0"/>'],
]
const CH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
const wrap = el('div', 'abs', box); S(wrap, { left: (DW - 768) / 2 + 'px', top: '30px', width: '768px', height: '540px' })
const rail = el('div', 'rail', wrap); S(rail, { left: '19px', top: '12px' })
const items = SV.map((s, i) => {
  const it = el('div', 'it', wrap), dt = el('span', 'dt', it)
  const card = el('div', 'gk', it, `<div class="bt"><span class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s[3]}</svg></span><span><span class="n" style="display:block">${String(i + 1).padStart(2, '0')}</span><span class="tt" style="display:block">${s[0]}</span></span><span class="ch">${CH}</span></div><div class="pnl"><div class="in"><p>${s[1]}</p><div class="tg">${s[2].map((x) => `<span>${x}</span>`).join('')}</div></div></div>`)
  const pnl = $(card, '.pnl'), inn = $(card, '.in')
  return { it, dt, card, pnl, ch: $(card, '.ch'), h: inn.offsetHeight }
})
el('div', 'cap', box, 'single-open accordion; panel height 0 to auto and opacity in .3s [0.16, 1, 0.3, 1]; each card rises 24px with delay .03 * i')
const T0 = .3, CLICKS = [[4.0, 2], [7.0, 4]]
function openAt(t) { let o = 0; for (const [tc, i] of CLICKS) if (t >= tc) o = i; return o }
function render(t) {
  const cur = openAt(t)
  let y = 0
  items.forEach((m, i) => {
    // FadeUp: opacity 0 to 1, y 24 to 0, .7s, delay .03 * i, expo-out
    const q = EASE.expo(clamp((t - T0 - .03 * i) / .7))
    // the panel: open state per item, each with its own transition start time
    let evs = []; let wasOpen = i === 0
    if (i === 0) evs.push({ t: -99, to: 1, dur: .001 })
    for (const [tc, k] of CLICKS) { const nowOpen = k === i; const prevOpen = CLICKS.filter(([tt]) => tt < tc).length ? CLICKS.filter(([tt]) => tt < tc).slice(-1)[0][1] : 0
      if (nowOpen && !(prevOpen === i)) evs.push({ t: tc, to: 1, dur: .3, ease: EASE.expo }); else if (!nowOpen && prevOpen === i) evs.push({ t: tc, to: 0, dur: .3, ease: EASE.expo }) }
    const open = animTo(t, 0, evs)
    S(m.pnl, { height: (m.h * open).toFixed(2) + 'px', opacity: open.toFixed(3) })
    const isOpen = cur === i
    m.card.classList.toggle('on', isOpen)
    S(m.dt, { background: isOpen ? '#2563eb' : '#0b0c10' })
    S(m.ch, { transform: `rotate(${180 * open}deg)` })
    const h = 68 + m.h * open
    S(m.it, { top: y.toFixed(2) + 'px', opacity: q.toFixed(3), transform: `translateY(${(24 * (1 - q)).toFixed(2)}px)` })
    y += h + 12
  })
  S(rail, { height: Math.max(0, y - 12 - 12 - 12) + 'px' })   // top-3 to bottom-3 of the list
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
