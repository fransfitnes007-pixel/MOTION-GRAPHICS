<!doctype html>
<html><head><meta charset="utf-8"><title>Polaroid line demo</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#ffffff;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.pol{position:absolute;background:#f7f6f2;box-shadow:0 22px 30px -14px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);transform-origin:50% 0}
.cap{position:absolute;left:0;right:0;text-align:center;font:italic 22px/1 Georgia,'Times New Roman',serif;color:#2b2b2b}
.peg{position:absolute;width:15px;height:46px;background:linear-gradient(90deg,#c58f4f,#e0b27a 45%,#b98445);border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.25)}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  slides: [                                   // title is the caption; the four colours paint a placeholder landscape
    { title: 'Above the Clouds', sky: ['#4a5a82', '#e9a384'], far: '#59627f', mid: '#363c56', near: '#232736' },
    { title: 'Glass Lake',       sky: ['#6aa4e6', '#cfe6f7'], far: '#a89484', mid: '#5f7b84', near: '#1fb6a6' },
    { title: 'Gold Valley',      sky: ['#7a7a55', '#d9c58a'], far: '#8b8a5e', mid: '#5b6a38', near: '#3f4c26' },
    { title: 'Snow Line',        sky: ['#5f93d8', '#dbe9f7'], far: '#dfe8f2', mid: '#6d8aa5', near: '#2e4a33' },
    { title: 'Blue Ridges',      sky: ['#f4c9b2', '#fbe3d2'], far: '#b9bec3', mid: '#6e8584', near: '#2b4140' },
    { title: 'Falls Bridge',     sky: ['#9cc9a0', '#d5ead3'], far: '#4c8a45', mid: '#2f6a32', near: '#1e4a25' },
  ],
  pitch: 536,          // px between polaroid centres (canvas is 1280 x 960)
  paperW: 506, paperH: 580,   // polaroid size
  stringPeakY: 187,    // y where neighbouring string curves meet
  sag: 64,             // how far each string segment drops at its middle
  hold: 1.1,           // seconds a slide rests in the middle
  travel: 0.9,         // seconds it takes to slide to the next one
  swing: 1,            // 0 turns the pendulum lag off, 2 doubles it
  bg: '#ffffff',
}
const N = CONFIG.slides.length
const DUR = (CONFIG.hold + CONFIG.travel) * N
window.DUR = DUR
stage.style.background = CONFIG.bg
const DW = 1280, DH = 960, U = Math.min(W / DW, H / DH)
const root = el('div', 'abs'); S(root, { width: DW + 'px', height: DH + 'px', left: (W - DW * U) / 2 + 'px', top: (H - DH * U) / 2 + 'px', transformOrigin: '0 0', transform: `scale(${U})`, overflow: 'visible' })
const clipR = el('div', 'abs'); S(clipR, { left: 0, top: 0, width: W + 'px', height: H + 'px', overflow: 'hidden' })
clipR.appendChild(root)
const strand = el('div', 'abs', root); S(strand, { left: '-800px', top: 0, width: '2880px', height: '500px' })
strand.innerHTML = `<svg width="2880" height="500" style="overflow:visible"><path id="str" d="" fill="none" stroke="#6f6358" stroke-width="2.4" stroke-linecap="round"/></svg>`
const strPath = strand.querySelector('#str')
const seeded = (n) => { const x = Math.sin(n * 91.7 + 3.1) * 43758.5453; return x - Math.floor(x) }
const photo = (s, i) => {
  const w = CONFIG.paperW - 42, h = CONFIG.paperH - 42 - 84
  let far = '', mid = '', near = ''
  for (let k = 0; k <= 24; k++) { const x = k / 24 * w
    far += `${x},${h * .52 - 40 * Math.sin(k * .7 + i) - 25 * seeded(k + i * 7)} `
    mid += `${x},${h * .66 - 30 * Math.sin(k * .5 + i * 2.1) - 28 * seeded(k * 3 + i)} `
    near += `${x},${h * .82 - 22 * Math.sin(k * .33 + i * 3.7) - 22 * seeded(k * 5 + i)} ` }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><defs><linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.sky[0]}"/><stop offset="1" stop-color="${s.sky[1]}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#sk${i})"/><polygon points="0,${h} ${far} ${w},${h}" fill="${s.far}"/><polygon points="0,${h} ${mid} ${w},${h}" fill="${s.mid}"/><polygon points="0,${h} ${near} ${w},${h}" fill="${s.near}"/></svg>`
}
const items = CONFIG.slides.map((s, i) => {
  const holder = el('div', 'abs', root); S(holder, { left: 0, top: 0, width: 0, height: 0 })
  const p = el('div', 'pol', holder); S(p, { width: CONFIG.paperW + 'px', height: CONFIG.paperH + 'px', left: -CONFIG.paperW / 2 + 'px', top: '2px' })
  const ph = el('div', 'abs', p, photo(s, i)); S(ph, { left: '21px', top: '21px', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,.08)' })
  const c = el('div', 'cap', p, s.title); S(c, { bottom: '28px' })
  const peg = el('div', 'peg', holder); S(peg, { left: '-7px', top: '-34px', zIndex: 2 })
  return { holder, tilt: (seeded(i + 11) - .5) * 3 }
})

// slide position in slide units: rests for `hold`, then eases to the next over `travel`
const pos = (t) => { const P = CONFIG.hold + CONFIG.travel; const tt = ((t % DUR) + DUR) % DUR; const k = Math.floor(tt / P); const r = tt - k * P; return k + eio(seg(r, CONFIG.hold, P)) }
const posL = (t) => pos(t < 0 ? t + DUR : t)

function render(t) {
  const s = pos(t)
  const sA = posL(t - .12), sB = posL(t - .32)
  const dv = (s - sA < -3 ? s - sA + N : s - sA), dv2 = (sA - sB < -3 ? sA - sB + N : sA - sB)
  const swing = (CONFIG.swing || 0) * (34 * dv - 20 * dv2)
  const mid = DW / 2
  let d = ''
  const segs = []
  for (let k = -4; k <= 5; k++) {
    const x0 = mid + (k - .5 - (s % 1)) * CONFIG.pitch, x1 = x0 + CONFIG.pitch
    d += (k === -4 ? `M${x0 + 800},${CONFIG.stringPeakY}` : '') + ` Q${(x0 + x1) / 2 + 800},${CONFIG.stringPeakY + CONFIG.sag * 2} ${x1 + 800},${CONFIG.stringPeakY}`
  }
  strPath.setAttribute('d', d)
  for (let i = 0; i < N; i++) {
    let off = ((i - s) % N + N) % N; if (off > N / 2) off -= N
    const x = mid + off * CONFIG.pitch
    const rot = items[i].tilt + swing
    S(items[i].holder, { transform: `translate(${x}px,${CONFIG.stringPeakY + CONFIG.sag}px) rotate(${rot}deg)`, display: Math.abs(off) > 2.6 ? 'none' : '' })
  }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
