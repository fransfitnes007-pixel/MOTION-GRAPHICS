const FLOAT = [{ y: -9, d: 5 }, { y: 8, d: 6 }, { y: -7, d: 7 }, { y: 9, d: 5.5 }, { y: -6, d: 6.5 }]
const tiles = SPOTS.map((s, i) => { const w = el('div', 'tile', right); S(w, { ...s.pos, transform: s.tilt })
  const d = el('div', '', w, `<div class="lb">${ic(s.icon, 13)}${s.label}</div><div class="vl tn">${s.value}</div>`); return { d, v: d.querySelector('.vl'), s } })

function render(t) {
  S(root, { opacity: loopFade(t) })
  const slide = (e, t0, y, dur) => S(e, { transform: `translateY(${(1 - E_EASEINOUT(seg(t, t0, t0 + dur))) * y}px)` })   // initial {y} animate {y:0}, no opacity
  slide(q('loc'), 0, 12, .5); slide(q('h1'), .05, 16, .6); slide(q('lede'), .12, 16, .6); slide(q('btns'), .2, 16, .6)
  S(card, { transform: `scale(${.96 + .04 * E_EASEINOUT(seg(t, .15, .85))})` })
  // photo carousel: every 4.5s, new image fades in from scale 1.04 over .9s easeOut while the old one fades out
  const sw = seg(t, 4.5, 5.4), k = E_EASEOUT(sw)
  S(photos[0], { opacity: 1 - k, zIndex: 1 }); S(photos[1], { opacity: k, transform: `scale(${1.04 - .04 * k})`, zIndex: 2 })
  const pg = E_TW(seg(t, 4.5, 4.65))
  S(dotEls[0], { width: (20 - 14 * pg) + 'px', background: `rgba(255,255,255,${1 - .3 * pg})` }); S(dotEls[1], { width: (6 + 14 * pg) + 'px', background: `rgba(255,255,255,${.7 + .3 * pg})` })
  tiles.forEach((o, i) => { const f = FLOAT[i]; S(o.d, { transform: `translateY(${bob(t, f.y, f.d, i * .4)}px)` }); o.v.textContent = cu(o.s.value, seg(t, .2, 1.7)) })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
