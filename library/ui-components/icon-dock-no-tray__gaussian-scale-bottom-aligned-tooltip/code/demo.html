<!doctype html>
<html><head><meta charset="utf-8"><title>icon-dock-no-tray__gaussian-scale-bottom-aligned-tooltip</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fdfdfd;color:#0a0a0a}
.ic{position:absolute;transform-origin:50% 100%}
.tip{position:absolute;background:#fff;border:1px solid #e6e6e6;border-radius:6px;font-size:12px;padding:3px 9px;color:#222;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cursor{position:absolute;width:18px;height:22px;pointer-events:none;z-index:50}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  items: [['Notes', 'notes'], ['Tasks', 'tasks'], ['Chat', 'chat'], ['Video', 'video'], ['Music', 'music'], ['Web', 'web'], ['Design', 'design']],  // [label, icon id]; swap the icons for <img>
  base: 56,           // resting icon size in px
  gap: 16,            // space between resting icons
  maxScale: 1.95,     // size multiplier directly under the pointer
  spread: 84,         // px: how far the magnify reaches (gaussian sigma-ish)
  baseline: 24,       // px below centre where icons sit
  tooltipGap: 12,     // px between icon top and its label
  sweep: [[.3, -.14], [.8, 0], [1.5, .03], [2.0, .2], [2.5, .34], [3.0, .5], [3.5, .66], [4.0, .82], [4.6, 1], [5.3, 1.16]],  // pointer path: [time, position across the row, 0 = right end, 1 = left end]
}
DUR = 6.4; window.DUR = DUR
const N = CONFIG.items.length, B = CONFIG.base, G = CONFIG.gap
const ICON_SVG = {
  notes: `<svg viewBox="0 0 48 48"><rect x="6" y="5" width="34" height="36" rx="3" fill="#fff" stroke="#111" stroke-width="3.4"/><path d="M40 12l4 3v26l-4 3" fill="none" stroke="#111" stroke-width="3.4"/><path d="M15 33V16l12 17V16" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>`,
  tasks: `<svg viewBox="0 0 48 48"><circle cx="24" cy="15" r="6.5" fill="#f06a6a"/><circle cx="14" cy="31" r="6.5" fill="#f06a6a"/><circle cx="34" cy="31" r="6.5" fill="#f06a6a"/></svg>`,
  chat: `<svg viewBox="0 0 48 48"><g stroke-linecap="round" stroke-width="5.6" fill="none"><path d="M18 9v9" stroke="#e01e5a"/><path d="M30 9v9" stroke="#36c5f0"/><path d="M18 30v9" stroke="#2eb67d"/><path d="M30 30v9" stroke="#ecb22e"/><path d="M9 18h9" stroke="#36c5f0"/><path d="M9 30h9" stroke="#2eb67d"/><path d="M30 18h9" stroke="#e01e5a"/><path d="M30 30h9" stroke="#ecb22e"/></g></svg>`,
  video: `<svg viewBox="0 0 48 48"><g stroke="#625df5" stroke-width="3.6" stroke-linecap="round">${Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; return `<line x1="${24 + Math.cos(a) * 9}" y1="${24 + Math.sin(a) * 9}" x2="${24 + Math.cos(a) * 20}" y2="${24 + Math.sin(a) * 20}"/>` }).join('')}</g></svg>`,
  music: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#1ed760"/><g fill="none" stroke="#0b1d12" stroke-linecap="round"><path d="M11 18c9-3 19-2 27 2" stroke-width="4.4"/><path d="M12.5 26c8-2.4 16-1.6 22.5 1.6" stroke-width="3.6"/><path d="M14 33c6.4-1.8 12.6-1.2 18 1.2" stroke-width="3"/></g></svg>`,
  web: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="7" fill="#146ef5"/><path d="M8 17l5 16 6-12 6 12 5-16" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round" transform="translate(4 -1)"/></svg>`,
  design: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="9" fill="#14181a"/><circle cx="20" cy="14" r="5.5" fill="#f24e1e"/><circle cx="30" cy="14" r="5.5" fill="#ff7262"/><circle cx="20" cy="24" r="5.5" fill="#a259ff"/><circle cx="30" cy="24" r="5.5" fill="#1abcfe"/><circle cx="20" cy="34" r="5.5" fill="#0acf83"/></svg>`,
}
const icons = CONFIG.items.map(([label, id]) => { const d = el('div', 'ic', stage, ICON_SVG[id]); S(d, { width: B + 'px', height: B + 'px' }); d.firstChild.setAttribute('width', B); d.firstChild.setAttribute('height', B); return d })
const tip = el('div', 'tip', stage, '')
const cur = el('div', 'cursor', stage, '<svg width="18" height="22" viewBox="0 0 18 22"><path d="M2 1l13 12-6 1 4 7-3 1.5-4-7-4 4z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>')
const rowW = N * B + (N - 1) * G, x0 = CX - rowW / 2, by = CY + CONFIG.baseline

function render(t) {
  // pointer x along the row, 0..1 from right end to left end, piecewise eased
  const sw = CONFIG.sweep; let u = sw[0][1]
  for (let k = 1; k < sw.length; k++) { if (t >= sw[k][0]) u = sw[k][1]; else if (t >= sw[k - 1][0]) { u = lerp(sw[k - 1][1], sw[k][1], eio(seg(t, sw[k - 1][0], sw[k][0]))); break } else break }
  const mx = x0 + rowW - u * rowW        // pointer x
  const active = u > -.1 && u < 1.1
  // scales from distance to each icon's resting centre
  const sc = icons.map((_, i) => { const cx = x0 + i * (B + G) + B / 2; const d = mx - cx; return active ? 1 + (CONFIG.maxScale - 1) * Math.exp(-(d * d) / (2 * (CONFIG.spread / 1.35) ** 2)) : 1 })
  const widths = sc.map(s => B * s), total = widths.reduce((a, b) => a + b, 0) + G * (N - 1)
  let x = CX - total / 2, best = 0
  icons.forEach((d, i) => { S(d, { left: px(x), top: px(by - B), transform: `scale(${sc[i]})`, transformOrigin: '0% 100%' }); if (sc[i] > sc[best]) best = i; x += widths[i] + G })
  // tooltip over the biggest icon
  const lx = parseFloat(icons[best].style.left) + widths[best] / 2
  tip.textContent = CONFIG.items[best][0]
  const show = active && sc[best] > 1.25
  S(tip, { opacity: show ? clamp((sc[best] - 1.25) * 3) : 0, left: px(lx - tip.offsetWidth / 2), top: px(by - B * sc[best] - CONFIG.tooltipGap - 24) })
  S(cur, { left: px(mx + 2), top: px(by - B * .3), opacity: t > .2 && t < 5.9 ? 1 : 0, transform: 'scale(.85) rotate(-8deg)' })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
