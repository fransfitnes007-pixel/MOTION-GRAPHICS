<!doctype html>
<html><head><meta charset="utf-8"><title>message-bubble-off-icon__hover-slash-redraw</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fdfdfd;color:#0a0a0a}
.cursor{position:absolute;width:18px;height:22px;pointer-events:none;z-index:50}
.lbl{position:absolute;font-size:13px;color:#8a8a8f;white-space:nowrap;text-align:center}
svg{overflow:visible}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  big: 9,              // scale of the large demo icon (24px viewBox x big)
  small: 32,           // size in px of the real-size copy (matches size={32} in the usage)
  stroke: '#0a0a0a', strokeWidth: 2,
  hoverAt: 1.0,        // seconds when the pointer lands on the icon
  drawTime: .5,        // seconds for the slash to redraw
  shake: 7,            // degrees of bubble wobble at the start
}
DUR = 4.2; window.DUR = DUR

const ARC = 'M20.5 14.9A9 9 0 0 0 9.1 3.5'
const TAIL = 'M5.6 5.6C3 8.3 2.2 12.5 4 16l-2 6 6-2c3.4 1.8 7.6 1 10.3-1.7'
const SLASH = 'm2 2 20 20'
function icon(size, x, y) {
  const w = el('div', 'abs', stage); S(w, { left: px(x), top: px(y), width: px(size), height: px(size) })
  w.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${CONFIG.stroke}" stroke-width="${CONFIG.strokeWidth}" stroke-linecap="round" stroke-linejoin="round"><g class="bub"><path d="${ARC}"/><path d="${TAIL}"/></g><path class="sl" d="${SLASH}" pathLength="1"/></svg>`
  return w.firstChild
}
const B = 24 * CONFIG.big
const bx = CX - B / 2, by = CY - B / 2 - 20
const big = icon(B, bx, by), sm = icon(CONFIG.small, CX - CONFIG.small / 2, CY + B / 2 + 50)
const l1 = el('div', 'lbl', stage, 'animateOnHover, size 32'); S(l1, { left: px(CX - 80), width: '160px', top: px(CY + B / 2 + 50 + CONFIG.small + 14) })
const cur = el('div', 'cursor', stage, '<svg width="18" height="22" viewBox="0 0 18 22"><path d="M2 1l13 12-6 1 4 7-3 1.5-4-7-4 4z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>')

function setIcon(svg, h) {
  let draw = 1, rot = 0, off = 0
  if (h >= 0) {
    draw = eo(clamp(h / CONFIG.drawTime))                         // slash retracts and redraws from the top-left
    const d = Math.exp(-h * 5) * Math.sin(h * 22); rot = d * CONFIG.shake // bubble wobbles and calms
    off = Math.max(0, 1 - h / CONFIG.drawTime)
  }
  const sl = svg.querySelector('.sl'); sl.setAttribute('stroke-dasharray', '1 1'); sl.setAttribute('stroke-dashoffset', 1 - draw)
  svg.querySelector('.bub').setAttribute('transform', `rotate(${rot} 12 12)`)
}
function render(t) {
  const enter = eo(seg(t, .3, CONFIG.hoverAt)), leave = eo(seg(t, 2.9, 3.6))
  const tgt = [bx + B * .45, by + B * .72], from = [bx + B + 160, by + B + 90]
  const x = lerp(lerp(from[0], tgt[0], enter), from[0] - 50, leave), y = lerp(lerp(from[1], tgt[1], enter), from[1], leave)
  const hov = t >= CONFIG.hoverAt && t < 3.1
  const h = hov ? t - CONFIG.hoverAt : -1
  setIcon(big, h); setIcon(sm, h)
  S(cur, { left: px(x), top: px(y) })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
