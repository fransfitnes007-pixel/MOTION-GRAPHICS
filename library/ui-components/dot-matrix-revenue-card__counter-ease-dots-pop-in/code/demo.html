<!doctype html>
<html><head><meta charset="utf-8"><title>dot-matrix-revenue-card__counter-ease-dots-pop-in</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#e5e5e5;color:#111;font-family:Inter,-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif}
.gc{position:absolute;left:0;top:0;transform-origin:0 0;width:460px;background:#f9f9f9;border-radius:24px;border:1px solid #eaeaea;box-shadow:0 10px 30px rgba(0,0,0,.05);overflow:hidden}
.gc-h{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 32px 20px}
.gc-hl{display:flex;flex-direction:column;gap:4px}
.gc-lab{font-size:11px;font-weight:500;color:#777;letter-spacing:.5px;text-transform:uppercase}
.gc-val{font-size:42px;font-weight:300;color:#111;line-height:1;letter-spacing:-1px;display:flex;align-items:baseline}
.gc-val i{font-style:normal;font-size:24px;font-weight:300;margin-left:2px}
.gc-hr{display:flex;gap:16px;padding-top:4px}
.gc-tab{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.gc-div{height:1px;background:#eaeaea;width:100%}
.gc-body{padding:32px 32px 24px;position:relative}
.gc-gr{display:flex;align-items:flex-end;gap:5px;height:120px;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent 100%);mask-image:linear-gradient(to right,#000 85%,transparent 100%);position:relative}
.gc-col{display:flex;flex-direction:column-reverse;gap:5px;padding:20px 0 0;margin-top:-20px}
.gc-dot{width:4px;height:4px;border-radius:50%}
.gc-lb{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;font-weight:500;font-family:ui-monospace,'SF Mono',Menlo,monospace;position:relative;height:14px}
.gc-l1{color:#a0a0a0}
.gc-l2{color:#111;position:absolute;left:183px}
.gc-tip{position:absolute;top:0;left:0;background:#111;color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:10}
.gc-tip b{color:#a0a0a0;font-weight:500;margin-left:4px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// Revenue card: a big percentage counter (1s ease-out-cubic) over a dot-matrix bar chart. Every column is a stack of 4px
// dots that pop in on a 0.4s overshoot curve, 20ms per column and 40ms per dot. Hover dims the other columns to 25% and
// grows the column's dots 1.4x. All timings and the data are read from the page's CSS and DOM; the tooltip wording is a
// placeholder (the original tooltip text did not show in the preview).
const CONFIG = {
  label: 'Revenue',
  periods: {
    MONTHLY: { value: 326, from: 'MAY $3,250', to: 'JUN $12,392', light: 23, per: 98, name: 'Jun',
      cols: [2,2,2,3,6,8,3,2,4,5,3,2,2,1,1,1,2,3,2,1,2,1,1,3,4,5,7,13,9,7,8,6,5,4,4,3,2,2,1,2,1,4,2,3,4,5,4,3,4] },
    WEEKLY: { value: 84, from: 'LAST WK $1,120', to: 'THIS WK $2,840', light: 12, per: 290, name: 'Wk',
      cols: [1,2,3,2,5,3,2,4,5,3,2,2,4,5,8,11,9,7,6,8,5,4,3,6] },
    DAILY: { value: 12, from: 'YESTERDAY $420', to: 'TODAY $680', light: 9, per: 130, name: 'Hour',
      cols: [1,2,1,3,4,2,1,2,1,3,5,7,4,6,8,5,3,4] },
  },
  // [time, period]
  plan: [[.25, 'MONTHLY'], [4.6, 'WEEKLY'], [7.8, 'DAILY']],
  hovers: [[2.7, 3.9, 27], [6.0, 7.1, 15], [9.9, 10.9, 10]],
  popDur: .4, colStep: .02, dotStep: .04, countDur: 1,
}
const DUR = 12
window.DUR = DUR

// cubic-bezier(0.34, 1.56, 0.64, 1) solved for y at progress x
const bez = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0; if (x >= 1) return 1
  let t = x
  for (let i = 0; i < 8; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x, dx = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(dx) < 1e-6) break; t -= cx / dx }
  return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3
}
const POP = bez(.34, 1.56, .64, 1)

const card = el('div', 'gc')
card.innerHTML = `<div class="gc-h"><div class="gc-hl"><div class="gc-lab">${CONFIG.label}</div><div class="gc-val"><span class="v"></span><i>%</i></div></div><div class="gc-hr"></div></div><div class="gc-div"></div><div class="gc-body"><div class="gc-tip" style="opacity:0"></div><div class="gc-gr"></div><div class="gc-lb"><span class="gc-l1"></span><span class="gc-l2"></span></div></div>`
const hr = card.querySelector('.gc-hr'), gr = card.querySelector('.gc-gr'), vEl = card.querySelector('.v'), l1 = card.querySelector('.gc-l1'), l2 = card.querySelector('.gc-l2'), tip = card.querySelector('.gc-tip')
const tabs = Object.keys(CONFIG.periods).reverse().map(k => ({ k, e: el('div', 'gc-tab', hr, k) }))     // DAILY WEEKLY MONTHLY
const LW = 460, s0 = TALL ? W * .9 / LW : Math.min(H * .74 / 330, W * .6 / LW)
card.style.transform = `scale(${s0})`
card.style.left = px((W - LW * s0) / 2); const cardH = card.offsetHeight; card.style.top = px((H - cardH * s0) / 2 - (TALL ? 40 : 0))
// column pool (49 max); each period shows the first N
const MAXC = 49, MAXD = 13
const cols = []
for (let c = 0; c < MAXC; c++) { const col = el('div', 'gc-col', gr); const dots = []; for (let d = 0; d < MAXD; d++) dots.push(el('div', 'gc-dot', col)); cols.push({ col, dots }) }

const fmtVal = (v) => '+' + Math.round(v)
const prevVal = (i) => i === 0 ? 0 : CONFIG.periods[CONFIG.plan[i - 1][1]].value
function render(t) {
  let pi = -1; CONFIG.plan.forEach(([pt], i) => { if (t >= pt) pi = i })
  const first = pi < 0
  const key = CONFIG.plan[Math.max(0, pi)][1], P = CONFIG.periods[key], ts = CONFIG.plan[Math.max(0, pi)][0]
  const lt = t - ts
  // counter
  const cp = first ? 0 : clamp(lt / CONFIG.countDur), ec = eo(cp)
  vEl.textContent = fmtVal(first ? 0 : lerp(prevVal(Math.max(0, pi)), P.value, ec))
  l1.textContent = P.from; l2.textContent = P.to
  tabs.forEach(tb => { tb.e.style.color = tb.k === key ? '#111' : '#aaa' })
  // hover
  let hv = null
  for (const [a, b, c] of CONFIG.hovers) if (t >= a && t < b + .25 && !first && a >= ts && c < P.cols.length) hv = { a, b, c, p: t < b ? clamp((t - a) / .3) : 1 - clamp((t - b) / .25) }
  // columns
  cols.forEach((o, c) => {
    const n = c < P.cols.length ? P.cols[c] : 0
    const isH = hv && hv.c === c
    o.col.style.opacity = hv ? (isH ? 1 : 1 - .75 * hv.p).toFixed(3) : 1
    o.dots.forEach((d, j) => {
      if (j >= n || first) { d.style.opacity = 0; return }
      const local = (lt - (c * CONFIG.colStep + j * CONFIG.dotStep)) / CONFIG.popDur
      const p = POP(clamp(local))
      const op = local <= 0 ? 0 : clamp(p)
      const sc = local <= 0 ? 0 : p
      const hs = isH ? 1 + .4 * eo(hv.p) : 1
      d.style.background = c < P.light ? '#c4c4c4' : '#555'
      d.style.opacity = op.toFixed(3)
      d.style.transform = `translateY(${(10 * (1 - p)).toFixed(2)}px) scale(${(sc * hs).toFixed(3)})`
    })
  })
  // tooltip over the hovered column
  if (hv) {
    const n = P.cols[hv.c]
    tip.innerHTML = `${P.name} ${hv.c + 1}<b>$${(n * P.per).toLocaleString('en-US')}</b>`
    S(tip, { left: px(32 + hv.c * 9 + 2), top: px(112 - n * 9), opacity: clamp(hv.p * 1.4), transform: `translate(-50%,${(-10 + 4 * (1 - hv.p)).toFixed(1)}px)` })
  } else tip.style.opacity = 0
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
