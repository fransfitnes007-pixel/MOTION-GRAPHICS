<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.t{position:absolute;white-space:nowrap;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  title: 'Choose Your Plan',
  intro: 'Select the perfect plan for your needs. Upgrade or downgrade at any time.',
  trigger: 'Upgrade Plan',
  plans: [
    { name: 'Basic', price: '$9', desc: 'Perfect for side projects', features: ['5 projects', 'Basic analytics', '24h support'] },
    { name: 'Pro', price: '$19', desc: 'For professional developers', features: ['Unlimited projects', 'Advanced analytics', 'Priority support'] },
  ],
  confirm: 'Confirm Selection', cancel: 'Cancel',
  bg: '#0a0a0b', panel: '#1c1c1e', card: '#1f1f21', cardOn: '#242426',
  // scripted clicks, in seconds
  openAt: 0.9,                       // click the trigger
  picks: [[2.3, 0], [3.5, 1]],       // [time, plan index] the cursor selects
  confirmHover: 4.5, confirmAt: 5.2, // hover then click Confirm, which closes the dialog
  closeAt: 5.3,
  defaultPlan: 1,                    // plan selected when the dialog opens
  openSec: 0.3,                      // dialog fade and scale in
}
const DUR = 7.4
window.DUR = DUR
const SCENE = { w: 960, h: 822, bg: CONFIG.bg, cursor: 'light', path: [] }
// ----- scene scaffold: a fixed-size scene scaled and centred to fit any stage size -----
const sc = Math.min(W / SCENE.w, H / SCENE.h)
const scene = el('div', 'abs'); S(scene, { left: '0', top: '0', width: SCENE.w + 'px', height: SCENE.h + 'px', transformOrigin: '0 0', transform: `translate(${(W - SCENE.w * sc) / 2}px,${(H - SCENE.h * sc) / 2}px) scale(${sc})` })
stage.style.background = SCENE.bg
// ----- icons (lucide, stroke 2) -----
const LUC = {
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>', chevL: '<path d="m15 18-6-6 6-6"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  arrowR: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  zoomIn: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  chevDown: '<path d="m6 9 6 6 6-6"/>', sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
}
const ic = (n, size = 16, sw = 2) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block">${LUC[n]}</svg>`
// ----- scripted cursor: PATH is [[time, x, y, pressed?], ...] in scene units -----
const cur = el('div', 'abs', scene, `<svg width="22" height="28" viewBox="0 0 22 28"><path d="M2 2 L2 22 L7.5 17.5 L11 25.5 L14.5 24 L11 16.2 L18 16 Z" fill="${SCENE.cursor === 'light' ? '#fff' : '#111'}" stroke="${SCENE.cursor === 'light' ? '#000' : '#fff'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`)
S(cur, { pointerEvents: 'none', zIndex: 99 })
function curAt(t) {
  const P = SCENE.path
  if (t <= P[0][0]) return [P[0][1], P[0][2]]
  for (let i = 0; i < P.length - 1; i++) { const a = P[i], b = P[i + 1]; if (t <= b[0]) { const u = eio(seg(t, a[0], b[0])); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u)] } }
  const l = P[P.length - 1]; return [l[1], l[2]]
}
// smooth 0..1 value that is 1 between a and b, easing over f seconds each side
const win = (t, a, b, f = .18) => eo(clamp(seg(t, a, a + f) - seg(t, b, b + f)))
function drawCursor(t) { const [x, y] = curAt(t); S(cur, { left: px(x - 2), top: px(y - 2) }); return [x, y] }

const MX = 244, MY = 98, MW = 469, MH = 657
const trig = el('div', 't', scene, `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px"><path d="M12 3l1.6 4.7L18 9l-4.4 1.3L12 15l-1.6-4.7L6 9l4.4-1.3z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>${CONFIG.trigger}`); S(trig, { left: '398px', top: '392px', width: '165px', height: '45px', borderRadius: '8px', background: '#fff', color: '#111', fontSize: '17px', fontWeight: '500', display: 'flex', alignItems: 'center', justifyContent: 'center' })
const veil = el('div', 't', scene); S(veil, { left: '0', top: '0', width: '960px', height: '822px', background: 'rgba(0,0,0,.3)' })
const dlg = el('div', 't', scene); S(dlg, { left: MX + 'px', top: MY + 'px', width: MW + 'px', height: MH + 'px', borderRadius: '16px', background: CONFIG.panel, border: '1px solid #2b2b2e', boxShadow: '0 30px 80px rgba(0,0,0,.6)' })
const T = (txt, o, p = dlg) => { const e = el('div', 't', p, txt); S(e, o); return e }
T('<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>', { left: '26px', top: '30px' })
T(CONFIG.title, { left: '58px', top: '29px', font: '600 24px/32px -apple-system,"SF Pro Display",system-ui,sans-serif', color: '#fff' })
T(CONFIG.intro.replace('Upgrade or', 'Upgrade or<br>'), { left: '26px', top: '66px', fontSize: '17.5px', lineHeight: '22px', color: '#b9b9bc', whiteSpace: 'normal', width: '400px' })
T('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4c4c7" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>', { left: '435px', top: '19px' })
const checkSvg = (c, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
const cards = CONFIG.plans.map((p, i) => {
  const y = 145 + i * 212, c = el('div', 't', dlg); S(c, { left: '27px', top: y + 'px', width: '415px', height: '194px', borderRadius: '16px', boxSizing: 'border-box' })
  const body = el('div', 't', c); S(body, { left: '0', top: '0', width: '100%', height: '100%' })
  T(p.name, { left: '20px', top: '20px', fontSize: '16px', fontWeight: '600', color: '#fff' }, body)
  T(p.desc, { left: '20px', top: '43px', fontSize: '16.5px', color: '#8e8e92' }, body)
  const pr = T(`<span style="font:700 29px/1 -apple-system,system-ui;color:#fff">${p.price}</span><span style="font:400 19px/1 -apple-system,system-ui;color:#9a9a9e;margin-left:5px">/mo</span>`, { right: '20px', top: '28px' }, body)
  p.features.forEach((f, k) => { T(checkSvg('#d8d8da', 17), { left: '20px', top: 91 + k * 31 + 'px' }, body); T(f, { left: '46px', top: 90 + k * 31 + 'px', fontSize: '16.5px', color: '#d2d2d5' }, body) })
  const tick = T(checkSvg('#111', 11), { left: '395px', top: '-11px', width: '19px', height: '19px', borderRadius: '10px', background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }, c)
  return { c, body, tick }
})
const bc = T(CONFIG.confirm, { left: '27px', top: '586px', width: '198px', height: '45px', borderRadius: '8px', background: '#fff', color: '#111', fontSize: '16.5px', fontWeight: '500', textAlign: 'center', lineHeight: '45px' })
T(CONFIG.cancel, { left: '294px', top: '597px', fontSize: '16.5px', color: '#a1a1a6', width: '100px', textAlign: 'center' })
const cy = (i) => MY + 145 + i * 212 + 97
SCENE.path = [[0, 760, 600], [.4, 760, 600], [.8, 500, 420], [CONFIG.openAt + .3, 520, 430], [CONFIG.picks[0][0] - .55, 620, cy(1) - 10], [CONFIG.picks[0][0], 600, cy(0) + 10], [CONFIG.picks[1][0] - .55, 610, cy(0) + 30], [CONFIG.picks[1][0], 590, cy(1) + 10], [CONFIG.confirmHover, 330, MY + 610], [CONFIG.confirmAt + .2, 335, MY + 612], [6.2, 700, 700], [DUR, 760, 600]]
function render(t) {
  drawCursor(t)
  const open = eo(seg(t, CONFIG.openAt, CONFIG.openAt + CONFIG.openSec)) * (1 - eo(seg(t, CONFIG.closeAt + .1, CONFIG.closeAt + .1 + CONFIG.openSec)))
  S(veil, { opacity: open }); S(dlg, { opacity: open, transform: `scale(${.95 + .05 * open}) translateY(${(1 - open) * 12}px)`, pointerEvents: 'none' })
  vis(dlg, open > .001); vis(veil, open > .001)
  cards.forEach((k, i) => {
    const lastPick = CONFIG.picks.filter((p) => t >= p[0]).pop(), selNow = lastPick ? lastPick[1] : CONFIG.defaultPlan, since = lastPick ? lastPick[0] : CONFIG.openAt
    const on = selNow === i, f = eo(seg(t, since, since + .25))
    const k2 = on ? (lastPick ? f : 1) : (lastPick ? 1 - f : 0)
    S(k.c, { border: `${lerp(1, 2, k2)}px solid ${mixc('#2f2f32', '#ffffff', k2)}`, background: mixc(CONFIG.card, CONFIG.cardOn, k2) })
    k.body.style.opacity = lerp(.72, 1, k2); S(k.tick, { opacity: k2, transform: `scale(${.4 + .6 * k2})` })
  })
  const hc = win(t, CONFIG.confirmHover, CONFIG.confirmAt + .3, .15)
  S(bc, { background: mixc('#ffffff', '#e8e8ea', hc) })
  S(trig, { opacity: 1 - open * .7 })
}
function mixc(a, b, k) { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})` }

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
