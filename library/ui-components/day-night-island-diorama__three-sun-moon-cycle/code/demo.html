// ---------- agents: the app's fallback character (box body + head), wandering, with chat bubbles ----------
const AGENT = [[0x8b5cf6, [[-8, 6], [4, 9], [10, 2], [-2, -2]]], [0x22c55e, [[28, 12], [36, 10], [32, 18]]], [0xf59e0b, [[-30, 8], [-20, -6], [-26, 4]]], [0x3b82f6, [[0, 22], [14, 28], [-6, 30]]], [0xec4899, [[-12, -10], [8, -12], [14, -6]]], [0x14b8a6, [[40, -6], [48, 4], [42, 12]]]]

  const a = new THREE.Group()
  P(a, B(0.5, 0.8, 0.3, M(col)), 0, 0.5, 0); P(a, B(0.4, 0.4, 0.4, M(0xf5c6a0)), 0, 1.1, 0); a.scale.setScalar(3.2); scene.add(a)

// ---------- HUD (the app's clock readout) ----------
const hud = el('div', null, stage); S(hud, { position: 'absolute', left: px(30 * K), top: px(26 * K), padding: '8px 14px', borderRadius: '8px', background: 'rgba(13,13,26,.75)', border: '1px solid rgba(139,92,246,.35)', color: '#e2e8f0', fontFamily: "'SF Mono',ui-monospace,Menlo,monospace", fontSize: px(18 * K), fontWeight: 600, letterSpacing: '.04em' })

const col = (h) => new THREE.Color(h)
const skyDay = col(0x87CEEB), skySunset = col(0xff6633), skyNight = col(0x0a0a2a)
function updateDayNight(dayNightT) {
  const sunAngle = dayNightT * Math.PI * 2 - Math.PI / 2, sunY = Math.sin(sunAngle), sunX = Math.cos(sunAngle) * 80

  moonSphere.position.set(-sunX * 3, Math.max(-50, -sunY * 200), -100); moonSphere.visible = sunY < 0.1
  starMat.opacity = sunY < 0 ? Math.min(1, (-sunY) * 3) : 0; stars.visible = sunY < 0.05
  cloudMat.opacity = sunY > 0 ? 0.6 : 0.15

  else if (sunY > -0.05) sky = skyDay.clone().lerp(skySunset, 1 - (sunY + 0.05) / 0.25)

}
const smooth = (a, b, x) => a + (b - a) * x
function agentPos(ag, t) {   // walks the waypoint loop at a steady pace, hopping like the Wanderer ("abs(sin(t*8))*0.07")
  const pts = ag.way, n = pts.length, u = (((t / DUR) * 1 + ag.phase / 10) % 1 + 1) % 1 * n, i = Math.floor(u), f = u - i

  wpos.needsUpdate = true
  clouds.forEach((c) => { const d = c.userData; c.position.set(((d.x0 + 400 * (t / DUR) * d.k + 200) % 400) - 200, d.y, d.z) })
  birds.forEach((b) => { const d = b.userData, a = d.a0 + w * d.k; b.position.set(Math.cos(a) * d.r, d.y + Math.sin(a * 2) * 3, Math.sin(a) * d.r); b.rotation.y = -a + Math.PI; const fl = Math.sin(t * 9 + d.ph) * 0.5; d.wl.rotation.z = 0.3 + fl; d.wr.rotation.z = -0.3 - fl })
  ffMat.opacity = sunY < 0 ? Math.min(0.9, -sunY * 3) : 0
  for (let i = 0; i < ffN; i++) { const b = ffBase[i], p = ffPh[i]; ffPos[i * 3] = b[0] + Math.sin(w * 3 + p) * 2; ffPos[i * 3 + 1] = b[1] + Math.sin(w * 4 + p * 2) * 0.8; ffPos[i * 3 + 2] = b[2] + Math.cos(w * 3 + p) * 2 }
  ffGeo.attributes.position.needsUpdate = true
  raveLights.forEach((L, i) => { const a = L.userData.baseAngle + w * 4;   // app: baseAngle + elapsed * 1.5 (snapped to 4 turns a loop)
    L.target.position.set(-25 + Math.cos(a) * 7, 0, Math.sin(a) * 7); L.target.updateMatrixWorld(); const mid = new THREE.Vector3((L.position.x + L.target.position.x) / 2, 6, (L.position.z + L.target.position.z) / 2); L.userData.beam.position.copy(mid); L.userData.beam.lookAt(L.target.position.x, 0, L.target.position.z); L.userData.beam.rotateX(Math.PI / 2); L.userData.beam.visible = sunY < 0.35 })
  raveLights.forEach((L) => { L.intensity = 90 * Math.min(1, Math.max(0.15, 0.9 - sunY * 1.5)) })
  agents.forEach((ag) => { const s = agentPos(ag, t); ag.a.position.set(s.x, s.moving ? 1.05 + Math.abs(Math.sin(t * 8 + ag.phase)) * 0.07 : 1.05, s.z); ag.a.rotation.y = s.rot; ag.pos = s })
  bubbles.forEach((b) => {   // life 4.5s, fade in .3s, drifts up
    const age = ((t - b.t0) % DUR + DUR) % DUR, life = 4.5; const op = age < life ? Math.min(1, age / 0.3) * (age > life - 0.8 ? (life - age) / 0.8 : 1) : 0
    const ap = agents[b.agent].a.position; b.spr.position.set(ap.x, ap.y + 5.4 + Math.min(age, life) * 0.35, ap.z); b.spr.material.opacity = op
  })
  // camera: slow aerial sway around the island (the app uses OrbitControls)
  const ca = 0.55 + 0.45 * Math.sin(w), cr = TALL ? 190 : 150
  camera.position.set(Math.sin(ca) * cr, 40 + 5 * Math.sin(w * 2), Math.cos(ca) * cr); camera.lookAt(0, TALL ? 26 : 16, -4)
  renderer.render(scene, camera)
}

// ---------- SKILL END ----------

window.render = render
document.fonts.ready.then(() => { render(0); window.__rdy(true) })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
})()
</script>
