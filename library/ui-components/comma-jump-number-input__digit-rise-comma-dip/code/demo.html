<!doctype html>
<html><head><meta charset="utf-8"><title>comma-jump-number-input</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10;color:#fff}
.ch{position:absolute;text-align:center;font-weight:700;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap;font-weight:500}
.key{position:absolute;border-radius:16px;background:rgba(255,255,255,.07);color:#fff;text-align:center;font-weight:500}
.fing{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.55)}
.rip{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.5)}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 6
window.DUR = DUR
const F = 230 * K
const numCY = TALL ? CY - 380 : CY - 270
const lineY = numCY + F * .76
const ks = TALL ? 1.35 : 1.2
const kw = 110 * ks, kh = 64 * ks, kg = 12 * ks
const padW = 3 * kw + 2 * kg, padTop = TALL ? CY - 40 : CY + 70
const DIGITS = '1234567'

const events = [{ t: -1, n: 0 }], taps = []
for (let k = 0; k < 7; k++) { const t = .5 + .28 * k; events.push({ t, n: k + 1 }); taps.push({ t, key: String(k + 1) }) }
for (let k = 0; k < 7; k++) { const t = 3.4 + .22 * k; events.push({ t, n: 6 - k }); taps.push({ t, key: 'del' }) }

// simulated number pad
const KEYS = ['1','2','3','4','5','6','7','8','9','','0','del']
const keyPos = {}, keyEls = {}
KEYS.forEach((k, i) => {
  const c = i % 3, r = (i / 3) | 0
  const x = CX - padW / 2 + c * (kw + kg), y = padTop + r * (kh + kg)
  keyPos[k] = { x: x + kw / 2, y: y + kh / 2 }
  if (!k) return
  const e = el('div', 'key', stage, k === 'del' ? '&#9003;' : k)
  S(e, { left: px(x), top: px(y), width: px(kw), height: px(kh), lineHeight: px(kh), fontSize: px(30 * ks) })
  keyEls[k] = e
})

// number pool
const dollar = el('div', 'ch', stage, '$')
const zero = el('div', 'ch', stage, '0')
const digs = DIGITS.split('').map(d => el('div', 'ch', stage, d))
const commas = [0, 1].map(() => el('div', 'ch', stage, ','))
;[dollar, zero, ...digs, ...commas].forEach(e => S(e, { fontSize: px(F), lineHeight: px(F * 1.1), width: px(F * .6), height: px(F * 1.1) }))
commas.forEach(e => S(e, { width: px(F * .3) }))
const info = el('div', 'sub', stage), msg = el('div', 'sub', stage, 'Not enough balance')
S(info, { top: px(lineY - 30 * K), fontSize: px(40 * K), lineHeight: px(60 * K), color: 'rgba(255,255,255,.42)' })
S(msg, { top: px(lineY - 30 * K), fontSize: px(40 * K), lineHeight: px(60 * K), color: '#ff453a' })

const fing = el('div', 'fing'), rip = el('div', 'rip')
const FS = 60

function lay(n) {
  const dw = .6 * F, cw = .3 * F, m = Math.max(n, 1)
  const total = dw + m * dw + Math.floor((m - 1) / 3) * cw
  let x = -total / 2
  const o = { s: x + dw / 2, d: [], c: [] }
  x += dw
  for (let i = 0; i < m; i++) {
    o.d.push(x + dw / 2); x += dw
    if (i < m - 1 && (m - 1 - i) % 3 === 0) { o.c[(m - 1 - i) / 3 - 1] = x + cw / 2; x += cw }
  }
  return o
}
const nCommas = (n) => Math.floor((Math.max(n, 1) - 1) / 3)
const fmt = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })

function place(e, x, y, a, w) {
  S(e, { left: px(CX + x - w / 2), top: px(numCY - F * .55 + y), opacity: clamp(a).toFixed(3) })
  vis(e, a > .003)
}

function render(t) {
  let ix = 0
  events.forEach((e, i) => { if (t >= e.t) ix = i })
  const cur = events[ix], prev = events[Math.max(0, ix - 1)]
  const p = seg(t, cur.t, cur.t + .7)
  const sp = spring(p, 6, 10)
  const spr = spring(seg(t, cur.t, cur.t + .55), 7, 12)
  const lc = lay(cur.n), lp = lay(prev.n)
  const shift = (lc.s - lp.s) * sp
  const dw = .6 * F, cw = .3 * F

  place(dollar, lerp(lp.s, lc.s, sp), 0, 1, dw)

  // zero placeholder
  const zc = cur.n === 0, zp = prev.n === 0
  if (zc && zp) place(zero, lc.d[0], 0, 1, dw)
  else if (zc) place(zero, lc.d[0], (1 - spr) * F * .5, seg(p, 0, .4), dw)
  else if (zp) place(zero, lp.d[0] + shift, eo(p) * F * .5, 1 - seg(p, 0, .5), dw)
  else place(zero, 0, 0, 0, dw)

  digs.forEach((e, i) => {
    const ic = i < cur.n, ip = i < prev.n
    if (ic && ip) place(e, lerp(lp.d[i], lc.d[i], sp), 0, 1, dw)
    else if (ic) place(e, lc.d[i], (1 - spr) * F * .6, seg(p, 0, .35), dw)
    else if (ip) place(e, lp.d[i] + shift, eo(p) * F * .5, 1 - seg(p, 0, .5), dw)
    else place(e, 0, 0, 0, dw)
  })

  const cc = nCommas(cur.n), cp = nCommas(prev.n)
  const dip = cc !== cp ? F * .17 * Math.sin(Math.PI * seg(t, cur.t, cur.t + .6)) : 0
  const spc = spring(seg(t, cur.t + .03, cur.t + .75), 6, 9)
  commas.forEach((e, j) => {
    const ic = j < cc, ip = j < cp
    if (ic && ip) place(e, lerp(lp.c[j], lc.c[j], spc), dip, 1, cw)
    else if (ic) place(e, lc.c[j], dip, seg(p, 0, .4), cw)
    else if (ip) place(e, lp.c[j] + shift, dip * .6, 1 - seg(p, 0, .35), cw)
    else place(e, 0, 0, 0, cw)
  })

  // converted line / balance message
  const ov = (n) => n >= 7 ? 1 : 0
  const a = lerp(ov(prev.n), ov(cur.n), eio(seg(t, cur.t, cur.t + .35)))
  const amt = cur.n ? parseInt(DIGITS.slice(0, cur.n), 10) : 0
  info.textContent = '≈ ' + fmt(amt * .0123) + ' units'
  S(info, { opacity: (1 - a).toFixed(3) }); S(msg, { opacity: a.toFixed(3) })

  // key highlights
  KEYS.forEach(k => {
    if (!k) return
    let dd = 9
    taps.forEach(tp => { if (tp.key === k && t >= tp.t) dd = Math.min(dd, t - tp.t) })
    const h = 1 - seg(dd, 0, .25)
    keyEls[k].style.background = `rgba(255,255,255,${(.07 + .2 * h).toFixed(3)})`
  })

  // finger
  let ti = -1
  taps.forEach((tp, i) => { if (t >= tp.t - .2) ti = i })
  if (ti < 0) ti = 0
  const tp = taps[ti], pp = taps[ti - 1]
  const tgt = keyPos[tp.key]
  const gap = pp ? tp.t - pp.t : 9
  let fx = tgt.x, fy = tgt.y
  const mv = eio(seg(t, tp.t - .2, tp.t - .04))
  if (pp && gap < 1) { fx = lerp(keyPos[pp.key].x, tgt.x, mv); fy = lerp(keyPos[pp.key].y, tgt.y, mv) }
  else { fx = lerp(tgt.x + 40, tgt.x, mv); fy = lerp(tgt.y + 90, tgt.y, mv) }
  const inRun = (t > .25 && t < 2.55) || (t > 3.15 && t < 5.0)
  const fa = t < 3 ? seg(t, .25, .45) * (1 - seg(t, 2.35, 2.55)) : seg(t, 3.15, 3.35) * (1 - seg(t, 4.8, 5.0))
  const dd = t - tp.t
  const press = clamp(seg(dd, -.1, 0) - seg(dd, .05, .2))
  const sz = FS * (1 - .22 * press)
  S(fing, { left: px(fx - sz / 2), top: px(fy - sz / 2), width: px(sz), height: px(sz), opacity: fa.toFixed(3) })
  vis(fing, inRun && fa > .01)
  const rp = dd >= 0 ? seg(dd, 0, .45) : 1
  const rs = FS * (1 + 1.4 * rp)
  S(rip, { left: px(fx - rs / 2), top: px(fy - rs / 2), width: px(rs), height: px(rs), opacity: (fa * (1 - rp) * .9).toFixed(3) })
  vis(rip, fa > .01 && rp < 1)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
