<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#121212;color:#fff}
.card{position:absolute;left:0;top:0;width:720px;border-radius:30px;padding:12px;background:#18181a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 12px 40px rgba(0,0,0,.45);display:flex;gap:12px;transform-origin:50% 0}
.img{width:120px;height:120px;border-radius:18px;overflow:hidden;flex:none;position:relative}
.main{flex:1;display:flex;flex-direction:column;justify-content:space-between;position:relative;padding:2px 0}
.main h3{font-size:14px;font-weight:600;color:#fafafa;line-height:20px;padding-right:32px}
.main p{font-size:14px;color:#a1a1aa;line-height:20px;margin-top:4px;padding-right:8px}
.foot{display:flex;align-items:center;justify-content:space-between;padding-right:4px}
.foot b{display:block;font-size:14px;font-weight:500;color:#fafafa;line-height:18px}
.foot small{display:block;font-size:12px;color:#a1a1aa;line-height:16px}
.btn{height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;display:flex;align-items:center}
.x{position:absolute;right:-2px;top:-2px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#a1a1aa}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- shared helpers (keyframes, scripted cursor, fixed 1280x800 design space scaled to fit) ----
const kf = (t, k, ez = eio) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; return va + (vb - va) * ez((t - a) / (b - a)) } return k[k.length - 1][1] }
const CURSOR_SVG = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 2.5l15 8-6.4 2L9.6 19.5z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
// pts: [[time, x, y, pressed?], ...]  (x, y in the 1280x800 design space); eases between points
const cursorAt = (t, pts, ez = eio) => { let r = { x: pts[0][1], y: pts[0][2], p: 0 }; if (t <= pts[0][0]) return r
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if (t <= b[0]) { const u = ez((t - a[0]) / Math.max(1e-6, b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), p: b[3] && a[3] ? 1 : (t > b[0] - .08 && b[3]) || (a[3] && t < a[0] + .08) ? 1 : 0 } } }
  const l = pts[pts.length - 1]; return { x: l[1], y: l[2], p: l[3] ? 1 : 0 } }
const root = el('div', 'abs'); const U = Math.min(W / 1280, H / 800)
S(root, { width: '1280px', height: '800px', left: px((W - 1280) / 2), top: px((H - 800) / 2), transform: `scale(${U})`, transformOrigin: '50% 50%' })
const cur = el('div', 'abs', root, CURSOR_SVG); S(cur, { left: 0, top: 0, zIndex: 99, pointerEvents: 'none', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' })
const putCursor = (c) => S(cur, { transform: `translate(${c.x - 4}px,${c.y - 2.5}px) scale(${c.p ? .88 : 1})`, opacity: c.show === 0 ? 0 : 1 })
// ---- end shared ----

const CONFIG = {
  scale: 1.6,                   // size of the card on the 1280x800 canvas
  title: 'Become an ACME Creator!',
  body: 'Lorem ipsum dolor sit amet consectetur. Sed arcu donec id aliquam dolor sed amet faucibus etiam.',
  stat: 'Only 10 spots',
  note: 'Submission ends Oct 10.',
  button: 'Apply Now',
  buttonBg: '#ffffff', buttonBgHover: '#e4e4e7', buttonText: '#09090b',
  imageBg: '#b7e4dd',           // placeholder tile behind the cherries
}
const DUR = 7.5
window.DUR = DUR
const CH = `<svg viewBox="0 0 120 120" width="120" height="120" style="display:block"><rect width="120" height="120" fill="${CONFIG.imageBg}"/><g transform="translate(60 62) scale(1.25) translate(-60 -62)"><path d="M62 24 C60 40 54 56 44 74 M62 24 C66 42 70 58 76 76" stroke="#8a8a2a" stroke-width="1.6" fill="none"/><circle cx="43" cy="82" r="14" fill="#b4101d"/><circle cx="77" cy="84" r="14" fill="#c2121f"/><circle cx="38" cy="77" r="3.5" fill="#ff8a8a" opacity=".7"/><circle cx="72" cy="79" r="3.5" fill="#ff8a8a" opacity=".7"/></g></svg>`
const card = el('div', 'card', root, `<div class="img">${CH}</div><div class="main"><div><h3>${CONFIG.title}</h3><p>${CONFIG.body}</p></div><div class="foot"><div><b>${CONFIG.stat}</b><small>${CONFIG.note}</small></div><div class="btn">${CONFIG.button}</div></div><div class="x"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M3.47 3.47a.75.75 0 0 1 1.06 0L8 6.94l3.47-3.47a.75.75 0 1 1 1.06 1.06L9.06 8l3.47 3.47a.75.75 0 1 1-1.06 1.06L8 9.06l-3.47 3.47a.75.75 0 0 1-1.06-1.06L6.94 8 3.47 4.53a.75.75 0 0 1 0-1.06Z"/></svg></div></div>`)
const btn = card.querySelector('.btn'), xb = card.querySelector('.x')
const CW = 720 * CONFIG.scale, CHt = card.offsetHeight * CONFIG.scale
const cx0 = 640 - CW / 2, cy0 = 400 - CHt / 2
S(card, { left: px(cx0), top: px(cy0), transform: `scale(${CONFIG.scale})`, transformOrigin: '0 0' })
// scripted positions: Apply Now button centre, close button centre
const bx = cx0 + (720 - 12 - 4 - 44) * CONFIG.scale, by = cy0 + (card.offsetHeight - 12 - 22) * CONFIG.scale
const xx = cx0 + (720 - 12 - 14) * CONFIG.scale, xy = cy0 + (12 + 12) * CONFIG.scale
const P = [[0, 1150, 700, 0], [1.2, 1150, 700, 0], [2.0, bx, by, 0], [3.2, bx, by, 0], [3.9, xx, xy, 0], [4.2, xx, xy, 0], [4.28, xx, xy, 1], [4.4, xx, xy, 0], [5.6, xx, xy, 0], [6.6, 1150, 700, 0], [7.5, 1150, 700, 0]]
function render(t) {
  const a = eo(seg(t, .15, .8))
  const hb = seg(t, 1.9, 2.1) * (1 - seg(t, 3.2, 3.4)), hx = seg(t, 3.8, 3.95) * (1 - seg(t, 4.5, 4.6))
  // clicking close folds the card away, then it comes back
  const gone = seg(t, 4.3, 4.65) * (1 - seg(t, 5.9, 6.4))
  S(card, { opacity: a * (1 - gone), transform: `scale(${CONFIG.scale * (.97 + .03 * a) * (1 - .06 * gone)}) translateY(${(1 - a) * 20 - gone * 8}px)` })
  S(btn, { background: hb > .5 ? CONFIG.buttonBgHover : CONFIG.buttonBg, color: CONFIG.buttonText, transform: `scale(${1 - .04 * hb})` })
  S(xb, { background: `rgba(255,255,255,${.1 * hx})`, color: hx > .5 ? '#fafafa' : '#a1a1aa' })
  putCursor(cursorAt(t, P))
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
