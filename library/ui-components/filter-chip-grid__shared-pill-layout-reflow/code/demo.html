<!doctype html>
<html><head><meta charset="utf-8"><title>Filter chip grid</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fdfdfd}
.chip{position:absolute;top:0;height:58px;line-height:56px;border-radius:12px;border:1px solid #e3e3e6;background:#fff;font-size:22px;font-weight:500;color:#2a2a2d;padding:0 20px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chip small{font-size:16px;color:#85858b;margin-left:9px;font-weight:500}
.pill{position:absolute;top:0;height:58px;border-radius:12px;background:#212121;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cell{position:absolute;width:230px;height:128px;border-radius:20px;border:1px solid #e6e6e9;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.cell b{position:absolute;left:19px;top:21px;font-size:22px;font-weight:500;color:#3b3b3f}
.cell span{position:absolute;left:19px;top:84px;font-size:18px;color:#777}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  items: [   // name, size, kind
    ['hero-wide', '2.4 MB', 'image'], ['onboarding', '18 MB', 'clip'], ['brand-deck', '840 KB', 'doc'],
    ['swatches', '410 KB', 'image'], ['changelog', '22 KB', 'doc'], ['teaser-cut', '31 MB', 'clip'],
    ['grid-study', '1.1 MB', 'image'], ['contract-v3', '96 KB', 'doc'], ['still-frame', '3.0 MB', 'image'],
  ],
  filters: [['All', 'all'], ['Images', 'image'], ['Clips', 'clip'], ['Docs', 'doc']],
  columns: 3, cellW: 230, cellH: 128, gap: 15,
  pillSec: .38,                 // time for the black pill to slide to another chip
  reflowSec: .55,               // time for the cards to move to their new places
  // scripted clicks: [time, filter index]
  clicks: [[.85, 2], [1.95, 3], [3.0, 1], [3.9, 0]],
  pillColor: '#212121',
}
const DUR = 6
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const box = fitBox(740, 500, .8)
const chipX = [0, 105, 260, 391], chipW = [94, 144, 119, 120]
const pill = el('div', 'pill', box); pill.style.background = CONFIG.pillColor
const counts = CONFIG.filters.map(([, k]) => k === 'all' ? CONFIG.items.length : CONFIG.items.filter((i) => i[2] === k).length)
const chips = CONFIG.filters.map(([lab], i) => { const c = el('div', 'chip', box, `${lab}<small>${counts[i]}</small>`); S(c, { left: chipX[i] + 'px', width: chipW[i] + 'px' }); return c })
const cells = CONFIG.items.map(([n, s]) => { const c = el('div', 'cell', box, `<b>${n}</b><span>${s}</span>`); return c })
const cur = makeCursor(box)
const shown = (fi) => CONFIG.items.map((it, i) => (CONFIG.filters[fi][1] === 'all' || it[2] === CONFIG.filters[fi][1]) ? i : -1).filter((i) => i >= 0)
const slot = (n) => [(n % CONFIG.columns) * (CONFIG.cellW + CONFIG.gap), 77 + Math.floor(n / CONFIG.columns) * (CONFIG.cellH + 16)]
// timeline of selections: sel[k] = {t, f}
const sel = [{ t: -9, f: 0 }, ...CONFIG.clicks.map(([t, f]) => ({ t, f }))]
const cursorTarget = (f) => [chipX[f] + chipW[f] * .6, 38]
const cp = [[0, 560, 300]]
CONFIG.clicks.forEach(([t, f]) => { cp.push([t - .45, ...cursorTarget(f)], [t + .12, ...cursorTarget(f)]) })
cp.push([DUR - .5, 600, 330], [DUR, 600, 330])
function render(t) {
  let k = 0; sel.forEach((s, i) => { if (t >= s.t) k = i })
  const cur_ = sel[k], prev = sel[Math.max(0, k - 1)]
  // pill
  const pq = k === 0 ? 1 : eo(seg(t, cur_.t, cur_.t + CONFIG.pillSec))
  const px0 = lerp(chipX[prev.f], chipX[cur_.f], k === 0 ? 1 : pq), pw0 = lerp(chipW[prev.f], chipW[cur_.f], k === 0 ? 1 : pq)
  S(pill, { left: px(px0), width: px(pw0) })
  chips.forEach((c, i) => {
    const ov = clamp((Math.min(px0 + pw0, chipX[i] + chipW[i]) - Math.max(px0, chipX[i])) / chipW[i])
    const v = Math.round(lerp(42, 255, clamp(ov * 1.6 - .3)))
    c.style.color = `rgb(${v},${v},${v})`; c.lastChild.style.color = ov > .5 ? '#bdbdc2' : '#85858b'
    c.style.borderColor = ov > .6 ? 'transparent' : '#e3e3e6'; c.style.background = `rgba(255,255,255,${1 - clamp(ov * 2)})`; c.style.boxShadow = ov > .6 ? 'none' : ''
  })
  // cards
  const vNow = shown(cur_.f), vPrev = shown(prev.f)
  const rq = k === 0 ? 1 : spring(seg(t, cur_.t, cur_.t + CONFIG.reflowSec), 6, 8)
  const rq2 = k === 0 ? 1 : eo(seg(t, cur_.t, cur_.t + CONFIG.reflowSec * .6))
  cells.forEach((c, i) => {
    const a = vNow.indexOf(i), b = vPrev.indexOf(i)
    if (a >= 0) {
      const [x1, y1] = slot(a)
      if (b >= 0 && k > 0) { const [x0, y0] = slot(b); S(c, { display: '', left: px(lerp(x0, x1, rq)), top: px(lerp(y0, y1, rq)), opacity: 1, transform: 'none' }) }
      else S(c, { display: '', left: px(x1), top: px(y1), opacity: k === 0 ? 1 : rq2, transform: `scale(${k === 0 ? 1 : .94 + .06 * rq2})` })
    } else if (b >= 0 && k > 0 && rq2 < 1) { const [x0, y0] = slot(b); S(c, { display: '', left: px(x0), top: px(y0), opacity: 1 - rq2 * 1.4 < 0 ? 0 : 1 - rq2 * 1.4, transform: `scale(${1 - .06 * rq2})` }) }
    else c.style.display = 'none'
  })
  const [mx, my] = kfp(t, cp)
  const press = CONFIG.clicks.some(([ct]) => t > ct - .06 && t < ct + .1)
  setCursor(cur, mx, my, press, t > .2)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
