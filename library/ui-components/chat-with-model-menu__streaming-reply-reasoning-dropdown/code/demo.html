<!-- Library demo. Every frame is a pure function of time: window.render(t). Open it in a browser and it loops.
     engine/tools/render_demo.cjs drives it frame by frame (?render=1). URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>

/* SKILL CSS START */
#stage{background:#fff;color:#0a0a0a;font-family:ui-sans-serif,system-ui,-apple-system,'SF Pro Text',sans-serif}

</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'
// cubic-bezier(x1,y1,x2,y2) as a function of progress, for the CSS easings read off the source
const bez = (x1, y1, x2, y2) => { const B = (a, b, t) => 3 * a * (1 - t) * (1 - t) * t + 3 * b * (1 - t) * t * t + t * t * t
  return (x) => { x = clamp(x); let lo = 0, hi = 1, t = x; for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; B(x1, x2, t) < x ? lo = t : hi = t } return B(y1, y2, t) } }
// phone-sized virtual canvas: the source previews were read at 540 x 960 CSS px; tall scales that to the frame width, wide shows a 540 column at 760 high
const SC = TALL ? W / 540 : H / 760, vw = W / SC, vh = H / SC
const V = el('div', 'abs'); S(V, { left: '0px', top: '0px', width: vw + 'px', height: vh + 'px', transform: `scale(${SC})`, transformOrigin: '0 0', overflow: 'hidden' })
const CW = Math.min(vw, 540), COL = el('div', 'abs', V); S(COL, { left: px((vw - CW) / 2), top: '0px', width: CW + 'px', height: vh + 'px', overflow: 'hidden' })

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  prior: [
    { u: 'Is it true that a day on Venus is longer than its year?', a: ['Yes. Venus takes 243 Earth days to rotate once, but only 225 days to orbit the Sun, so its day is longer than its year.', 'It also spins in the opposite direction to most planets, which means the Sun rises in the west there.'] },
    { u: 'How hot does it get on the surface?', a: ['The surface sits around 465°C, hot enough to melt lead. The atmosphere traps so much heat that Venus stays hotter than Mercury, even though Mercury is much closer to the Sun.'] } ],
  ask: 'Does Venus have any moons?',
  reply: ['Good question. Venus has no moons and no rings, which makes it unusual among the inner planets. Most explanations point to its slow, retrograde spin: any moon it once had would have drifted inward and been pulled apart by tidal forces.', 'Mercury is the only other moonless planet in the solar system.'],
  levels: ['Instant', 'Medium', 'High', 'Extra High', 'Pro'], from: 3, to: 2,
  typeAt: .5, typeDur: 1.5, sendAt: 2.3, cps: 164, thinkFor: .69, menuAt: 5.7, hoverAt: 6.5, pickAt: 7.1 }
const DUR = 9.5
window.DUR = DUR
const IC = { copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></svg>', edit: '<svg viewBox="0 0 24 24"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg>', redo: '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5"/><path d="M20 3.5v5h-5"/></svg>', plus: '<svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>', mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>', up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>', down: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>', check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', right: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' }
const root = el('div', 'c2 abs', COL); S(root, { left: '0px', top: '0px', width: '100%', height: vh + 'px', background: '#fff' })
const FH = 94, SH = vh - FH
const scroll = el('div', 'c2-scroll', root); S(scroll, { height: SH + 'px' })
const inn = el('div', 'c2-in', scroll)
const userBlk = (txt, first) => { const b = el('div', 'c2-blk u' + (first ? ' first' : ''), inn); const w = el('div', 'c2-ub', b); const bb = el('div', 'c2-bub', w, txt); const a = el('div', 'c2-act', w, IC.copy + IC.edit); return { b, bb, a } }
const aiBlk = (paras, acts = true) => { const b = el('div', 'c2-blk a', inn); const ps = paras.map((p) => el('div', 'c2-p', b, p)); const a = el('div', 'c2-act l', b, IC.copy + IC.redo); return { b, ps, a } }
CONFIG.prior.forEach((x, i) => { userBlk(x.u, i === 0); aiBlk(x.a) })
const nu = userBlk(CONFIG.ask, false)
const na = aiBlk(['', ''], true); const think = el('div', 'c2-p', na.b, 'Thinking...'); na.b.insertBefore(think, na.b.firstChild)
const form = el('div', 'c2-form', root); S(form, { top: SH + 'px', height: FH + 'px' })
const grp = el('div', 'c2-grp', form)
el('div', 'c2-plus', grp, IC.plus)
const ph = el('div', 'c2-ph', grp, 'Ask anything'), typed = el('div', 'c2-ph', grp), cur = el('div', 'c2-cur', grp)
const mic = el('div', 'c2-mic', grp, IC.mic), send = el('div', 'c2-send', grp, IC.up)
const mod = el('div', 'c2-mod', grp), modT = el('div', '', mod, CONFIG.levels[CONFIG.from]); el('div', '', mod, IC.down)
el('div', 'c2-note', form, 'AI can make mistakes. Check important info.')
const menu = el('div', 'c2-menu', root); S(menu, { right: '24px', width: '196px' })
el('div', 'c2-mh', menu, 'Intelligence')
const items = CONFIG.levels.map((n, i) => { const d = el('div', 'c2-mi', menu, (i === CONFIG.from ? IC.check : '') + n + (i === 0 ? '<small>5.5</small>' : '')); return d })
el('div', 'c2-sep', menu); el('div', 'c2-mi', menu, 'GPT-5.6 Sol' + '<span class="ch">' + IC.right.replace('<svg', '<svg width="14" height="14"') + '</span>')
const L1 = CONFIG.reply[0].length, LT = L1 + CONFIG.reply[1].length
const zoomIn = (x) => eo(x)
function render(t){
  const C = CONFIG
  // composer text
  const n = t < C.sendAt ? Math.floor(clamp((t - C.typeAt) / C.typeDur) * C.ask.length) : 0
  typed.textContent = C.ask.slice(0, n); S(typed, { color: '#0a0a0a' })
  vis(ph, n === 0); vis(cur, t < C.sendAt && t >= C.typeAt - .2)
  const tw = typed.offsetWidth; S(cur, { left: px(46 + tw + 1), top: '12px', opacity: String(Math.floor(t * 2) % 2 ? .2 : 1) })
  const sendOn = n > 0 && t < C.sendAt
  vis(send, sendOn); S(send, { transform: `scale(${.6 + .4 * eo(seg(t, C.typeAt, C.typeAt + .15))})`, opacity: String(eo(seg(t, C.typeAt, C.typeAt + .15))) }); vis(mic, !sendOn)
  // thread
  const shown = t >= C.sendAt
  vis(nu.b, shown); vis(na.b, shown)
  const e = eo(seg(t, C.sendAt, C.sendAt + .22))
  S(nu.bb, { opacity: String(e), transform: `translateY(${(1 - e) * 8}px)` }); S(nu.a, { opacity: String(e) })
  const st = C.sendAt + C.thinkFor + .15, sn = Math.floor(clamp((t - st) * C.cps, 0, LT))
  const streaming = t >= st
  vis(think, shown && !streaming)
  const sh = (t * 1.1) % 1.6; S(think, { color: 'transparent', backgroundImage: `linear-gradient(100deg,#b4b4b4 ${sh * 100 - 60}%,#555 ${sh * 100 - 30}%,#b4b4b4 ${sh * 100}%)`, webkitBackgroundClip: 'text', backgroundClip: 'text', width: 'fit-content' })
  na.ps[0].textContent = CONFIG.reply[0].slice(0, Math.min(sn, L1)); na.ps[1].textContent = CONFIG.reply[1].slice(0, Math.max(0, sn - L1))
  vis(na.ps[0], streaming); vis(na.ps[1], sn > L1)
  const done = st + LT / C.cps
  S(na.a, { opacity: String(eo(seg(t, done, done + .25))) })
  na.a.style.display = shown ? '' : 'none'
  // autoscroll like the source: stick to the bottom, with a short ease when the user bubble lands
  const maxS = Math.max(0, inn.offsetHeight - SH)
  const add = shown ? (nu.b.offsetHeight + 18) + 40 : 0
  const sy = Math.max(0, maxS - (1 - eo5(seg(t, C.sendAt, C.sendAt + .45))) * add)
  inn.style.transform = `translateY(${-sy}px)`
  // model menu
  const o = t >= C.menuAt && t < C.pickAt + .2
  const mo = o ? (t < C.pickAt ? eo(seg(t, C.menuAt, C.menuAt + .15)) : 1 - eo(seg(t, C.pickAt + .08, C.pickAt + .2))) : 0
  vis(menu, mo > 0)
  S(menu, { opacity: String(mo), transform: `scale(${.95 + .05 * mo})`, bottom: (FH - 2) + 'px' })
  const hov = t >= C.hoverAt && t < C.pickAt + .1 ? C.to : -1
  items.forEach((d, i) => S(d, { background: i === hov ? '#f5f5f5' : 'transparent' }))
  const chk = items[C.from].querySelector('svg'), pickd = t >= C.pickAt
  if (pickd) { const ck = items[C.from].querySelector('svg'); if (ck) { ck.style.opacity = '0' } }
  modT.textContent = CONFIG.levels[pickd ? C.to : C.from]
  S(mod, { background: mo > 0 && !pickd ? '#f5f5f5' : 'transparent', borderRadius: '16px' })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
