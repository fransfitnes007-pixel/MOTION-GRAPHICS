<!doctype html>
<html><head><meta charset="utf-8"><title>Floating phone hero with credential marquee</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--blue:#1290CB;--navy:#0A3A52;--teal:#68CCD1;--tealsoft:#DDF2F3;--aqua:#74FFF6;--gold:#C9A24B;--goldsoft:#F6EDDA;--ink:#17222B;--ink2:#46555F;--gray:#7C8890;--line:#E8E2D8;--bg:#FAF7F1;--tint:#F2EDE3;--bluetint:#EAF4FA}
#stage{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.ui{background:var(--bg)}
.blob{position:absolute;border-radius:50%}
.nav{position:absolute;left:140px;right:140px;top:14px;height:50px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:0 6px 24px rgba(10,58,82,.08);display:flex;align-items:center;padding:0 26px;gap:26px;font-size:14px;font-weight:600;color:var(--ink2)}
.nav b{color:var(--navy);font-weight:800;margin-right:auto}.nav .cta{background:var(--blue);color:#fff;padding:9px 20px;border-radius:999px}
.eyebrow{display:inline-block;text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;font-weight:800;color:var(--blue);background:var(--bluetint);padding:8px 16px;border-radius:999px}
h1{font-size:68px;line-height:1.05;letter-spacing:-.03em;font-weight:800;margin-top:18px;color:var(--ink)}
.accent{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;color:var(--blue);letter-spacing:0}
.lead{font-size:18px;color:var(--ink2);margin-top:20px;max-width:560px;line-height:1.6}
.btn{display:inline-block;font-weight:700;font-size:16px;padding:16px 30px;border-radius:999px}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(18,144,203,.3)}.btn.o{border:2px solid var(--navy);color:var(--navy)}
.fine{margin-top:18px;font-size:13.5px;color:var(--gray)}
.phone{position:absolute;width:300px;height:610px;border-radius:48px;background:#0B1216;padding:12px;box-shadow:0 24px 70px rgba(10,58,82,.14),inset 0 0 0 2px #2A3942}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0B1216;border-radius:20px;z-index:3}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);position:relative}
.mini{font-size:11px;padding:44px 14px 14px}
.m-hi{font-weight:800;font-size:15px;letter-spacing:-.02em}.m-sub{color:var(--gray);font-size:10px;margin-bottom:10px}
.m-card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(10,58,82,.08);margin-bottom:10px}
.m-navy{background:var(--navy);color:#fff}.m-navy .m-sub{color:#9FC4D6}
.m-join{background:var(--teal);color:var(--navy);font-weight:800;border-radius:999px;padding:6px 12px;display:inline-block;font-size:10px;margin-top:8px}
.m-ring{display:flex;gap:8px;margin-top:6px}.m-ring>div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:8px 4px}
.pct{font-weight:850;color:var(--blue);font-size:13px}.lb{font-size:8.5px;color:var(--gray)}
.m-bar{height:7px;border-radius:99px;background:var(--tint);overflow:hidden;margin-top:6px}.m-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px}
.m-pod{display:flex;gap:5px;margin-top:6px}.m-pod b{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px}.m-pod b:first-child{background:var(--blue)}
.marquee{position:absolute;left:0;right:0;overflow:hidden;white-space:nowrap;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.mt{display:inline-block}
.marquee span{display:inline-flex;align-items:center;gap:10px;margin:0 34px;color:var(--ink2);font-weight:700;font-size:15.2px}
.marquee b{color:var(--navy)}
.fade{position:absolute;inset:0;background:var(--bg);pointer-events:none}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers shared by the dashboard demos ----
// CSS cubic-bezier(x1,y1,x2,y2) as a function of progress 0..1 (Newton solve for x)
const bez = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0; if (x >= 1) return 1
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  let u = x
  for (let i = 0; i < 8; i++) { const f = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(f) < 1e-5 || Math.abs(d) < 1e-6) break; u -= f / d }
  return ((ay * u + by) * u + cy) * u
}
const easeOutCss = bez(0, 0, .58, 1)          // CSS ease-out
const easeCss = bez(.25, .1, .25, 1)             // CSS ease, Recharts default animationEasing
const easeInOutCss = bez(.42, 0, .58, 1)       // CSS ease-in-out
const outExpo22 = bez(.22, 1, .36, 1)          // cubic-bezier(0.22,1,0.36,1), used all over the sources
// framer-motion physics spring, 0 -> 1, t in seconds (stiffness, damping, mass)
const fmSpring = (t, k = 100, c = 10, m = 1) => {
  if (t <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t)
}
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }   // fixed-seed random
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e }
const fmtInt = (n) => Math.round(n).toLocaleString('en-US')
// d3 curveMonotoneX, which is what Recharts type="monotone" draws
const monotonePath = (pts) => {
  const n = pts.length; if (n < 2) return ''
  const dx = [], dy = [], m = [], tg = []
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i] }
  tg[0] = m[0]; tg[n - 1] = m[n - 2]
  for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { tg[i] = 0; tg[i + 1] = 0 } else { const a = tg[i] / m[i], b = tg[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i] } } }
  let d = `M${pts[0][0]},${pts[0][1]}`
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${pts[i][0] + h},${pts[i][1] + tg[i] * h},${pts[i + 1][0] - h},${pts[i + 1][1] - tg[i + 1] * h},${pts[i + 1][0]},${pts[i + 1][1]}` }
  return d
}
// A fixed design-size UI fitted into the stage: 1440x900 wide, 900x1440 tall. CSS under .tall reflows the grids.
const DW = TALL ? 900 : 1440, DH = TALL ? 1440 : 900
const UI_SC = Math.min(W / DW, H / DH)
const ui = el('div', 'ui' + (TALL ? ' tall' : ''))
S(ui, { position: 'absolute', width: DW + 'px', height: DH + 'px', left: ((W - DW * UI_SC) / 2) + 'px', top: ((H - DH * UI_SC) / 2) + 'px', transform: `scale(${UI_SC})`, transformOrigin: '0 0', overflow: 'hidden' })

const DUR = 14
window.DUR = DUR
// soft colour pools (the site uses blurred 420px circles; radial gradients give the same pool without a blur filter)
const b1 = el('div', 'blob', ui); S(b1, { width: '700px', height: '700px', right: '-260px', top: '-300px', background: 'radial-gradient(circle, rgba(221,242,243,.95) 0%, rgba(221,242,243,0) 68%)' })
const b2 = el('div', 'blob', ui); S(b2, { width: '640px', height: '640px', left: '-260px', bottom: '-300px', background: 'radial-gradient(circle, rgba(246,237,218,.95) 0%, rgba(246,237,218,0) 68%)' })
el('div', 'nav', ui, '<b>Northwind Academy</b><span>Free training</span><span>Programme</span><span>Events</span><span>Resources</span><span class="cta">Join free</span>')
const copy = el('div', null, ui); S(copy, { position: 'absolute', left: TALL ? '60px' : '150px', top: TALL ? '110px' : '150px', width: TALL ? '780px' : '720px' })
el('span', 'eyebrow', copy, 'For learners at every stage')
el('h1', null, copy, 'The support your <span class="accent">career</span> has always deserved.')
el('p', 'lead', copy, 'Courses, mentorship, events and community for people building new skills. Every path starts with a real plan, not a pep talk.')
const cta = el('div', null, copy); S(cta, { marginTop: '30px', display: 'flex', gap: '14px' }); cta.innerHTML = '<span class="btn p">Join the free training</span><span class="btn o">See the programme</span>'
el('p', 'fine', copy, 'Free 90-minute monthly session · 500 live seats · no card required')
const PX = TALL ? DW / 2 - 150 : 1020, PY = TALL ? 700 : 110
const phoneWrap = el('div', null, ui); S(phoneWrap, { position: 'absolute', left: PX + 'px', top: PY + 'px', width: '300px', height: '610px' })
const phone = el('div', 'phone', phoneWrap); S(phone, { left: 0, top: 0 })
const scr = el('div', 'screen', phone)
el('div', 'mini', scr, `<div class="m-hi">Welcome back, Learner</div><div class="m-sub">Cohort 1 · Day 24 of 90 · 6-day streak</div>
<div class="m-card m-navy"><div style="font-size:9px;letter-spacing:.12em;color:var(--aqua);font-weight:800">NEXT LIVE SESSION</div><div style="font-weight:800;font-size:12px;margin-top:2px">Module 2 Workshop with your coach</div><div class="m-sub" style="margin-bottom:0">Thu Sep 10 · 12:00 PM</div><span class="m-join">Join session →</span></div>
<div class="m-card"><div style="font-weight:800;font-size:11px">My 90-Day Map</div><div class="m-ring"><div><div class="pct">100%</div><div class="lb">Audit</div></div><div><div class="pct">40%</div><div class="lb">Map</div></div><div><div class="pct">0%</div><div class="lb">Practice</div></div></div><div class="m-bar"><i style="width:40%"></i></div></div>
<div class="m-card"><div style="font-weight:800;font-size:11px">My Pod · next call Tue 5 PM</div><div class="m-pod"><b>L</b><b>D</b><b>M</b><b>P</b><b>T</b></div></div>`)
const MY = TALL ? 1250 : 800
const mq = el('div', 'marquee', ui); S(mq, { top: MY + 'px' })
const ITEMS = ['Featured in <b>Trade Journal</b> 2024', '<b>Educator of the Year</b> award 2023', 'ex-<b>Global Operations</b> Executive', 'ex-<b>Programme</b> Director, Large Retailer', 'Certified <b>Process Coach</b>', 'Author of <b>two practical guides</b>', '<b>60-episode</b> podcast · 5.0 rating', 'Founder of a <b>community</b> foundation']
const track = el('div', 'mt', mq); track.innerHTML = [...ITEMS, ...ITEMS].map((s) => `<span>${s}</span>`).join('')
const fadeEl = el('div', 'fade', ui)
const rev = bez(.2, .7, .2, 1)
function render(t) {
  // .reveal.d2: .7s cubic-bezier(.2,.7,.2,1), 28px rise, .16s delay
  const q = rev(seg(t, .16, .86)); S(phoneWrap, { opacity: q, top: PY + (1 - q) * 28 + 'px' })
  const cq = rev(seg(t, 0, .7)); S(copy, { opacity: cq, transform: `translateY(${(1 - cq) * 28}px)` })
  // @keyframes phoneFloat { 0%,100% { translateY(0) rotate(-1.2deg) } 50% { translateY(-16px) rotate(1.2deg) } }  7s ease-in-out infinite (ease-in-out applies per half)
  const u = (t % 7) / 7, h = u < .5 ? easeInOutCss(u * 2) : 1 - easeInOutCss((u - .5) * 2)
  S(phone, { transform: `translateY(${-16 * h}px) rotate(${-1.2 + 2.4 * h}deg)` })
  // @keyframes marquee { translateX(0) -> translateX(-50%) } linear infinite; source 30s, 14s here so the clip loops
  const tw = track.scrollWidth / 2
  S(track, { transform: `translateX(${-tw * ((t % 14) / 14)}px)` })
  S(fadeEl, { opacity: seg(t, DUR - .4, DUR) })
}


// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
