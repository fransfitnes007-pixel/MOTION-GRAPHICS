  [[.42, 0], [.6, 4], [.66, 8], [.84, 11], [1.02, 17], [1.2, 21], [1.26, 24], [1.44, 28], [1.62, 32], [1.8, 39], [2.04, 46], [2.22, 49], [2.4, 57], [2.6, 62]],

// layout for one moment: y of every element, plus the card height
function layout(m) {
  const kinds = F.map((_, i) => kindAt(i, m)), out = { y: {}, text: {} }
