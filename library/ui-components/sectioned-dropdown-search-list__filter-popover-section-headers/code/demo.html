<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#121212;color:#fff}
.lbl{font-size:14px;font-weight:500;color:#fafafa;margin-bottom:8px;display:block}
.inp{display:flex;align-items:center;height:40px;border-radius:14px;padding:0 10px 0 14px;background:#151517;border:1px solid #38383b;position:relative}
.inp.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.inp .v{flex:1;font-size:14px;white-space:nowrap}
.inp .v.ph{color:#8b8b92}
.caret{display:inline-block;width:1px;height:16px;background:#fff;vertical-align:-3px;margin-left:1px}
.chev{width:20px;height:20px;color:#d4d4d8}
.pop{position:absolute;left:0;top:calc(100% + 6px);width:100%;border-radius:20px;background:#18181a;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);overflow:hidden;transform-origin:50% 0}
.scroll{padding:6px 6px}
.hd{font-size:12px;font-weight:500;color:#919095;padding:10px 10px 4px}
.it{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;border-radius:10px;font-size:14px;color:#fafafa}
.it.hv{background:rgba(255,255,255,.07)}
.sepr{height:1px;background:#313133;margin:6px 4px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- shared helpers (keyframes, scripted cursor, fixed 1280x800 design space scaled to fit) ----
const kf = (t, k, ez = eio) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; return va + (vb - va) * ez((t - a) / (b - a)) } return k[k.length - 1][1] }
const CURSOR_SVG = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 2.5l15 8-6.4 2L9.6 19.5z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
// pts: [[time, x, y, pressed?], ...]  (x, y in the 1280x800 design space); eases between points
const cursorAt = (t, pts, ez = eio) => { let r = { x: pts[0][1], y: pts[0][2], p: 0 }; if (t <= pts[0][0]) return r
  for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; if (t <= b[0]) { const u = ez((t - a[0]) / Math.max(1e-6, b[0] - a[0])); return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), p: b[3] && a[3] ? 1 : (t > b[0] - .08 && b[3]) || (a[3] && t < a[0] + .08) ? 1 : 0 } } }
  const l = pts[pts.length - 1]; return { x: l[1], y: l[2], p: l[3] ? 1 : 0 } }
const root = el('div', 'abs'); const U = Math.min(W / 1280, H / 800)
S(root, { width: '1280px', height: '800px', left: px((W - 1280) / 2), top: px((H - 800) / 2), transform: `scale(${U})`, transformOrigin: '50% 50%' })
const cur = el('div', 'abs', root, CURSOR_SVG); S(cur, { left: 0, top: 0, zIndex: 99, pointerEvents: 'none', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' })
const putCursor = (c) => S(cur, { transform: `translate(${c.x - 4}px,${c.y - 2.5}px) scale(${c.p ? .88 : 1})`, opacity: c.show === 0 ? 0 : 1 })
// ---- end shared ----

const CONFIG = {
  label: 'Country',
  placeholder: 'Search countries...',
  scale: 1.6,                  // size of the whole field on the 1280x800 canvas
  width: 256,                  // field width in px before scaling
  popoverMaxHeight: 319,       // px, the list scrolls inside this
  accent: '#3b82f6',
  typed: 'an',                 // text typed into the box (filters the list)
  pick: 'France',              // the item clicked
  sections: [
    ['North America', ['United States', 'Canada', 'Mexico']],
    ['Europe', ['United Kingdom', 'France', 'Germany', 'Spain', 'Italy']],
    ['Asia', ['Japan', 'China', 'India', 'South Korea']],
  ],
}
const DUR = 9.2
window.DUR = DUR
stage.style.setProperty('--acc', CONFIG.accent); stage.style.setProperty('--accSoft', CONFIG.accent + '55')
const wrap = el('div', 'abs', root); S(wrap, { left: px(640 - CONFIG.width * CONFIG.scale / 2), top: px(100), width: CONFIG.width + 'px', transform: `scale(${CONFIG.scale})`, transformOrigin: '0 0' })
el('span', 'lbl', wrap, CONFIG.label)
const inp = el('div', 'inp', wrap)
const val = el('span', 'v', inp)
const chev = el('div', 'chev', inp, '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5-5 5 5"/></svg>')
const pop = el('div', 'pop', inp); const scroll = el('div', 'scroll', pop)
const rows = []   // {kind, el, name, sec}
CONFIG.sections.forEach(([name, items], si) => {
  if (si) rows.push({ kind: 'sep', sec: si, e: el('div', 'sepr', scroll) })
  rows.push({ kind: 'hd', sec: si, e: el('div', 'hd', scroll, name) })
  items.forEach((n) => rows.push({ kind: 'it', sec: si, name: n, e: el('div', 'it', scroll, `<span>${n}</span><svg class="chk" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M3 8.5l3.2 3L13 4.5"/></svg>`) }))
})
// timeline (seconds)
const T = { openIdle: [0, 3.9], click: 2.2, k1: 2.55, k2: 2.9, hover: 3.5, pick: 4.05, reopen: 5.7, close2: 7.9, clear: 8.5, openAgain: 8.75 }
const P = [[0, 1050, 640, 0], [1.6, 1050, 640, 0], [2.1, 640, 172, 0], [2.2, 640, 172, 1], [2.3, 640, 172, 0], [3.2, 640, 172, 0], [3.8, 660, 423, 0], [4.05, 660, 423, 1], [4.15, 660, 423, 0], [5.2, 660, 423, 0], [5.65, 770, 172, 0], [5.7, 770, 172, 1], [5.8, 770, 172, 0], [7.3, 770, 172, 0], [7.9, 1000, 600, 1], [8.0, 1000, 600, 0], [9.2, 1050, 640, 0]]
function render(t) {
  const typedN = t < T.k1 ? 0 : t < T.k2 ? 1 : CONFIG.typed.length
  const picked = t >= T.pick && t < T.clear
  const typing = t >= T.click && t < T.pick
  const q = typing ? CONFIG.typed.slice(0, typedN) : ''
  // open state: 0..1
  let open = 1
  if (t >= T.pick && t < T.reopen) open = 1 - seg(t, T.pick, T.pick + .22)
  else if (t >= T.reopen && t < T.close2) open = seg(t, T.reopen, T.reopen + .2)
  else if (t >= T.close2 && t < T.openAgain) open = 1 - seg(t, T.close2, T.close2 + .2)
  else if (t >= T.openAgain) open = seg(t, T.openAgain, T.openAgain + .2)
  if (t >= T.clear && t < T.openAgain) open = 0
  S(pop, { opacity: open, transform: `scale(${.96 + .04 * open})`, display: open > 0 ? '' : 'none' })
  chev.firstChild.style.transform = `rotate(${open > .5 ? 0 : 180}deg)`
  const focused = (t >= T.click && t < T.pick) || (t >= T.reopen && t < T.close2)
  inp.className = 'inp' + (focused ? ' on' : '')
  const text = q || (picked ? CONFIG.pick : '')
  val.className = 'v' + (text ? '' : ' ph')
  val.innerHTML = (text || CONFIG.placeholder) + (typing && Math.floor(t * 2) % 2 === 0 ? '<span class="caret"></span>' : '')
  // filter
  const visSec = {}
  rows.forEach((r) => { if (r.kind === 'it') { const ok = !q || r.name.toLowerCase().includes(q.toLowerCase()); r.ok = ok; if (ok) visSec[r.sec] = 1 } })
  let firstSec = true
  rows.forEach((r) => {
    if (r.kind === 'it') { vis(r.e, r.ok); r.e.firstChild.nextSibling.style.display = (picked || t >= T.reopen) && r.name === CONFIG.pick && r.name === CONFIG.pick && t >= T.pick && t < T.clear ? '' : 'none'
      r.e.className = 'it' + ((t > T.hover && t < T.pick && r.name === CONFIG.pick) ? ' hv' : '') }
    else if (r.kind === 'hd') vis(r.e, !!visSec[r.sec])
    else vis(r.e, !!visSec[r.sec] && Object.keys(visSec).some((k) => +k < r.sec))
  })
  // list scroll: gentle peek at the Asia section, and a longer one after reopening
  const sc = kf(t, [[0, 0], [.3, 0], [1.1, 150], [1.7, 0], [5.9, 0], [6.8, 170], [7.5, 170]], eio)
  const maxH = CONFIG.popoverMaxHeight
  S(pop, { maxHeight: maxH + 'px' }); S(scroll, { transform: `translateY(${-sc}px)` })
  putCursor(cursorAt(t, P))
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
