<!doctype html>
<html><head><meta charset="utf-8"><title>OTP input</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.box{position:absolute;overflow:hidden;background:#fff}
.fill{position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;background:linear-gradient(135deg,#3ddc84,#1fb860)}
.dig{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:600;font-variant-numeric:tabular-nums}
.caret{position:absolute;background:#3478f6;border-radius:2px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 6
window.DUR = DUR

const bw = TALL ? 130 : 150, bh = Math.round(bw * 1.2), gp = TALL ? 18 : 24, N = 6
const tw = N * bw + (N - 1) * gp, x0 = CX - tw / 2, y0 = CY - bh / 2
const CODE = ['4', '8', '2', '9', '1', '7'], T = [.9, 1.3, 1.7, 2.1, 2.5, 2.9]
const mix = (a, b, x) => a.map((v, i) => Math.round(v + (b[i] - v) * x))
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`
const GREY = [214, 214, 222], BLUE = [52, 120, 246], GREEN = [31, 184, 96], INK = [11, 11, 16], WHITE = [255, 255, 255]

const title = el('div', 'abs', stage, 'Enter your code'); S(title, { left: 0, top: px(y0 - 190 * K), width: px(W), textAlign: 'center', fontSize: px(70 * K), fontWeight: 700, letterSpacing: '-.02em' })
const sub = el('div', 'abs', stage, 'Type the six digits we just sent you'); S(sub, { left: 0, top: px(y0 - 98 * K), width: px(W), textAlign: 'center', fontSize: px(36 * K), color: '#7b7b88' })
const boxes = []
for (let i = 0; i < N; i++) {
  const b = el('div', 'box'); S(b, { left: px(x0 + i * (bw + gp)), top: px(y0), width: px(bw), height: px(bh), borderRadius: px(bw * .2), border: '3px solid #d6d6de', boxSizing: 'border-box' })
  const fill = el('div', 'fill', b), dig = el('div', 'dig', b), caret = el('div', 'caret', b)
  S(dig, { fontSize: px(bh * .52) }); S(caret, { left: px(bw / 2 - 2 - 3), top: px(bh * .26), width: '4px', height: px(bh * .42) })
  boxes.push({ b, fill, dig, caret })
  dig.textContent = CODE[i]
}
// success badge
const bsz = 150 * K
const badge = el('div', 'abs'); S(badge, { left: px(CX - bsz / 2), top: px(y0 + bh + 70 * K), width: px(bsz), height: px(bsz) })
badge.innerHTML = '<svg viewBox="0 0 150 150" width="100%" height="100%"><circle cx="75" cy="75" r="62" fill="#1fb860"/><path id="ck" d="M44 78 L66 100 L108 54" pathLength="1" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1"/></svg>'
const ck = badge.querySelector('#ck')
const ok = el('div', 'abs', stage, 'Code verified'); S(ok, { left: 0, top: px(y0 + bh + 70 * K + bsz + 26 * K), width: px(W), textAlign: 'center', fontSize: px(42 * K), fontWeight: 600, color: '#168a49' })

function render(t) {
  const clr = eio(seg(t, 5.15, 5.65))
  const bi = seg(t, 3.9, 4.6)
  for (let i = 0; i < N; i++) {
    const B = boxes[i]
    // digit pop
    const dt = seg(t, T[i], T[i] + .45)
    const pop = spring(dt, 7, 13)
    const da = clamp((t - T[i]) / .1, 0, 1) * (1 - clr)
    // active
    let act = i === 0 ? 1 : eo(seg(t, T[i - 1], T[i - 1] + .18))
    act *= 1 - eo(seg(t, T[i], T[i] + .18))
    if (i === 0) act = Math.max(act, eo(seg(t, 5.45, 5.85)))
    // green sweep
    const s0 = 3.15 + i * .1
    const sp = eo(seg(t, s0, s0 + .42)) * (1 - clr)
    const spl = eo(seg(t, s0, s0 + .42))
    const pulse = .5 + .5 * Math.sin(2 * Math.PI * t * 1.5 / 1.0 * (1 / 1))
    const bump = Math.sin(Math.PI * seg(t, s0, s0 + .5)) * .05
    const border = mix(mix(GREY, BLUE, act), GREEN, sp)
    S(B.b, { borderColor: rgb(border), transform: `scale(${(1 + .02 * act * pulse + bump).toFixed(4)})`,
      boxShadow: act > .01 ? `0 0 0 ${(4 + 7 * pulse) * act}px rgba(52,120,246,${(.14 * act).toFixed(3)}),0 12px 30px rgba(20,20,40,.08)` : '0 12px 30px rgba(20,20,40,.08)' })
    S(B.fill, { clipPath: `inset(0 ${((1 - spl) * 100).toFixed(2)}% 0 0)`, opacity: (1 - clr).toFixed(3) })
    S(B.dig, { opacity: da.toFixed(3), transform: `scale(${(.5 + .5 * pop).toFixed(4)})`, color: rgb(mix(INK, WHITE, sp > .5 ? 1 : sp * 2)) })
    S(B.caret, { opacity: (act * (1 - da) * (Math.floor(t * 2) % 2 === 0 ? 1 : 0)).toFixed(3) })
  }
  // badge
  const bs = spring(seg(t, 3.95, 4.55), 6, 10) * (1 - clr)
  S(badge, { transform: `scale(${bs.toFixed(4)})`, opacity: (1 - clr).toFixed(3) })
  ck.setAttribute('stroke-dashoffset', (1 - eo(seg(t, 4.2, 4.65))).toFixed(4))
  S(ok, { opacity: (eo(seg(t, 4.45, 4.8)) * (1 - clr)).toFixed(3), transform: `translateY(${(1 - eo(seg(t, 4.45, 4.8))) * 14}px)` })
  S(sub, { opacity: (1 - .0).toFixed(1) })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
