<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#05070d}
canvas{position:absolute;left:0;top:0}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  bg: '#05070D',                       // page colour
  colors: ['#1261A0', '#35C4E8', '#F2FBFF'],   // tail (deep blue), body (cyan), hot core (white)
  inset: [65, 55, 735, 445],           // border rectangle in the 800x500 design box: left, top, right, bottom
  glowWidth: 36, coreWidth: 16,        // px thickness of the soft glow stroke and the bright core stroke
  glowBlur: 9, coreBlur: 2,          // px blur of each
  tail: 0.20, head: 0.115,             // length of the fade behind and ahead of the bright spot, as a share of the perimeter
  lapSeconds: 9,                       // seconds for the bright spot to go once around (also the loop length)
  startAt: 0.205,                      // where on the perimeter the spot is at t=0 (0 = bottom-left corner, counter-clockwise)
  pulse: 0.12,                         // how much the spot breathes in size (0 = steady)
  pulsesPerLap: 3,                     // breaths per lap
}
const DUR = CONFIG.lapSeconds
window.DUR = DUR
const BW = 800, BH = 500
const U = Math.min(W / BW, H / BH), OX = (W - BW * U) / 2, OY = (H - BH * U) / 2
const cv = el('canvas', '', stage); cv.width = W; cv.height = H
const g = cv.getContext('2d')
const A = document.createElement('canvas'); A.width = W; A.height = H
const B = document.createElement('canvas'); B.width = W; B.height = H
const ga = A.getContext('2d'), gb = B.getContext('2d')
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16))
const C0 = hex(CONFIG.colors[0]), C1 = hex(CONFIG.colors[1]), C2 = hex(CONFIG.colors[2])
const mixc = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k)
const ramp = (i) => i < .5 ? mixc(C0, C1, i / .5) : mixc(C1, C2, (i - .5) / .5)   // intensity 0..1 to colour

// walk the rectangle counter-clockwise from the bottom-left corner: bottom edge to the right, right edge up, top edge to the left, left edge down
const [x0, y0, x1, y1] = CONFIG.inset
const EW = x1 - x0, EH = y1 - y0, P = 2 * (EW + EH)
const pt = (s) => {
  let d = ((s % 1) + 1) % 1 * P
  if (d < EW) return [x0 + d, y1]; d -= EW
  if (d < EH) return [x1, y1 - d]; d -= EH
  if (d < EW) return [x1 - d, y0]; d -= EW
  return [x0, y0 + d]
}
const N = 760
const pts = []; for (let i = 0; i <= N; i++) pts.push(pt(i / N))

function render(t) {
  const C = CONFIG
  const head = C.startAt + t / C.lapSeconds
  const breathe = 1 + C.pulse * Math.sin((t / C.lapSeconds) * Math.PI * 2 * C.pulsesPerLap)
  ga.setTransform(1, 0, 0, 1, 0, 0); ga.clearRect(0, 0, W, H); gb.setTransform(1, 0, 0, 1, 0, 0); gb.clearRect(0, 0, W, H)
  ga.setTransform(U, 0, 0, U, OX, OY); gb.setTransform(U, 0, 0, U, OX, OY)
  ga.lineCap = gb.lineCap = 'butt'; ga.lineJoin = gb.lineJoin = 'round'
  for (let i = 0; i < N; i++) {
    let d = i / N - (head % 1); d -= Math.round(d)            // signed distance along the perimeter, -.5..+.5
    const sg = (d < 0 ? C.tail : C.head) * breathe
    const k = Math.exp(-Math.pow(d / sg, 2))
    if (k < .01) continue
    const col = ramp(k).map(Math.round).join(',')
    ga.strokeStyle = `rgba(${col},${(1 * k).toFixed(3)})`; ga.lineWidth = C.glowWidth
    ga.beginPath(); ga.moveTo(pts[i][0], pts[i][1]); ga.lineTo(pts[i + 1][0], pts[i + 1][1]); ga.stroke()
    gb.strokeStyle = `rgba(${col},${Math.min(1, k * 1.15).toFixed(3)})`; gb.lineWidth = C.coreWidth
    gb.beginPath(); gb.moveTo(pts[i][0], pts[i][1]); gb.lineTo(pts[i + 1][0], pts[i + 1][1]); gb.stroke()
  }
  g.setTransform(1, 0, 0, 1, 0, 0); g.filter = 'none'
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H)
  const vg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .6); vg.addColorStop(0, 'rgba(14,22,40,.3)'); vg.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = vg; g.fillRect(0, 0, W, H)
  g.filter = `blur(${C.glowBlur * U}px)`; g.drawImage(A, 0, 0)
  g.filter = `blur(${C.coreBlur * U}px)`; g.drawImage(B, 0, 0)
  g.filter = 'none'
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
