<!doctype html>
<html><head><meta charset="utf-8"><title>readiness meter gauge</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 6.8
window.DUR = DUR
const cvs = el('canvas', 'abs'); cvs.width = W; cvs.height = H
S(cvs, { left: '0px', top: '0px', width: W + 'px', height: H + 'px' })
const g = cvs.getContext('2d')
const FONT = "-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif"
const rnd = (i, s = 1) => { let h = (Math.imul(i + 1, 374761393) + Math.imul(s, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296 }
const rrect = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r) }
const circ = (x, y, r) => { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, Math.PI * 2) }
const txt = (s, x, y, size, wt, col, al = 'center') => { g.font = `${wt} ${size}px ${FONT}`; g.textAlign = al; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y) }
// simulated finger: a = opacity, press 0..1 (shrinks), rip 0..1 ripple progress (<0 or >1 = none)
function finger(x, y, a, press, rip) {
  if (a <= .01) return
  g.save(); g.globalAlpha = a
  if (rip >= 0 && rip < 1) { g.strokeStyle = `rgba(255,255,255,${.55 * (1 - rip)})`; g.lineWidth = 5 * (1 - rip) + 1; circ(x, y, lerp(34, 120, eo(rip))); g.stroke() }
  const r = 38 * (1 - .2 * press)
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 24; g.shadowOffsetY = 8
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.62)'); gr.addColorStop(1, 'rgba(255,255,255,.30)')
  g.fillStyle = gr; circ(x, y, r); g.fill(); g.shadowColor = 'transparent'
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 2.5; g.stroke(); g.restore()
}
const tapPress = (t, tt) => seg(t, tt - .14, tt) * (1 - seg(t, tt + .05, tt + .22))
const tapRip = (t, tt) => t < tt ? -1 : seg(t, tt, tt + .6)

const GR = TALL ? 360 : 380, GW = 58, GCX = CX, GCY = CY - 10, VAL = 82
const T0 = 1.0, T1 = 3.2, TN = 3.4
function render(t) {
  const bg = g.createRadialGradient(GCX, GCY, 40, GCX, GCY, W * .7); bg.addColorStop(0, '#171722'); bg.addColorStop(1, '#0b0b10'); g.fillStyle = bg; g.fillRect(0, 0, W, H)
  const drain = 1 - eio(seg(t, 5.3, 6.4)), appear = eo(seg(t, .1, .7))
  const ov = seg(t, T1 - .3, T1 + 1.0)
  const needle = (VAL / 100 * eo(seg(t, T0, T1)) + .05 * Math.sin(ov * Math.PI * 2.4) * Math.pow(1 - ov, 1.5)) * drain   // sweeps with the fill, then springs past 82 and settles
  const fill = Math.min(needle, VAL / 100)
  const num = Math.round(VAL * eo(seg(t, T0, T1)) * drain)
  g.save(); g.globalAlpha = appear
  // track
  g.lineCap = 'round'; g.lineWidth = GW; g.strokeStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.arc(GCX, GCY, GR, Math.PI, Math.PI * 2); g.stroke()
  // ticks
  for (let k = 0; k <= 40; k++) { const a = Math.PI + k / 40 * Math.PI, maj = k % 4 === 0, r0 = GR - GW / 2 - 18, r1 = r0 - (maj ? 24 : 12); g.strokeStyle = `rgba(255,255,255,${maj ? .45 : .2})`; g.lineWidth = maj ? 4 : 2.5; g.beginPath(); g.moveTo(GCX + Math.cos(a) * r0, GCY + Math.sin(a) * r0); g.lineTo(GCX + Math.cos(a) * r1, GCY + Math.sin(a) * r1); g.stroke() }
  for (const [k, s] of [[0, '0'], [20, '50'], [40, '100']]) { const a = Math.PI + k / 40 * Math.PI, rr = GR + GW / 2 + 36; txt(s, GCX + Math.cos(a) * rr, GCY + Math.sin(a) * rr + (k === 20 ? 0 : -2), 28, 600, 'rgba(255,255,255,.4)') }
  // gradient arc fill
  if (fill > .002) {
    const cg = g.createConicGradient(Math.PI, GCX, GCY); cg.addColorStop(0, '#ff5a5f'); cg.addColorStop(.2, '#ffb020'); cg.addColorStop(.42, '#3fe08a'); cg.addColorStop(.5, '#2bd4a0')
    g.save(); g.shadowColor = 'rgba(63,224,138,.45)'; g.shadowBlur = 40; g.strokeStyle = cg; g.lineWidth = GW; g.beginPath(); g.arc(GCX, GCY, GR, Math.PI, Math.PI + Math.PI * fill); g.stroke(); g.restore()
    g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 6; g.beginPath(); g.arc(GCX, GCY, GR - GW * .22, Math.PI + .02, Math.PI + Math.PI * fill - .02); g.stroke()
  }
  // needle
  const na = Math.PI + needle * Math.PI, nl = GR - GW / 2 - 56
  g.save(); g.translate(GCX, GCY); g.rotate(na)
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 20; g.shadowOffsetY = 8
  g.fillStyle = '#f4f4f8'; g.beginPath(); g.moveTo(-26, -9); g.lineTo(nl, -3); g.lineTo(nl + 8, 0); g.lineTo(nl, 3); g.lineTo(-26, 9); g.closePath(); g.fill(); g.shadowColor = 'transparent'
  g.restore()
  const hg = g.createRadialGradient(GCX - 6, GCY - 8, 2, GCX, GCY, 34); hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, '#a8a8bc'); g.fillStyle = hg; g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 16; circ(GCX, GCY, 30); g.fill(); g.shadowColor = 'transparent'
  g.fillStyle = '#1b1b28'; circ(GCX, GCY, 10); g.fill()
  g.restore()
  // number + labels
  g.save(); g.globalAlpha = appear
  const ng = Math.max(0, 1 - Math.abs(num - VAL) / 3) * seg(t, T1 - .3, T1) * drain
  txt(String(num), GCX, GCY + 190, 250, 700, '#f6f6fa')
  txt('Readiness score', GCX, GCY + 330, 32, 560, 'rgba(255,255,255,.45)')
  g.restore()
  const la = eo(seg(t, TN, TN + .5)) * (1 - eo(seg(t, 5.0, 5.5))), lp = spring(seg(t, TN, TN + .8), 6, 12)
  if (la > .01) {
    const lw = 232, ly = GCY + 420 - (1 - la) * 16
    g.save(); g.globalAlpha = la; g.translate(GCX, ly); g.scale(lp, lp)
    g.fillStyle = 'rgba(63,224,138,.14)'; rrect(-lw / 2, -34, lw, 68, 34); g.fill(); g.strokeStyle = 'rgba(63,224,138,.6)'; g.lineWidth = 2; g.stroke()
    g.fillStyle = '#3fe08a'; circ(-lw / 2 + 38, 0, 15); g.fill(); g.strokeStyle = '#0b0b10'; g.lineWidth = 4.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-lw / 2 + 31, 1); g.lineTo(-lw / 2 + 36.5, 7); g.lineTo(-lw / 2 + 46, -5); g.stroke()
    txt('Ready', 22, 2, 36, 680, '#c9ffe2'); g.restore()
  }
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
