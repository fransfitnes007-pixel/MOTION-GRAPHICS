  const h = el('div', 'abs', par, ICONS[name].svg); const svg = h.firstChild
  svg.setAttribute('width', size); svg.setAttribute('height', size); svg.style.color = color
  S(h, { width: px(size), height: px(size) }); live.push({ svg, start }); return h
}
// ---- A: notification bubbles on a lock screen ----
const A = el('div', 'abs', cv); S(A, { left: 0, top: 0, width: FW + 'px', height: FH + 'px' })
txt(A, CONFIG.clock, 70, 170, 230, 200, CONFIG.ink, { letterSpacing: '-.04em' })
txt(A, CONFIG.date, 78, 420, 40, 500, CONFIG.muted)
const bellW = el('div', 'abs', A); S(bellW, { left: '830px', top: '230px', width: '170px', height: '170px', borderRadius: '85px', background: CONFIG.card, border: '2px solid ' + CONFIG.line })
const bell = icon(bellW, 'bell', 84, CONFIG.ink, (t) => { let l = -1; for (const b of CONFIG.banners) if (t >= b.at + .15) l = Math.max(l, t - b.at - .15); return l })
S(bell, { left: '43px', top: '43px' })
const badge = el('div', 'abs', bellW); S(badge, { left: '100px', top: '-6px', width: '64px', height: '64px', borderRadius: '32px', background: '#ff3b5c', color: '#fff', fontSize: '38px', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '5px solid ' + CONFIG.bg })
const bnr = CONFIG.banners.map((b, i) => {
  const c = el('div', 'abs', A); S(c, { left: '60px', top: px(560 + i * 250), width: '960px', height: '210px', borderRadius: '56px', background: 'rgba(255,255,255,.07)', border: '2px solid ' + CONFIG.line, backdropFilter: 'blur(20px)' })
  const tile = el('div', 'abs', c); S(tile, { left: '36px', top: '35px', width: '140px', height: '140px', borderRadius: '38px', background: `linear-gradient(145deg, ${b.a}, ${b.b})`, boxShadow: `0 14px 40px ${b.b}66` })
  const ic = icon(tile, b.icon, 80, '#fff', (t) => t - b.at - .2); S(ic, { left: '30px', top: '30px' })
  txt(c, b.title, 206, 46, 44, 650, CONFIG.ink); txt(c, b.body, 206, 112, 36, 400, CONFIG.muted); txt(c, 'now', 850, 50, 30, 400, CONFIG.muted)
  return c
})
// ---- B: label chips ----
const B = el('div', 'abs', cv); S(B, { left: 0, top: 0, width: FW + 'px', height: FH + 'px' })
txt(B, CONFIG.headline, 0, 330, 82, 750, CONFIG.ink, { width: FW + 'px', textAlign: 'center' })
txt(B, 'icons that move when they land', 0, 450, 40, 400, CONFIG.muted, { width: FW + 'px', textAlign: 'center' })
const chipEls = []
CONFIG.chips.forEach((row, r) => {
  const ws = row.map(([n, l]) => 76 + 26 + l.length * 31 + 96), gapX = 30, tot = ws.reduce((a, b) => a + b, 0) + gapX * (row.length - 1)
  let x = (FW - tot) / 2
  row.forEach(([n, l, col], k) => {
    const c = el('div', 'abs', B); S(c, { left: px(x), top: px(650 + r * 200), width: px(ws[k]), height: '150px', borderRadius: '75px', background: CONFIG.card, border: '2px solid ' + CONFIG.line, boxShadow: '0 16px 40px rgba(0,0,0,.35)' })
    const at = 4.45 + r * .22 + k * .1
    const dot = el('div', 'abs', c); S(dot, { left: '24px', top: '24px', width: '102px', height: '102px', borderRadius: '51px', background: col + '26' })
    const ic = icon(dot, n, 60, col, (t) => t - at - .12); S(ic, { left: '21px', top: '21px' })
    txt(c, l, 150, 38, 50, 600, CONFIG.ink)
    chipEls.push({ c, at }); x += ws[k] + gapX
  })
})
// ---- C: app tab bar ----
const C = el('div', 'abs', cv); S(C, { left: 0, top: 0, width: FW + 'px', height: FH + 'px' })
const ttl = CONFIG.tabs.map(([n, l, title]) => txt(C, title, 70, 230, 96, 750, CONFIG.ink))
txt(C, 'tab bar · the active icon plays', 74, 360, 38, 400, CONFIG.muted)
for (let i = 0; i < 3; i++) { const cd = el('div', 'abs', C); S(cd, { left: '70px', top: px(520 + i * 300), width: '940px', height: '250px', borderRadius: '44px', background: CONFIG.card, border: '2px solid ' + CONFIG.line })
  const th = el('div', 'abs', cd); S(th, { left: '30px', top: '30px', width: '190px', height: '190px', borderRadius: '30px', background: `linear-gradient(145deg, rgba(124,108,255,${.5 - i * .12}), rgba(124,108,255,.08))` })
  for (let k = 0; k < 3; k++) { const ln = el('div', 'abs', cd); S(ln, { left: '260px', top: px(52 + k * 54), width: px(560 - k * 130), height: '26px', borderRadius: '13px', background: 'rgba(255,255,255,' + (k ? .07 : .14) + ')' }) } }
const bar = el('div', 'abs', C); S(bar, { left: '60px', top: '1590px', width: '960px', height: '210px', borderRadius: '105px', background: 'rgba(255,255,255,.08)', border: '2px solid ' + CONFIG.line, backdropFilter: 'blur(24px)' })
const slotW = 960 / 5
const pill = el('div', 'abs', bar); S(pill, { top: '22px', width: '170px', height: '166px', borderRadius: '83px', background: 'rgba(124,108,255,.30)', border: '2px solid rgba(160,148,255,.5)' })
const tabEls = CONFIG.tabs.map(([n, l, , at], i) => {
  const ic = icon(bar, n, 76, CONFIG.muted, (t) => t - at - .1); S(ic, { left: px(slotW * i + slotW / 2 - 38), top: '50px' })
  const lb = txt(bar, l, slotW * i, 138, 28, 600, CONFIG.muted, { width: px(slotW), textAlign: 'center' })
  return { ic, lb, at, i, svg: ic.firstChild }
})
const mix = (a, b, x) => { const p = (c) => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16)); const A_ = p(a), B_ = p(b); return '#' + A_.map((v, j) => Math.round(lerp(v, B_[j], x)).toString(16).padStart(2, '0')).join('') }
// ---- the frame ----
function render(t) {
  const [a0, a1] = CONFIG.scenes.a, [b0, b1] = CONFIG.scenes.b, [c0, c1] = CONFIG.scenes.c
  const fadeIO = (t0, t1, x) => clamp(Math.min(seg(x, t0, t0 + .35), 1 - seg(x, t1 - .4, t1)))
  // A
  vis(A, t < a1); { const o = Math.min(1 - seg(t, a1 - .45, a1), .15 + seg(t, 0, .35)); A.style.opacity = o; A.style.transform = `translateY(${-70 * seg(t, a1 - .45, a1)}px)`
    const n = CONFIG.banners.filter(b => t >= b.at).length; badge.textContent = n; const pb = n ? spring(seg(t, CONFIG.banners[n - 1].at, CONFIG.banners[n - 1].at + .5), 8, 14) : 0; badge.style.transform = `scale(${pb})`
    CONFIG.banners.forEach((b, i) => { const p = spring(seg(t, b.at, b.at + .7), 7, 11); bnr[i].style.opacity = clamp(p * 2); bnr[i].style.transform = `translateY(${(1 - p) * -140}px) scale(${.9 + .1 * p})` }) }
  // B
  vis(B, t >= b0 - .01 && t < b1); { const o = fadeIO(b0, b1, t); B.style.opacity = o; B.style.transform = `translateY(${(1 - seg(t, b0, b0 + .5)) * 40 - 70 * seg(t, b1 - .45, b1)}px)`
    for (const k of chipEls) { const p = spring(seg(t, k.at, k.at + .6), 7, 11); k.c.style.opacity = clamp(p * 2); k.c.style.transform = `translateY(${(1 - p) * 90}px) scale(${.8 + .2 * p})` } }
  // C
  vis(C, t >= c0 - .01); { const o = clamp(Math.min(seg(t, c0, c0 + .35), 1 - seg(t, c1 - .3, c1))); C.style.opacity = o
    const p = spring(seg(t, c0, c0 + .8), 7, 10); bar.style.transform = `translateY(${(1 - p) * 300}px)`
    let cur = 0; tabEls.forEach(k => { if (t >= k.at) cur = k.i })
    // pill: springs from the previous tab's slot to the current one
    const k0 = tabEls[cur], prev = cur ? cur - 1 : 0, mv = spring(seg(t, k0.at, k0.at + .5), 9, 12)
    S(pill, { left: px(lerp(slotW * prev, slotW * cur, cur ? mv : 1) + (slotW - 170) / 2) })
    tabEls.forEach(k => { const act = k.i === cur ? seg(t, k.at, k.at + .25) : k.i === cur - 1 ? 1 - seg(t, tabEls[cur].at, tabEls[cur].at + .25) : 0
      const col = mix('#8d93a8', '#ffffff', act); k.svg.style.color = col; k.lb.style.color = col })
    ttl.forEach((e, i) => { const on = i === cur ? seg(t, tabEls[i].at, tabEls[i].at + .3) : i === cur - 1 ? 1 - seg(t, tabEls[cur].at, tabEls[cur].at + .25) : 0; e.style.opacity = on; e.style.transform = `translateY(${(1 - on) * 24}px)` }) }
  // seek every icon: same t, same frame
  for (const o of live) { const ms = Math.max(0, o.start(t)) * 1000; for (const a of o.svg.getAnimations({ subtree: true })) { a.pause(); a.currentTime = ms } }
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
