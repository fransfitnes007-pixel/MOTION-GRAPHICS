<!doctype html>
<html><head><meta charset="utf-8"><title>Spotlight product tour</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.app{position:absolute;inset:0;background:#050509;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#f9fafb}
.side{position:absolute;left:0;top:0;bottom:0;width:220px;background:#0d0d1a;border-right:1px solid #1a1a2e}
.nav{position:absolute;left:16px;width:188px;height:40px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;font-weight:500;color:#9ca3af}
.nav i{width:16px;height:16px;border-radius:5px;background:#2a2a40;display:block}
.nav.on{background:linear-gradient(90deg,rgba(139,92,246,.15),transparent);border-left:2px solid #8B5CF6;color:#fff}
.top{position:absolute;left:220px;right:0;top:0;height:64px;border-bottom:1px solid #1a1a2e;background:rgb(13 13 26/.6)}
.btn{position:absolute;right:28px;top:14px;height:36px;padding:0 16px;border-radius:12px;background:#8B5CF6;color:#fff;font:600 14px/36px -apple-system,system-ui,sans-serif;box-shadow:0 10px 15px -3px rgba(139,92,246,.25)}
.crd{position:absolute;border-radius:16px;background:#0d0d1a;border:1px solid #1a1a2e}
.crd b{position:absolute;left:20px;top:20px;width:40%;height:10px;border-radius:5px;background:#26263a}
.crd i{position:absolute;left:20px;height:8px;border-radius:4px;background:#1c1c30}
.ov{position:absolute;inset:0}
.tip{position:absolute;width:320px;border-radius:16px;border:1px solid rgba(139,92,246,.3);background:#0d0d1a;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.tip .p{padding:20px}
.arrow{position:absolute;width:12px;height:12px;transform:rotate(45deg);background:#0d0d1a;border:0 solid rgba(139,92,246,.3)}
.k{font-size:10px;font-weight:600;color:#a78bfa;text-transform:uppercase;letter-spacing:.1em}
.h{margin-top:6px;font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}
.b{margin-top:6px;font-size:14px;color:#6b7280;line-height:1.625}
.dots{margin-top:16px;display:flex;gap:6px;align-items:center}
.dots span{height:4px;border-radius:9999px;display:block}
.row{margin-top:16px;display:flex;align-items:center;gap:8px}
.sk{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:#6b7280}
.bk{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(139,92,246,.4);color:#a78bfa}
.nx{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#8B5CF6;color:#fff;box-shadow:0 10px 15px -3px rgba(139,92,246,.25)}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }

const DUR = 11
window.DUR = DUR
const VW = 1200, VH = 720
const box = fitBox(VW, VH, '#050509')
const app = el('div', 'app', box)
el('div', 'side', app)
const NAVS = ['Overview', 'Campaigns', 'Creators', 'Reviews', 'Billing']
const navEls = NAVS.map((n, i) => { const e = el('div', 'nav' + (i === 0 ? ' on' : ''), app, `<i></i>${n}`); S(e, { top: 96 + i * 48 + 'px' }); return e })
el('div', 'top', app); const newBtn = el('div', 'btn', app, 'New campaign')
const cards = [[260, 96, 440, 200], [724, 96, 436, 200], [260, 320, 900, 150], [260, 494, 440, 180], [724, 494, 436, 180]]
cards.forEach(([x, y, w, h]) => { const c = el('div', 'crd', app, '<b></b><i style="top:52px;width:70%"></i><i style="top:72px;width:52%"></i><i style="top:92px;width:60%"></i>'); S(c, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }) })
// each step points at an element. The real overlay measures it with getBoundingClientRect and pads it by 6px (HOLE_PAD).
const PAD = 6, RAD = 12, GAP = 14, EDGE = 12, CARD_W = 320
const rectOf = (x, y, w, h) => ({ x: x - PAD, y: y - PAD, w: w + PAD * 2, h: h + PAD * 2 })
const STEPS = [
  { t: 'Overview', b: 'Everything that needs you today, in one place.', box: rectOf(16, 96, 188, 40) },
  { t: 'Campaigns', b: 'Create a campaign and set the rules once. The platform holds everyone to them.', box: rectOf(16, 144, 188, 40) },
  { t: 'Reviews', b: 'Drafts are scored against the brief before anything goes live.', box: rectOf(16, 240, 188, 40) },
  { t: 'Start here', b: 'Launch your first campaign from this button whenever you are ready.', box: rectOf(VW - 28 - 134, 14, 134, 36) },
]
const N = STEPS.length
// time plan (seconds): overlay fades in at .4, a step every 2.4s, fades out at 10.2
const T0 = .8, STEP_T = 2.4, TOUT = 10.2
const clampv = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
function place(b, cw, ch) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2
  if (b.x + b.w + GAP + cw <= VW - EDGE) { const top = clampv(cy - ch / 2, EDGE, VH - ch - EDGE); return { left: b.x + b.w + GAP, top, arrow: 'left', off: clampv(cy - top, 18, ch - 18) } }
  if (b.y + b.h + GAP + ch <= VH - EDGE) { const left = clampv(cx - cw / 2, EDGE, VW - cw - EDGE); return { left, top: b.y + b.h + GAP, arrow: 'top', off: clampv(cx - left, 18, cw - 18) } }
  return { left: (VW - cw) / 2, top: (VH - ch) / 2, arrow: null, off: 0 }
}
const ov = el('div', 'ov', box)
ov.innerHTML = `<svg class="ov" width="${VW}" height="${VH}" style="position:absolute;left:0;top:0"><defs><mask id="m"><rect width="100%" height="100%" fill="white"/><rect id="hole" rx="${RAD}" fill="black"/></mask></defs>
  <rect width="100%" height="100%" fill="rgba(5,5,9,0.78)" mask="url(#m)"/><rect id="ring" rx="${RAD}" fill="none" stroke="rgba(167,139,250,0.85)" stroke-width="1.5" style="filter:drop-shadow(0 0 14px rgba(139,92,246,0.55))"/></svg>`
const hole = $(ov, '#hole'), ring = $(ov, '#ring')
const tip = el('div', 'tip', ov)
let lastIdx = -1
const setRect = (r) => { for (const e of [hole, ring]) { e.setAttribute('x', r.x.toFixed(2)); e.setAttribute('y', r.y.toFixed(2)); e.setAttribute('width', r.w.toFixed(2)); e.setAttribute('height', r.h.toFixed(2)) } }
const mixRect = (a, b, q) => ({ x: mix(a.x, b.x, q), y: mix(a.y, b.y, q), w: mix(a.w, b.w, q), h: mix(a.h, b.h, q) })
function html(i) {
  const dots = STEPS.map((s, k) => `<span style="width:${k === i ? 20 : 6}px;background:${k === i ? '#8B5CF6' : k < i ? 'rgba(139,92,246,.5)' : 'rgba(255,255,255,.1)'}"></span>`).join('')
  const last = i === N - 1
  return `<div class="p"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="k">Step ${i + 1} of ${N}</div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="h">${STEPS[i].t}</div><div class="b">${STEPS[i].b}</div><div class="dots">${dots}</div>
    <div class="row"><span class="sk">Skip</span><span style="flex:1"></span>${i > 0 ? '<span class="bk">← Back</span>' : ''}<span class="nx">${last ? 'Done ✓' : 'Next →'}</span></div></div><span class="arrow"></span>`
}
function render(t) {
  const on = t >= .4 && t < TOUT + .2
  vis(ov, on)
  // the whole overlay: opacity 0 to 1 in .18s on mount, back out in .18s
  const fade = t < .4 ? 0 : clamp((t - .4) / .18), fadeOut = t >= TOUT ? 1 - clamp((t - TOUT) / .18) : 1
  S(ov, { opacity: String(fade * fadeOut) })
  // which step, and how long since it began
  const k = clampv(Math.floor((t - T0) / STEP_T), 0, N - 1), ts = t - (T0 + k * STEP_T)
  const cur = STEPS[k].box
  // the hole springs from the previous step's box (stiffness 380, damping 34); the first step starts on its own box
  const r = k === 0 || t < T0 ? STEPS[0].box : mixRect(STEPS[k - 1].box, cur, sp(ts, 380, 34))
  setRect(r)
  if (k !== lastIdx) { tip.innerHTML = html(k); lastIdx = k }
  const ch = tip.offsetHeight, pos = place(cur, CARD_W, ch)
  const q = EASE.expo(clamp(ts / .2))
  S(tip, { left: pos.left + 'px', top: pos.top + 'px', opacity: String(t < T0 ? EASE.expo(clamp((t - .4) / .2)) : q), transform: `translateY(${(1 - (t < T0 ? EASE.expo(clamp((t - .4) / .2)) : q)) * 6}px)` })
  const ar = $(tip, '.arrow')
  if (pos.arrow === 'left') S(ar, { left: '-7px', top: pos.off - 6 + 'px', borderLeftWidth: '1px', borderBottomWidth: '1px' })
  else if (pos.arrow === 'top') S(ar, { top: '-7px', left: pos.off - 6 + 'px', borderLeftWidth: '1px', borderTopWidth: '1px' })
  else vis(ar, false)
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
