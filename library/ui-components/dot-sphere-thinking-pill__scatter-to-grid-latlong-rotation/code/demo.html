<!doctype html>
<html><head><meta charset="utf-8"><title>larsen66-thinking-orbs</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#070707;color:#fbfbfb}
.pill{position:absolute;height:74px;border-radius:37px;background:rgba(29,29,29,.42);box-shadow:inset 0 0 0 1px rgba(44,47,54,.31),inset 0 0 50px 0 rgba(255,255,255,.012);display:flex;align-items:center;gap:12px;padding-left:9px;padding-right:32px;white-space:nowrap}
.pill .tx{font-size:18px;line-height:24px;color:rgba(251,251,251,.5)}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const U = Math.min(W / 1280, H / 800)   // the board below is 1280x800 and scaled to fit any ?w=&h=
const root = el('div', 'abs'); S(root, { left: px(CX - 640), top: px(CY - 400), width: '1280px', height: '800px', transform: `scale(${U})`, transformOrigin: '50% 50%' })

const CONFIG = {
  zoom: 2.4,                  // the pill is 186px wide in life
  label: 'Solving....',
  orb: 56,                    // orb box in px
  radius: 25,                 // sphere radius in px
  rings: 11,                  // latitude rings
  perRing: 15,                // dots on the equator ring, fewer toward the poles
  dot: 1.35,                  // dot radius px
  spin: 40,                   // degrees per second around the vertical axis
  tilt: 14,                   // degrees the axis leans toward the viewer
  scatter: .5,                // radians a dot can wander off its place while scrambled
  solveAt: 1.7, scrambleAt: 3.8,   // seconds: fully ordered by here, begins scattering again here
}
const DUR = 4.8
window.DUR = DUR
root.style.transform = `scale(${U * CONFIG.zoom})`
const pill = el('div', 'pill', root)
const orbBox = el('div', '', pill); S(orbBox, { width: px(CONFIG.orb), height: px(CONFIG.orb) })
const ns = 'http://www.w3.org/2000/svg'
const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('width', CONFIG.orb); svg.setAttribute('height', CONFIG.orb); svg.setAttribute('viewBox', `${-CONFIG.orb / 2} ${-CONFIG.orb / 2} ${CONFIG.orb} ${CONFIG.orb}`); orbBox.appendChild(svg)
el('div', 'tx', pill, CONFIG.label)
S(pill, { left: px(640 - 93), top: px(400 - 37) })
const hash = (n) => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n) }
const pts = []
for (let r = 0; r < CONFIG.rings; r++) {
  const lat = (-75 + r * 150 / (CONFIG.rings - 1)) * Math.PI / 180
  const n = Math.max(3, Math.round(CONFIG.perRing * Math.cos(lat)))
  for (let k = 0; k < n; k++) pts.push({ lat, lon: k / n * Math.PI * 2 + (r % 2) * .0, id: pts.length })
}
function render(t) {
  const C = CONFIG
  // disorder: 1 while scrambled, eased to 0 by solveAt, back up from scrambleAt
  const d = t < C.solveAt ? 1 - eo5(seg(t, .15, C.solveAt)) : (t > C.scrambleAt ? eio(seg(t, C.scrambleAt, DUR)) : 0)
  const spin = (t * C.spin) * Math.PI / 180, tl = C.tilt * Math.PI / 180
  let out = ''
  const proj = pts.map((p) => {
    const jx = (hash(p.id * 2.3) - .5) * 2 * C.scatter * d, jy = (hash(p.id * 5.1 + 9) - .5) * 2 * C.scatter * d
    const lat = p.lat + jy, lon = p.lon + jx + spin
    let x = Math.cos(lat) * Math.sin(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon)
    const y2 = y * Math.cos(tl) - z * Math.sin(tl), z2 = y * Math.sin(tl) + z * Math.cos(tl)
    return { x: x * C.radius, y: y2 * C.radius, z: z2 }
  }).sort((a, b) => a.z - b.z)
  for (const q of proj) { const k = (q.z + 1) / 2; out += `<circle cx="${q.x.toFixed(2)}" cy="${q.y.toFixed(2)}" r="${(C.dot * (.65 + .5 * k)).toFixed(2)}" fill="#fff" opacity="${(.1 + .62 * Math.pow(k, 1.6)).toFixed(2)}"/>` }
  svg.innerHTML = out
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
