<!doctype html>
<html><head><meta charset="utf-8"><title>Glass folder fan-out icons</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.fold{position:absolute;width:460px;height:300px;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#fff;letter-spacing:-.03em}
.tile{position:absolute;left:50%;top:42px;margin-left:-50.5px;width:101px;height:101px;border-radius:26px;backface-visibility:hidden}
.tile .in{position:relative;width:100%;height:100%;border-radius:inherit;overflow:hidden;display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14)}
.pillt{position:absolute;bottom:100%;left:50%;margin-bottom:10px;white-space:nowrap;border-radius:9999px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.55);padding:4px 10px;font-size:12px;font-weight:500;line-height:16px;letter-spacing:-.03em;color:#fff}
.front,.back{position:absolute;left:0;right:0;bottom:0}
.ttl{margin:0;padding:34px 18px 0;font-size:20px;font-weight:600;line-height:26px}
.tags{margin:14px 18px 0;display:flex;flex-wrap:wrap;gap:6px}
.tag{height:24px;white-space:nowrap;border-radius:9999px;border:1px solid #282828;padding:2px 10px;font-size:12px;line-height:20px;background:rgba(36,36,36,.7);color:#9f9f9f;letter-spacing:-.03em}
.mini{position:absolute;right:14px;bottom:14px;height:34px;display:flex;align-items:center;gap:6px;border-radius:9999px;border:1px solid rgba(255,255,255,.08);padding:0 6px;background:rgba(0,0,0,.55)}
.mini i{display:block;width:22px;height:22px;border-radius:7px}
.cur{position:absolute;width:22px;height:22px}
.cap{position:absolute;left:0;right:0;bottom:36px;text-align:center;font:600 13px -apple-system,system-ui,sans-serif;color:rgb(255 255 255/.45);letter-spacing:.03em}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }
// a CSS-transition-like value: events [{t, to, dur, delay, ease}] each start from wherever the value was when they began (interrupts are continuous)
const animTo = (t, init, events, i = events.length - 1) => {
  if (i < 0) return init
  const e = events[i], start = e.t + (e.delay || 0)
  if (t < start) return animTo(t, init, events, i - 1)
  const from = animTo(start, init, events, i - 1), p = clamp((t - start) / e.dur)
  return from + (e.to - from) * (e.ease || EASE.easeOut)(p)
}

const DUR = 9
window.DUR = DUR
const box = fitBox(640, 480, '#000')
const bgw = el('div', 'abs', box); S(bgw, { left: '0', top: '0', width: '640px', height: '480px', background: 'radial-gradient(50% 45% at 50% 40%, rgba(255,255,255,.07), transparent 70%)' })
const FW = 460, FH = 300, SPREAD = 92, FX = 90, FY = 74
// pathL: the front pocket (tab on the left). pathR: the back plate (tab on the right). Same functions as the component.
const pathL = (w, h, r, d, tw, s) => `M0 ${r}A${r} ${r} 0 0 1 ${r} 0L${tw} 0C${tw + s * 0.55} 0 ${tw + s * 0.45} ${d} ${tw + s} ${d}L${w - r} ${d}A${r} ${r} 0 0 1 ${w} ${d + r}L${w} ${h - r}A${r} ${r} 0 0 1 ${w - r} ${h}L${r} ${h}A${r} ${r} 0 0 1 0 ${h - r}Z`
const pathR = (w, h, r, d, tw, s) => { const x = w - tw; return `M0 ${d + r}A${r} ${r} 0 0 1 ${r} ${d}L${x - s} ${d}C${x - s * 0.45} ${d} ${x - s * 0.55} 0 ${x} 0L${w - r} 0A${r} ${r} 0 0 1 ${w} ${r}L${w} ${h - r}A${r} ${r} 0 0 1 ${w - r} ${h}L${r} ${h}A${r} ${r} 0 0 1 0 ${h - r}Z` }
const root = el('div', 'fold', box); S(root, { left: FX + 'px', top: FY + 'px' })
const glow = el('div', 'abs', root); S(glow, { left: '8%', right: '8%', top: '40px', height: '200px', borderRadius: '9999px', opacity: '.8', background: 'radial-gradient(closest-side, rgba(255,255,255,.10), transparent)' })
const backH = FH - 14, backD = pathR(FW, backH, 24, 24, Math.round(FW * 0.4), 46)
const back = el('div', 'back', root); S(back, { top: '14px', height: backH + 'px', background: 'linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008) 60%)', clipPath: `path('${backD}')` })
back.innerHTML = `<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><path d="${backD}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/></svg>`
// three placeholder app tiles. Names are invented.
const TILES = [
  { name: 'Northwind', bg: 'linear-gradient(135deg,#f97316,#be123c)', glyph: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 5 6 9a6 6 0 0 1-12 0c0-2 1-3 2-4 .5 2 1.500 2.500 2.500 2.500C10 8 11 6 12 3z"/></svg>' },
  { name: 'Helio', bg: 'linear-gradient(135deg,#1e40af,#0b1a4a)', glyph: '<span style="font:800 21px -apple-system,system-ui;letter-spacing:.12em;color:#fff">HELIO</span>' },
  { name: 'Palmetto', bg: 'linear-gradient(135deg,#34d399,#0e7490)', glyph: '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-8 8-12 16-12-1 8-5 13-13 13M4 18l6-6"/></svg>' },
]
const tiles = TILES.map((tl, i) => {
  const w = el('div', 'tile', root); const a = el('div', 'abs', w); S(a, { left: '0', top: '0', width: '100%', height: '100%', borderRadius: '26px' })
  const inn = el('div', 'in', a, tl.glyph); S(inn, { background: tl.bg })
  const pill = el('span', 'pillt', a, tl.name + ' · Read the case')
  return { w, a, pill }
})
const frontH = 180, frontD = pathL(FW, frontH, 24, 24, Math.round(FW * 0.42), 46)
const front = el('div', 'front', root); S(front, { height: frontH + 'px', overflow: 'hidden', background: 'linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.015) 55%),rgba(12,12,12,.78)', clipPath: `path('${frontD}')` })
front.innerHTML = `<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><defs><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.38)"/><stop offset=".35" stop-color="rgba(255,255,255,.1)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient></defs><path d="${frontD}" fill="none" stroke="url(#edge)" stroke-width="2"/></svg>
  <h3 class="ttl">Case studies</h3><div class="tags">${TILES.map((x) => `<span class="tag">${x.name}</span>`).join('')}</div>
  <span class="mini">${TILES.map((x) => `<i style="background:${x.bg}"></i>`).join('')}</span>`
const tags = Array.from(front.querySelectorAll('.tag'))
const cur = el('div', 'cur', box, '<svg width="22" height="22" viewBox="0 0 20 20"><path d="M3 2l12 6-5 1.5L8 15z" fill="#fff" stroke="#000" stroke-width="1"/></svg>')
el('div', 'cap', box, 'hover fans tiles out in .6s, tile hover lifts 26px with a name pill, leave folds back in .9s')
// time plan: scroll-in at .3s, pointer enters at 3.2s, hovers the right tile 4.6 to 5.6, leaves at 6.4s
const EV = { show: .3, hOn: 3.2, tOn: 4.6, tOff: 5.6, hOff: 6.4 }, HI = 2
const E = bez(.2, .8, .2, 1), ES = bez(.25, .1, .25, 1)
const n = 3, rs = 25 / (n - 1)
const geo = (i, wide) => { const k = i - (n - 1) / 2, gap = wide ? SPREAD * 1.15 : SPREAD; return { x: k * gap, y: k * k * 9 - (wide ? 4 : 0), r: k * rs * (wide ? 1.2 : 1) } }
// one value per tile and property, using the delay and duration of the state it is moving into
const tileVal = (i, key, t) => {
  const A = { x: geo(i, 0).x, y: geo(i, 0).y, r: geo(i, 0).r }, W = geo(i, 1)
  const first = { x: (i - 1) * SPREAD * .6, y: 80, r: 0 }
  return animTo(t, first[key], [
    { t: EV.show, to: A[key], dur: .9, delay: .35 + i * .08, ease: E },
    { t: EV.hOn, to: W[key], dur: .6, delay: i * .04, ease: E },
    { t: EV.hOff, to: A[key], dur: .9, delay: .35 + i * .08, ease: E },
  ])
}
function render(t) {
  const sh = animTo(t, 0, [{ t: EV.show, to: 1, dur: .9, ease: ES }]), op = animTo(t, 0, [{ t: EV.show, to: 1, dur: .6, ease: ES }])
  const wide = animTo(t, 0, [{ t: EV.hOn, to: 1, dur: .9, ease: ES }, { t: EV.hOff, to: 0, dur: .9, ease: ES }])
  S(root, { opacity: String(op), transform: `translateY(${(1 - sh) * 34 + wide * -6}px) scale(${.92 + .08 * sh + .02 * wide})` })
  const fw = animTo(t, 0, [{ t: EV.hOn, to: 6, dur: .6, ease: E }, { t: EV.hOff, to: 0, dur: .6, ease: E }])
  S(front, { transform: `translateY(${fw.toFixed(2)}px)` })
  const hiQ = animTo(t, 0, [{ t: EV.tOn, to: 1, dur: .45, ease: E }, { t: EV.tOff, to: 0, dur: .45, ease: E }])
  tiles.forEach((tl, i) => {
    const x = tileVal(i, 'x', t), y = tileVal(i, 'y', t), r = tileVal(i, 'r', t)
    const tOp = animTo(t, 0, [{ t: EV.show, to: 1, dur: .5, delay: .35 + i * .08, ease: ES }])
    S(tl.w, { opacity: String(tOp), transform: `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(2)}deg)`, zIndex: i === HI && hiQ > .01 ? 5 : 0 })
    const mine = i === HI ? hiQ : 0, other = i === HI ? 0 : hiQ
    S(tl.a, { transform: `translateY(${-26 * mine}px) rotate(${-r * mine}deg) scale(${1 + .1 * mine - .04 * other})`, filter: other > .3 ? 'saturate(.75) brightness(.85)' : 'none' })
    S(tl.pill, { opacity: String(mine), transform: `translateX(-50%) translateY(${6 * (1 - mine)}px)` })
  })
  tags.forEach((g, i) => { const on = i === HI && hiQ > .3; S(g, { borderColor: on ? 'rgba(255,255,255,.4)' : '#282828', color: on ? '#fff' : '#9f9f9f' }) })
  // pointer: enters, moves to the right tile, leaves
  const g2 = geo(HI, 1), tx = FX + FW / 2 + g2.x + 10, ty = FY + 42 + 50 + g2.y + 14 - 26 * 0
  const cx = animTo(t, FX + FW + 90, [{ t: 3.0, to: FX + FW / 2 + 40, dur: .5, ease: E }, { t: 4.4, to: tx, dur: .5, ease: E }, { t: 6.2, to: FX + FW + 90, dur: .6, ease: E }])
  const cy = animTo(t, FY + 220, [{ t: 3.0, to: FY + 190, dur: .5, ease: E }, { t: 4.4, to: ty, dur: .5, ease: E }, { t: 6.2, to: FY + 220, dur: .6, ease: E }])
  S(cur, { left: cx.toFixed(1) + 'px', top: cy.toFixed(1) + 'px', display: t > 2.9 && t < 6.9 ? '' : 'none' })
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
