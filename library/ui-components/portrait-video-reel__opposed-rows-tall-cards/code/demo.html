<!doctype html>
<html><head><meta charset="utf-8"><title>Portrait video reel</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.row{position:absolute;left:0;right:0;overflow:hidden}
.track{display:flex;gap:16px;width:max-content;padding:4px 0}
.card{position:relative;width:210px;flex-shrink:0;border-radius:25.6px;border:1px solid rgb(255 255 255/.10);background:rgb(255 255 255/.04);padding:6px}
.inner{position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:19.2px;background:#000}
.shade{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(to top,rgb(0 0 0/.7),transparent)}
.pill{position:absolute;left:10px;top:10px;border-radius:9999px;border:1px solid rgb(255 255 255/.2);background:rgb(0 0 0/.4);padding:4px 10px;font:600 11px -apple-system,'SF Pro Display',system-ui,sans-serif;color:#fff}
.cr{position:absolute;left:12px;bottom:12px;font:600 12px -apple-system,'SF Pro Display',system-ui,sans-serif;color:rgb(255 255 255/.9)}
.pl{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:9999px;background:rgb(255 255 255/.15);display:grid;place-items:center;color:#fff}
.head{position:absolute;left:50%;width:70px;height:70px;margin-left:-35px;top:28%;border-radius:50%}
.body{position:absolute;left:50%;width:150px;height:170px;margin-left:-75px;top:46%;border-radius:75px 75px 0 0}
.cap{position:absolute;left:14px;right:14px;top:62%;height:34px;border-radius:8px;background:rgb(255 255 255/.92)}
.cap::after{content:"";position:absolute;left:10px;right:34px;top:11px;height:12px;border-radius:6px;background:rgb(0 0 0/.65)}
.fl,.fr{position:absolute;top:0;bottom:0;width:112px;pointer-events:none}
.fl{left:0;background:linear-gradient(90deg,#000,rgb(0 0 0/0))}
.fr{right:0;background:linear-gradient(270deg,#000,rgb(0 0 0/0))}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }

const DUR = 8
window.DUR = DUR
const box = fitBox(1280, 800, '#000')
const NICHES = ['Fitness', 'Cooking', 'Gadgets', 'Travel', 'Beauty', 'Finance', 'Gaming', 'Pets', 'Fashion']
const NAMES = ['Ava', 'Leo', 'Mina', 'Jonas', 'Priya', 'Omar', 'Sofia', 'Kai', 'Elena']
const PAL = [['#6d28d9', '#1e1b4b', '#f0abfc'], ['#0e7490', '#082f49', '#fde68a'], ['#be123c', '#4c0519', '#fecdd3'], ['#15803d', '#052e16', '#bbf7d0'], ['#b45309', '#451a03', '#fed7aa'], ['#1d4ed8', '#172554', '#bfdbfe'], ['#a21caf', '#3b0764', '#f5d0fe'], ['#475569', '#0f172a', '#e2e8f0'], ['#0f766e', '#042f2e', '#99f6e4']]
const card = (i) => { const p = PAL[i % PAL.length]
  return `<div class="card"><div class="inner" style="background:linear-gradient(160deg,${p[0]},${p[1]})">
    <div class="head" style="background:${p[2]}"></div><div class="body" style="background:${p[2]};opacity:.9"></div><div class="cap"></div>
    <div class="shade"></div><span class="pill">${NICHES[i % 9]}</span><span class="cr">${NAMES[(i * 4) % 9]}</span>
    <span class="pl"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M6 4l14 8-14 8z"/></svg></span></div></div>` }
const mkRow = (off, top, reverse) => {
  const r = el('div', 'row', box); S(r, { top: top + 'px' })
  const list = Array.from({ length: 9 }, (_, k) => card(k + off)).join('')
  const tr = el('div', 'track', r, list + list)
  return { r, tr, reverse, cards: Array.from(tr.children) }
}
const rows = [mkRow(0, 22, false), mkRow(4, 408, true)]
el('div', 'fl', box); el('div', 'fr', box)
// hover on one card of row 1 from 2.5s to 5s: .reel-row:hover .reel-track pauses the animation, and the card lifts -4px with a blue border
const H0 = 2.5, H1 = 5
rows.forEach((r) => r.cards.forEach((c) => { const p = $(c, '.pl'); p.style.opacity = '0'; c._p = p }))
// the card nearest the middle of row 1 at the moment the pointer arrives
const wHalf = () => rows[0].tr.scrollWidth / 2
const pAt = (t) => ((t - Math.max(0, Math.min(t, H1) - H0)) / (DUR - (H1 - H0))) % 1
let HOVER = -1
const pick = () => { const x = -pAt(H0) * wHalf(); let best = 0, bd = 1e9; rows[0].cards.forEach((c, i) => { const d = Math.abs(x + 16 * i + 210 * i + 105 + 6 - 640); if (d < bd) { bd = d; best = i } }); return best }
function render(t) {
  if (HOVER < 0) HOVER = pick()
  const paused = Math.max(0, Math.min(t, H1) - H0)          // animation-play-state: paused while hovered
  const p = ((t - paused) / (DUR - (H1 - H0))) % 1
  rows.forEach((r, ri) => {
    const w = r.tr.scrollWidth / 2
    const x = r.reverse ? -w + p * w : -p * w
    S(r.tr, { position: "relative", left: Math.round(x) + "px" })
    r.cards.forEach((c, ci) => {
            const q = ri === 0 && ci === HOVER ? (t >= H0 && t < H1 ? EASE.easeInOut(clamp((t - H0) / .3)) : (t >= H1 ? 1 - EASE.easeInOut(clamp((t - H1) / .3)) : 0)) : 0
      S(c, { transform: `translateY(${Math.round(-4 * q)}px)`, borderColor: `rgb(${mix(255, 59, q)} ${mix(255, 130, q)} ${mix(255, 246, q)} / ${mix(.10, .40, q)})` })
      c._p.style.opacity = String(q)
    })
  })
  box.style.display = 'none'; void box.offsetHeight; box.style.display = ''   // drop Chrome's cached raster so a frame never depends on the one before it
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
