.btn-secondary{color:var(--ink)}

.lede{font-size:18px;line-height:1.625;color:var(--ink2)}
.tn{font-variant-numeric:tabular-nums}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vcard{position:relative;flex:none;width:230px}
.vcard .fr{border-radius:24px;padding:6px;aspect-ratio:9/16}

  const sp = PITCH / 9
  rows.forEach((r, ri) => { const x = r.reverse ? -24 * PITCH / 2 + t * sp : -t * sp; S(r.track, { transform: `translateX(${x}px)` }) })
  // hover: the card under the pointer lifts 4px (300ms) and shows the play dot; pointer clicks at 4.6 and the sheet opens
  const hv = E_TW(seg(t, 2.9, 3.2)) * (1 - E_TW(seg(t, 7.8, 8.1)))
  const target = rows[0].cards[4]
  rows.forEach((r) => r.cards.forEach((c) => { S(c.fr, { transform: 'translateY(0)' }); c.pb.style.opacity = 0 }))
  S(target.fr, { transform: `translateY(${-4 * hv}px)` }); target.pb.style.opacity = hv
  const open = t >= 4.6 && t < 7.6, it = t - 4.6, ot = t - 7.6
  const k = open ? 1 : t >= 7.6 ? 1 - E_EASEOUT(seg(ot, 0, .25)) : 0
  const y = open ? 40 * (1 - fspring(it, 260, 26)) : t >= 7.6 ? 40 * E_EASEOUT(seg(ot, 0, .25)) : 40
  S(modal, { display: k > .001 ? 'block' : 'none', opacity: open ? E_EASEOUT(seg(it, 0, .25)) : k }); S(sheet, { transform: `translateY(${y}px)`, opacity: open ? clamp(fspring(it, 260, 26) * 1.5) : k })
  const tx = (rows[0].cards[4].c.getBoundingClientRect ? 0 : 0)
  const a = E_EASEINOUT(seg(t, 2.0, 2.9)), out = E_EASEINOUT(seg(t, 4.9, 5.7))
  S(cur, { left: lerp(lerp(1180, 1050, a), 1260, out) + 'px', top: lerp(lerp(800, 470, a), 760, out) + 'px', display: t >= 2.0 && t < 5.7 ? 'block' : 'none' })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
