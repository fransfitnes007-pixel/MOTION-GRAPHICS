<!doctype html>
<html><head><meta charset="utf-8"><title>Radial orbital timeline</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#000;color:#fff}
.orb{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.nd{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:#000;display:grid;place-items:center;box-shadow:0 0 14px rgba(255,255,255,.14)}
.nd svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nl{position:absolute;left:50%;top:60px;transform:translateX(-50%);font-size:16px;font-weight:600;letter-spacing:.04em;white-space:nowrap;color:rgba(255,255,255,.75)}
.cd{position:absolute;width:316px;background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.28);border-radius:9px;box-shadow:0 0 28px rgba(255,255,255,.1);transform-origin:50% 0}
.bg{position:absolute;left:30px;top:30px;height:26px;line-height:22px;padding:0 11px;border-radius:13px;border:1.5px solid rgba(255,255,255,.8);font-size:14.5px;font-weight:600;letter-spacing:.03em}
.mono{font-family:ui-monospace,Menlo,monospace}
.hr{position:absolute;left:30px;right:30px;height:1px;background:rgba(255,255,255,.12)}
.cb{display:inline-block;height:28px;line-height:25px;padding:0 10px;border:1px solid rgba(255,255,255,.25);border-radius:4px;font-size:15px;font-weight:500;margin-right:6px}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  nodes: [   // id, title, date, text, status, energy 0..100, related ids, icon
    { id: 1, t: 'Planning', d: 'Jan 2024', c: 'Project planning and requirements gathering phase.', s: 'completed', e: 100, rel: [2], ic: 'cal' },
    { id: 2, t: 'Design', d: 'Feb 2024', c: 'UI/UX design and system architecture.', s: 'completed', e: 90, rel: [1, 3], ic: 'doc' },
    { id: 3, t: 'Development', d: 'Mar 2024', c: 'Core features implementation and testing.', s: 'in-progress', e: 60, rel: [2, 4], ic: 'code' },
    { id: 4, t: 'Testing', d: 'Apr 2024', c: 'User testing and bug fixes.', s: 'pending', e: 30, rel: [3, 5], ic: 'user' },
    { id: 5, t: 'Release', d: 'May 2024', c: 'Final deployment and release.', s: 'pending', e: 10, rel: [4], ic: 'clock' },
  ],
  center: [633, 342], radius: 236,      // orbit centre and radius in the 1280 x 720 design
  spinDegPerSec: 6,                      // auto-rotation speed while nothing is selected
  travelSec: .6,                         // time to bring a selected node to the top
  startAngle: 171,                       // angle of node 1 at t = 0 (degrees, 270 = top)
  // scripted clicks: select a node id at a time; id 0 = click the background to close
  events: [[1.25, 4], [3.0, 0], [4.3, 5], [6.2, 0]],
  accent: ['#3b82f6', '#8b5cf6'],        // energy bar gradient
}
const DUR = 9
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const IC = {
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/>',
  code: '<path d="m8 8-5 4 5 4M16 8l5 4-5 4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
}
const box = fitBox(1280, 720, 1)
const [OCX, OCY] = CONFIG.center, RR = CONFIG.radius
const ring0 = el('div', 'orb', box); S(ring0, { left: px(OCX - RR), top: px(OCY - RR), width: px(RR * 2), height: px(RR * 2) })
const pings = [0, 1].map(() => { const p = el('div', 'orb', box); p.style.borderColor = 'rgba(150,130,255,.5)'; return p })
const core = el('div', 'abs', box); S(core, { left: px(OCX - 40), top: px(OCY - 40), width: '80px', height: '80px', borderRadius: '50%', background: 'linear-gradient(135deg,#7c3aed,#3b82f6 55%,#14b8a6)' })
el('div', 'abs', core).style.cssText = 'left:20px;top:20px;width:40px;height:40px;border-radius:50%;background:rgba(220,220,230,.8)'
const nodes = CONFIG.nodes.map((n) => {
  const e = el('div', 'nd', box, `<svg viewBox="0 0 24 24">${IC[n.ic]}</svg>`); const l = el('div', 'nl', e, n.t); return { n, e, l }
})
const card = el('div', 'cd', box)
const cur = makeCursor(box)
const stText = { completed: 'COMPLETE', 'in-progress': 'IN PROGRESS', pending: 'PENDING' }
// ---- rotation / selection state as a pure function of time ----
const ang = (i, R) => CONFIG.startAngle + i * 72 + R
function state(t) {
  let R = 0, last = 0, sel = 0, selT = -9, mode = 'spin', Rt = 0, from = 0, tt = 0
  const evs = CONFIG.events
  for (let k = 0; k <= evs.length; k++) {
    const tEnd = k < evs.length ? Math.min(t, evs[k][0]) : t
    if (mode === 'spin') R += CONFIG.spinDegPerSec * Math.max(0, tEnd - last)
    else if (mode === 'travel') { /* settled below */ }
    last = tEnd
    if (k === evs.length || t < evs[k][0]) break
    const [te, id] = evs[k]
    if (id > 0) {
      const i = id - 1; let target = 270 - CONFIG.startAngle - i * 72
      target += 360 * Math.round((R - target) / 360)
      const q = eo(seg(t, te, te + CONFIG.travelSec))
      from = R; Rt = target; mode = 'sel'; sel = id; selT = te
      const nextT = k + 1 < evs.length ? evs[k + 1][0] : 1e9
      if (t < nextT) { R = lerp(from, Rt, q); return { R, sel, selT } }
      R = Rt; last = te
    } else { mode = 'spin'; sel = 0; selT = te; last = te }
  }
  return { R, sel, selT }
}
const pos = (i, R) => { const a = ang(i, R) * Math.PI / 180; return [OCX + RR * Math.cos(a), OCY + RR * Math.sin(a)] }
// cursor keyframes from the node positions at click time
const cp = [[0, 1000, 270]]
CONFIG.events.forEach(([te, id], k) => {
  if (id > 0) { const s = state(te - .01); const [x, y] = pos(id - 1, s.R); cp.push([te - .5, x + 20, y + 10], [te + .15, x + 12, y + 8], [te + 1.0, 890, 465]) }
  else cp.push([te - .4, 890, 465], [te + .2, 890 + 40, 465 + 10])
})
cp.push([DUR - .5, 1000, 330], [DUR, 1000, 270]); cp.sort((a, b) => a[0] - b[0])
function render(t) {
  const fade = Math.min(eo(seg(t, 0, .4)), 1 - seg(t, DUR - .45, DUR))
  const st = state(t), R = st.R
  const sel = st.sel ? CONFIG.nodes[st.sel - 1] : null
  const q = sel ? eo(seg(t, st.selT, st.selT + CONFIG.travelSec)) : 0
  const cardQ = sel ? eo(seg(t, st.selT + .3, st.selT + .6)) : 0
  // closing: fade the card out over 0.25s after a background click
  const closeQ = !sel ? 1 - eo(seg(t, st.selT, st.selT + .25)) : 1
  pings.forEach((p, i) => { const u = ((t / 1.6) + i * .5) % 1; const r = 46 + u * 30; S(p, { left: px(OCX - r), top: px(OCY - r), width: px(r * 2), height: px(r * 2), opacity: (1 - u) * .5 * fade }) })
  S(core, { opacity: fade })
  let selPos = null
  nodes.forEach((o, i) => {
    const [x, y] = pos(i, R)
    const isSel = sel && sel.id === o.n.id, isRel = sel && sel.rel.includes(o.n.id)
    const op = Math.max(.4, Math.min(1, .4 + .6 * ((1 + Math.sin(ang(i, R) * Math.PI / 180)) / 2)))
    const k = isSel ? 1 + .5 * q : 1
    const pulse = .5 + .5 * Math.sin(t * 5)
    S(o.e, { left: px(x), top: px(y), opacity: (isSel ? 1 : sel ? Math.min(op, isRel ? 1 : .7) : op) * fade, transform: `scale(${k})`, zIndex: String(isSel ? 200 : Math.round(100 + 50 * Math.sin(ang(i, R) * Math.PI / 180))),
      background: isSel ? `rgb(${lerp(0, 255, q) | 0},${lerp(0, 255, q) | 0},${lerp(0, 255, q) | 0})` : isRel && q > 0 ? `rgba(255,255,255,${.25 + .2 * pulse})` : '#000',
      borderColor: isSel ? '#fff' : isRel && q > 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.55)' })
    o.e.firstChild.style.stroke = isSel && q > .5 ? '#000' : '#fff'
    o.l.style.color = isSel ? '#fff' : 'rgba(255,255,255,.75)'; o.l.style.top = (isSel ? 33 : 60) + 'px'; o.l.style.fontSize = isSel ? '15px' : '16px'
    if (isSel) selPos = [x, y]
  })
  if ((sel || closeQ < 1) && st.selT > -1) {
    const n = sel || CONFIG.nodes[(() => { let id = 0; CONFIG.events.forEach(([te, i]) => { if (te < st.selT && i > 0) id = i }); return id - 1 })()]
    const key = sel ? selPos : (() => { const ev = [...CONFIG.events].reverse().find(([te, i]) => i > 0 && te < st.selT); const [x, y] = pos(ev[1] - 1, R); return [x, y] })()
    if (n && key) {
      const o = sel ? cardQ : closeQ
      card.innerHTML = `<div style="position:relative;height:310px">
        <div class="bg" style="${n.s === 'completed' ? 'background:#fff;color:#000;border-color:#fff' : n.s === 'in-progress' ? 'background:#000;color:#fff' : 'background:transparent'}">${stText[n.s]}</div>
        <div class="mono" style="position:absolute;right:30px;top:33px;font-size:14px;color:rgba(255,255,255,.55)">${n.d}</div>
        <div style="position:absolute;left:30px;top:68px;font-size:19px;font-weight:600">${n.t}</div>
        <div style="position:absolute;left:30px;top:98px;font-size:15.5px;color:rgba(255,255,255,.82)">${n.c}</div>
        <div class="hr" style="top:139px"></div>
        <div style="position:absolute;left:30px;top:154px;font-size:15.5px;font-weight:500;color:rgba(255,255,255,.9)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2" stroke-linejoin="round" style="vertical-align:-1px"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg> Energy Level</div>
        <div class="mono" style="position:absolute;right:30px;top:154px;font-size:15px">${n.e}%</div>
        <div style="position:absolute;left:30px;right:30px;top:178px;height:4px;border-radius:2px;background:rgba(255,255,255,.1)"><div style="width:${n.e}%;height:100%;border-radius:2px;background:linear-gradient(90deg,${CONFIG.accent[0]},${CONFIG.accent[1]})"></div></div>
        <div class="hr" style="top:204px"></div>
        <div style="position:absolute;left:30px;top:220px;font-size:15px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.8)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-1px"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg> CONNECTED NODES</div>
        <div style="position:absolute;left:30px;top:250px;white-space:nowrap">${n.rel.map((r) => `<span class="cb">${CONFIG.nodes[r - 1].t} &rarr;</span>`).join('')}</div></div>`
      S(card, { display: '', left: px(key[0] - 158), top: px(key[1] + 74), opacity: o * fade, transform: `scale(${.92 + .08 * o})`, height: '310px', zIndex: 300 })
    } else S(card, { display: 'none' })
  } else S(card, { display: 'none' })
  const [mx, my] = kfp(t, cp); setCursor(cur, mx, my, CONFIG.events.some(([te]) => t > te - .05 && t < te + .12), t > .15)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
