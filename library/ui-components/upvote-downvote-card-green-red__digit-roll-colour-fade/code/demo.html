<!doctype html>
<html><head><meta charset="utf-8"><title>uilayout-contact-motion-number-upvotes</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#111}
.vc{position:absolute;width:132px;height:114px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.09)}
.vt{position:absolute;left:0;top:19px;width:100%;text-align:center;font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.dg{display:inline-block;position:relative;width:9px;height:20px;vertical-align:top}
.dg>span{position:absolute;left:0;top:0;width:100%;text-align:center}
.vb{position:absolute;top:60px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const U = Math.min(W / 1280, H / 800)   // the board below is 1280x800 and scaled to fit any ?w=&h=
const root = el('div', 'abs'); S(root, { left: px(CX - 640), top: px(CY - 400), width: '1280px', height: '800px', transform: `scale(${U})`, transformOrigin: '50% 50%' })

const CONFIG = {
  zoom: 2.9,                      // the real card is about 132px wide
  start: 14, label: 'Upvotes',
  // scripted clicks: time (s) and 'up' or 'down'; each changes the count by 1
  clicks: [[1.0, 'up'], [2.5, 'up'], [4.0, 'down']],
  resetAt: 6.0,                   // card returns to neutral for the loop
  colors: {                       // card fill, card border, text, up button, down button
    neutral: ['#fafafa', '#ececec', '#111111', '#000000', '#000000'],
    up: ['#86efac', '#22c55e', '#ffffff', '#00c055', '#000000'],
    down: ['#fca5a5', '#ef4444', '#ffffff', '#000000', '#f0293f'],
  },
  fade: .25, roll: .38,           // colour fade and digit roll durations (s)
}
const DUR = 7.5
window.DUR = DUR
root.style.transform = `scale(${U * CONFIG.zoom})`
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
const mix = (a, b, k) => 'rgb(' + hex(a).map((x, i) => Math.round(x + (hex(b)[i] - x) * k)).join(',') + ')'
const card = el('div', 'vc', root); S(card, { left: px(640 - 66), top: px(400 - 57), border: '1px solid #ececec' })
const tx = el('div', 'vt', card)
const dg = [el('span', 'dg', tx), el('span', 'dg', tx)]
dg.forEach((d) => { d.o = el('span', '', d); d.n = el('span', '', d) })
const lab = el('span', '', tx, CONFIG.label); lab.style.display = 'inline-block'; lab.style.verticalAlign = 'top'; lab.style.marginLeft = '6px'
const mk = (x, path) => { const b = el('div', 'vb', card, `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`); S(b, { left: px(x) }); return b }
const up = mk(15, '<path d="M12 19V5M5 12l7-7 7 7"/>'), dn = mk(77, '<path d="M12 5v14M19 12l-7 7-7-7"/>')
// scripted cursor: keys = [{t, x, y, click?}], eased between keys; a click shows a short press ring
const cursorEl = el('div', 'abs', root, '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.8L10.4 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>')
const ringEl = el('div', 'abs', root); S(ringEl, { width: '34px', height: '34px', marginLeft: '-17px', marginTop: '-17px', borderRadius: '50%', border: '2px solid rgba(120,120,140,.6)', pointerEvents: 'none' })
function cursorAt(t, keys) {
  let i = 0; while (i < keys.length - 1 && t >= keys[i + 1].t) i++
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)]
  const k = b === a ? 0 : eio(seg(t, a.t, b.t))
  let press = 0; for (const q of keys) if (q.click && t >= q.t && t < q.t + .35) press = 1 - (t - q.t) / .35
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), press }
}
function drawCursor(c) {
  S(cursorEl, { left: px(c.x - 5), top: px(c.y - 3), transform: `scale(${1 - .12 * c.press})`, zIndex: 99 })
  S(ringEl, { left: px(c.x), top: px(c.y), opacity: c.press * .9, transform: `scale(${.5 + (1 - c.press) * 1.2})`, zIndex: 98 })
}

cursorEl.firstChild.setAttribute('width', 14); cursorEl.firstChild.setAttribute('height', 14)
S(ringEl, { width: '16px', height: '16px', marginLeft: '-8px', marginTop: '-8px', borderWidth: '1.5px' })

const UP = { x: 640 - 66 + 15 + 22, y: 400 - 57 + 60 + 22 }, DN = { x: 640 - 66 + 77 + 22, y: 400 - 57 + 60 + 22 }
const keys = [{ t: 0, x: 640, y: 400 - 20 }, { t: .8, x: UP.x, y: UP.y }]
CONFIG.clicks.forEach(([t, d], i) => { const p = d === 'up' ? UP : DN; const prev = CONFIG.clicks[i - 1]; if (prev && prev[1] !== d) keys.push({ t: t - .7, x: p.x, y: p.y }); keys.push({ t, x: p.x, y: p.y, click: 1 }) })
keys.push({ t: 5.2, x: DN.x + 60, y: DN.y + 60 }, { t: DUR, x: 640, y: 400 - 20 })

function stateAt(t) {   // value, colour state and when each last changed
  let v = CONFIG.start, st = 'neutral', prevSt = 'neutral', tcSt = -9, tcV = -9, dir = 1, prevV = v
  for (const [ct, d] of CONFIG.clicks) { if (ct > t) break; prevV = v; v += d === 'up' ? 1 : -1; dir = d === 'up' ? 1 : -1; tcV = ct; if (d !== st) { prevSt = st; st = d; tcSt = ct } }
  if (t >= CONFIG.resetAt) { prevSt = st; st = 'neutral'; tcSt = CONFIG.resetAt; prevV = v; v = CONFIG.start; tcV = CONFIG.resetAt; dir = -1 }
  return { v, prevV, st, prevSt, tcSt, tcV, dir }
}
function render(t) {
  const s = stateAt(t)
  const k = eo(seg(t - s.tcSt, 0, CONFIG.fade))
  const A = CONFIG.colors[s.prevSt], B = CONFIG.colors[s.st]
  const c = A.map((a, i) => mix(a, B[i], k))
  S(card, { background: c[0], borderColor: c[1], color: c[2] })
  S(up, { background: c[3] }); S(dn, { background: c[4] })
  // digit roll: only the digits that changed move, new one rises from below on up, drops from above on down
  const p = eo(seg(t - s.tcV, 0, CONFIG.roll))
  const a = String(s.prevV).padStart(2, ' '), b = String(s.v).padStart(2, ' ')
  dg.forEach((d, i) => {
    d.o.textContent = a[i]; d.n.textContent = b[i]
    if (a[i] === b[i] || s.tcV < 0) { S(d.o, { opacity: 0 }); S(d.n, { opacity: 1, transform: 'none', filter: 'none' }); return }
    S(d.o, { opacity: 1 - p, transform: `translateY(${-s.dir * 14 * p}px)`, filter: `blur(${p * 1.5}px)` })
    S(d.n, { opacity: p, transform: `translateY(${s.dir * 14 * (1 - p)}px)`, filter: `blur(${(1 - p) * 1.5}px)` })
  })
  const cu = cursorAt(t, keys)
  const ring = (b) => Math.hypot(cu.x - b.x, cu.y - b.y) < 21
  S(up, { transform: `scale(${ring(UP) ? 1.06 - .1 * cu.press : 1})` }); S(dn, { transform: `scale(${ring(DN) ? 1.06 - .1 * cu.press : 1})` })
  drawCursor(cu)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
