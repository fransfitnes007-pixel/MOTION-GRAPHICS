<!doctype html>
<html><head><meta charset="utf-8"><title>Mechanical keyboard demo</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#ffffff;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.p3{position:absolute;transform-style:preserve-3d}
.face{position:absolute}
.lg{position:absolute;left:0;right:0;text-align:center;font:600 11px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#444}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  unit: 58,                       // px per key unit on the 1280 x 1014 canvas
  gap: 5,                         // px between keys
  keyColor: ['#f0f0f2', '#c9c9ce', '#b4b4ba'],     // top, front, side of a normal key
  accent: ['#ee4b22', '#b63515', '#992c10'],       // accent keys (esc and the corner keys)
  body: ['#a9abb2', '#7b7d84', '#5d5f66'],         // aluminium case
  cable: '#e2461e',
  screenText: '12:37',
  page: '#ffffff',
  pressDepth: 11,                 // px a key sinks when typed
  loop: 12,                       // seconds
}
const DUR = CONFIG.loop
window.DUR = DUR
const DW = 1280, DH = 1014, U = Math.min(W / DW, H / DH)
stage.style.background = CONFIG.page
const root = el('div', 'abs'); S(root, { width: DW + 'px', height: DH + 'px', left: (W - DW * U) / 2 + 'px', top: (H - DH * U) / 2 + 'px', transformOrigin: '0 0', transform: `scale(${U})`, overflow: 'hidden', background: CONFIG.page })
const g3 = (parent, x, y, z) => { const d = el('div', 'p3', parent); S(d, { left: 0, top: 0, width: 0, height: 0, transform: `translate3d(${x}px,${y}px,${z}px)` }); return d }
const face = (parent, w, h, css, tr) => { const d = el('div', 'face', parent); S(d, Object.assign({ width: w + 'px', height: h + 'px', transform: tr || '', transformOrigin: '0 0' }, css)); return d }
const box = (parent, x, y, z, w, d, h, cols, rad) => {
  const b = g3(parent, x, y, z); const r = rad ? { borderRadius: rad + 'px' } : {}
  face(b, w, d, Object.assign({ background: cols[0] }, r), `translateZ(${h}px)`)
  face(b, w, h, { background: cols[1] }, `translateY(${d}px) translateZ(${h}px) rotateX(-90deg)`)
  face(b, w, h, { background: cols[2] }, `translateZ(${h}px) rotateX(-90deg)`)
  face(b, h, d, { background: cols[2] }, `translateX(${w}px) rotateY(-90deg)`)
  face(b, h, d, { background: cols[2] }, `rotateY(-90deg)`)
  return b
}
const view = el('div', 'abs', root); S(view, { left: 0, top: 0, width: DW + 'px', height: DH + 'px', perspective: '2200px', perspectiveOrigin: '50% 45%' })
const cam = el('div', 'p3', view); S(cam, { left: DW / 2 + 'px', top: DH * .56 + 'px', width: 0, height: 0 })
const world = el('div', 'p3', cam)
const Un = CONFIG.unit, G = CONFIG.gap
const BW = 16.35 * Un + 56, BD = 6 * Un + 56
const board = g3(world, -BW / 2, -BD / 2, 0)
// floor shadow
face(board, BW + 60, BD + 60, { left: '-30px', top: '-10px', borderRadius: '40px', background: 'radial-gradient(ellipse,rgba(0,0,0,.2),transparent 70%)', filter: 'blur(14px)' }, 'translateZ(-1px)')
box(board, 0, 0, 0, BW, BD, 24, CONFIG.body, 14)
face(board, BW - 26, BD - 26, { left: '13px', top: '13px', background: '#0e0e10', borderRadius: '8px' }, 'translateZ(24.5px)')
// cable
const cable = face(board, 40, 520, { left: BW - 58 + 'px', top: '-520px' }, 'translateZ(2px)')
cable.innerHTML = `<svg width="40" height="520" viewBox="0 0 40 520" style="overflow:visible"><path d="M20,520 C20,440 8,420 14,330 C20,240 30,200 18,110 C10,60 24,30 20,-300" fill="none" stroke="#18181a" stroke-width="12" stroke-linecap="round"/><path d="M20,520 C20,440 8,420 14,330 C20,240 30,200 18,110 C10,60 24,30 20,-300" fill="none" stroke="${CONFIG.cable}" stroke-width="7" stroke-dasharray="18 6" stroke-linecap="round"/></svg>`
// keys
const ROWS = [
  [['esc', 1.25, 1], ...['F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'].map((k) => [k, 1]), ['del', 1.75]],
  [...['`', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='].map((k) => [k, 1]), ['backspace', 2]],
  [['tab', 1.5], ...'QWERTYUIOP'.split('').map((k) => [k, 1]), ['[', 1], [']', 1], ['\\', 1.5]],
  [['caps', 1.75], ...'ASDFGHJKL'.split('').map((k) => [k, 1]), [';', 1], ["'", 1], ['enter', 2.25]],
  [['shift', 2.25], ...'ZXCVBNM'.split('').map((k) => [k, 1]), [',', 1], ['.', 1], ['/', 1], ['shift', 1.75], ['', 1, 1]],
  [['ctrl', 1.25], ['fn', 1], ['alt', 1.25], ['cmd', 1.25], ['', 6.25], ['alt', 1], ['fn', 1], ['', 1, 1], ['', 1, 1], ['', 1, 1]],
]
const keys = []
ROWS.forEach((row, r) => {
  let x = 28
  row.forEach(([lab, w, acc]) => {
    const kw = w * Un - G, kd = Un - G
    const b = g3(board, x, 28 + r * Un, 24)
    const cols = acc ? CONFIG.accent : CONFIG.keyColor
    const inner = box(b, 0, 0, 0, kw, kd, 15, cols, 8)
    const lg = el('div', 'lg', inner)
    S(lg, { left: 0, top: kd / 2 - 6 + 'px', width: kw + 'px', transform: 'translateZ(15.5px)', color: acc ? '#fff' : '#555', fontSize: lab.length > 3 ? '10px' : '13px' })
    lg.textContent = lab
    keys.push({ b, x, y: 28 + r * Un, id: keys.length })
    x += w * Un
  })
})
// knobs and screen at the right
const KX = BW - 28 - Un * .95
;[0, 1].forEach((i) => { const k = g3(board, KX, 38 + i * 56, 24); face(k, 40, 40, { background: 'radial-gradient(circle at 40% 35%,#4a4a4f,#0b0b0d 70%)', borderRadius: '50%', boxShadow: '0 0 0 2px #2a2a2e' }, 'translateZ(14px)'); face(k, 40, 40, { background: '#0b0b0d', borderRadius: '50%' }, 'translateZ(1px)') })
const scr = g3(board, KX - 2, 168, 24)
const scrTop = face(scr, 44, 120, { background: 'linear-gradient(180deg,#e8461a,#f5a02a 50%,#fff6d8)', borderRadius: '12px', boxShadow: '0 0 0 3px #1c1c1e', color: '#fff', font: '700 10px/1 -apple-system,system-ui,sans-serif', textAlign: 'center', paddingTop: '8px' }, 'translateZ(6px)')
scrTop.textContent = CONFIG.screenText
// pointer overlay
const cur = el('div', 'abs', root, '<svg width="22" height="30" viewBox="0 0 22 28"><path d="M2 2 L2 22 L7 17.5 L10.5 25 L14 23.5 L10.5 16.5 L17 16.5 Z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>'); S(cur, { zIndex: 9 })
const seeded = (n) => { const x = Math.sin(n * 91.7 + 3.1) * 43758.5453; return x - Math.floor(x) }
// typing script: [start second, key index]
const TYPE = []
for (let i = 0; i < 46; i++) TYPE.push([.4 + i * (DUR - 1) / 46 + seeded(i) * .12, Math.floor(seeded(i + 40) * keys.length)])
// camera keyframes: [t, scale, rotX, rotZ, panX, panY]
const CAM = [[0, 1.0, 6, -1, 0, 20], [1.0, .42, 8, 0, 0, 40], [2.3, .42, 8, 0, 0, 40], [3.1, 2.1, 8, 0, 260, -20], [4.2, 1.15, 10, 0, 0, 20], [5.0, 1.0, 12, 0, 0, 20], [6.0, .62, 38, 72, 0, 0], [7.1, .55, 52, 78, 0, 0], [8.0, .9, 74, 12, 0, -20], [9.0, .8, 50, -28, 0, 0], [10.2, .9, 30, -8, 0, 10], [11.2, 1.0, 22, -3, 0, 10], [12, 1.0, 6, -1, 0, 20]]
const camAt = (t) => { for (let i = 0; i < CAM.length - 1; i++) if (t < CAM[i + 1][0]) { const u = eio(seg(t, CAM[i][0], CAM[i + 1][0])); return CAM[i].slice(1).map((v, k) => lerp(v, CAM[i + 1][k + 1], u)) } return CAM[CAM.length - 1].slice(1) }
function render(t) {
  const [s, rx, rz, px, py] = camAt(t)
  S(world, { transform: `translate(${px}px,${py}px) scale(${s}) rotateX(${rx}deg) rotateZ(${rz}deg)` })
  keys.forEach((k) => { let d = 0; TYPE.forEach(([a, id]) => { if (id === k.id) d = Math.max(d, Math.sin(clamp((t - a) / .22) * Math.PI)) }); S(k.b, { transform: `translate3d(${k.x}px,${k.y}px,${24 - CONFIG.pressDepth * d}px)` }) })
  // pointer wanders over the board in the middle of the screen
  const q = t / DUR * Math.PI * 2
  S(cur, { left: DW / 2 + Math.sin(q * 1) * 250 + 80 + 'px', top: DH * .56 + Math.cos(q * 2) * 110 + 'px', opacity: seg(t, .2, .5) * (1 - seg(t, 11.4, 11.8)) })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
