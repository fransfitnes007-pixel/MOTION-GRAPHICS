  const sm = t < T.tToRansom + 1.6 ? 0 : spring(seg(t, T.tToRansom + 1.6, T.tToRansom + 2.1), 7, 11)
  S(smile, { opacity: sm > .01 && t < T.tOut ? 1 : (t >= T.tOut ? 1 : 0), transform: `scale(${Math.max(sm, t >= T.tOut ? 1 : 0)}) rotate(${(1 - Math.min(1, sm)) * -30}deg)` })
  S(plus, { opacity: t > T.tToRansom + .5 ? 1 : 0 })
  // final plain scene
  const pv = seg(t, T.tPlain - .1, T.tPlain + .2)
  S(plainWrap, { opacity: pv > 0 ? 1 : 0, display: pv > 0 ? '' : 'none' })
  let li = 0
  PL.forEach(([w, x0, y0], r) => { for (let i = 0; i < w.length; i++) { const d = plainL[li++]; const k = spring(seg(t, T.tPlain + .1 + li * .08, T.tPlain + .6 + li * .08), 6, 9); d.textContent = w[i]
    S(d, { left: x0 + i * 205 + 'px', top: y0 + (1 - k) * -60 + 'px', opacity: clamp(k * 2) }) } })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
