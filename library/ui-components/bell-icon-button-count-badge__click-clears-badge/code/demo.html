<!doctype html>
<html><head><meta charset="utf-8"><title>bell-icon-button-count-badge__click-clears-badge</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fdfdfd;color:#0a0a0a}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e2e2e2;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.badge{position:absolute;display:flex;align-items:center;justify-content:center;background:#171717;color:#fff;font-weight:500;border-radius:999px;box-shadow:0 0 0 0 #fff}
.cursor{position:absolute;width:18px;height:22px;pointer-events:none;z-index:50}
.lbl{position:absolute;font-size:13px;color:#8a8a8f;white-space:nowrap}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  count: 3,            // number in the badge; 0 hides it
  zoom: 2.0,           // size multiplier (1 = real 36px button)
  badgeColor: '#171717', badgeText: '#ffffff',
  hover: '#f4f4f5',    // button fill on hover
  clickAt: 2.2,        // seconds when the click lands
  resetAt: 5.2,        // seconds when the demo puts the badge back
}
DUR = 6.5; window.DUR = DUR
const Z = CONFIG.zoom, B = 36 * Z
const bx = CX - B / 2, by = CY - B / 2
const btn = el('div', 'btn'); S(btn, { left: px(bx), top: px(by), width: px(B), height: px(B), borderRadius: 8 * Z + 'px' })
btn.innerHTML = `<svg width="${16 * Z}" height="${16 * Z}" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>`
// badge: absolute -top-2, left-full, -translate-x-1/2, min-w-5 (20px), px-1, text-xs
const bw = 20 * Z
const badge = el('div', 'badge'); S(badge, { left: px(bx + B - bw / 2), top: px(by - 8 * Z), minWidth: px(bw), height: px(20 * Z), fontSize: 12 * Z + 'px', padding: `0 ${4 * Z}px`, background: CONFIG.badgeColor, color: CONFIG.badgeText })
const lb = el('div', 'lbl', stage, 'click the bell: the count resets'); S(lb, { left: px(CX - 95), top: px(CY + 90) })
const cur = el('div', 'cursor', stage, '<svg width="18" height="22" viewBox="0 0 18 22"><path d="M2 1l13 12-6 1 4 7-3 1.5-4-7-4 4z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>')

function render(t) {
  const enter = eo(seg(t, .3, 1.6)), leave = eo(seg(t, 3.4, 4.6))
  const tgt = [bx + B * .5, by + B * .75], from = [bx + B + 140, by + B + 120]
  let x = lerp(from[0], tgt[0], enter), y = lerp(from[1], tgt[1], enter)
  x = lerp(x, from[0] - 40, leave); y = lerp(y, from[1], leave)
  const hov = t > 1.5 && t < 4.0
  const down = t > CONFIG.clickAt && t < CONFIG.clickAt + .15
  const cleared = t >= CONFIG.clickAt && t < CONFIG.resetAt
  S(btn, { background: hov ? CONFIG.hover : '#fff', transform: down ? 'scale(.97)' : 'none' })
  const show = !cleared && CONFIG.count > 0
  vis(badge, show); badge.textContent = CONFIG.count > 99 ? '99+' : CONFIG.count
  // badge pops in when the demo restores it
  const pop = t >= CONFIG.resetAt ? spring(seg(t, CONFIG.resetAt, CONFIG.resetAt + .45), 6, 10) : 1
  S(badge, { transform: `scale(${pop})` })
  S(cur, { left: px(x), top: px(y), transform: `scale(${down ? .88 : 1})` })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
