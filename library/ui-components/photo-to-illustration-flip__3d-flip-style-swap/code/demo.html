<!doctype html>
<html><head><meta charset="utf-8"><title>photo to illustration flip</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b10}
#stage{background:radial-gradient(ellipse at 50% 45%,#1c1c28 0%,#0b0b10 70%)}
.persp{position:absolute;perspective:2000px}
.flip{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;overflow:hidden;border-radius:36px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg);background:#f6f1e4}
.ab{position:absolute}
.seg{position:absolute;height:72px;border-radius:36px;background:rgba(255,255,255,.07);box-shadow:0 0 0 1.5px rgba(255,255,255,.08) inset}
.seg .knob{position:absolute;top:6px;height:60px;border-radius:30px;background:#f4f4f8;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.seg span{position:absolute;top:0;height:72px;line-height:72px;text-align:center;font-size:30px;font-weight:640;color:#fff}
.fing{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.62),rgba(255,255,255,.3));box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 0 2.5px rgba(255,255,255,.75) inset;pointer-events:none}
.rip{position:absolute;border-radius:50%;border:4px solid #fff;pointer-events:none}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const DUR = 6.4
window.DUR = DUR
const CW = TALL ? 900 : 860, CH = TALL ? 640 : 600, SX = CW / 780, SY = CH / 560
const CT = CY - CH / 2 - 50, TAP1 = .78, TAP2 = 3.95
// scene geometry in a 780x560 box: sun + three ellipse hills + cloud
const HILLS = [[180, 470, 420, 170], [620, 500, 440, 160], [330, 600, 520, 150]]
const pr = el('div', 'persp'); S(pr, { left: px(CX - CW / 2), top: px(CT), width: px(CW), height: px(CH) })
const flip = el('div', 'flip', pr); S(flip, { width: px(CW), height: px(CH) })
// FRONT: the "photo", all CSS gradients
const front = el('div', 'face', flip); S(front, { width: px(CW), height: px(CH), background: 'linear-gradient(180deg,#5aa8e8 0%,#8ec9f0 38%,#ffe2b0 72%,#ffc98a 100%)' })
const bx = (p, css) => { const e = el('div', 'ab', front); S(e, css); return e }
bx(0, { left: px(560 * SX - 330), top: px(190 * SY - 330), width: '660px', height: '660px', background: 'radial-gradient(circle,rgba(255,244,205,.95) 0,rgba(255,226,160,.55) 14%,rgba(255,214,140,.18) 34%,transparent 62%)' })
bx(0, { left: px((560 - 64) * SX), top: px((190 - 64) * SY), width: px(128 * SX), height: px(128 * SY), borderRadius: '50%', background: 'radial-gradient(circle at 40% 38%,#fffdf0,#ffe9a8 60%,#ffd070)', boxShadow: '0 0 70px 26px rgba(255,236,170,.7)' })
for (const [cx, cy, r, o] of [[170, 150, 30, .85], [212, 128, 40, .9], [262, 150, 32, .85], [215, 168, 44, .8]]) bx(0, { left: px((cx - r) * SX), top: px((cy - r * .85) * SY), width: px(2 * r * SX), height: px(1.7 * r * SY), borderRadius: '50%', background: `rgba(255,255,255,${o})`, filter: 'blur(5px)' })
const HG = ['linear-gradient(180deg,#8aa9c4,#5b7f98 55%,#4a6a82)', 'linear-gradient(180deg,#7fae77,#4e8559 55%,#3c6c4a)', 'linear-gradient(180deg,#4f8a45,#2f5f36 60%,#1f4228)']
HILLS.forEach(([cx, cy, rx, ry], i) => bx(0, { left: px((cx - rx) * SX), top: px((cy - ry) * SY), width: px(2 * rx * SX), height: px(2 * ry * SY), borderRadius: '50%', background: HG[i], boxShadow: i ? 'inset 0 18px 40px rgba(255,236,190,.2)' : 'inset 0 20px 50px rgba(255,236,190,.35)' }))
bx(0, { left: '0px', top: '0px', width: px(CW), height: px(CH), background: 'radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(10,10,30,.42) 100%)' })
bx(0, { left: '0px', top: '0px', width: px(CW), height: px(CH), background: 'repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)' })
// BACK: the same scene as a flat line illustration
const back = el('div', 'face back', flip); S(back, { width: px(CW), height: px(CH) })
let rays = ''; for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; rays += `<path d="M${560 + Math.cos(a) * 86} ${190 + Math.sin(a) * 86}L${560 + Math.cos(a) * 112} ${190 + Math.sin(a) * 112}"/>` }
let hatch = ''; for (let k = 0; k < 14; k++) hatch += `<path d="M${40 + k * 30} 540l22 -30" />`
back.innerHTML = `<svg width="${CW}" height="${CH}" viewBox="0 0 780 560" preserveAspectRatio="none" fill="none" stroke="#23232e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<rect width="780" height="560" fill="#f6f1e4" stroke="none"/>
<circle cx="560" cy="190" r="64" fill="#ffd45e"/><g stroke-width="5">${rays}</g>
<path d="M130 160h170a28 28 0 0 0 0-56a40 40 0 0 0-72-12a30 30 0 0 0-98 68z" fill="#fff" transform="translate(-20 8)"/>
<clipPath id="c1"><ellipse cx="180" cy="470" rx="420" ry="170"/></clipPath><clipPath id="c2"><ellipse cx="620" cy="500" rx="440" ry="160"/></clipPath><clipPath id="c3"><ellipse cx="330" cy="600" rx="520" ry="150"/></clipPath>
<ellipse cx="180" cy="470" rx="420" ry="170" fill="#b8d3e6"/><g clip-path="url(#c1)" stroke-width="3" opacity=".55"><path d="M40 360l60 -40M110 380l60 -40M180 360l60 -40M250 380l60 -40"/></g><ellipse cx="180" cy="470" rx="420" ry="170"/>
<ellipse cx="620" cy="500" rx="440" ry="160" fill="#bfe0b0"/><g clip-path="url(#c2)" stroke-width="3" opacity=".55"><path d="M520 380l56 -36M590 400l56 -36M660 380l56 -36M730 400l56 -36"/></g><ellipse cx="620" cy="500" rx="440" ry="160"/>
<ellipse cx="330" cy="600" rx="520" ry="150" fill="#8cc49a"/><g clip-path="url(#c3)" stroke-width="3" opacity=".6">${hatch.replace(/540/g, '520')}</g><ellipse cx="330" cy="600" rx="520" ry="150"/>
</svg>`
// style switch under the card
const sg = el('div', 'seg'); S(sg, { left: px(CX - 210), top: px(CT + CH + 44), width: '420px' })
const knob = el('div', 'knob', sg); const sA = el('span', '', sg, 'Photo'), sB = el('span', '', sg, 'Illustration')
S(sA, { left: '6px', width: '204px' }); S(sB, { left: '210px', width: '204px' })
const shadow = el('div', 'ab'); S(shadow, { left: px(CX - CW / 2 + 40), top: px(CT + CH - 20), width: px(CW - 80), height: '70px', borderRadius: '50%', background: 'rgba(0,0,0,.6)', filter: 'blur(40px)' })
const fin = el('div', 'fing'), rip = el('div', 'rip')
const FX = CX + CW * .22, FY = CT + CH * .62

function render(t) {
  // two springs: flip to the illustration, then flip back
  const a1 = spring(seg(t, TAP1 + .1, TAP1 + 1.2), 8, 10), a2 = spring(seg(t, TAP2 + .1, TAP2 + 1.2), 8, 10)
  const ang = 180 * (a1 - a2), mid = Math.sin(Math.PI * clamp(Math.abs(ang) / 180, 0, 1))
  const lift = 1 + .06 * mid
  const idle = Math.sin(2 * Math.PI * t / DUR)
  const intro = spring(seg(t, 0, .8), 6, 11)
  flip.style.transform = `translateZ(${(mid * 90).toFixed(1)}px) scale(${(lift * lerp(.9, 1, intro)).toFixed(4)}) rotateY(${ang.toFixed(2)}deg) rotateX(${(mid * -5 + idle * 1.2).toFixed(2)}deg)`
  pr.style.opacity = eo(seg(t, 0, .3)).toFixed(3)
  S(shadow, { opacity: (.75 - .25 * mid).toFixed(3), transform: `scaleX(${(1 - .12 * mid).toFixed(3)})` })
  // switch
  const s = clamp(ang / 180, 0, 1.05)
  S(knob, { left: px(6 + 204 * s), width: '204px' }); sA.style.color = s < .5 ? '#14141c' : '#fff'; sB.style.color = s < .5 ? '#fff' : '#14141c'
  // finger
  const press1 = seg(t, TAP1 - .14, TAP1) * (1 - seg(t, TAP1 + .05, TAP1 + .22)), press2 = seg(t, TAP2 - .14, TAP2) * (1 - seg(t, TAP2 + .05, TAP2 + .22))
  const pressed = Math.max(press1, press2)
  const fa1 = seg(t, .35, .6) * (1 - seg(t, 1.3, 1.6)), fa2 = seg(t, 3.5, 3.75) * (1 - seg(t, 4.5, 4.8))
  const mv = eio(seg(t, .3, TAP1 - .05)) , mv2 = eio(seg(t, 3.45, TAP2 - .05))
  const fx = t < 2.5 ? lerp(FX + 220, FX, mv) : lerp(FX + 220, FX, mv2), fy = t < 2.5 ? lerp(FY + 260, FY, mv) : lerp(FY + 260, FY, mv2)
  S(fin, { left: px(fx), top: px(fy), opacity: Math.max(fa1, fa2).toFixed(3), transform: `scale(${(1 - .2 * pressed).toFixed(3)})` })
  const rp = t < 2.5 ? (t < TAP1 ? -1 : seg(t, TAP1, TAP1 + .6)) : (t < TAP2 ? -1 : seg(t, TAP2, TAP2 + .6))
  const rr = rp >= 0 && rp < 1 ? lerp(38, 130, eo(rp)) : 0
  S(rip, { left: px(fx - rr), top: px(fy - rr), width: px(rr * 2), height: px(rr * 2), opacity: rr ? (.55 * (1 - rp)).toFixed(3) : 0, borderWidth: px(5 * (1 - (rp > 0 ? rp : 0)) + 1) })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
