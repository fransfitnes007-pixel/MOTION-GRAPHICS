<!doctype html>
<html><head><meta charset="utf-8"><title>Copy button</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fdfdfd}
.cb{position:absolute;left:0;top:0;width:164px;height:64px;border-radius:14px;background:#fff;border:1px solid #e4e4e6;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);color:#2b2b2e;font-weight:600;font-size:22px}
.cb .ic{position:absolute;left:24px;top:22px;width:20px;height:20px}
.cb .ic svg{position:absolute;left:0;top:0;width:20px;height:20px;fill:none;stroke:#2b2b2e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb .tx{position:absolute;left:62px;top:0;height:62px;line-height:62px;white-space:nowrap}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  idleLabel: 'Copy',          // text before the click
  doneLabel: 'Copied',        // text after the click
  clickAt: 1.15,              // when the cursor clicks (seconds)
  resetAfter: 2.3,            // how long "Copied" stays before it goes back
  swapSec: .22,               // label crossfade
  drawSec: .3,                // check stroke draw time
  buttonFill: '#ffffff', hoverFill: '#f6f6f7',
}
const DUR = 5.6
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const K2 = Math.min(W / 164, H / 64) * .22
const wrap = el('div', 'abs'); S(wrap, { left: px(CX - 82 * K2), top: px(CY - 32 * K2), width: '164px', height: '64px', transformOrigin: '0 0', transform: `scale(${K2})` })
const btn = el('div', 'cb', wrap)
const ic = el('div', 'ic', btn)
const svgNS = 'http://www.w3.org/2000/svg'
const mk = (inner) => { const s = document.createElementNS(svgNS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = inner; ic.appendChild(s); return s }
const copyIc = mk('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>')
const checkIc = mk('<path d="M4 12.5l5 5L20 6.5" pathLength="1" stroke-dasharray="1" />')
const chk = checkIc.firstChild
const tx1 = el('div', 'tx', btn, CONFIG.idleLabel), tx2 = el('div', 'tx', btn, CONFIG.doneLabel)
const cur = makeCursor(wrap)
const cp = [[0, 250, 140], [.8, 118, 44], [2.6, 118, 44], [3.2, 250, 118], [DUR, 250, 118]]
function render(t) {
  const c0 = CONFIG.clickAt, c1 = c0 + CONFIG.resetAfter
  const done = t >= c0 && t < c1
  const a = clamp((t - c0) / CONFIG.swapSec), b = clamp((t - c1) / CONFIG.swapSec)
  const m = t < c0 ? 0 : t < c1 ? eo(a) : 1 - eo(b)         // 0 idle look, 1 copied look
  S(copyIc, { opacity: 1 - m, transform: `scale(${1 - .3 * m})` })
  S(checkIc, { opacity: m > 0 ? 1 : 0 })
  const dr = t < c0 ? 0 : t < c1 ? eo(clamp((t - c0) / CONFIG.drawSec)) : 1 - eo(b)
  chk.style.strokeDashoffset = String(1 - dr)
  S(tx1, { opacity: 1 - m, transform: `translateY(${-5 * m}px)`, filter: `blur(${m * 2}px)` })
  S(tx2, { opacity: m, transform: `translateY(${5 * (1 - m)}px)`, filter: `blur(${(1 - m) * 2}px)` })
  const [x, y] = kfp(t, cp)
  const over = x > 0 && x < 164 && y > 0 && y < 64
  btn.style.background = over ? CONFIG.hoverFill : CONFIG.buttonFill
  const press = t > c0 - .06 && t < c0 + .12
  S(btn, { transform: `scale(${press ? .96 : 1})` })
  setCursor(cur, x, y, press)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
