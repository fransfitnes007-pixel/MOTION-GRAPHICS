<!doctype html>
<html><head><meta charset="utf-8"><title>Black chrome glass cards</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.haze{position:absolute;border-radius:9999px}
.grid{position:absolute;left:96px;top:130px;width:1088px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{position:relative;height:250px;border-radius:16px;padding:26px;
  --glass:255 255 255/.035;--glass-edge:255 255 255/.12;
  --glass-sheen:linear-gradient(158deg,rgb(255 255 255/.11) 0%,rgb(255 255 255/.035) 22%,rgb(255 255 255/0) 48%,rgb(255 255 255/.015) 72%,rgb(255 255 255/.06) 100%);
  --glass-shadow:inset 0 1px 0 rgb(255 255 255/.32),inset 0 -1px 0 rgb(255 255 255/.09),inset 1px 0 0 rgb(255 255 255/.07),inset -1px 0 0 rgb(255 255 255/.05),0 30px 60px -24px rgb(0 0 0/1),0 2px 6px rgb(0 0 0/.8);
  background:var(--glass-sheen),rgb(var(--glass));border:1px solid rgb(var(--glass-edge));box-shadow:var(--glass-shadow);
  color:#f4f4f5}
.card::before{content:"";position:absolute;inset:-1px;z-index:1;pointer-events:none;border-radius:inherit;padding:2px;
  --beam-light:255 255 255;
  background:conic-gradient(from var(--beam),transparent 0deg,transparent 190deg,rgb(var(--beam-light)/.18) 240deg,rgb(var(--beam-light)/.75) 285deg,rgb(var(--beam-light)/1) 300deg,rgb(var(--beam-light)/.75) 315deg,rgb(var(--beam-light)/.18) 350deg,transparent 360deg);
  filter:drop-shadow(0 0 7px rgb(var(--beam-light)/.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ico{width:38px;height:38px;border-radius:12px;background:linear-gradient(180deg,rgb(255 255 255/.16),rgb(255 255 255/.06));box-shadow:inset 0 1px 0 rgb(255 255 255/.22);border:1px solid rgb(255 255 255/.1)}
.t{font:600 19px -apple-system,'SF Pro Display',system-ui,sans-serif;margin-top:22px;letter-spacing:-.01em}
.l{height:9px;border-radius:5px;background:rgb(255 255 255/.10);margin-top:13px}
.kick{position:absolute;left:96px;top:62px;font:600 13px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgb(255 255 255/.5)}
.kick b{color:#fff;font-weight:600}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }
// a CSS-transition-like value: events [{t, to, dur, delay, ease}] each start from wherever the value was when they began (interrupts are continuous)
const animTo = (t, init, events, i = events.length - 1) => {
  if (i < 0) return init
  const e = events[i], start = e.t + (e.delay || 0)
  if (t < start) return animTo(t, init, events, i - 1)
  const from = animTo(start, init, events, i - 1), p = clamp((t - start) / e.dur)
  return from + (e.to - from) * (e.ease || EASE.easeOut)(p)
}

const DUR = 7
window.DUR = DUR
const box = fitBox(1280, 800, '#000')
// the page: pure black plus two long soft chrome arcs (.app-haze), here drifting once per loop instead of once per 72s
const h1 = el('div', 'haze', box), h2 = el('div', 'haze', box)
const VW = 1280 / 100
// the source blurs these 28px; a blur filter on a moving layer renders differently run to run, so the cut edge is feathered with a mask instead
S(h1, { webkitMaskImage: 'linear-gradient(to top, transparent 0, #000 40px)', maskImage: 'linear-gradient(to top, transparent 0, #000 40px)' }); S(h2, { webkitMaskImage: 'linear-gradient(to bottom, transparent 0, #000 40px)', maskImage: 'linear-gradient(to bottom, transparent 0, #000 40px)' })
S(h1, { width: 120 * VW + 'px', height: 46 * VW + 'px', left: -30 * VW + 'px', top: -34 * VW + 'px', background: 'radial-gradient(ellipse at 50% 100%, rgb(255 255 255 / 0.10) 0%, rgb(255 255 255 / 0.035) 30%, transparent 62%)' })
S(h2, { width: 110 * VW + 'px', height: 40 * VW + 'px', right: -28 * VW + 'px', bottom: -30 * VW + 'px', background: 'radial-gradient(ellipse at 50% 0%, rgb(255 255 255 / 0.07) 0%, rgb(255 255 255 / 0.025) 32%, transparent 62%)' })
el('div', 'kick', box, '<b>box.border</b> &nbsp;travelling light, 7s per turn')
const grid = el('div', 'grid', box)
const titles = ['Brief review', 'Team roster', 'Review queue', 'Billing schedule', 'Settings vault', 'Weekly read-out']
const cards = titles.map((t) => el('div', 'card', grid, `<div class="ico"></div><div class="t">${t}</div><div class="l" style="width:86%"></div><div class="l" style="width:64%"></div><div class="l" style="width:42%"></div>`))
// the stylesheet's nth-child phase offsets: 2n -2.3s, 3n -4.1s, 5n -5.6s (later rules win)
const delay = (n) => n % 5 === 0 ? -5.6 : n % 3 === 0 ? -4.1 : n % 2 === 0 ? -2.3 : 0
function render(t) {
  const p = (t / DUR) * 1  // DUR = 7s = one beam turn
  cards.forEach((c, i) => c.style.setProperty('--beam', (((t - delay(i + 1)) / 7) % 1 * 360).toFixed(2) + 'deg'))
  const w = Math.sin(p * Math.PI * 2)  // haze-a / haze-b: translate(6vw,3vw) rotate(-2deg), alternate
  S(h1, { transform: `translate(${(.5 - .5 * Math.cos(p * Math.PI * 2)) * 6 * VW}px,${(.5 - .5 * Math.cos(p * Math.PI * 2)) * 3 * VW}px) rotate(${-2 * (.5 - .5 * Math.cos(p * Math.PI * 2))}deg)` })
  S(h2, { transform: `translate(${-(.5 - .5 * Math.cos(p * Math.PI * 2)) * 6 * VW}px,${-(.5 - .5 * Math.cos(p * Math.PI * 2)) * 3 * VW}px) rotate(${2 * (.5 - .5 * Math.cos(p * Math.PI * 2))}deg)` })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
