<!doctype html>
<html><head><meta charset="utf-8"><title>extend-hq-file-upload-2</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#111}
.card{position:absolute;border:1px solid #e6e6e9;border-radius:22px;background:#fff}
.tile{position:absolute;width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid #e4e4e8;box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#8a8a93;letter-spacing:.03em}
.title{position:absolute;left:0;width:100%;text-align:center;font-size:17px;color:#0a0a0a}
.hint{position:absolute;left:0;width:100%;text-align:center;font-size:13.5px;color:#7a7a82}
.btn{position:absolute;height:34px;border:1px solid #e2e2e6;border-radius:17px;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;color:#6b6b73;background:#fff}
.frow{position:absolute;left:0;height:46px;border:1px solid #ececef;border-radius:11px;background:#fff;display:flex;align-items:center;gap:11px;padding:0 12px;font-size:13.5px}
.frow .ft{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff}
.frow .nm{font-weight:500;color:#111}
.frow .sz{color:#8a8a93;font-size:12px}
.chip{position:absolute;width:44px;height:54px;border-radius:7px;background:#fff;border:1px solid #d9d9de;box-shadow:0 8px 18px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#e5484d}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const U = Math.min(W / 1280, H / 800)   // the board below is 1280x800 and scaled to fit any ?w=&h=
const root = el('div', 'abs'); S(root, { left: px(CX - 640), top: px(CY - 400), width: '1280px', height: '800px', transform: `scale(${U})`, transformOrigin: '50% 50%' })

const CONFIG = {
  zoom: 1.55,                                  // the real component is only max-w-md (448px), so the board shows it larger
  title: 'Click to upload or drop files',
  hint: 'PDF, DOC/DOCX, XLSX, CSV, PNG, or JPG',
  button: 'Browse files',
  types: ['PDF', 'DOC', 'XLSX', 'CSV', 'PNG', 'JPG'],   // file-type labels that cycle on the tiles behind the icon
  cycle: .9,                                   // seconds per type
  beam: '#6f7bff',                             // border beam colour
  beamLen: 140,                                // beam length out of 1000 around the dashed border
  files: [{ n: 'Q3-report.pdf', s: '2.4 MB', k: 'PDF', c: '#e5484d' }, { n: 'pricing.xlsx', s: '148 KB', k: 'XLS', c: '#2f9e6b' }],
  dragIn: 1.3, drop: 2.6, clear: 6.4,          // seconds: file enters, file lands, list clears
}
const DUR = 8
window.DUR = DUR
root.style.transform = `scale(${U * CONFIG.zoom})`
const CW = 520, DZH = 300, PADC = 16
const card = el('div', 'card', root)
S(card, { left: px(640 - CW / 2), width: px(CW) })
const svgNS = 'http://www.w3.org/2000/svg'
const dz = document.createElementNS(svgNS, 'svg'); dz.style.cssText = `position:absolute;left:${PADC}px;top:${PADC}px;overflow:visible`; card.appendChild(dz)
dz.innerHTML = `<rect id="dash" x=".75" y=".75" rx="16" fill="none" stroke="#d2d2d8" stroke-width="1.5" stroke-dasharray="4 5"/><rect id="beam" x=".75" y=".75" rx="16" fill="none" stroke="${CONFIG.beam}" stroke-width="2.5" stroke-linecap="round" pathLength="1000" style="filter:drop-shadow(0 0 5px ${CONFIG.beam})"/>`
const dash = dz.querySelector('#dash'), beam = dz.querySelector('#beam')
dz.setAttribute('width', CW - 2 * PADC); dz.setAttribute('height', DZH); dash.setAttribute('width', CW - 2 * PADC - 1.5); dash.setAttribute('height', DZH - 1.5); beam.setAttribute('width', CW - 2 * PADC - 1.5); beam.setAttribute('height', DZH - 1.5)
const cx = CW / 2
const tiles = [0, 1, 2].map(() => el('div', 'tile', card))
tiles[2].innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V4m-3 3 3-3 3 3"/><path d="M14 4h2a3 3 0 0 1 3 3v6l-5 5H8a3 3 0 0 1-3-3v-1"/><path d="M19 13h-3a2 2 0 0 0-2 2v3"/></svg>`
const title = el('div', 'title', card, CONFIG.title), hint = el('div', 'hint', card, CONFIG.hint)
const btn = el('div', 'btn', card, `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m-4 4 4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>${CONFIG.button}`)
const rows = CONFIG.files.map((f) => el('div', 'frow', card, `<div class="ft" style="background:${f.c}">${f.k}</div><div><div class="nm">${f.n}</div><div class="sz">${f.s}</div></div><div style="margin-left:auto;color:#9a9aa2;font-size:16px;padding-right:2px">&times;</div>`))
const chip = el('div', 'chip', root, 'PDF')
// scripted cursor: keys = [{t, x, y, click?}], eased between keys; a click shows a short press ring
const cursorEl = el('div', 'abs', root, '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.8L10.4 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>')
const ringEl = el('div', 'abs', root); S(ringEl, { width: '34px', height: '34px', marginLeft: '-17px', marginTop: '-17px', borderRadius: '50%', border: '2px solid rgba(120,120,140,.6)', pointerEvents: 'none' })
function cursorAt(t, keys) {
  let i = 0; while (i < keys.length - 1 && t >= keys[i + 1].t) i++
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)]
  const k = b === a ? 0 : eio(seg(t, a.t, b.t))
  let press = 0; for (const q of keys) if (q.click && t >= q.t && t < q.t + .35) press = 1 - (t - q.t) / .35
  return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), press }
}
function drawCursor(c) {
  S(cursorEl, { left: px(c.x - 5), top: px(c.y - 3), transform: `scale(${1 - .12 * c.press})`, zIndex: 99 })
  S(ringEl, { left: px(c.x), top: px(c.y), opacity: c.press * .9, transform: `scale(${.5 + (1 - c.press) * 1.2})`, zIndex: 98 })
}


const keys = [{ t: 0, x: 1000, y: 700 }, { t: CONFIG.dragIn, x: 980, y: 560 }, { t: CONFIG.drop - .15, x: 640, y: 400 }, { t: CONFIG.drop, x: 640, y: 400 }, { t: 3.6, x: 900, y: 640 }, { t: 8, x: 1000, y: 700 }]

function render(t) {
  const hov = seg(t, CONFIG.dragIn + .4, CONFIG.drop - .1) * (1 - seg(t, CONFIG.drop, CONFIG.drop + .25))     // 1 while a file is over the zone
  const dropP = seg(t, CONFIG.drop, CONFIG.drop + .5)
  const listP = (t < CONFIG.clear ? 1 : 1 - eo(seg(t, CONFIG.clear, CONFIG.clear + .5))) * dropP
  const listH = CONFIG.files.length * 54
  const cardH = DZH + 2 * PADC + listH * eo(listP) + (listP > 0 ? 6 : 0)
  S(card, { height: px(cardH), top: px(400 - (DZH + 2 * PADC) / 2 - listH * eo(listP) / 2) })
  // border beam runs while a file is over the zone, and for a moment after the drop
  const bv = Math.max(hov, 1 - seg(t, CONFIG.drop, CONFIG.drop + .6)) * (t >= CONFIG.dragIn + .3 && t < CONFIG.drop + .6 ? 1 : 0)
  beam.setAttribute('stroke-dasharray', `${CONFIG.beamLen} ${1000 - CONFIG.beamLen}`)
  beam.setAttribute('stroke-dashoffset', -((t * 520) % 1000)); beam.style.opacity = bv
  dash.setAttribute('stroke', hov > 0 ? '#aab0ff' : '#d2d2d8')
  // tiles: three stacked, the two behind cycle file-type labels
  const k = hov
  const spread = 22 + 20 * k, rot = 7 + 9 * k
  const ty = 82 - 4 * k
  const ci = Math.floor(t / CONFIG.cycle), cp = eo(seg(t % CONFIG.cycle, 0, .35))
  const L = (n) => CONFIG.types[((ci + n) % CONFIG.types.length + CONFIG.types.length) % CONFIG.types.length]
  tiles[0].textContent = L(0); tiles[1].textContent = L(1)
  const bob = Math.sin(t * 2.4) * 1.5
  S(tiles[0], { left: px(cx - 28 - spread), top: px(PADC + ty + 6 + bob), transform: `rotate(${-rot}deg) scale(${.95 + .05 * (1 - cp)})`, opacity: .6 + .4 * cp })
  S(tiles[1], { left: px(cx - 28 + spread), top: px(PADC + ty + 6 - bob), transform: `rotate(${rot}deg) scale(${.95 + .05 * cp})`, opacity: 1 - .4 * cp })
  S(tiles[2], { left: px(cx - 28), top: px(PADC + ty - 4 * k - 2), width: '62px', height: '62px', marginLeft: '-3px', transform: `scale(${1 + .06 * k})`, zIndex: 3 })
  S(title, { top: px(PADC + 170) }); S(hint, { top: px(PADC + 200) })
  S(btn, { left: px(cx - 105), top: px(PADC + 236), width: '210px', justifyContent: 'center' })
  title.textContent = hov > .1 ? 'Drop to upload' : CONFIG.title
  rows.forEach((r, i) => {
    const pi = eo(seg(listP, 0, 1)) * (t >= CONFIG.drop ? 1 : 0) * seg(t - CONFIG.drop, .2 * i, .2 * i + .3 + (t > CONFIG.clear ? 99 : 0))
    S(r, { left: px(PADC), width: px(CW - 2 * PADC), top: px(DZH + 2 * PADC + 2 + i * 54), opacity: Math.min(listP * 3, 1) * (t < CONFIG.clear ? eo(seg(t - CONFIG.drop, .2 * i, .2 * i + .3)) : 1), transform: `translateY(${(1 - Math.min(1, eo(seg(t - CONFIG.drop, .2 * i, .2 * i + .35)))) * 10}px)` })
  })
  // the dragged file chip follows the cursor until it lands
  const c = cursorAt(t, keys)
  const carry = t >= CONFIG.dragIn - .8 && t < CONFIG.drop ? 1 : 0
  S(chip, { left: px(c.x + 6), top: px(c.y + 8), opacity: carry, transform: 'rotate(-6deg)', zIndex: 90 })
  drawCursor(c)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
