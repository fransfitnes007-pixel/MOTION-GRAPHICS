<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#171717}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:500;border-radius:10px;white-space:nowrap}
.cur{position:absolute;width:26px;height:26px;pointer-events:none}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  trigger: 'Onboarding',                                             // label on the page button that opens the dialog
  steps: [                                                           // one entry per dialog step: heading + body text
    { title: 'Welcome to the app', body: 'Discover a powerful collection of components designed to enhance your workflow.' },
    { title: 'Customizable Components', body: 'Each component is fully customizable and built with modern web standards in mind.' },
    { title: 'Ready to Start?', body: 'Begin building amazing interfaces with our comprehensive component library.' },
    { title: 'Get Support', body: 'Access our extensive documentation and community resources to get the most out of it.' },
  ],
  skipLabel: 'Skip', nextLabel: 'Next', doneLabel: 'Okay',
  // timeline in seconds: click trigger, then one click on Next per entry, then click the X
  clickTrigger: 0.9, nextClicks: [2.0, 2.8], clickClose: 4.0,
  overlay: 'rgba(0,0,0,.83)',   // dim layer behind the dialog
  accent: '#171717',            // Next button and active dot colour
  heroTop: '#1d1d20', heroBottom: '#3b3b44',   // hero image gradient (placeholder for a picture)
  dialogW: 740,                 // dialog width px (design box is 1216x1026)
}
const DUR = 5.4
window.DUR = DUR
const BW = 1216, BH = 1026
const U = Math.min(W / BW, H / BH)
const root = el('div', 'abs', stage)
S(root, { left: '50%', top: '50%', width: BW + 'px', height: BH + 'px', marginLeft: -BW / 2 + 'px', marginTop: -BH / 2 + 'px', transform: `scale(${U})`, overflow: 'hidden' })
stage.style.background = '#fff'
// page behind: one outline button
const trig = el('div', 'btn', root, CONFIG.trigger)
S(trig, { left: px(BW / 2 - 70), top: px(BH / 2 - 28), width: '140px', height: '56px', border: '1.5px solid #d4d4d4', fontSize: '19px', background: '#fff', boxShadow: '0 1px 2px rgba(0,0,0,.06)' })
const ov = el('div', 'abs', root); S(ov, { inset: '0', background: CONFIG.overlay })
const dlg = el('div', 'abs', root)
const DW = CONFIG.dialogW, DH = 747
S(dlg, { left: px((BW - DW) / 2), top: px((BH - DH) / 2), width: px(DW), height: px(DH), background: '#fff', borderRadius: '18px', boxShadow: '0 20px 60px rgba(0,0,0,.35)', overflow: 'hidden', border: '1px solid #e5e5e5' })
// hero: dark gradient with a grey ring
const hero = el('div', 'abs', dlg); S(hero, { left: '15px', top: '15px', right: '15px', height: '399px', borderRadius: '13px', overflow: 'hidden', background: `linear-gradient(180deg, ${CONFIG.heroTop}, ${CONFIG.heroBottom})` })
for (let i = 0; i < 9; i++) { const l = el('div', 'abs', hero); S(l, { left: px(70 + i * 70), top: '30px', width: '1px', height: '300px', background: 'linear-gradient(180deg,transparent,rgba(255,255,255,.07),transparent)' }) }
const ring = el('div', 'abs', hero); S(ring, { left: px(353 - 82), top: px(195 - 82), width: '164px', height: '164px', borderRadius: '50%', background: 'linear-gradient(160deg,#76767e,#4a4a52 70%)', boxShadow: '0 24px 40px rgba(0,0,0,.35)' })
const hole = el('div', 'abs', ring); S(hole, { left: '47px', top: '47px', width: '70px', height: '70px', borderRadius: '50%', background: 'linear-gradient(160deg,#2c2c31,#45454c)', boxShadow: 'inset 0 4px 10px rgba(0,0,0,.45)' })
const xic = el('div', 'abs', dlg, '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9c9cf" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'); S(xic, { right: '30px', top: '30px' })
const title = el('div', 'abs', dlg); S(title, { left: '47px', top: '460px', fontSize: '27px', fontWeight: '600', letterSpacing: '-.01em' })
const body = el('div', 'abs', dlg); S(body, { left: '47px', top: '516px', width: px(DW - 94), fontSize: '21px', lineHeight: '37px', color: '#737373' })
const dots = CONFIG.steps.map((_, i) => { const d = el('div', 'abs', dlg); S(d, { left: px(51 + i * 22.4), top: '662px', width: '11px', height: '11px', borderRadius: '50%', background: CONFIG.accent }); return d })
const skip = el('div', 'btn', dlg, CONFIG.skipLabel); S(skip, { left: px(DW - 372), top: '635px', width: '112px', height: '67px', fontSize: '22px' })
const next = el('div', 'btn', dlg, `<span id="nl">${CONFIG.nextLabel}</span><svg id="na" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:12px;opacity:.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`)
S(next, { left: px(DW - 232), top: '635px', width: '152px', height: '67px', fontSize: '22px', background: CONFIG.accent, color: '#fff' })
const nl = next.querySelector('#nl'), na = next.querySelector('#na')
const cur = el('div', 'cur', root)
const ARROW = '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
cur.innerHTML = ARROW
function render(t) {
  const C = CONFIG
  const open = seg(t, C.clickTrigger + .05, C.clickTrigger + .3) * (1 - seg(t, C.clickClose + .05, C.clickClose + .3))
  const nClicks = C.nextClicks.filter((c) => t >= c).length
  const step = Math.min(nClicks, C.steps.length - 1)
  S(ov, { opacity: open }); vis(ov, open > 0)
  vis(dlg, open > 0)
  S(dlg, { opacity: open, transform: `scale(${.95 + .05 * eo(open)})` })
  title.textContent = C.steps[step].title
  body.textContent = C.steps[step].body
  dots.forEach((d, i) => S(d, { opacity: i === step ? 1 : .2 }))
  const last = step === C.steps.length - 1
  nl.textContent = last ? C.doneLabel : C.nextLabel
  vis(na, !last)
  // pointer path
  const trigXY = [BW / 2 + 20, BH / 2 + 6]
  const nextXY = [(BW - DW) / 2 + DW - 232 + 100, (BH - DH) / 2 + 635 + 34]
  const closeXY = [(BW - DW) / 2 + DW - 30 - 10, (BH - DH) / 2 + 30 + 14]
  const home = [900, 840]
  const pts = [
    [0, home], [C.clickTrigger - .4, trigXY], [C.clickTrigger + .3, trigXY], [C.nextClicks[0] - .6, nextXY], [C.nextClicks[C.nextClicks.length - 1] + .3, nextXY],
    [C.clickClose - .5, closeXY], [C.clickClose + .3, closeXY], [C.clickClose + 1.0, home], [DUR, home],
  ]
  let X = home[0], Y = home[1]
  for (let i = 0; i < pts.length - 1; i++) {
    const [ta, pa] = pts[i], [tb, pb] = pts[i + 1]
    if (t >= ta && t <= tb) { const e = eio(seg(t, ta, tb)); X = lerp(pa[0], pb[0], e); Y = lerp(pa[1], pb[1], e) }
  }
  // click dip
  const clicks = [C.clickTrigger, ...C.nextClicks, C.clickClose]
  let dip = 0
  clicks.forEach((c) => { dip = Math.max(dip, 1 - seg(Math.abs(t - c - .04), 0, .09)) })
  S(cur, { left: px(X), top: px(Y), transform: `scale(${1 - .18 * dip})` })
  // next button press feedback
  let pr = 0; C.nextClicks.forEach((c) => { pr = Math.max(pr, 1 - seg(Math.abs(t - c - .04), 0, .1)) })
  S(next, { transform: `scale(${1 - .04 * pr})` })
  S(trig, { transform: `scale(${1 - .04 * Math.max(0, 1 - seg(Math.abs(t - C.clickTrigger - .04), 0, .1))})` })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
