<!doctype html>
<html><head><meta charset="utf-8"><title>DEMO</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#fff;color:#0a0a0a}
.tx{position:absolute;white-space:nowrap}
.cur{position:absolute;width:26px;height:26px;pointer-events:none}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  label: 'Name',                         // caption above the field
  placeholder: 'Enter your name',        // shown while the field is empty
  typed: 'Alex Morgan',                  // text the demo types
  accent: '#0485f7',                     // focus ring colour
  clickLabel: 1.1,                       // pointer clicks the label (focuses the field)
  typeFrom: 1.7, typeStep: 0.09,         // typing starts here, seconds per character
  clickAway: 4.3,                        // pointer clicks outside (blurs the field)
  inputW: 513, inputH: 73,               // field size in px (design box 850x650, drawn at 2x: w-64 = 256 css px)
}
const DUR = 6.2
window.DUR = DUR
const BW = 850, BH = 650
const U = Math.min(W / BW, H / BH)
const root = el('div', 'abs', stage); S(root, { left: '50%', top: '50%', width: BW + 'px', height: BH + 'px', marginLeft: -BW / 2 + 'px', marginTop: -BH / 2 + 'px', transform: `scale(${U})` })
const L = 208, IW = CONFIG.inputW, IH = CONFIG.inputH, IT = 310
const lab = el('div', 'tx', root, CONFIG.label); S(lab, { left: px(L), top: '264px', fontSize: '27px', fontWeight: '500' })
const inp = el('div', 'tx', root); S(inp, { left: px(L), top: px(IT), width: px(IW), height: px(IH), borderRadius: px(IH / 2), background: '#fff', boxShadow: '0 1px 2px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.08)', border: '1px solid #f1f1f2' })
const ph = el('div', 'tx', inp, CONFIG.placeholder); S(ph, { left: '24px', top: '0', height: px(IH - 2), display: 'flex', alignItems: 'center', fontSize: '27px', color: '#707076' })
const tx = el('div', 'tx', inp); S(tx, { left: '24px', top: '0', height: px(IH - 2), display: 'flex', alignItems: 'center', fontSize: '27px' })
const caret = el('div', 'tx', inp); S(caret, { top: '19px', width: '2px', height: '34px', background: '#0a0a0a' })
const ring = el('div', 'tx', root); S(ring, { left: px(L - 3), top: px(IT - 3), width: px(IW + 6), height: px(IH + 6), borderRadius: px((IH + 6) / 2), border: `3px solid ${CONFIG.accent}`, pointerEvents: 'none' })
const cur = el('div', 'cur', root, '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>')
const meas = el('span', 'tx', stage); S(meas, { visibility: 'hidden', fontSize: '27px' })
const widthOf = (s) => { meas.textContent = s || ''; return meas.offsetWidth }

function render(t) {
  const C = CONFIG
  const focus = eo(seg(t, C.clickLabel + .04, C.clickLabel + .2)) * (1 - eo(seg(t, C.clickAway + .04, C.clickAway + .2)))
  const n = clamp(Math.floor((t - C.typeFrom) / C.typeStep) + 1, 0, C.typed.length)
  const fade = 1 - seg(t, DUR - .5, DUR - .1)                 // clears at the end of the loop
  const shown = C.typed.slice(0, n)
  tx.textContent = shown; S(tx, { opacity: fade })
  S(ph, { opacity: shown ? 0 : 1 })
  S(ring, { opacity: focus }); vis(ring, focus > 0)
  S(inp, { borderColor: focus > 0 ? 'transparent' : '#f1f1f2' })
  const blink = (Math.floor(t * 2) % 2) === 0 || (t - C.typeFrom) < C.typed.length * C.typeStep + .2 && n > 0 && n < C.typed.length
  S(caret, { left: px(24 + widthOf(shown)), opacity: focus > .5 && blink ? 1 : 0 })
  // pointer: to the label, click, rest beside the field while typing, click away
  const P = [[0, 700, 540], [C.clickLabel - .55, 246, 296], [C.clickLabel + .15, 246, 296], [C.clickLabel + .7, 640, 470], [C.clickAway - .6, 640, 470], [C.clickAway - .0, 720, 560], [DUR, 760, 600]]
  let X = P[0][1], Y = P[0][2]
  for (let i = 0; i < P.length - 1; i++) if (t >= P[i][0] && t <= P[i + 1][0] && P[i + 1][0] > P[i][0]) { const e = eio(seg(t, P[i][0], P[i + 1][0])); X = lerp(P[i][1], P[i + 1][1], e); Y = lerp(P[i][2], P[i + 1][2], e) }
  const dip = (c) => 1 - seg(Math.abs(t - c - .05), 0, .1)
  S(cur, { left: px(X), top: px(Y), transform: `scale(${1 - .15 * Math.max(dip(C.clickLabel), dip(C.clickAway))})`, opacity: seg(t, 0, .12) * fade })
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
