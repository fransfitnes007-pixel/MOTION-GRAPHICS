  S(b2, { left: (420 + 50 * Math.cos(ph * 1.1)) + 'px', top: (150 + 40 * Math.sin(ph)) + 'px' })
  S(b3, { left: (200 + 80 * Math.sin(ph * .6)) + 'px', top: (260 + 20 * Math.cos(ph)) + 'px' })
  const p = pulse(t); S(ring, { transform: `scale(${p.s})`, opacity: p.o })
  S(ov, { display: muted ? 'grid' : 'none' })
  S(prog, { display: muted ? 'block' : 'none' }); S(progIn, { width: (vt / 30 * 100) + '%' })
  S(ctl, { display: muted ? 'none' : 'flex' }); sc.style.width = (vt / 30 * 100) + '%'; tm.textContent = `0:0${Math.floor(vt)} / 0:30`
  // pointer glides to the pill and taps
  const a = E_EASEINOUT(seg(t, 2.6, 4.0)), out = E_EASEINOUT(seg(t, 4.7, 5.6))
  const x = lerp(lerp(980, TAP.x, a), 1100, out), y = lerp(lerp(560, TAP.y + 8, a), 640, out)
  S(cur, { left: x + 'px', top: y + 'px', display: t >= 2.6 && t < 5.6 ? 'block' : 'none', transform: t >= CLICK && t < CLICK + .12 ? 'scale(.85)' : 'scale(1)' })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
