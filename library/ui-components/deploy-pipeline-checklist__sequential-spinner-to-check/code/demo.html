<!doctype html>
<html><head><meta charset="utf-8"><title>Deploy pipeline checklist</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#0b0b0b;color:#eee}
.pn{position:absolute;left:0;top:0;width:697px;height:782px;border-radius:40px;background:#1a1a1a;border:1px solid #252525}
.tt{position:absolute;left:66px;top:34px;font-size:28px;font-weight:700;letter-spacing:-.01em;color:#f3f3f3;white-space:nowrap}
.sb{position:absolute;left:28px;top:75px;font-size:18px;color:#979797}
.xb{position:absolute;left:622px;top:32px;width:34px;height:34px;border-radius:50%;background:#222;display:grid;place-items:center}
.rw{position:absolute;left:28px;width:641px;height:95px;border-radius:30px;background:#131313}
.ic{position:absolute;left:17px;top:17px;width:62px;height:62px;border-radius:20px;background:#222;display:grid;place-items:center}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt{position:absolute;left:100px;top:22px;font-size:23px;font-weight:600;letter-spacing:.005em;white-space:nowrap}
.rd{position:absolute;left:100px;top:54px;font-size:17px;color:#8e8e8e;white-space:nowrap}
.st{position:absolute;left:585px;top:28px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ft{position:absolute;left:28px;top:693px;width:641px;height:62px;border-radius:31px;background:#262626;display:flex;align-items:center;justify-content:center;gap:16px;font-size:22px;font-weight:600;color:#dcdcdc}
/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
const CONFIG = {
  title: 'CI/CD Pipeline Protocol', subtitle: 'Execute build and deployment stages sequentially.',
  stages: [   // title, description, icon, [start, end] seconds of the "running" state
    ['Cloning Repository', 'Fetch latest codebase revision from Git source remote.', 'git', [-1, .7]],
    ['Installing Dependencies', 'Run package setup scripts and verify security signatures.', 'down', [.7, 3.0]],
    ['Making Optimized Builds', 'Compile production bundles and minify assets.', 'cpu', [3.0, 5.0]],
    ['Generating Registry', 'Assemble component configurations and output registry files.', 'layers', [5.0, 6.7]],
    ['Copying Files & Deploying', 'Distribute production bundles to serverless web nodes.', 'copy', [6.7, 8.3]],
  ],
  running: 'Deploying Pipeline...', finished: 'Pipeline Deployed',
  resetAt: 10.2,         // seconds: everything goes back to pending so the demo loops
  checkSec: .35,         // check draw and fill time
  spinSec: .85,          // one turn of the spinner
}
const DUR = 11
window.DUR = DUR
// ---- helpers: keyframe interpolation and a scripted cursor ----
// kf(t, [[time, value], ...]) eases between values; kfp does the same for [time, x, y] points.
const kf = (t, pts, ease = eio) => {
  if (t <= pts[0][0]) return pts[0][1]
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])) }
  return pts[pts.length - 1][1]
}
const kfp = (t, pts, ease = eio) => [kf(t, pts.map((p) => [p[0], p[1]]), ease), kf(t, pts.map((p) => [p[0], p[2]]), ease)]
const CURSOR_SVG = '<svg width="22" height="26" viewBox="0 0 22 26"><path d="M3.5 2.5v17l4.6-4 3.2 7 3-1.4-3.2-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
const makeCursor = (parent) => { const c = el('div', 'cursor', parent, CURSOR_SVG); S(c, { position: 'absolute', left: '0', top: '0', pointerEvents: 'none', zIndex: 99, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,.35))' }); return c }
const setCursor = (c, x, y, down = false, on = true) => S(c, { display: on ? '' : 'none', transform: `translate(${x - 3}px,${y - 2}px) scale(${down ? .86 : 1})` })
// fit(): put a fixed-size design box in the middle of the stage, scaled to fit.
const fitBox = (dw, dh, fill = .86) => { const k = Math.min(W / dw, H / dh) * fill; const box = el('div', 'abs'); S(box, { width: dw + 'px', height: dh + 'px', left: px(CX - dw * k / 2), top: px(CY - dh * k / 2), transformOrigin: '0 0', transform: `scale(${k})` }); return box }

const IC = {
  git: '<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  down: '<path d="M12 3v11M7 10l5 5 5-5"/><rect x="5" y="17" width="14" height="4" rx="1" fill="currentColor"/>',
  cpu: '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  layers: '<path d="M12 3 3 8l9 5 9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".6"/>',
  copy: '<rect x="3" y="7" width="11" height="14" rx="2" fill="currentColor" opacity=".55"/><rect x="10" y="3" width="11" height="14" rx="2" fill="currentColor"/>',
}
const box = fitBox(697, 782, .9)
const pn = el('div', 'pn', box)
el('div', 'tt', pn, CONFIG.title); el('div', 'sb', pn, CONFIG.subtitle)
el('div', '', pn, '<svg width="28" height="28" viewBox="0 0 24 24" fill="#9a9a9a"><path d="M12 2c.6 5 2.5 8.4 10 10-7.5 1.6-9.4 5-10 10-.6-5-2.5-8.4-10-10 7.5-1.6 9.4-5 10-10z"/></svg>').style.cssText = 'position:absolute;left:26px;top:34px'
el('div', 'xb', pn, '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>')
const NS = 'http://www.w3.org/2000/svg'
const rows = CONFIG.stages.map((s, i) => {
  const r = el('div', 'rw', pn); r.style.top = 112 + i * 114 + 'px'
  const ic = el('div', 'ic', r, `<svg viewBox="0 0 24 24">${IC[s[2]]}</svg>`)
  const t = el('div', 'rt', r, s[0]); el('div', 'rd', r, s[1])
  const st = el('div', 'st', r)
  st.innerHTML = `<div class="dot" style="width:16px;height:16px;border-radius:50%;background:#2c2c2c;position:absolute"></div>
    <svg class="spin" width="30" height="30" viewBox="0 0 30 30" style="position:absolute;fill:none;stroke:#ddd;stroke-width:2.4;stroke-linecap:round"><path d="M15 4a11 11 0 1 1-9.5 5.5"/></svg>
    <div class="fill" style="position:absolute;inset:0;border-radius:50%;background:#fff"></div>
    <svg class="ck" width="22" height="22" viewBox="0 0 24 24" style="position:absolute;fill:none;stroke:#111;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" stroke-dasharray="1"/></svg>`
  return { r, ic, t, st, dot: st.querySelector('.dot'), spin: st.querySelector('.spin'), fill: st.querySelector('.fill'), ck: st.querySelector('.ck'), path: st.querySelector('.ck path') }
})
const ft = el('div', 'ft', pn)
const cur = makeCursor(box)
const cp = [[0, 800, 380], [1.2, 640, 300], [2.2, 630, 340], [3.2, 600, 400], [4.4, 650, 560], [5.5, 700, 500], [7, 760, 600], [9, 800, 640], [DUR, 800, 380]]
function render(t) {
  const reset = t >= CONFIG.resetAt
  let allDone = true
  rows.forEach((o, i) => {
    const [a, b] = CONFIG.stages[i][3]
    const done = !reset && t >= b, run = !reset && t >= a && t < b
    if (!done) allDone = false
    const q = done ? eo(clamp((t - b) / CONFIG.checkSec)) : 0
    const fade = reset ? 1 - eo(clamp((t - CONFIG.resetAt) / .5)) : 1
    S(o.fill, { opacity: q, transform: `scale(${.6 + .4 * q})` }); S(o.ck, { opacity: q > 0 ? 1 : 0 }); o.path.style.strokeDashoffset = String(1 - clamp((q - .25) / .75))
    S(o.spin, { opacity: run ? 1 : 0, transform: `rotate(${((t - a) / CONFIG.spinSec) * 360}deg)` })
    S(o.dot, { opacity: !run && !done ? 1 : 0, background: '#2d2d2d' })
    o.st.style.background = run || done ? (done ? 'transparent' : '#222') : '#222'
    const lit = run || done
    o.ic.style.color = lit ? '#fff' : '#858585'; o.t.style.color = lit ? '#f1f1f1' : '#cfcfcf'
    o.r.style.opacity = reset ? 1 : 1
  })
  const fin = !reset && t >= CONFIG.stages[CONFIG.stages.length - 1][3][1]
  ft.innerHTML = fin ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dcdcdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${CONFIG.finished}` : `<svg width="26" height="26" viewBox="0 0 30 30" style="transform:rotate(${(t / CONFIG.spinSec) * 360}deg);fill:none;stroke:#ddd;stroke-width:2.4;stroke-linecap:round"><path d="M15 4a11 11 0 1 1-9.5 5.5"/></svg>${CONFIG.running}`
  const [x, y] = kfp(t, cp); setCursor(cur, x, y)
}
// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
