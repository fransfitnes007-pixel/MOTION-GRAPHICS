<!doctype html>
<html><head><meta charset="utf-8"><title>iMessage typing bubbles</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f2f2f4;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
.pg{position:absolute;inset:0;background:#050509}
.card{position:absolute;left:280px;top:130px;width:440px;border-radius:16px;border:1px solid #1a1a2e;background:rgba(5,5,9,.6);padding:16px;font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#fff}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:14px;font-weight:600}
.hd span{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums}
.bar{margin-top:8px;height:6px;border-radius:9999px;background:rgb(255 255 255/.05);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9999px;background:#3b82f6;width:0}
.list{position:relative;margin-top:12px;height:140px}
.bb{position:absolute;left:0;border-radius:18px;background:#2C2C2E;padding:7px 12px;font:15px/1.3 -apple-system,'SF Pro Text',system-ui,sans-serif;letter-spacing:-.01em;color:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.bb .ck{flex-shrink:0}
.td{display:inline-flex;align-items:center;gap:5px;padding:5px 0}
.td i{display:block;width:8px;height:8px;border-radius:9999px;background:rgb(255 255 255/.6)}
.cap{position:absolute;left:0;right:0;bottom:60px;text-align:center;font:600 13px -apple-system,system-ui,sans-serif;color:rgb(255 255 255/.45);letter-spacing:.03em}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers (framer-motion style easing and springs, evaluated from t) ----
const bez = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let s = x; for (let i = 0; i < 8; i++) { const e = X(s) - x; if (Math.abs(e) < 1e-6) break; const d = (3 * ax * s + 2 * bx) * s + cx; if (Math.abs(d) < 1e-6) break; s -= e / d } return Y(s) }
}
const EASE = { linear: (x) => x, easeInOut: bez(.42, 0, .58, 1), easeOut: bez(0, 0, .58, 1), easeIn: bez(.42, 0, 1, 1), expo: bez(.16, 1, .3, 1), out: bez(0, 0, .58, 1) }
// keyframes that loop forever, like animate={{ x: [a, b, c] }} transition={{ duration, repeat: Infinity, ease, times, repeatDelay }}
const kf = (t, vals, o = {}) => {
  const { dur = 1, delay = 0, times, ease = EASE.easeInOut, repeatDelay = 0, repeat = true } = o
  let l = t - delay; if (l < 0) return vals[0]
  const per = dur + repeatDelay
  if (repeat) l = l % per; else l = Math.min(l, dur)
  if (l >= dur) return vals[vals.length - 1]
  const p = l / dur, n = vals.length - 1, tm = times || vals.map((_, i) => i / n)
  let i = 0; while (i < n - 1 && p > tm[i + 1]) i++
  const q = (p - tm[i]) / (tm[i + 1] - tm[i])
  return vals[i] + (vals[i + 1] - vals[i]) * ease(q)
}
// framer spring from 0 to 1 (stiffness, damping, mass), starting at t0
const sp = (t, k = 100, c = 10, m = 1, t0 = 0) => {
  const x = t - t0; if (x <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * x) * (Math.cos(wd * x) + (z * w0 / wd) * Math.sin(wd * x)) }
  if (z === 1) return 1 - Math.exp(-w0 * x) * (1 + w0 * x)
  const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s
  return 1 - (r2 * Math.exp(r1 * x) - r1 * Math.exp(r2 * x)) / (r2 - r1)
}
const mix = (a, b, p) => a + (b - a) * p
// design box: build at DW x DH and scale to fit whatever W x H the renderer asks for
const fitBox = (DW, DH, bg) => {
  const box = el('div', 'abs', stage); const FS = Math.min(W / DW, H / DH)
  S(box, { left: '0px', top: '0px', width: DW + 'px', height: DH + 'px', transformOrigin: '0 0', transform: `translate(${(W - DW * FS) / 2}px,${(H - DH * FS) / 2}px) scale(${FS})`, overflow: 'hidden' })
  if (bg) S(stage, { background: bg })
  return box
}
const $ = (e, q) => e.querySelector(q)
// drop Chrome's cached raster so a frame never depends on the one drawn before it (keeps render(t) pure with filters and transforms)
const fresh = (b) => { b.style.display = 'none'; void b.offsetHeight; b.style.display = '' }
// a CSS-transition-like value: events [{t, to, dur, delay, ease}] each start from wherever the value was when they began (interrupts are continuous)
const animTo = (t, init, events, i = events.length - 1) => {
  if (i < 0) return init
  const e = events[i], start = e.t + (e.delay || 0)
  if (t < start) return animTo(t, init, events, i - 1)
  const from = animTo(start, init, events, i - 1), p = clamp((t - start) / e.dur)
  return from + (e.to - from) * (e.ease || EASE.easeOut)(p)
}

const DUR = 10
window.DUR = DUR
const box = fitBox(1000, 640, '#050509')
el('div', 'pg', box)
const STAGES = ['Uploading your draft', 'Waiting for the reviewer', 'Opening the file', 'Reading frames and cuts', 'Transcribing what you say', 'Reading the text on screen', 'Scoring against the brief', 'Writing the fixes']
const STAGE_T = 1.1, T0 = .5, TYPE = .45, ROW = 33.5 + 3
const card = el('div', 'card', box)
const hdr = el('div', 'hd', card, '<b></b><span></span>'), title = $(hdr, 'b'), pctEl = $(hdr, 'span')
const bar = el('div', 'bar', card, '<i></i>'), barI = $(bar, 'i')
const list = el('div', 'list', card)
const tail = (side) => `<svg width="17" height="21" viewBox="0 0 17 21" style="position:absolute;bottom:0;left:-5px"><path d="M16.8 20.6c-4.8.4-9.6-1-12.9-4.2C1.6 14.2.2 11 0 7.4V0h11.3v11.2c0 3.6 2 7 5.5 9.4z" fill="#2C2C2E"/></svg>`
const check = '<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'
// finished bubbles (no tail) and current bubbles (tail, typing dots then the line); one of each per stage, shown or hidden by time
const fin = STAGES.map((s) => { const b = el('div', 'bb', list, check + s); b.style.transformOrigin = 'bottom left'; return b })
const cur = STAGES.map((s) => { const b = el('div', 'bb', list, tail() + '<span class="in" style="position:relative"></span>'); b.style.transformOrigin = 'bottom left'; return b })
const dots = (t) => `<span class="td">${[0, 1, 2].map((i) => `<i style="opacity:${kf(t, [.35, 1, .35], { dur: 1.1, delay: i * .16 }).toFixed(3)};transform:translateY(${kf(t, [0, -2.5, 0], { dur: 1.1, delay: i * .16 }).toFixed(2)}px)"></i>`).join('')}</span>`
el('div', 'cap', box, 'PopIn: spring stiffness 520, damping 30, mass .7, from scale .55 and y 10. Typing 450ms, then the text.')
// PopIn: initial { opacity 0, scale .55, y 10 } to { 1, 1, 0 } by spring; exit { opacity 0, scale .9, y -6 } in .15s
const pop = (ts) => { const q = sp(ts, 520, 30, .7); return { o: clamp(q * 1.0 / .6), s: .55 + .45 * q, y: (1 - q) * 10 } }   // framer fades opacity in the same spring; clamp keeps it from overshooting
const setPop = (e, ts, x, y) => { const p = pop(ts); S(e, { display: '', opacity: String(Math.min(1, p.o)), transform: `translate(${x}px,${y + p.y}px) scale(${p.s})` }) }
const setExit = (e, ts, x, y) => { const q = EASE.easeOut(clamp(ts / .15)); if (q >= 1) { vis(e, false); return } S(e, { display: '', opacity: String(1 - q), transform: `translate(${x}px,${y - 6 * q}px) scale(${1 - .1 * q})` }) }
function render(t) {
  const at = t < T0 ? 0 : Math.min(STAGES.length, Math.floor((t - T0) / STAGE_T) + 1)   // number of stages started, like the component's `at` counter
  const started = t < T0 ? -1 : Math.min(STAGES.length - 1, Math.floor((t - T0) / STAGE_T))
  const done = t >= T0 + STAGES.length * STAGE_T
  const finished = Math.min(STAGES.length, t < T0 ? 0 : Math.floor((t - T0) / STAGE_T))   // stages completed so far
  const pct = Math.round(Math.min(1, finished / STAGES.length) * 100)
  title.textContent = done ? 'Review finished' : 'Reviewing your draft'; pctEl.textContent = pct + '%'
  S(barI, { width: (animTo(t, 0, STAGES.map((_, i) => ({ t: T0 + (i + 1) * STAGE_T, to: (i + 1) / STAGES.length * 100, dur: .4, ease: EASE.easeInOut })))).toFixed(2) + '%' })
  // finished list shows the last three
  const lo = Math.max(0, finished - 3)
  fin.forEach((b, j) => {
    const born = T0 + (j + 1) * STAGE_T, gone = T0 + (j + 4) * STAGE_T   // pops in when stage j completes, leaves when a fourth newer one arrives
    if (t < born || j >= finished) return vis(b, false)
    if (j < lo) { if (t < gone + .15) setExit(b, t - gone, 0, (j - Math.max(0, finished - 4)) * ROW); else vis(b, false); return }
    setPop(b, t - born, 0, (j - lo) * ROW)
  })
  // current: typing for 450ms, then the line pops in (the dots exit .15s first, mode="wait")
  cur.forEach((b, j) => {
    const born = T0 + j * STAGE_T, end = born + STAGE_T
    if (t < born || t >= end || done) return vis(b, false)
    const ts = t - born, y = (finished - lo) * ROW
    const inn = $(b, '.in')
    if (ts < TYPE) { inn.innerHTML = dots(ts); setPop(b, ts, 0, y) }
    else if (ts < TYPE + .15) { inn.innerHTML = dots(ts); setExit(b, ts - TYPE, 0, y) }
    else { inn.textContent = STAGES[j] + '...'; setPop(b, ts - TYPE - .15, 0, y) }
  })
  fresh(box)
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
