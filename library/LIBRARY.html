*{box-sizing:border-box;margin:0}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 24px 12px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:21px;letter-spacing:-.02em;font-weight:700}
#count{color:var(--mute);font-variant-numeric:tabular-nums}
#q{display:block;width:100%;max-width:560px;margin:12px 0 10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}
#q:focus{border-color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button.f{border:0;background:var(--chip);color:var(--ink);padding:5px 11px;border-radius:999px;font:500 13px inherit;font-family:inherit;cursor:pointer}

#tags{max-height:62px;overflow:auto}

main{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:20px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumb .snd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;background:linear-gradient(135deg,#1c1c24,#35354a)}
.body{padding:11px 13px 13px}
.v{font-weight:650;letter-spacing:-.01em}
.c{color:var(--accent);font-size:13px;margin-top:1px}
.s{color:var(--mute);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#empty{display:none;padding:60px 24px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--shade)}
dialog video{display:block;width:100%;max-height:60vh;background:#000}
.dbody{padding:16px 20px 20px}
.dbody h2{font-size:19px;letter-spacing:-.02em}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere;margin:8px 0 12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a,.links button{background:var(--chip);color:var(--ink);text-decoration:none;border:0;border-radius:8px;padding:7px 12px;font:500 13px inherit;font-family:inherit;cursor:pointer}
.links a.p{background:var(--accent);color:#fff}
.meta{color:var(--mute);font-size:13px;margin-top:10px}
@media (max-width:600px){header{padding:14px 16px 10px}main{padding:16px;grid-template-columns:1fr}}
