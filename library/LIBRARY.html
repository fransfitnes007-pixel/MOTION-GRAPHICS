header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 24px 12px}

h1{font-size:21px;letter-spacing:-.02em;font-weight:700}
#count{color:var(--mute);font-variant-numeric:tabular-nums}
#q{display:block;width:100%;max-width:560px;margin:12px 0 10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;outline:none}

.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

main{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:20px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumb .snd{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;background:linear-gradient(135deg,#1c1c24,#35354a)}
.body{padding:11px 13px 13px}
.v{font-weight:650;letter-spacing:-.01em}
.c{color:var(--accent);font-size:13px;margin-top:1px}
.s{color:var(--mute);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#empty{display:none;padding:60px 24px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--shade)}
dialog video{display:block;width:100%;max-height:60vh;background:#000}
.dbody{padding:16px 20px 20px}
.dbody h2{font-size:19px;letter-spacing:-.02em}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere;margin:8px 0 12px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a,.links button{background:var(--chip);color:var(--ink);text-decoration:none;border:0;border-radius:8px;padding:7px 12px;font:500 13px inherit;font-family:inherit;cursor:pointer}
.links a.p{background:var(--accent);color:#fff}
.meta{color:var(--mute);font-size:13px;margin-top:10px}
@media (max-width:600px){header{padding:14px 16px 10px}main{padding:16px;grid-template-columns:1fr}}

$('#tags').innerHTML = TAGS.map((t) => `<button class="f" data-t="${esc(t)}">${esc(t)}</button>`).join('')
$('#cats').onclick = (e) => { const k = e.target.dataset.c; if (!k) return; cat = k; document.querySelectorAll('#cats .f').forEach((b) => b.classList.toggle('on', b.dataset.c === k)); draw() }
$('#tags').onclick = (e) => { const k = e.target.dataset.t; if (!k) return; tag = tag === k ? null : k; document.querySelectorAll('#tags .f').forEach((b) => b.classList.toggle('on', b.dataset.t === tag)); draw() }
$('#q').oninput = draw
function draw() {
  const words = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean)
  const rows = ITEMS.filter((i) => (cat === 'all' || i.category === cat) && (!tag || i.tags.includes(tag)) && words.every((w) => [i.visual_name, i.code_name, i.summary, i.slug, ...i.aliases, ...i.tags, ...i.tech, ...i.projects].join(' ').toLowerCase().includes(w)))
  $('#count').textContent = rows.length === ITEMS.length ? ITEMS.length + ' skills' : rows.length + ' of ' + ITEMS.length
  $('#empty').style.display = rows.length ? 'none' : 'block'
  $('#grid').innerHTML = rows.map((i) => `<button class="card" data-s="${esc(i.slug)}"><div class="thumb">${i.poster ? `<img loading="lazy" src="${url(i.poster)}" alt="">` : `<div class="snd">Sound</div>`}</div><div class="body"><div class="v">${esc(i.visual_name)}</div><div class="c">${esc(i.code_name)}</div><div class="s">${esc(i.summary)}</div></div></button>`).join('')
}
$('#grid').addEventListener('pointerover', (e) => { const c = e.target.closest('.card'); if (!c || c.querySelector('video')) return; const i = ITEMS.find((x) => x.slug === c.dataset.s); if (!i || !i.clip) return; const v = document.createElement('video'); v.src = url(i.clip); v.muted = true; v.loop = true; v.playsInline = true; c.querySelector('.thumb').appendChild(v); v.play().catch(() => {}) })
$('#grid').addEventListener('pointerout', (e) => { const c = e.target.closest('.card'); if (!c || c.contains(e.relatedTarget)) return; const v = c.querySelector('video'); if (v) v.remove() })
$('#grid').onclick = (e) => { const c = e.target.closest('.card'); if (c) open_(c.dataset.s) }
function open_(slug) {
  const i = ITEMS.find((x) => x.slug === slug), d = $('#d')
  const media = i.clip ? `<video src="${url(i.clip)}" controls autoplay loop playsinline></video>` : (i.demo ? `<iframe src="${url(i.demo)}" style="width:100%;aspect-ratio:16/9;border:0;display:block;background:#000" title="live demo"></iframe>` : (i.sound ? `<div style="padding:20px 20px 0"><audio src="${url(i.sound)}" controls style="width:100%"></audio></div>` : ''))
  const links = [`<a class="p" href="${url(i.skill)}">SKILL.md</a>`]
  if (i.demo) links.push(`<a href="${url(i.demo)}" target="_blank">Run the demo</a>`)
  i.clips.filter((x) => x !== i.clip).forEach((x) => links.push(`<a href="${url(x)}" target="_blank">${esc(x.split('/').pop())}</a>`))
  if (i.sound && i.clip) links.push(`<a href="${url(i.sound)}" target="_blank">Sound only</a>`)
  links.push(`<button id="cp">Copy path</button><button id="cl">Close</button>`)
  d.innerHTML = `${media}<div class="dbody"><h2>${esc(i.visual_name)}</h2><div class="c">${esc(i.code_name)}</div><p class="s" style="-webkit-line-clamp:unset">${esc(i.summary)}</p><div class="meta">${esc(i.projects.join(', '))}${i.duration_sec ? ' · ' + i.duration_sec + 's demo' : ''}${i.demo_kind ? ' · ' + esc(i.demo_kind) : ''}</div><div class="path">${esc(i.path)}</div><div class="links">${links.join('')}</div></div>`
  d.querySelector('#cl').onclick = () => d.close()
  d.querySelector('#cp').onclick = (e) => { navigator.clipboard && navigator.clipboard.writeText(i.path); e.target.textContent = 'Copied' }
  d.showModal()
}
$('#d').addEventListener('close', () => { $('#d').innerHTML = '' })
$('#d').addEventListener('click', (e) => { if (e.target === $('#d')) $('#d').close() })
draw()
</script></body></html>
