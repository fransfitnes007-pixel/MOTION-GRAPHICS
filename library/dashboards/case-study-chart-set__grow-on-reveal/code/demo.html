const D = mk('', 652, 24, 596, 360, 'Cumulative views')
const PTS = []; { let a = 0; const r = rnd(5); for (let i = 0; i < 40; i++) { a += 30000 + r() * 90000 * (1 + i / 10); PTS.push(Math.round(a)) } }
const CW = 640, CH = 240, PX = 8, PY = 22, mx = Math.max(...PTS)
const xs = (i) => PX + (i / (PTS.length - 1)) * (CW - PX * 2), ys = (v) => CH - PY - (v / mx) * (CH - PY * 2)
const dpath = PTS.map((v, i) => `${i ? 'L' : 'M'} ${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(' ')
const area = `${dpath} L ${xs(PTS.length - 1).toFixed(1)} ${CH - PY} L ${xs(0).toFixed(1)} ${CH - PY} Z`
const MK = [{ at: 12, label: 'First 1M' }, { at: 26, label: 'Spike' }, { at: 39, label: 'Now' }]
D.insertAdjacentHTML('beforeend', `<div style="position:relative"><svg viewBox="0 0 ${CW} ${CH}" style="display:block;width:100%;height:auto"><defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b5ce6" stop-opacity=".28"/><stop offset="1" stop-color="#5b5ce6" stop-opacity="0"/></linearGradient></defs>${[.25, .5, .75, 1].map((t) => `<line x1="${PX}" x2="${CW - PX}" y1="${ys(mx * t)}" y2="${ys(mx * t)}" stroke="#0b0c10" stroke-opacity=".07" stroke-dasharray="3 5"/><text x="${PX + 2}" y="${ys(mx * t) - 4}" font-size="10" fill="#686c77">${fmt(mx * t)}</text>`).join('')}<path id="ar" d="${area}" fill="url(#gf)" opacity="0"/><path id="ln" d="${dpath}" pathLength="1" fill="none" stroke="#5b5ce6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 1"/>${MK.map((m, i) => `<circle class="mk" cx="${xs(m.at)}" cy="${ys(PTS[m.at])}" r="5" fill="#fff" stroke="#5b5ce6" stroke-width="3" style="transform-origin:${xs(m.at)}px ${ys(PTS[m.at])}px;transform:scale(0)"/><text class="mt" x="${m.at > PTS.length * .8 ? xs(m.at) - 10 : xs(m.at)}" y="${Math.max(ys(PTS[m.at]) - 12, 12)}" text-anchor="${m.at > PTS.length * .8 ? 'end' : 'middle'}" font-size="11" font-weight="600" fill="#0b0c10" stroke="#fff" stroke-width="4" paint-order="stroke" opacity="0">${m.label}</text>`).join('')}</svg><div style="margin-top:4px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink4)"><span>Posts, in order</span><span>Cumulative views</span></div></div>`)
const ln = D.querySelector('#ln'), ar = D.querySelector('#ar'), mks = [...D.querySelectorAll('.mk')], mts = [...D.querySelectorAll('.mt')]
const E = E_OUT22
function render(t) {
  S(root, { opacity: loopFade(t) })
  const t0 = .35   // everything starts when its panel is revealed (useRevealed)
  bars.forEach((b) => { const w = b.w * E(seg(t, t0 + b.i * .08, t0 + b.i * .08 + 1.1)); b.f.style.width = w + '%'; b.n.style.display = b.w > 28 ? 'inline' : 'none' })
  let acc = 0; const tot = PARTS.reduce((a, p) => a + p[1], 0)
  segs.forEach((s, i) => { s.s.style.width = (s.v / tot * 100) * E(seg(t, t0 + i * .12, t0 + i * .12 + 1)) + '%' })
  cols.forEach((c) => { c.c.style.height = c.h * E(seg(t, t0 + .25 + c.i * .012, t0 + .25 + c.i * .012 + .7)) + '%' })
  // GrowthLine: path 0 -> 1 in 1.8s (ease [.22,1,.36,1]); area fades in 1.2s after .6s; markers spring in (300 / 18) at 1.2 + at/len
  const p = E(seg(t, t0, t0 + 1.8)); ln.style.strokeDasharray = `${p} 1`; ln.style.opacity = p > 0 ? 1 : 0
  ar.setAttribute('opacity', seg(t, t0 + .6, t0 + 1.8))
  MK.forEach((m, i) => { const d = t0 + 1.2 + m.at / PTS.length; mks[i].style.transform = `scale(${Math.max(0, fspring(t - d, 300, 18))})`; mts[i].setAttribute('opacity', seg(t, t0 + 1.4 + m.at / PTS.length, t0 + 1.4 + m.at / PTS.length + .3)) })
}

// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
