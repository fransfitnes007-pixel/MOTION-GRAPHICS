<!doctype html>
<html><head><meta charset="utf-8"><title>Dark ops scenario cards</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#06101c;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
:root{--bg:#06101c;--panel:#0c1b2c;--line:#173b54;--ink:#edf8ff;--muted:#88a4b9;--cyan:#3edcff;--lime:#bafb64}
#stage{background:var(--bg);color:var(--ink);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.ui{background:radial-gradient(circle at 90% 0,#173a51,transparent 32%),var(--bg)}
.main{position:absolute;left:180px;right:180px;top:64px}
.tag{color:var(--cyan);letter-spacing:.16em;text-transform:uppercase}
h1{font:800 88px/.9 system-ui,-apple-system,sans-serif;margin:.15em 0}
.lede{max-width:700px;color:var(--muted);font-size:17px}
.notice{margin:34px 0;padding:18px;border:1px solid var(--line);border-left:4px solid var(--lime);background:#091827}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{padding:22px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#10253a,#0a1726)}
h2{font-family:system-ui,-apple-system,sans-serif;margin:.3em 0;font-size:24px}
.card p{color:var(--muted);min-height:72px}
.btn{display:inline-block;border-radius:6px;background:var(--cyan);color:#04111c;font-weight:800;padding:10px 14px}
#status{color:var(--lime);margin:20px 0;height:24px}
footer{position:absolute;left:0;right:0;top:800px;border-top:1px solid var(--line);color:var(--muted);padding-top:20px}
.cursor{position:absolute;width:22px;height:22px;z-index:20;pointer-events:none}
.fade{position:absolute;inset:0;background:var(--bg);pointer-events:none}
.tall .main{left:60px;right:60px}.tall h1{font-size:64px}.tall .grid{grid-template-columns:1fr}.tall footer{top:1380px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers shared by the dashboard demos ----
// CSS cubic-bezier(x1,y1,x2,y2) as a function of progress 0..1 (Newton solve for x)
const bez = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0; if (x >= 1) return 1
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  let u = x
  for (let i = 0; i < 8; i++) { const f = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(f) < 1e-5 || Math.abs(d) < 1e-6) break; u -= f / d }
  return ((ay * u + by) * u + cy) * u
}
const easeOutCss = bez(0, 0, .58, 1)          // CSS ease-out
const easeCss = bez(.25, .1, .25, 1)             // CSS ease, Recharts default animationEasing
const easeInOutCss = bez(.42, 0, .58, 1)       // CSS ease-in-out
const outExpo22 = bez(.22, 1, .36, 1)          // cubic-bezier(0.22,1,0.36,1), used all over the sources
// framer-motion physics spring, 0 -> 1, t in seconds (stiffness, damping, mass)
const fmSpring = (t, k = 100, c = 10, m = 1) => {
  if (t <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t)
}
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }   // fixed-seed random
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e }
const fmtInt = (n) => Math.round(n).toLocaleString('en-US')
// d3 curveMonotoneX, which is what Recharts type="monotone" draws
const monotonePath = (pts) => {
  const n = pts.length; if (n < 2) return ''
  const dx = [], dy = [], m = [], tg = []
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i] }
  tg[0] = m[0]; tg[n - 1] = m[n - 2]
  for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { tg[i] = 0; tg[i + 1] = 0 } else { const a = tg[i] / m[i], b = tg[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i] } } }
  let d = `M${pts[0][0]},${pts[0][1]}`
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${pts[i][0] + h},${pts[i][1] + tg[i] * h},${pts[i + 1][0] - h},${pts[i + 1][1] - tg[i + 1] * h},${pts[i + 1][0]},${pts[i + 1][1]}` }
  return d
}
// A fixed design-size UI fitted into the stage: 1440x900 wide, 900x1440 tall. CSS under .tall reflows the grids.
const DW = TALL ? 900 : 1440, DH = TALL ? 1440 : 900
const UI_SC = Math.min(W / DW, H / DH)
const ui = el('div', 'ui' + (TALL ? ' tall' : ''))
S(ui, { position: 'absolute', width: DW + 'px', height: DH + 'px', left: ((W - DW * UI_SC) / 2) + 'px', top: ((H - DH * UI_SC) / 2) + 'px', transform: `scale(${UI_SC})`, transformOrigin: '0 0', overflow: 'hidden' })

const DUR = 10
window.DUR = DUR
const main = el('div', 'main', ui)
el('div', 'tag', main, 'Detection coverage validation · sealed sandbox')
el('h1', null, main, 'Signal<br>Console')
el('p', 'lede', main, 'Generate synthetic telemetry in a sealed local simulator, measure alert coverage, and export evidence for review.')
el('div', 'notice', main, 'Simulation boundary active: no outside network targets, third-party accounts or live traffic.')
const status = el('div', null, main); status.id = 'status'
const grid = el('div', 'grid', main)
const SC = [['SC-101', 'Burst of failed sign-ins', 'Many failed sign-ins from one source over a short window.'], ['SC-102', 'Slow drip across accounts', 'One attempt per account, spread over a long window.'], ['SC-103', 'Odd-hours admin access', 'Admin activity outside the normal working pattern.']]
const cards = SC.map(([id, n, d]) => { const c = el('article', 'card', grid, `<div class="tag">${id}</div><h2>${n}</h2><p>${d}</p>`); const b = el('span', 'btn', c, 'Run simulation'); return { c, b } })
el('footer', null, ui, 'Signal Console · loopback-only API · documentation-range addresses'); S(ui.lastChild, { left: '180px', right: '180px' })
const cur = el('div', 'cursor', ui, '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 2l15 8-6.5 2L9 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>')
const fadeEl = el('div', 'fade', ui)
const T = { ready: 1.1, click: 3.6, done: 6.2 }
const kfs = (t, keys) => { for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t <= keys[i + 1][0]) { const q = easeInOutCss((t - keys[i][0]) / (keys[i + 1][0] - keys[i][0] || 1)); return [keys[i][1] + (keys[i + 1][1] - keys[i][1]) * q, keys[i][2] + (keys[i + 1][2] - keys[i][2]) * q] } return [keys[keys.length - 1][1], keys[keys.length - 1][2]] }
function render(t) {
  const ready = t >= T.ready
  status.textContent = !ready ? 'Loading bundled scenarios…' : t < T.click ? '3 scenarios ready' : t < T.done ? 'Running SC-102…' : 'Complete: run-7f3a · 1,240 events · 4 findings'
  cards.forEach((c, i) => { const q = ready ? easeOutCss(seg(t, T.ready + i * .08, T.ready + i * .08 + .4)) : 0; S(c.c, { opacity: q, transform: `translateY(${(1 - q) * 8}px)` }); const dis = i === 1 && t >= T.click && t < T.done; S(c.b, { opacity: dis ? .45 : 1 }) })
  const b = cards[1].b, bx = 180 + 14 + (1440 - 360 - 28) / 3 + 22 + 30   // second card button, design px
  const [cx, cy] = kfs(t, [[0, 1100, 760], [2.8, 650, 692], [T.click, 650, 692], [T.click + .2, 650, 692], [T.click + 1, 1000, 640], [DUR, 1000, 640]])
  S(cur, { left: cx + 'px', top: cy + 'px' })
  S(fadeEl, { opacity: seg(t, DUR - .4, DUR) })
}


// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
