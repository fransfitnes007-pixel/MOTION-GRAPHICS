<!doctype html>
<html><head><meta charset="utf-8"><title>Brutalist mono bar timeline</title>
<!-- Library demo template. Every frame is a pure function of time: window.render(t).
     Open it in a browser and it loops. engine/tools/render_demo.cjs drives it frame by frame (?render=1).
     URL params: ?w=1920&h=1080&layout=wide|tall -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000;color:#0b0b10;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
/* SKILL CSS START */
#stage{background:#000;color:#fff;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.ui{background:#000}
.mono{font-family:inherit}
.hd{border-bottom:2px solid #fff;padding:16px 32px;display:flex;justify-content:space-between;align-items:flex-start}
.hd .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hd h1{font-size:48px;font-weight:900;letter-spacing:-.02em;line-height:1;margin-top:6px}
.hd .r{text-align:right;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);line-height:1.7}
.hd .st{display:inline-block;margin-top:6px;padding:2px 8px;background:#fff;color:#000;border:1px solid #fff;font-size:9px}
.tabs{border-bottom:2px solid #fff;overflow:hidden;padding:0 32px;display:flex}
.tabs div{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:13px 20px 16px;border-bottom:3px solid transparent;margin-bottom:-3px;color:rgba(255,255,255,.6);white-space:nowrap}
.tabs div.on{border-bottom-color:#fff;color:#fff;font-weight:700}
.main{padding:0 32px}
.desc{padding:10px 0;border-bottom:2px solid #fff;margin-bottom:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.sh{margin:14px 0 10px}
.sh .t{display:inline-block;background:#fff;color:#000;padding:9px 16px;font-size:16px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.sh p{font-size:11px;letter-spacing:.02em;opacity:.5;margin-top:8px;text-transform:uppercase}
.sh .bar{height:2px;background:#fff;margin-top:10px}
.hero{display:grid;grid-template-columns:repeat(4,1fr)}
.hero div{border-bottom:2px solid #fff;border-right:2px solid #fff;padding:12px 24px}
.hero small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:8px}
.hero b{font-size:40px;font-weight:700;line-height:1}
.tg{display:flex;margin-bottom:16px}
.tg div{font-size:11px;letter-spacing:.15em;text-transform:uppercase;padding:8px 16px;border:2px solid #fff;background:#000;color:#fff}
.tg div+div{border-left:0}
.tg div.on{background:#fff;color:#000}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid #fff;margin-top:8px}
.sum div{padding:10px 12px;border-right:2px solid #fff}.sum div:last-child{border-right:0}
.sum small{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.5}
.sum b{display:block;font-size:14px;margin-top:4px}.sum span{font-size:12px;opacity:.6}
.tip{position:absolute;background:#fff;color:#000;font-size:11px;padding:6px 10px;white-space:nowrap}
.cursor{position:absolute;width:22px;height:22px;z-index:20;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.fade{position:absolute;inset:0;background:#000;pointer-events:none}
.tall .hero{grid-template-columns:1fr 1fr}.tall .hd h1{font-size:38px}.tall .tabs div{padding:14px 12px}

/* SKILL CSS END */
</style></head>
<body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080), TALL = (Q.get('layout') || (H > W ? 'tall' : 'wide')) === 'tall'
const stage = document.getElementById('stage')
stage.style.width = W + 'px'; stage.style.height = H + 'px'
document.body.style.width = W + 'px'; document.body.style.height = H + 'px'
const CX = W / 2, CY = H / 2, K = TALL ? .74 : 1          // K: type scale for the narrow layout

// easing + helpers, the same set the films use
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x))
const seg = (t, a, b) => clamp((t - a) / (b - a))
const eo = (x) => 1 - Math.pow(1 - x, 3)
const eo5 = (x) => 1 - Math.pow(1 - x, 5)
const ei = (x) => x * x * x
const eio = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2
const spring = (x, k = 7, f = 11) => x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const lerp = (a, b, x) => a + (b - a) * x
const el = (tag, cls, parent = stage, html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; parent.appendChild(e); return e }
const S = (e, o) => { for (const k in o) e.style[k] = o[k] }
const vis = (e, on) => { const d = on ? '' : 'none'; if (e.style.display !== d) e.style.display = d }
const px = (n) => Math.round(n) + 'px'

// ---------- SKILL START: edit from here down ----------
// ---- helpers shared by the dashboard demos ----
// CSS cubic-bezier(x1,y1,x2,y2) as a function of progress 0..1 (Newton solve for x)
const bez = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0; if (x >= 1) return 1
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
  let u = x
  for (let i = 0; i < 8; i++) { const f = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(f) < 1e-5 || Math.abs(d) < 1e-6) break; u -= f / d }
  return ((ay * u + by) * u + cy) * u
}
const easeOutCss = bez(0, 0, .58, 1)          // CSS ease-out
const easeCss = bez(.25, .1, .25, 1)             // CSS ease, Recharts default animationEasing
const easeInOutCss = bez(.42, 0, .58, 1)       // CSS ease-in-out
const outExpo22 = bez(.22, 1, .36, 1)          // cubic-bezier(0.22,1,0.36,1), used all over the sources
// framer-motion physics spring, 0 -> 1, t in seconds (stiffness, damping, mass)
const fmSpring = (t, k = 100, c = 10, m = 1) => {
  if (t <= 0) return 0
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m))
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t)
}
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 }   // fixed-seed random
const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e }
const fmtInt = (n) => Math.round(n).toLocaleString('en-US')
// d3 curveMonotoneX, which is what Recharts type="monotone" draws
const monotonePath = (pts) => {
  const n = pts.length; if (n < 2) return ''
  const dx = [], dy = [], m = [], tg = []
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; dy[i] = pts[i + 1][1] - pts[i][1]; m[i] = dy[i] / dx[i] }
  tg[0] = m[0]; tg[n - 1] = m[n - 2]
  for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { tg[i] = 0; tg[i + 1] = 0 } else { const a = tg[i] / m[i], b = tg[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i] } } }
  let d = `M${pts[0][0]},${pts[0][1]}`
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += `C${pts[i][0] + h},${pts[i][1] + tg[i] * h},${pts[i + 1][0] - h},${pts[i + 1][1] - tg[i + 1] * h},${pts[i + 1][0]},${pts[i + 1][1]}` }
  return d
}
// A fixed design-size UI fitted into the stage: 1440x900 wide, 900x1440 tall. CSS under .tall reflows the grids.
const DW = TALL ? 900 : 1440, DH = TALL ? 1440 : 900
const UI_SC = Math.min(W / DW, H / DH)
const ui = el('div', 'ui' + (TALL ? ' tall' : ''))
S(ui, { position: 'absolute', width: DW + 'px', height: DH + 'px', left: ((W - DW * UI_SC) / 2) + 'px', top: ((H - DH * UI_SC) / 2) + 'px', transform: `scale(${UI_SC})`, transformOrigin: '0 0', overflow: 'hidden' })

const DUR = 9
window.DUR = DUR
const R = rng(5)
const hd = el('div', 'hd', ui, '<div><div class="k">Analytics dashboard</div><h1>SPRING LAUNCH</h1></div><div class="r">Mar 01 — Mar 30<br>212 videos<br><span class="st">ACTIVE</span></div>')
const tabs = el('div', 'tabs', ui)
;['Overview', 'Top creators', 'Top videos', 'All videos', 'Get script'].forEach((n, i) => el('div', i ? '' : 'on', tabs, n))
const main = el('div', 'main', ui)
el('div', 'desc', main, 'Performance snapshot, platform split and posting pace')
el('div', 'sh', main, '<div class="t">Key metrics</div><p>Performance snapshot across all tracked content</p><div class="bar"></div>')
const hero = el('div', 'hero', main)
;[['Total views', '4.8M'], ['Total videos', '212'], ['Unique creators', '87'], ['Avg views/video', '22.6K']].forEach(([l, v]) => el('div', null, hero, `<small>${l}</small><b>${v}</b>`))
el('div', 'sh', main, '<div class="t">Posting timeline</div><p>Daily video output and view accumulation</p><div class="bar"></div>')
const tg = el('div', 'tg', main); const tgA = el('div', 'on', tg, 'Videos posted'); const tgB = el('div', null, tg, 'Views')
const cbox = el('div', null, main); S(cbox, { position: 'relative', height: '236px' })
const CW = DW - 64, CH = 236
const sv = svgEl('svg', { width: CW, height: CH }, cbox); sv.style.display = 'block'
const N = 30
const videos = Array.from({ length: N }, (_, i) => Math.round(2 + R() * 6 + (i > 10 && i < 18 ? 6 : 0) + (i === 14 ? 3 : 0)))
const views = Array.from({ length: N }, (_, i) => Math.round(40000 + R() * 120000 + (i > 10 && i < 20 ? 160000 : 0)))
const dayLbl = (i) => { const d = new Date(2026, 2, 1 + i); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) }
const fmtN = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n)
const PL = 54, PR = CW - 6, PT = 8, PB = CH - 54
const grid = svgEl('g', {}, sv), bars = svgEl('g', {}, sv)
const yl = [0, 1, 2, 3, 4].map(() => svgEl('text', { fill: '#fff', 'font-size': 10, 'text-anchor': 'end' }, grid))
const gl = [0, 1, 2, 3, 4].map(() => svgEl('line', { x1: PL, x2: PR, stroke: '#fff', 'stroke-opacity': .08 }, grid))
svgEl('line', { x1: PL, x2: PR, y1: PB, y2: PB, stroke: '#fff', 'stroke-width': 2 }, sv); svgEl('line', { x1: PL, x2: PL, y1: PT, y2: PB, stroke: '#fff', 'stroke-width': 2 }, sv)
const barEls = Array.from({ length: N }, () => svgEl('rect', { fill: '#fff' }, bars))
const xl = Array.from({ length: N }, (_, i) => { if (i % 3) return null; const x = PL + (i + .5) * (PR - PL) / N; svgEl('line', { x1: x, x2: x, y1: PB, y2: PB + 6, stroke: '#fff' }, sv); const t = svgEl('text', { x, y: PB + 16, fill: '#fff', 'font-size': 9, 'text-anchor': 'end', transform: `rotate(-45 ${x} ${PB + 16})` }, sv); t.textContent = dayLbl(i); return t })
const tip = el('div', 'tip', cbox); const hline = null
const pk = videos.indexOf(Math.max(...videos)), hvd = views.indexOf(Math.max(...views))
el('div', 'sum', main, `<div><small>Peak day</small><b>${dayLbl(pk)}</b><span>${videos[pk]} videos</span></div><div><small>Highest views day</small><b>${dayLbl(hvd)}</b><span>${fmtN(views[hvd])} views</span></div><div><small>Days tracked</small><b>${N}</b><span>consecutive days</span></div>`)
const cur = el('div', 'cursor', ui, '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 2l15 8-6.5 2L9 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>')
const fadeEl = el('div', 'fade', ui)
const T_CLICK = 4.0
const lerp2 = (a, b, q) => a + (b - a) * q
function render(t) {
  const mode = t >= T_CLICK ? 'views' : 'videos'
  tgA.className = mode === 'videos' ? 'on' : ''; tgB.className = mode === 'views' ? 'on' : ''
  const data = mode === 'videos' ? videos : views, max = Math.max(...data)
  const nice = mode === 'videos' ? 16 : 300000, step = nice / 4
  yl.forEach((e, i) => { const y = PB - (i * step / nice) * (PB - PT); e.setAttribute('x', PL - 8); e.setAttribute('y', y + 3); e.textContent = mode === 'videos' ? (i * step) : fmtN(i * step); gl[i].setAttribute('y1', y); gl[i].setAttribute('y2', y); S(gl[i], { display: i ? '' : 'none' }) })
  // Recharts Bar: re-mounts when the chart swaps, bars grow from the baseline over 1500ms, ease
  const t0 = mode === 'videos' ? 0 : T_CLICK + .15, g = easeCss(seg(t, t0, t0 + 1.5))
  const bw = (PR - PL) / N
  data.forEach((v, i) => { const h = (v / nice) * (PB - PT) * g; barEls[i].setAttribute('x', PL + i * bw + bw * .1); barEls[i].setAttribute('width', bw * .8); barEls[i].setAttribute('y', PB - h); barEls[i].setAttribute('height', h) })
  // tooltip: white box, black text, mono 11px; follows the mouse
  const hv = seg(t, 6.0, 8.2), idx = hv > 0 && hv < 1 ? Math.round(lerp2(8, 22, hv)) : -1
  if (idx >= 0) { S(tip, { display: '', left: (PL + idx * bw + bw / 2 + 12) + 'px', top: '40px' }); tip.innerHTML = `<b>${dayLbl(idx)}</b><br>Views: ${fmtN(views[idx])}` } else S(tip, { display: 'none' })
  // cursor: to the Views toggle at T_CLICK, then over the chart
  const key = [[0, 900, 600], [2.8, 148 + 32, 520], [T_CLICK, 148 + 32, 520], [4.5, 620, 700], [6.0, 520, 700], [8.2, 900, 700], [9, 900, 700]]
  let cx = key[0][1], cy = key[0][2]
  for (let i = 0; i < key.length - 1; i++) if (t >= key[i][0] && t <= key[i + 1][0]) { const q = easeInOutCss((t - key[i][0]) / (key[i + 1][0] - key[i][0])); cx = lerp2(key[i][1], key[i + 1][1], q); cy = lerp2(key[i][2], key[i + 1][2], q) }
  S(cur, { left: cx + 'px', top: cy + 'px' })
  S(fadeEl, { opacity: seg(t, DUR - .4, DUR) })
}


// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
</body></html>
