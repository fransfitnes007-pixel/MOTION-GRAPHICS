  // hover crosshair across the chart
  const hv = seg(t, 3.2, 6.6), idx = hv > 0 && hv < 1 ? hv * 9 : -1
  if (idx >= 0) { const i0 = Math.floor(idx), f = idx - i0, i1 = Math.min(9, i0 + 1), x = pts[i0][0] + (pts[i1][0] - pts[i0][0]) * f, y = pts[i0][1] + (pts[i1][1] - pts[i0][1]) * f, near = Math.round(idx)
    cursorL.setAttribute('x1', x); cursorL.setAttribute('x2', x); hdot.setAttribute('cx', x); hdot.setAttribute('cy', y); S(tip, { display: '', left: Math.min(x + 28, CW - 70) + 'px', top: '70px' }); tip.innerHTML = `<span style="color:#A1A1AE">${HOURS[near]}</span> <b>${cnt[near]}</b>`
  } else { cursorL.setAttribute('x1', -10); cursorL.setAttribute('x2', -10); hdot.setAttribute('cx', -10); S(tip, { display: 'none' }) }
  S(fadeEl, { opacity: seg(t, DUR - .4, DUR) })
}


// ---------- SKILL END ----------

window.render = render
window.READY = document.fonts.ready.then(() => { render(0); return true })
// Plays on a loop when opened by hand; the render tool passes ?render=1 and steps frames itself.
if (!Q.get('render')) { const t0 = performance.now(); const loop = (n) => { render(((n - t0) / 1000) % DUR); requestAnimationFrame(loop) }; requestAnimationFrame(loop) }
</script>
