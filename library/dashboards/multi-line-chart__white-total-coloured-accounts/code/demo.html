// d3 curveMonotoneX, which Recharts uses for type="monotone"
function monoPath(P) {
  const n = P.length; if (n < 2) return ''

  const T = new Array(n)
  for (let i = 1; i < n - 1; i++) T[i] = s3(P[i - 1][0], P[i - 1][1], P[i][0], P[i][1], P[i + 1][0], P[i + 1][1])
  T[0] = s2(P[0][0], P[0][1], P[1][0], P[1][1], T[1]); T[n - 1] = s2(P[n - 2][0], P[n - 2][1], P[n - 1][0], P[n - 1][1], T[n - 2])
  let d = `M${P[0][0]},${P[0][1]}`
  for (let i = 0; i < n - 1; i++) { const [x0, y0] = P[i], [x1, y1] = P[i + 1], dx = (x1 - x0) / 3; d += `C${x0 + dx},${y0 + dx * T[i]},${x1 - dx},${y1 - dx * T[i + 1]},${x1},${y1}` }
  return d
}
