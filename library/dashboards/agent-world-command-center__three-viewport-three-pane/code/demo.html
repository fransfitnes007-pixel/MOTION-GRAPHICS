const R = ((seed) => () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 })(2024)   // fixed seed, replaces Math.random

const sandFloor = new THREE.Mesh(new THREE.CylinderGeometry(80, 85, 2, 48), M(0xf5e6c8, { roughness: 0.9, metalness: 0 })); sandFloor.receiveShadow = true; P(g, sandFloor, 0, -1, 0)
const lagoon = new THREE.Mesh(new THREE.CylinderGeometry(120, 125, 0.5, 64), new THREE.MeshPhysicalMaterial({ color: 0x00bcd4, transparent: true, opacity: 0.55, roughness: 0.05, metalness: 0.1 })); P(g, lagoon, 0, -0.8, 0)

const waveMesh = new THREE.Mesh(new THREE.PlaneGeometry(600, 600, 80, 80), new THREE.MeshPhysicalMaterial({ color: 0x0088aa, transparent: true, opacity: 0.3, roughness: 0.02, metalness: 0.1 }))

const raveLights = []
for (let rl = 0; rl < 3; rl++) {
  const L = new THREE.SpotLight(danceColors[rl * 2], 90, 45, Math.PI / 6, 0.5); L.position.set(-25 + (rl - 1) * 6, 12, 0)
  const tgt = new THREE.Object3D(); tgt.position.set(-25, 0, 0); g.add(tgt); L.target = tgt; L.userData.baseAngle = (rl / 3) * Math.PI * 2; g.add(L); raveLights.push(L)
  const beam = new THREE.Mesh(new THREE.ConeGeometry(2.2, 12, 12, 1, true), new THREE.MeshBasicMaterial({ color: danceColors[rl * 2], transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); beam.userData.light = L; g.add(beam); L.userData.beam = beam
}
// palm trees
for (let pt = 0; pt < 15; pt++) {
  const pa = R() * Math.PI * 2, pr = 34 + R() * 36, ptx = Math.cos(pa) * pr, ptz = Math.sin(pa) * pr

  const trunk = Cyl(0.25, 0.35, 6 + R() * 3, M(0x8B6914, { roughness: 0.9 })); trunk.rotation.z = (R() - 0.5) * 0.2; P(g, trunk, ptx, 3, ptz)
  for (let f = 0; f < 6; f++) { const fa = (f / 6) * Math.PI * 2, fr = B(0.3, 0.05, 3, M(0x228B22)); fr.rotation.x = 0.5; fr.rotation.y = fa; P(g, fr, ptx + Math.cos(fa) * 1.5, 6.5 + R(), ptz + Math.sin(fa) * 1.5) }
}
// floating sky sign

const sc = ssC.getContext('2d'); sc.fillStyle = '#ffffff'; sc.strokeStyle = '#000000'; sc.lineWidth = 6; sc.font = 'bold 130px sans-serif'; sc.textAlign = 'center'
sc.strokeText('NORTHSTAR LABS', 1024, 190); sc.fillText('NORTHSTAR LABS', 1024, 190); sc.font = 'bold 60px sans-serif'; sc.strokeText('lagoon outpost', 1024, 340); sc.fillText('lagoon outpost', 1024, 340)
const skyTex = new THREE.CanvasTexture(ssC); skyTex.colorSpace = THREE.SRGBColorSpace
P(g, new THREE.Mesh(new THREE.PlaneGeometry(60, 15), new THREE.MeshBasicMaterial({ map: skyTex, transparent: true, side: THREE.DoubleSide, fog: false })), 0, 50, -40)

const clouds = []
for (let i = 0; i < 14; i++) {

}
const birds = []
for (let i = 0; i < 8; i++) {

}
const ffN = 80, ffPos = new Float32Array(ffN * 3), ffBase = [], ffPh = []
for (let i = 0; i < ffN; i++) { ffBase.push([(R() - 0.5) * 60, 1.5 + R() * 5, (R() - 0.5) * 40]); ffPh.push(R() * Math.PI * 2) }
const ffGeo = new THREE.BufferGeometry(); ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3))

// ---------- agents: the app's fallback character (box body + head), wandering, with chat bubbles ----------
const AGENT = [[0x8b5cf6, [[-8, 6], [4, 9], [10, 2], [-2, -2]]], [0x22c55e, [[28, 12], [36, 10], [32, 18]]], [0xf59e0b, [[-30, 8], [-20, -6], [-26, 4]]], [0x3b82f6, [[0, 22], [14, 28], [-6, 30]]], [0xec4899, [[-12, -10], [8, -12], [14, -6]]], [0x14b8a6, [[40, -6], [48, 4], [42, 12]]]]
const agents = AGENT.map(([col, way], i) => {
  const a = new THREE.Group()
  P(a, B(0.5, 0.8, 0.3, M(col)), 0, 0.5, 0); P(a, B(0.4, 0.4, 0.4, M(0xf5c6a0)), 0, 1.1, 0); a.scale.setScalar(3.2); scene.add(a)
  return { a, way, phase: i * 1.7 }
})
const CHAT = ['Deploy is live', 'Numbers up 12%', 'Brief locked in', 'All tasks on track', 'Hook is fire', 'Pipeline looking full']
const bubbles = CHAT.map((tx, i) => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 80; const x = c.getContext('2d'), reply = i % 2
  x.fillStyle = reply ? '#e5e5ea' : '#007aff'; const r = 16, bw = 480, bh = 56
  x.beginPath(); x.moveTo(16 + r, 12); x.lineTo(16 + bw - r, 12); x.quadraticCurveTo(16 + bw, 12, 16 + bw, 12 + r); x.lineTo(16 + bw, 12 + bh - r); x.quadraticCurveTo(16 + bw, 12 + bh, 16 + bw - r, 12 + bh); x.lineTo(16 + r, 12 + bh); x.quadraticCurveTo(16, 12 + bh, 16, 12 + bh - r); x.lineTo(16, 12 + r); x.quadraticCurveTo(16, 12, 16 + r, 12); x.fill()
  x.fillStyle = reply ? '#000' : '#fff'; x.font = 'bold 26px -apple-system,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(tx, 256, 40)
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, fog: false, depthTest: false })); spr.scale.set(8, 1.3, 1); spr.renderOrder = 10; scene.add(spr)
  return { spr, agent: i, t0: 1.0 + i * 2.5 }
})

let clockText = ''
const col = (h) => new THREE.Color(h)
const skyDay = col(0x87CEEB), skySunset = col(0xff6633), skyNight = col(0x0a0a2a)
function updateDayNight(dayNightT) {
  const sunAngle = dayNightT * Math.PI * 2 - Math.PI / 2, sunY = Math.sin(sunAngle), sunX = Math.cos(sunAngle) * 80
  sunLight.position.set(sunX, Math.max(5, sunY * 80), 40); sunLight.intensity = Math.max(0, sunY) * 2.5; moonLight.intensity = Math.max(0, -sunY) * 0.4
  sunSphere.position.set(sunX * 3, Math.max(-50, sunY * 200), -100); sunSphere.visible = sunY > -0.1; sunSphere.material.color.setHex(sunY > 0.15 ? 0xffdd44 : 0xff6622)
  sunGlow.position.copy(sunSphere.position); sunGlow.visible = sunY > -0.05; sunGlow.material.opacity = Math.max(0, Math.min(0.6, sunY * 1.5)); sunGlow.scale.setScalar(30 + sunY * 15)
  moonSphere.position.set(-sunX * 3, Math.max(-50, -sunY * 200), -100); moonSphere.visible = sunY < 0.1
  starMat.opacity = sunY < 0 ? Math.min(1, (-sunY) * 3) : 0; stars.visible = sunY < 0.05
  cloudMat.opacity = sunY > 0 ? 0.6 : 0.15
  let sky
  if (sunY > 0.2) sky = skyDay.clone()
  else if (sunY > -0.05) sky = skyDay.clone().lerp(skySunset, 1 - (sunY + 0.05) / 0.25)
  else if (sunY > -0.2) sky = skySunset.clone().lerp(skyNight, (-sunY - 0.05) / 0.15)
  else sky = skyNight.clone()
  scene.background = sky; scene.fog.color.copy(sky)
  ambLight.intensity = 0.15 + Math.max(0, sunY) * 0.5; hemiLight.intensity = 0.1 + Math.max(0, sunY) * 0.4
  renderer.toneMappingExposure = 0.55 + Math.max(0, sunY) * 0.55   // the app uses 0.6 + sunY * 1.0; lowered a little so the pale sand does not clip on a plain background
  const hh = Math.floor(dayNightT * 24), mm = Math.floor((dayNightT * 24 - hh) * 60)
  clockText = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}  ${sunY > 0.1 ? 'DAY' : sunY > -0.1 ? 'DUSK' : 'NIGHT'}`
  return sunY
}
const smooth = (a, b, x) => a + (b - a) * x
function agentPos(ag, t) {   // walks the waypoint loop at a steady pace, hopping like the Wanderer ("abs(sin(t*8))*0.07")
  const pts = ag.way, n = pts.length, u = (((t / DUR) * 1 + ag.phase / 10) % 1 + 1) % 1 * n, i = Math.floor(u), f = u - i
  const p0 = pts[i % n], p1 = pts[(i + 1) % n], walk = f < 0.7 ? f / 0.7 : 1, moving = f < 0.7
  return { x: smooth(p0[0], p1[0], walk), z: smooth(p0[1], p1[1], walk), moving, rot: Math.atan2(p1[0] - p0[0], p1[1] - p0[1]) }
}
function renderWorld(t) {
  const sunY = updateDayNight(((0.24 + t / DUR) % 1))
  // waves: every term repeats once per DUR so the loop is seamless
  const w = (2 * Math.PI * t) / DUR
  for (let i = 0; i < wpos.count; i++) { const x = wbase[i * 3], y = wbase[i * 3 + 1]; wpos.setZ(i, Math.sin(x * 0.08 + w * 4) * 0.4 + Math.cos(y * 0.06 + w * 3) * 0.3 + Math.sin((x + y) * 0.05 + w * 2) * 0.2) }
  wpos.needsUpdate = true
  clouds.forEach((c) => { const d = c.userData; c.position.set(((d.x0 + 400 * (t / DUR) * d.k + 200) % 400) - 200, d.y, d.z) })
  birds.forEach((b) => { const d = b.userData, a = d.a0 + w * d.k; b.position.set(Math.cos(a) * d.r, d.y + Math.sin(a * 2) * 3, Math.sin(a) * d.r); b.rotation.y = -a + Math.PI; const fl = Math.sin(t * 9 + d.ph) * 0.5; d.wl.rotation.z = 0.3 + fl; d.wr.rotation.z = -0.3 - fl })
  ffMat.opacity = sunY < 0 ? Math.min(0.9, -sunY * 3) : 0
  for (let i = 0; i < ffN; i++) { const b = ffBase[i], p = ffPh[i]; ffPos[i * 3] = b[0] + Math.sin(w * 3 + p) * 2; ffPos[i * 3 + 1] = b[1] + Math.sin(w * 4 + p * 2) * 0.8; ffPos[i * 3 + 2] = b[2] + Math.cos(w * 3 + p) * 2 }
  ffGeo.attributes.position.needsUpdate = true
  raveLights.forEach((L, i) => { const a = L.userData.baseAngle + w * 4; L.target.position.set(-25 + Math.cos(a) * 7, 0, Math.sin(a) * 7); L.target.updateMatrixWorld(); const mid = new THREE.Vector3((L.position.x + L.target.position.x) / 2, 6, (L.position.z + L.target.position.z) / 2); L.userData.beam.position.copy(mid); L.userData.beam.lookAt(L.target.position.x, 0, L.target.position.z); L.userData.beam.rotateX(Math.PI / 2); L.userData.beam.visible = sunY < 0.35 })
  raveLights.forEach((L) => { L.intensity = 90 * Math.min(1, Math.max(0.15, 0.9 - sunY * 1.5)) })
  agents.forEach((ag) => { const s = agentPos(ag, t); ag.a.position.set(s.x, s.moving ? 1.05 + Math.abs(Math.sin(t * 8 + ag.phase)) * 0.07 : 1.05, s.z); ag.a.rotation.y = s.rot; ag.pos = s })
  bubbles.forEach((b) => {   // life 4.5s, fade in .3s, drifts up
    const age = ((t - b.t0) % DUR + DUR) % DUR, life = 4.5; const op = age < life ? Math.min(1, age / 0.3) * (age > life - 0.8 ? (life - age) / 0.8 : 1) : 0
    const ap = agents[b.agent].a.position; b.spr.position.set(ap.x, ap.y + 5.4 + Math.min(age, life) * 0.35, ap.z); b.spr.material.opacity = op
  })
  // camera: slow aerial sway around the island (the app uses OrbitControls)
  const ca = 0.55 + 0.45 * Math.sin(w), cr = TALL ? 170 : 175
  camera.position.set(Math.sin(ca) * cr, 40 + 5 * Math.sin(w * 2), Math.cos(ca) * cr); camera.lookAt(0, 16, -4)
  renderer.render(scene, camera)
}

// ================= panels around the viewport (index.html of the app) =================
const NAMES = [['Scout', 'Researcher', 'CORE', '#8b5cf6'], ['Echo', 'Social media', 'SHOP', '#22c55e'], ['Forge', 'Coder', 'CORE', '#f59e0b'], ['Atlas', 'Strategist', 'LABS', '#3b82f6'], ['Quill', 'Content', 'SHOP', '#ec4899'], ['Ledger', 'Operations', 'LABS', '#14b8a6']]
const tb = el('div', 'tb', ui)
el('i', 'tdot', tb); el('h1', null, tb, 'NORTHSTAR HQ')
el('div', 'tstats', tb, '<span>Agents <b>6</b></span><span>Running <b>4</b></span><span>Messages <b id="msgs">0</b></span>')
el('div', 'tcmd', tb, 'Commands  ⌘K')
const clock = el('div', 'tclock', tb)
if (!TALL) {
  const sb = el('div', 'sb2', ui)
  el('div', 'sbh', sb, '<h2>Agents</h2><span class="add">+</span>')
  el('div', 'biz', sb, '<span class="on">ALL</span><span>CORE</span><span>LABS</span><span>SHOP</span>')
  el('div', 'srch2', sb, 'Search agents…')
  var cards = NAMES.map(([n, role, biz, c], i) => { const cd = el('div', 'acard', sb); cd.innerHTML = `<div class="an">${n}</div><div class="ar">${role}</div><div class="as"><i class="sd"></i><span>running</span></div>`; cd.querySelector('.as').style.marginTop = '3px'; return { cd, dot: cd.querySelector('.sd') } })
} else var cards = []
// viewport overlays
const mini = el('div', 'mini', vp); const msv = svgEl('svg', { width: 140, height: 90 }, mini)
svgEl('ellipse', { cx: 70, cy: 45, rx: 56, ry: 34, fill: '#e8d8b0', 'fill-opacity': .5, stroke: 'rgba(139,92,246,.5)' }, msv)
const mdots = NAMES.map((n) => svgEl('circle', { r: 3, fill: n[3] }, msv))
el('div', 'vbtn', vp, '<span>Aerial</span><span>Follow</span><span>First person</span>')
el('div', 'vlabel', vp, 'Drag to orbit · scroll to zoom')
const toasts = el('div', 'toasts', vp)
const toastEls = bubbles.map((b, i) => { const [n, , , c] = NAMES[b.agent]; return el('div', 'toast', toasts, `<div class="tn" style="color:${c}">${n}</div><div class="tm">${CHAT[i]}</div>`) })
// detail panel
const dp = el('div', 'dp', ui)
const dh = el('div', 'dph', dp); const dname = el('h2', null, dh); const drole = el('span', 'rb', dh); const dbiz = el('span', 'bb2', dh)
const dout = el('div', 'out', dp)
el('div', 'inp', dp, '<div class="inpf">Message the agent…</div><span class="send">Send</span><span class="kill">Kill</span>')
const LOG = [
  ['$ scout --task "weekly market scan"', '> reading 14 sources…', '> trend: short video up 18% week on week', '> competitor pricing changed on 3 SKUs', '> writing summary to /reports/week-14.md', '✔ done in 41s · 2 findings flagged'],
  ['$ forge --task "ship status page"', '> pulling latest main', '> running 128 tests… all passing', '> building bundle (412 kB)', '> deploying to preview', '✔ preview live · awaiting review'],
]
const loading = el('div', 'load', ui, '<div class="li"><div class="lt">NORTHSTAR HQ</div><div class="ls">Building the world…</div><div class="lb"><i></i></div><div class="lst">…</div></div>')
const lfill = loading.querySelector('i'), lst = loading.querySelector('.lst')
const fadeEl = el('div', 'fade', ui)
const pulse = (t) => { const u = (t % 2) / 2; return u < .5 ? 1 - .6 * easeCss(u * 2) : .4 + .6 * easeCss((u - .5) * 2) }   // @keyframes pulse, 2s infinite, ease
const bizColors = ['#8b5cf6', '#22c55e', '#f59e0b', '#3b82f6', '#ec4899', '#14b8a6']
let lastSel = -1
function render(t) {
  renderWorld(t)
  clock.textContent = clockText
  document.getElementById('msgs').textContent = String(Math.min(48, Math.floor(t * 3)))
  const sel = t < 8.2 ? 0 : 2
  const pl = pulse(t)
  cards.forEach((c, i) => { const on = i === sel; c.cd.className = 'acard' + (on ? ' sel' : ''); S(c.dot, { opacity: pl, background: '#22c55e' }) })
  if (lastSel !== sel) { lastSel = sel; const [n, role, biz, c] = NAMES[sel]; dname.textContent = n; drole.textContent = role; dbiz.textContent = biz; dbiz.style.color = c }
  // streamed output: 34 characters a second, starting 0.6s after the selection
  const log = LOG[sel === 0 ? 0 : 1].join('\n'), t0 = sel === 0 ? 1.9 : 8.7, n = clamp((t - t0) * 34, 0, log.length)
  dout.textContent = log.slice(0, Math.floor(n)) + ((Math.floor(t * 2) % 2 && n < log.length) ? '▍' : '')
  // minimap dots follow the characters (island x/z scaled into 140x90)
  mdots.forEach((d, i) => { const p = agents[i].pos; if (p) { d.setAttribute('cx', 70 + p.x * 0.55); d.setAttribute('cy', 45 + p.z * 0.55) } })
  // toasts: toastIn .3s ease-out, visible 3.5s, then fade .3s; stacked from the top, max 4
  toastEls.forEach((te, i) => {
    const age = t - bubbles[i].t0
    if (age < 0 || age > 3.8) { S(te, { display: 'none' }); return }
    S(te, { display: '' }); const q = easeOutCss(seg(age, 0, .3)), out = age > 3.5 ? 1 - (age - 3.5) / .3 : 1
    S(te, { opacity: q * out, transform: `translateX(${(1 - q) * 20}px)` })
  })
  // loading overlay: bar fills over 1.5s, then the overlay fades .6s
  const lp = clamp(t / 1.5); S(lfill, { width: (lp * 100) + '%' }); lst.textContent = lp < 1 ? `Loading agents… ${Math.floor(lp * 100)}%` : 'Ready'
  S(loading, { opacity: 1 - seg(t, 1.7, 2.3), display: t > 2.3 ? 'none' : '' })
  S(fadeEl, { opacity: seg(t, DUR - .4, DUR) })
}

S(dp, TALL ? { left: '0px', top: (TB + VPH) + 'px', width: DW + 'px', height: (DH - TB - VPH) + 'px', borderLeft: '0' } : { left: (SBW + VPW) + 'px', top: TB + 'px', width: DPW + 'px', height: (DH - TB) + 'px' })
