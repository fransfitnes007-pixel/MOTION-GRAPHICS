<!doctype html>
<html><head><meta charset="utf-8"><title>motion-reel-kit showcase</title>
<!-- The showcase film. 1920x1080, every frame is render(t). Cuts are pinned to the voiceover's word times (T below).
     Every clip is shown at its own shape: tall reels in 9:16 frames, wide films and interactions in 16:9 frames.
     Build: see README.md in this folder (render_clips.sh, then render_demo.cjs, then mix.py). -->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="assets/data.js"></script>
<script src="assets/frames.js"></script>
<script>
const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d')
// San Francisco everywhere: SF Pro on Apple devices, the system UI font elsewhere.
const FONT = '-apple-system,"SF Pro Display","SF Pro Text",BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif'
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t
const pr = (t, a, d) => cl((t - a) / d)
const eo = (x) => 1 - Math.pow(1 - cl(x), 3), eo5 = (x) => 1 - Math.pow(1 - cl(x), 5)
const eio = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const spring = (x, k = 7, f = 11) => x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-k * x) * Math.cos(f * x)
const back = (x) => { x = cl(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const ACC = '#6D7BFF', ACC2 = '#38BDF8', HOT = '#FF6A3D', GOLD = '#FFD479', GREEN = '#7CE38B', INK = '#F5F5F7', MUTE = '#8E8E93'

// Voiceover word times (seconds). Regenerate from assets/voiceover.words.json if the voice changes.
const T = { prompt: .22, one: 1.04, video: 1.92, kit: 3.42, open: 4.72, claude: 5.78, inside: 6.72, n240: 7.62, pieces: 9.08,
  kinetic: 9.94, trans: 10.96, dash: 11.86, endc: 12.64, every: 13.54, code: 14.3, exact: 15.94, micro: 16.84, best: 18.02, rebuilt: 18.62,
  put: 20.16, brand: 20.44, file: 21.16, logo: 22.1, scene: 22.78, endcard: 23.24, follows: 23.7, writes: 24.6, records: 25.68, pins: 26.74,
  words: 27.88, then: 28.22, clicks: 29.58, swishes: 30.1, booms: 30.72, exactf: 31.44, show: 32.52, viral: 32.96, cuts: 34.4, pace: 35.06,
  sound: 35.76, rebuilds: 36.54, reels: 38.28, tiktoks: 39.02, shorts: 39.86, longform: 40.54, clone: 41.8, brandit: 42.5, ship: 43.34, end: 43.9 }
const DUR = 49.5
const SC = [0, 2.86, 6.72, 13.54, 16.84, 20.16, 24.6, 28.22, 32.52, 38.28, 41.8, 43.9, DUR]

// Content shown, by shape. Wide pieces carry the category they light up in the wall scene.
const WIDE = [['w_ember', 'type'], ['w_browser', 'trans'], ['w_bento', 'dash'], ['w_logo', 'end'], ['w_caption', 'type'], ['w_cover', 'trans'],
  ['w_biz', 'dash'], ['w_domain', 'end'], ['w_number', 'type'], ['w_ripple', 'trans'], ['w_dashfly', 'dash'], ['w_typed', 'end']]
const TALL = ['dino', 'pictogram', 't_dinogo', 't_stamp', 't_fan']
const PACK12 = ['comma', 'border', 'burn', 'flip', 'i_subscribe_pill', 'i_plus_to', 'i_bottom_tab', 'i_graph_scrub', 'i_number_flip', 'i_otp_input', 'i_hold_to', 'i_delete_to']

// ---------- assets
const IMG = {}, SEQ = {}
const load = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src })
async function seq(name, n) { const a = []; for (let k = 1; k <= n; k++) a.push(load(`frames/${name}/${String(k).padStart(4, '0')}.jpg`)); SEQ[name] = (await Promise.all(a)).filter(Boolean) }
let WAVE = { peaks: [], dur: 1 }
const frameOf = (name, t, fps = 30) => { const s = SEQ[name]; if (!s || !s.length) return null; return s[((Math.floor(Math.max(0, t) * fps) % s.length) + s.length) % s.length] }

// ---------- drawing helpers
function bg() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'; g.fillStyle = '#060609'; g.fillRect(0, 0, W, H)
  const gr = g.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, W * .72); gr.addColorStop(0, 'rgba(90,100,255,0.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.fillStyle = 'rgba(255,255,255,0.04)'; for (let y = 24; y < H; y += 40) for (let x = 20; x < W; x += 40) g.fillRect(x, y, 2, 2)
}
function al(a, fn) { if (a <= .003) return; g.save(); g.globalAlpha *= cl(a); fn(); g.restore() }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r) }
function txt(s, x, y, size, o = {}) { g.font = `${o.w || 600} ${size}px ${FONT}`; g.textAlign = o.a || 'center'; g.textBaseline = 'middle'; g.letterSpacing = (o.ls ?? -size * .01) + 'px'; g.fillStyle = o.col || INK; g.fillText(s, x, y); g.letterSpacing = '0px' }
function tw(s, size, o = {}) { g.font = `${o.w || 600} ${size}px ${FONT}`; g.letterSpacing = (o.ls ?? -size * .01) + 'px'; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w }
function glow(x, y, r, a, col = '255,255,255') { if (a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r) }
// a label: plain San Francisco, sentence case, on a soft pill
function pill(s, x, y, p, o = {}) { if (p <= 0) return; const size = o.size || 26, w = tw(s, size, { w: 600 }) + size * 1.3, h = size * 1.85, sc = lerp(.8, 1, back(p))
  al(eo(p * 1.5), () => { g.save(); g.translate(x, y); g.scale(sc, sc); g.fillStyle = o.bg || 'rgba(255,255,255,0.94)'; rr(-w / 2, -h / 2, w, h, h / 2); g.fill(); txt(s, 0, 1, size, { w: 600, col: o.col || '#0B0B10' }); g.restore() }) }
function shadowCard(x, y, w, h, r = 22, fill = '#0E0E14') { g.save(); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 50; g.shadowOffsetY = 20; g.fillStyle = fill; rr(x, y, w, h, r); g.fill(); g.restore(); g.save(); g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 2; rr(x, y, w, h, r); g.stroke(); g.restore() }
// draw an image filling a box made at the clip's own aspect ratio (so nothing is squashed or cropped to a different shape)
function imgIn(im, x, y, w, h, r = 18) { if (!im) return; g.save(); rr(x, y, w, h, r); g.clip(); const s = Math.max(w / im.width, h / im.height); g.drawImage(im, x + (w - im.width * s) / 2, y + (h - im.height * s) / 2, im.width * s, im.height * s); g.restore() }
// clip tiles at native shape: tall = 9:16 phone, wide = 16:9 window
function tall(name, t, x, y, h, label, o = {}) { const w = h * 9 / 16, r = w * .11; shadowCard(x - 8, y - 8, w + 16, h + 16, r + 6, '#0C0C11'); imgIn(o.img || frameOf(name, t), x, y, w, h, r)
  g.save(); g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 2; rr(x - 8, y - 8, w + 16, h + 16, r + 6); g.stroke(); g.restore(); if (label) pill(label, x + w / 2, y + h + 50, o.lp ?? 1, { size: 24 }); return w }
function wide(name, t, x, y, w, label, o = {}) { const h = w * 9 / 16; shadowCard(x, y, w, h, 16, '#0C0C11'); imgIn(o.img || frameOf(name, t), x, y, w, h, 16)
  g.save(); g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2; rr(x, y, w, h, 16); g.stroke(); g.restore(); if (label) pill(label, x + w / 2, y + h + 44, o.lp ?? 1, { size: 24 }); return h }
function typed(s, p, t) { const n = Math.floor(cl(p) * s.length); return s.slice(0, n) + ((n < s.length || Math.floor(t * 2.5) % 2) ? '|' : '') }
function cam(t, a, b, zoom = .03) { const u = pr(t, a, b - a); g.translate(W / 2, H / 2); const z = 1 + zoom * u; g.scale(z, z); g.translate(-W / 2, -H / 2) }

// ---------- scenes
function s1(t) { // One prompt. One finished video.
  const m = eio(pr(t, T.one, .45)), ex = eo5(pr(t, T.video - .4, .8)), pw = lerp(1000, 116, m), ph = 116, x = W / 2 - pw / 2, y = H / 2 - ph / 2
  if (ex < 1) al(1 - ex, () => { shadowCard(x, y, pw, ph, 58, '#121218'); g.save(); g.strokeStyle = `rgba(109,123,255,${.45 + .3 * Math.sin(t * 6)})`; g.lineWidth = 3; rr(x, y, pw, ph, 58); g.stroke(); g.restore()
    al(1 - m * 1.6, () => txt(typed('/reel  a 40-second launch reel for our app', pr(t, T.prompt, .7), t), x + 56, H / 2 + 1, 36, { a: 'left', w: 500 }))
    al(m, () => { g.fillStyle = '#fff'; g.beginPath(); g.moveTo(W / 2 - 13, H / 2 - 21); g.lineTo(W / 2 + 21, H / 2); g.lineTo(W / 2 - 13, H / 2 + 21); g.closePath(); g.fill() }) })
  if (ex > 0) { const h = lerp(116, 820, ex); al(ex, () => { const w = h * 9 / 16; tall('pictogram', t - T.video + 2.4, W / 2 - w / 2, H / 2 - h / 2 + 40, h) }) }
  pill('One prompt', W / 2, 110, pr(t, T.prompt + .1, .3), { size: 28 }); al(pr(t, T.video - .1, .3), () => pill('One finished video', W / 2, 110, 1, { size: 28, bg: ACC, col: '#fff' }))
}
function s2(t) { // This is Motion Reel Kit, an open source plugin for Claude Code.
  const p = pr(t, T.kit - .15, .6), sp = spring(pr(t, T.kit - .15, 1.2))
  const rp = pr(t, T.kit, .7); al(1 - rp, () => { if (rp <= 0) return; g.strokeStyle = `rgba(160,170,255,${.7 * (1 - rp)})`; g.lineWidth = 4; g.beginPath(); g.ellipse(W / 2, 440, 180 + 900 * eo(rp), 60 + 260 * eo(rp), 0, 0, 7); g.stroke() })
  glow(W / 2, 440, 720, .2 * eo(p)); al(eo(p), () => { g.save(); g.translate(W / 2, 440); const s = lerp(1.25, 1, sp); g.scale(s, s); txt('motion-reel-kit', 0, 0, 168, { w: 700 }); g.restore() })
  al(pr(t, T.open - .1, .3), () => txt(typed('An open-source plugin for Claude Code', pr(t, T.open - .1, 1.25), t), W / 2, 600, 48, { w: 400, col: '#D2D2DA' }))
  ;[['MIT', 0], ['Local-first', .14], ['White-label', .28], ['241 pieces', .42]].forEach(([s, d], i) => pill(s, W / 2 + (i - 1.5) * 260, 740, pr(t, T.claude + d, .35), { size: 26, bg: i === 3 ? ACC : undefined, col: i === 3 ? '#fff' : undefined }))
}
function s3(t) { // Inside, over 240 motion pieces. Kinetic type, transitions, dashboards, end cards.
  const wallIn = eio(pr(t, T.pieces - .45, 1.0)), n = Math.round(lerp(0, 241, eo5(pr(t, T.n240 - .3, 1.3))))
  const hot = t >= T.endc ? 'end' : t >= T.dash ? 'dash' : t >= T.trans ? 'trans' : t >= T.kinetic ? 'type' : null
  if (wallIn > 0) {
    // one long strip: two stacked wide films, then a tall reel, repeated; it pans left for the whole scene
    const TH = 520, WH = (TH - 16) / 2, WW = WH * 16 / 9, TW = TH * 9 / 16, gap = 18, y0 = 400
    const cols = []; let wi = 0, ti = 0; for (let k = 0; k < 11; k++) cols.push(k % 2 === 0 ? { kind: 'w', a: WIDE[wi++ % WIDE.length], b: WIDE[wi++ % WIDE.length] } : { kind: 't', n: TALL[ti++ % TALL.length] })
    const total = cols.reduce((s, c) => s + (c.kind === 'w' ? WW : TW) + gap, 0), pan = lerp(80, -(total - W) - 80, pr(t, T.pieces - .45, SC[3] - T.pieces + .45))
    g.save(); g.translate(pan, (1 - wallIn) * 260); let x = 0
    cols.forEach((c, k) => { const ap = eo(pr(t, T.pieces - .4 + k * .05, .45))
      if (c.kind === 'w') { [c.a, c.b].forEach(([name, cat], j) => { const lit = hot ? (cat === hot ? 1 : .22) : .9, y = y0 + j * (WH + 16)
          al(ap * lit, () => { wide(name, t - T.pieces + j * .6 + k * .2, x, y, WW); if (hot && cat === hot) { g.strokeStyle = 'rgba(170,180,255,.95)'; g.lineWidth = 3; rr(x, y, WW, WH, 16); g.stroke() } }) }); x += WW + gap }
      else { const lit = hot ? .22 : .95; al(ap * lit, () => tall(c.n, t - T.pieces + k * .4, x, y0, TH)); x += TW + gap } })
    g.restore(); const vg = g.createLinearGradient(0, 0, W, 0); vg.addColorStop(0, 'rgba(6,6,9,.9)'); vg.addColorStop(.08, 'rgba(6,6,9,0)'); vg.addColorStop(.92, 'rgba(6,6,9,0)'); vg.addColorStop(1, 'rgba(6,6,9,.9)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  }
  const cy = lerp(H / 2, 210, wallIn), cs = lerp(1, .46, wallIn)
  al(pr(t, T.inside, .3), () => { glow(W / 2, cy, 420 * cs, .22 * (1 - wallIn)); txt(String(n), W / 2, cy, 320 * cs, { w: 700 }); al(1 - wallIn, () => txt('motion pieces', W / 2, cy + 200, 40, { w: 500, col: MUTE })) })
  ;[['Kinetic type', T.kinetic], ['Transitions', T.trans], ['Dashboards', T.dash], ['End cards', T.endc]].forEach(([s, a], i, A) => { const nx = A[i + 1] ? A[i + 1][1] : SC[3]; if (t >= a - .05 && t < nx) pill(s, W / 2, 1010, pr(t, a - .05, .3), { size: 32 }) })
}
function s4(t) { // Every frame is code, so every render is exact.
  const p = eo(pr(t, SC[3], .5)); shadowCard(150, 250, 700, 580, 26, '#0E0E15')
  al(p, () => { const L = ['function render(t) {', '    sky.dither(t)', '    dino.jump(at(T.jump))', '    tags.pop(t, CONFIG)', '    return frame', '}', '', `t = ${t.toFixed(3)} s`, `frame ${String(Math.floor(t * 30)).padStart(4, '0')}`]
    L.forEach((l, i) => { const c = i >= 7 ? ACC2 : i === 0 || i === 5 ? '#C9B8FF' : '#E8E8F0'; al(pr(t, SC[3] + .1 + i * .06, .25), () => txt(l, 200, 320 + i * 56, 34, { a: 'left', w: 500, col: c })) }) })
  const strip = eo(pr(t, SC[3] + .2, .6)), fh = 330, fw = fh * 9 / 16, step = fw + 26
  for (let k = -1; k < 6; k++) { const ft = 30 + k * .9 + (t - SC[3]) * .9, x = 960 + k * step - ((t - SC[3]) * 60) % step, y = 360
    al(strip * (k === 2 && t > T.exact ? 1 : .82), () => { tall('dino', ft, x, y, fh); txt('frame ' + String(Math.floor(ft * 30)).padStart(4, '0'), x + fw / 2, y + fh + 40, 20, { w: 500, col: MUTE }) }) }
  const xp = pr(t, T.exact - .1, .35); al(xp, () => { const x = 960 + 2 * step - ((t - SC[3]) * 60) % step; g.strokeStyle = ACC2; g.lineWidth = 4; rr(x - 14, 346, fw + 28, fh + 28, 22); g.stroke(); pill('Same pixels, every render', 1370, 960, xp, { size: 26, bg: ACC2 }) })
  pill('Every frame is code', 500, 170, pr(t, T.every, .3), { size: 28 })
}
function s5(t) { // Micro-interactions from the best apps, rebuilt for video. Four big, then all twelve.
  const z = eio(pr(t, T.rebuilt - .1, .75))
  PACK12.forEach((name, i) => { const big = i < 4
    const bw = 760, bx = W / 2 - bw - 20 + (i % 2) * (bw + 40), by = 150 + Math.floor(i / 2) * (bw * 9 / 16 + 34)
    const sw = 400, sx = W / 2 - 2 * sw - 54 + (i % 4) * (sw + 36), sy = 150 + Math.floor(i / 4) * (sw * 9 / 16 + 60)
    let x, y, w, a
    if (big) { x = lerp(bx, sx, z); y = lerp(by, sy, z); w = lerp(bw, sw, z); a = eo(pr(t, T.micro + i * .14, .35)) } else { x = sx; y = sy; w = sw; a = eo(pr(t, T.rebuilt + (i - 4) * .06, .4)) }
    if (a <= 0) return; const sp = big ? spring(pr(t, T.micro + i * .14, 1.1)) : spring(pr(t, T.rebuilt + (i - 4) * .06, 1.0))
    al(a, () => { g.save(); g.translate(x + w / 2, y + w * 9 / 32); g.scale(lerp(.85, 1, sp), lerp(.85, 1, sp)); g.translate(-w / 2, -w * 9 / 32); wide(name, t - T.micro + i * .3, 0, 0, w); g.restore() }) })
  pill('The best app micro-interactions', W / 2, 80, pr(t, T.best - .1, .3), { size: 28 }); pill('Rebuilt for video', W / 2, 1010, pr(t, T.rebuilt, .3), { size: 28, bg: ACC, col: '#fff' })
}
function s6(t) { // Put your brand in one file, and every logo, scene and end card follows.
  shadowCard(110, 230, 640, 560, 26, '#0E0E15'); txt('brand.config.json', 150, 280, 24, { a: 'left', w: 500, col: MUTE })
  const name = t < T.brand + .2 ? 'YourBrand' : t < T.file ? 'YourBrand'.slice(0, Math.max(0, 9 - Math.floor((t - T.brand - .2) / .05))) : typed('Acme', pr(t, T.file - .1, .4), t).replace('|', '')
  const L = ['{', `   "name": "${name}${t > T.brand && t < T.file + .4 && Math.floor(t * 3) % 2 ? '|' : ''}",`, `   "domain": "${t > T.file + .3 ? 'acme.studio' : 'yourbrand.com'}",`, `   "handle": "${t > T.file + .4 ? '@acme' : '@yourbrand'}",`, '   "accent": "#6D7BFF",', '   "app_store": { … }', '}']
  L.forEach((l, i) => txt(l, 150, 350 + i * 58, 32, { a: 'left', w: 500, col: i === 1 ? GOLD : '#E8E8F0' }))
  if (t > T.file + .1) al(pr(t, T.file + .1, .3), () => txt('apply_brand.py   ✓ 64 files', 150, 740, 26, { a: 'left', w: 500, col: GREEN }))
  // three outputs, each at its own shape: the logo end card is wide, the App Store card and the reel's end card are tall
  const flipAt = (at) => { const f = pr(t, at, .5); return [Math.max(.02, Math.abs(Math.cos(f * Math.PI))), f > .5] }
  const card = (cx, cy, at, k, fn) => al(eo(pr(t, SC[5] + .1 + k * .12, .4)), () => { const [sx, after] = flipAt(at); g.save(); g.translate(cx, cy); g.scale(sx, 1); g.translate(-cx, -cy); fn(after); g.restore() })
  const lw = 540, lh = lw * 9 / 16, lx = 800, ly = 250
  card(lx + lw / 2, ly + lh / 2, T.logo, 0, (after) => wide(null, 0, lx, ly, lw, null, { img: IMG[after ? 'logo_after' : 'logo_before'] }))
  pill('Logo', lx + lw / 2, ly + lh + 44, pr(t, T.logo - .05, .3), { size: 24 })
  const th = 560, tw_ = th * 9 / 16, ax = 1430, ay = 230
  card(ax + tw_ / 2, ay + th / 2, T.scene, 1, (after) => tall(null, 0, ax, ay, th, null, { img: IMG[after ? 'store_after' : 'store_before'] }))
  pill('App Store card', ax + tw_ / 2, ay + th + 50, pr(t, T.scene - .05, .3), { size: 24 })
  const eh = 300, ew = eh * 9 / 16, ex = lx + lw / 2 - ew / 2, ey = 660
  card(ex + ew / 2, ey + eh / 2, T.endcard, 2, (after) => tall(null, 0, ex, ey, eh, null, { img: IMG[after ? 'brand_after_dino' : 'brand_before_dino'] }))
  pill('End card', ex + ew + 110, ey + eh / 2, pr(t, T.endcard - .05, .3), { size: 24 })
  pill('One file', 430, 160, pr(t, T.brand, .3), { size: 28 }); pill('Everything follows', 1100, 160, pr(t, T.follows - .1, .3), { size: 28, bg: ACC, col: '#fff' })
}
function waveRow(t, y, h, t0, t1, col) { const pk = WAVE.peaks, n = pk.length; if (!n) return; const x0 = 140, x1 = W - 140
  for (let x = x0; x < x1; x += 6) { const tt = lerp(t0, t1, (x - x0) / (x1 - x0)), i = Math.floor(tt / WAVE.dur * n); if (i < 0 || i >= n) continue; const a = pk[i] * h
    g.fillStyle = tt < t ? col : 'rgba(255,255,255,.22)'; rr(x, y - a, 3.5, a * 2, 2); g.fill() } }
function s7(t) { // It writes the script, records the voice, and pins every beat to the words.
  const lines = ['One prompt. One finished video.', 'This is Motion Reel Kit, an open-source plugin…', 'Inside, over 240 motion pieces…']
  al(pr(t, T.writes, .3), () => { shadowCard(140, 120, 1640, 250, 26, '#0E0E15'); lines.forEach((l, i) => txt(typed(l, pr(t, T.writes + i * .35, .5), t).replace('|', ''), 190, 185 + i * 64, 36, { a: 'left', w: i ? 400 : 600, col: i ? '#C8C8D2' : INK })); pill('Script', 1660, 120, pr(t, T.writes, .3), { size: 22 }) })
  const wp = pr(t, T.records - .1, .4), vt = lerp(0, 9.2, pr(t, T.records, 3.4))
  al(wp, () => { waveRow(vt, 610, 150, 0, 9.2, ACC2); pill('Voice', 1660, 470, 1, { size: 22 }) })
  const words = [['One', .0], ['prompt', .22], ['one', 1.04], ['finished', 1.38], ['video', 1.92], ['This', 2.86], ['Motion Reel Kit', 3.42], ['open source', 4.72], ['Claude Code', 5.78], ['Inside', 6.72], ['240', 7.62], ['pieces', 9.08]]
  words.forEach(([w, wt], i) => { const x = lerp(140, W - 140, wt / 9.2), d = pr(t, T.pins + i * .08, .35); if (d <= 0) return
